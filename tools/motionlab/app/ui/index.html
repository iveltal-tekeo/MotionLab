<nav id="side">
  <a class="logo" href="#/"><img src="/ui/logo.png" alt="MotionLab"></a>
  <button class="upd-open" id="side-update" hidden title="{{t:See what changed and update}}"><svg class="ic"><use href="#i-update"/></svg><span><b>{{t:Update available}}</b><small></small></span></button>
  <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>{{t:Home}}</a>
  <div class="navgrp">{{t:Make a video}}</div>
  <a href="#/analyze" data-nav="analyze" title="{{t:Learn from what works: videos (every cut, effect, caption and colour), a channel's thumbnails, scripts and prompts - Claude remembers it}}"><svg class="ic"><use href="#i-analyze"/></svg>{{t:Analyser}}</a>
  <a href="#/prepare" data-nav="prepare" title="{{t:What you say on camera: improve a script you have, or let Claude write one from a few questions - written to hold attention}}"><svg class="ic"><use href="#i-prepare"/></svg>{{t:Prepare}}</a>
  <a href="#/edit" data-nav="edit" title="{{t:Your clips, edited in the style of videos you analysed - or from a prompt}}"><svg class="ic"><use href="#i-edit"/></svg>{{t:Editor}}</a>
  <a href="#/generate" data-nav="generate" title="{{t:A video from zero: prompts for AI video tools, or a motion-graphics video}}"><svg class="ic"><use href="#i-generate"/></svg>{{t:Generator}}</a>
  <div class="navsep"></div>
  <a href="#/memory" data-nav="memory" title="{{t:What Claude learned from your videos and your ratings - it reads this before it edits or generates}}"><svg class="ic"><use href="#i-memory"/></svg>{{t:Claude's memory}}</a>
  <div class="grow"></div>
  <!-- 2026-10-22 (the user: "move the motion graphics side bar section to down below above the jobs section") -->
  <a href="#/motion" data-nav="motion" title="{{t:Designed motion to reuse: templates learned from pro clips - titles, counters, lists, buttons, chats - for your videos and the Generator}}"><svg class="ic"><use href="#i-motion"/></svg>{{t:Motion Graphics}}</a>
  <a href="#/jobs" data-nav="jobs" title="{{t:What MotionLab is working on right now}}"><svg class="ic"><use href="#i-jobs"/></svg>{{t:Jobs}} <b id="jobcount"></b></a>
  <a href="#/settings" data-nav="settings" title="{{t:Programs, downloads, Claude Code, updates, storage, Claude skills}}"><svg class="ic"><use href="#i-settings"/></svg>{{t:Settings}}</a>
  <button class="chk-open" id="side-check" title="{{t:Ask GitHub for a newer MotionLab (or new knowledge from your friends) and install it}}"><svg class="ic"><use href="#i-update"/></svg><span><b>{{t:Check for updates}}</b><small></small></span></button>
  <button class="news-open" id="side-news" title="{{t:Every MotionLab version and what it changed (CHANGELOG.md)}}"><svg class="ic"><use href="#i-news"/></svg>{{t:What's new}}</button>
  <button class="claude-open" id="side-claude" title="{{t:Open Claude Code in the MotionLab folder}}"><svg class="ic"><use href="#i-claude"/></svg>{{t:Open Claude Code}}</button>
  <a id="side-live" hidden></a>
  <div id="resolve-state" title="DaVinci Resolve">Resolve <i class="dot"></i> <span>...</span></div>
  <div class="ver">MotionLab {{VERSION}}</div>
</nav>
<main id="main"><div class="loading">{{t:Loading...}}</div></main>

<div id="tip" hidden></div>
