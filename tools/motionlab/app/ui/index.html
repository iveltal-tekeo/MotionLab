  <div class="navgrp">Make a video</div>
  <a href="#/analyze" data-nav="analyze" title="Learn from videos you like: every cut, effect, caption and colour, measured - Claude remembers the style"><svg class="ic"><use href="#i-analyze"/></svg>Analyze</a>
  <a href="#/prepare" data-nav="prepare" title="What you say on camera: improve a script you have, or let Claude write one from a few questions - written to hold attention"><svg class="ic"><use href="#i-prepare"/></svg>Prepare</a>
  <a href="#/edit" data-nav="edit" title="Your clips, edited in the style of videos you analysed - or from a prompt"><svg class="ic"><use href="#i-edit"/></svg>Edit</a>
  <a href="#/generate" data-nav="generate" title="A video from zero: prompts for AI video tools, or a motion-graphics video"><svg class="ic"><use href="#i-generate"/></svg>Generate</a>
  <div class="navsep"></div>
  <a href="#/memory" data-nav="memory" title="What Claude learned from your videos - the styles, effects, graphics and lessons it uses when it edits or generates"><svg class="ic"><use href="#i-memory"/></svg>Claude's memory</a>
