<!-- MotionLab motion template "glow-circle-text" (2026-10-22): two glowing circles that open in turn, each with a word typed into it. A dot swells on a dark woven
     board (f3-f8), turns into a ripple ring (f9-f12) and settles into three nested rings with a glowing core while
     the first word types in letter by letter (f5-f20, "TEXT A" in the clip). The camera is zoomed in on it; at f41
     it pans sideways to the second circle (f41-f66, slow start, fast middle at f49-f56, soft stop), which opens and
     types its word on the way in (f51-f56); at f92 the camera pulls back and swings home (f93-f116) so both circles
     sit side by side, and the pair then drifts gently up and down until the end. Look-aware: the dark ground, the
     circle colour and the text colour come from the look tokens. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .grp { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .grp canvas { position: absolute; }
  .tx { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; letter-spacing: -0.01em; transform-origin: 50% 50%; }
  .ch { display: inline-block; }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 300;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const toH = a => "#" + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  const mixh = (a, b, t) => { const x = hex(a), y = hex(b); return toH(x.map((v, i) => v + (y[i] - v) * t)); };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, a)).toFixed(3)})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };

  // ---- the look: a dark board (the ink), darker still beyond its edges; circles in one token colour, text in another
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const tc = V.colour === "mustard" ? L.mustard : V.colour === "paper" ? glare : L.signal;
  const B0 = V.halo === "signal" ? L.signal : V.halo === "mustard" ? L.mustard : V.halo === "paper" ? glare : L.deep;
  const seedC = mixh(B0, "#ffffff", 0.1), rim = mixh(B0, "#ffffff", 0.16), dk = mixh("#000000", B0, 0.09), dk2 = mixh("#000000", B0, 0.3);
  const warm = mixh(B0, tc, 0.5), warm2 = mixh(B0, tc, 0.16);
  const gl = V.glow / 100;
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = night;
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });

  // the board: a woven dark cloth between the two circles' edges (it moves with the camera), black beyond it
  const board = document.createElement("div");
  const pitch = Math.max(2, Math.round(3 * U)), wv = rgba(glare, 0.045);
  Object.assign(board.style, { position: "absolute", top: `${-0.2 * H}px`, height: `${1.4 * H}px`, background: night,
    backgroundImage: `repeating-linear-gradient(0deg, ${wv} 0px, ${wv} 1px, transparent 1px, transparent ${pitch}px), repeating-linear-gradient(90deg, ${wv} 0px, ${wv} 1px, transparent 1px, transparent ${pitch}px)` });
  if (V.background) hand.appendChild(board);

  // ---- the two circles (a canvas each) with their word typed letter by letter
  const FS = V.size * U, R1 = 2.27 * FS, CS = 1.3, SZ = Math.round(R1 * 2 * 1.9), fam = V.body_font;
  const D1 = [[3,.05],[5,.12],[6,.17],[7,.27],[8,.36],[9,.5],[10,.68],[11,.88],[12,1.02],[14,1.06],[16,1.09],[18,1.1],[20,1.095],[22,1.06],[26,1.03],[30,1]];
  const D2 = [[14,0],[16,.35],[18,.85],[20,.9],[22,.82],[26,.76],[30,.74]];
  const D3 = [[9,.07],[10,.09],[11,.13],[12,.18],[14,.36],[16,.57],[18,.6],[22,.52],[30,.48]];
  const mkGroup = (txt, off) => {
    const grp = document.createElement("div"); grp.className = "grp";
    const cv = document.createElement("canvas");
    cv.width = cv.height = Math.round(SZ * CS);
    Object.assign(cv.style, { width: `${SZ}px`, height: `${SZ}px`, left: `${-SZ / 2}px`, top: `${-SZ / 2}px` });
    const tx = document.createElement("div"); tx.className = "tx ml-body";
    Object.assign(tx.style, { fontSize: `${FS}px`, fontWeight: String(fw(fam, 800)), color: tc, textTransform: V.caps ? "uppercase" : "none",
      textShadow: `0 0 ${0.1 * FS}px ${rgba(tc, 0.5 * (0.4 + gl))}, 0 0 ${0.35 * FS}px ${rgba(tc, 0.38 * (0.4 + gl))}` });
    const rr = window.MLLook ? MLLook.rich(tx, txt, { look: L, family: fam, weight: 800 }) : { words: [] };
    if (!window.MLLook) tx.textContent = txt;
    const lets = [];
    rr.words.forEach(w => { const s = w.textContent; w.textContent = "";
      [...s].forEach(ch => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; w.appendChild(sp); lets.push(sp); }); });
    const n = lets.length;
    const on = lets.map((_, k) => k === 0 ? 3.5 : n <= 2 ? 11 : 11 + (k - 1) * 6 / (n - 2));    // typed in f4-f17: the first letter slowly, the rest quicker
    const du = lets.map((_, k) => k === 0 ? 5 : 3);
    grp.appendChild(cv); grp.appendChild(tx); hand.appendChild(grp);
    return { grp, cv, cx: cv.getContext("2d"), tx, lets, on, du, off };
  };
  const GA = mkGroup(V.text_a, 0), GB = mkGroup(V.text_b, 37);

  function draw(o, g) {
    const cx = o.cx;
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, o.cv.width, o.cv.height);
    if (g < 3) return;
    cx.setTransform(CS, 0, 0, CS, SZ / 2 * CS, SZ / 2 * CS);
    const disc = (r, st) => { const gr = cx.createRadialGradient(0, 0, 0, 0, 0, r); st.forEach(([s, c]) => gr.addColorStop(s, c));
      cx.fillStyle = gr; cx.beginPath(); cx.arc(0, 0, r, 0, Math.PI * 2); cx.fill(); };
    const rad = tab(D1, g)[0] * R1, solid = clamp01(9 - g), ready = 1 - solid, a = 0.3 + 0.7 * gl;
    // the halo around it
    disc(rad * 1.62, [[0, rgba(B0, 0.3 * a)], [0.5, rgba(B0, 0.42 * a)], [0.617, rgba(B0, 0.5 * a)], [0.8, rgba(B0, 0.2 * a)], [1, rgba(B0, 0)]]);
    // the seed dot, then the ripple ring it turns into
    if (solid > 0) disc(rad, [[0, rgba(seedC, solid)], [0.88, rgba(seedC, solid)], [1, rgba(seedC, 0)]]);
    if (ready > 0) disc(rad, [[0, rgba(dk, 0.88 * ready)], [0.62, rgba(dk2, 0.6 * ready)], [0.86, rgba(B0, 0.55 * ready)], [0.95, rgba(rim, 0.9 * ready * (0.5 + 0.5 * a))], [1, rgba(rim, 0)]]);
    // the middle ring and the glowing core
    const a2 = clamp01((g - 14) / 4) * ready;
    if (a2 > 0) disc(tab(D2, g)[0] * R1, [[0, rgba(B0, 0)], [0.8, rgba(B0, 0.22 * a2)], [0.95, rgba(rim, 0.5 * a2)], [1, rgba(rim, 0)]]);
    if (g >= 9) {
      const r3 = tab(D3, g)[0] * R1, s2 = clamp01((16 - g) / 4);
      if (s2 > 0) disc(r3, [[0, rgba(seedC, s2)], [0.85, rgba(seedC, s2)], [1, rgba(seedC, 0)]]);
      if (s2 < 1) disc(r3, [[0, rgba(warm, 0.55 * (1 - s2))], [0.7, rgba(warm2, 0.4 * (1 - s2))], [0.93, rgba(rim, 0.5 * (1 - s2))], [1, rgba(rim, 0)]]);
    }
  }

  // ---- the motion, frame by frame from one proxy (seek-safe). g = the frame, shifted by "Starts at frame".
  // ROWS = [frame, A x, A y, B x, B y, zoom]: where the two circles sit in the frame (fractions of its width / height,
