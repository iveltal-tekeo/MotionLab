  const CAM = [[0,1.753,2.75,1159.8,176.8],[1,1.751,2.74,1159.8,176.8],[2,1.748,2.71,1158.0,176.8],[3,1.745,2.67,1156.1,177.2],[4,1.743,2.51,1155.3,177.3],[5,1.74,2.18,1153.6,166.4],[6,1.737,1.97,1151.5,166.1],

    [14,1.722,0.79,1133.1,167.0],[15,1.673,0.4,1100.4,186.2],[16,1.624,0.06,1068.3,208.8],[17,1.617,0.14,1045.2,236.5],[18,1.646,0.75,1015.9,290.8],[19,1.62,0.24,964.1,347.7],[20,1.612,0.7,864.0,464.6],
    [21,1.614,-0.19,742.3,575.1],[22,1.618,0.08,685.1,607.0],[23,1.622,0.05,657.7,616.2],[24,1.624,0.06,646.0,617.7],[25,1.624,0.08,644.2,617.1],[26,1.623,0.01,643.4,616.8],[27,1.623,-0.02,642.1,616.0],
    [28,1.624,0.01,639.3,618.4],[29,1.622,0.03,636.0,614.8],[30,1.622,0.06,630.7,615.5],[31,1.623,0.08,623.5,614.2],[32,1.623,0.08,613.5,611.2],[33,1.622,0.05,601.2,606.9],[34,1.621,0.05,584.5,597.7],
    [35,1.623,0.11,561.2,585.2],[36,1.619,0.01,525.2,557.2],[37,1.65,-0.05,335.8,362.6],[38,1.67,-0.02,275.7,259.7],[39,1.699,-0.05,242.9,250.9],[40,1.704,-0.07,208.9,182.9],[41,1.701,-0.1,201.8,168.7],
    [42,1.702,-0.2,195.5,158.0],[43,1.701,-0.24,191.6,149.2],[44,1.701,-0.24,187.7,142.3],[45,1.701,-0.24,185.9,136.8],[46,1.7,-0.29,185.9,133.8],[47,1.699,-0.38,186.3,134.4],[48,1.699,-0.46,186.5,133.2],
    [49,1.7,-0.5,186.6,133.5],[50,1.702,-0.42,186.3,132.3],[51,1.706,-0.25,181.9,123.2],[52,1.699,-0.28,179.5,119.9],[53,1.662,-0.6,201.8,135.2],[54,1.622,-1.18,225.2,151.8],[55,1.605,-2.1,243.0,173.5],
    [56,1.605,-4.48,266.7,217.8],[57,1.42,-3.87,324.4,231.2],[58,1.233,-2.54,386.5,244.5],[59,1.14,-1.18,436.8,256.1],[60,1.06,-0.11,570.6,319.5],[61,1.033,0.0,606.4,339.1],[62,1.018,-0.01,622.0,347.8],
    [63,1.014,-0.02,631.2,353.4],[64,1.008,0.02,636.9,356.3],[65,1.006,-0.02,640.3,358.6],[66,1.003,-0.01,642.5,359.4],[67,1.002,-0.03,643.4,360.1],[68,1,0,644,360]];
  const camAt = g => tab(CAM, g);
  const camStr = c => `translate(${SHX} 0) scale(${KR}) translate(${c[2].toFixed(2)} ${c[3].toFixed(2)}) rotate(${c[1].toFixed(3)}) scale(${c[0].toFixed(4)}) translate(-644 -360)`;
  // the line's drawn length (arc length from the start of the measured line, in the reference's pixels): held to f4,
  // then drawing on faster and faster until the whole line is there
  const HEAD = [[0, 241.6], [4, 241.6], [5, 297], [6, 371.6], [7, 456.3], [8, 553.4], [9, 659.4], [10, 770], [11, 880], [12, 990], [13, 1100], [14, 1210], [15, 1320], [16, 1430], [17, 1540], [18, 1650], [19, 1740], [20, 1760]];
  const S = Math.round(V.start);
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    // the line
    const drawn = EXT + tab(HEAD, g)[0];
    lp.forEach(p => { p.setAttribute("stroke-dasharray", `${drawn.toFixed(1)} ${(LEN + 200).toFixed(1)}`); });
    // the words and the punch line pop in
    const pop = (r) => r < 0 ? null : tab(POP, r);
    words.forEach((w, i) => {
      w.t.setAttribute("font-size", (FS).toFixed(2));
      const len = w.t.getComputedTextLength ? w.t.getComputedTextLength() : 0;
      const fit = len > 380 ? 380 / len : 1;
      w.t.setAttribute("font-size", (FS * fit).toFixed(2));
      const p = pop(g - T0[i]);
      if (!p) { w.grp.setAttribute("opacity", "0"); return; }
      w.grp.setAttribute("opacity", p[1].toFixed(3));
      w.grp.setAttribute("transform", `translate(${w.cx.toFixed(2)} ${w.cy.toFixed(2)}) scale(${p[0].toFixed(3)}) translate(${(-w.cx).toFixed(2)} ${(-w.cy).toFixed(2)})`);
      w.blur.setAttribute("stdDeviation", `${(p[2] / p[0]).toFixed(2)} ${(p[2] * 0.2 / p[0]).toFixed(2)}`);
    });
    pt.setAttribute("font-size", (FS * 0.78).toFixed(2));
    const pl = pt.getComputedTextLength ? pt.getComputedTextLength() : 0, pfit = pl > 320 ? 320 / pl : 1;
    pt.setAttribute("font-size", (FS * 0.78 * pfit).toFixed(2));
    const pp = pop(g - T0[3]);
    if (!pp) pg.setAttribute("opacity", "0");
    else {
      pg.setAttribute("opacity", pp[1].toFixed(3));
      pg.setAttribute("transform", `translate(${PCX} ${PCY}) scale(${pp[0].toFixed(3)}) translate(${-PCX} ${-PCY})`);
      pBlur.setAttribute("stdDeviation", `${(pp[2] / pp[0]).toFixed(2)} ${(pp[2] * 0.2 / pp[0]).toFixed(2)}`);
    }
    // the camera, with motion blur from copies of the scene at moments around the frame (only when it moves fast)
    const cs = Array.from({ length: NCOP }, (_, i) => camAt(g + (i / (NCOP - 1) - 0.5) * SHUT));
    const mid = camAt(g);
    const move = Math.max(...cs.map(c => Math.hypot(c[2] - mid[2], c[3] - mid[3]) + Math.abs(c[0] - mid[0]) * 600));
    const blurred = move > 2.5;
    copies.forEach((c, i) => {
      if (!blurred && i > 0) { c.g.setAttribute("display", "none"); return; }
      c.g.setAttribute("display", "inline");
      c.cam.setAttribute("transform", camStr(blurred ? cs[i] : mid));
      c.g.setAttribute("opacity", (blurred ? (V.background ? 1 / (i + 1) : 1 / NCOP) : 1).toFixed(4));
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 9 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 29 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font); the words are measured per frame to fit the line, so they are fitted with the right font
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { render(0); window.__timelines["main"] = tl; });
</script>
