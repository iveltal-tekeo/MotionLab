  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},

  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},

<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "three-step-progress" (2026-10-18): a long progress bar seen through a moving camera, three steps along it. The first step is there from the
     start; the camera eases right (16 f), holds while the fill grows past the second step - whose letters tumble in
     one by one - then pans fast to the end of the bar (37 f, S-curve), the fill finishes, and the third step's
     letters tumble in. Look-aware. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #world { position: absolute; left: 0; top: 0; }
  .lab { position: absolute; white-space: nowrap; display: flex; }
  .ch { display: inline-block; white-space: pre; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8.5" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"><div id="cam" class="abs"><div id="world"><div id="grid"></div><div id="track"></div><div id="fill"></div></div></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 255;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const E = window.MLLook ? MLLook.EASE : { enter: "expo.out", exit: "expo.in", move: "expo.inOut" };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;

  gsap.set("#bgfill", { width: W, height: H, background: V.background ? L.paper : "transparent" });
  // ---- the world, in units of the frame's width (the reference measured on screen, the camera added back):
  // the bar runs 0..1.40 W; step 1 sits at its start, step 2 at 0.58 W, step 3 at 1.17 W (the end's left)
  const BAR = 1.40 * W, th = H * V.thick / 100, by = H * V.y / 100 - th / 2;
  const world = q("world"), track = q("track"), fill = q("fill");
  const bx0 = 0.03 * W;
  // depth behind: the reference's grid, part of the world (it moves with the camera) - flat, dots or a floor
  if (V.grid !== "none" && window.MLLook) {
    const gw = q("grid");
    Object.assign(gw.style, { position: "absolute", left: `${-0.5 * W}px`, top: "0px", width: `${BAR + W}px`, height: `${H}px` });
    MLLook.grid(gw, V.grid === "floor" ? tl : null, { kind: V.grid, U, W: BAR + W, H, look: L, size: 120, alpha: 0.07, vignette: false,
      horizon: 0.5, flow: 0, fps: FPS, frames: FRAMES });
  }
  Object.assign(q("cam").style, { width: `${W}px`, height: `${H}px`, transformOrigin: "50% 55%" });
  Object.assign(track.style, { position: "absolute", left: `${bx0}px`, top: `${by + th * 0.15}px`, width: `${BAR - bx0}px`, height: `${th * 0.7}px`,
    background: rgba(L.ink, 0.12), borderRadius: `${Math.min(L.radius, th * 0.35)}px` });
  Object.assign(fill.style, { position: "absolute", left: `${bx0}px`, top: `${by}px`, width: `${BAR - bx0}px`, height: `${th}px`,
    background: L.signal, borderRadius: `${Math.min(L.radius, th / 2)}px`, boxShadow: L.shadow });
  if (window.MLLook) MLLook.glow(fill, L.signal, V.glow, { U });
  const fs = V.size * U;
  const steps = [{ t: V.step1, x: bx0 }, { t: V.step2, x: 0.58 * W }, { t: V.step3, x: 1.17 * W }].map((s, i) => {
    const el = document.createElement("div"); el.className = "lab ml-accent";
    Object.assign(el.style, { left: `${s.x}px`, top: `${by - fs * 1.6}px`, font: `700 ${fs}px var(--font-accent)`, color: L.ink, letterSpacing: "0.06em" });
    const txt = V.uppercase ? String(s.t || "").toUpperCase() : String(s.t || "");
    const chars = [...txt].map(c => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = c; el.appendChild(sp); return sp; });
    world.appendChild(el);
    // a short signal tick on the bar under each step
    const tk = document.createElement("div");
    Object.assign(tk.style, { position: "absolute", left: `${s.x}px`, top: `${by - th * 0.35}px`, width: `${3 * U}px`, height: `${th * 0.35}px`, background: L.ink, opacity: "0.5" });
    world.appendChild(tk);
    return { ...s, el, chars };
  });

  // ---- the motion (30 fps frames; K() keeps them at any rate)
  // the camera: 0 -> 0.15 W (f0-f16, decelerating), drifts, 0.15 -> 0.70 W (f124-f170, S-curve), drifts
  const cam = { x: 0 };
  const moveCam = () => gsap.set(world, { x: -cam.x * W });
  moveCam();
  ft(cam, { x: 0 }, { x: 0.15, onUpdate: moveCam }, 0, K(30), E.enter);
  ft(cam, { x: 0.15 }, { x: 0.70, onUpdate: moveCam }, K(126), K(164), "power2.inOut");
  // the camera never quite rests: a slow push-in and rise while the fill grows, easing back after the pan
  ft("#cam", { scale: 1, y: 0 }, { scale: 1.08, y: -0.03 * H }, K(16), K(124), "sine.inOut");
  ft("#cam", { scale: 1.08 }, { scale: 1.0 }, K(164), FRAMES, "sine.inOut");
  // as step 3 lands the camera lifts and tilts a little, then settles (the reference's second big move)
  ft("#cam", { y: -0.03 * H, rotation: 0 }, { y: -0.09 * H, rotation: -1.5 }, K(176), K(192), "sine.inOut");
  ft("#cam", { y: -0.09 * H, rotation: -1.5 }, { y: 0.01 * H, rotation: 0 }, K(192), K(216), E.enter);
  // the fill's head (world, in W): 0.55 at f0, 0.97 at f128 (steady), the bar's end 1.40 at f170 (with the pan)
  // (the fill grows in WIDTH so its liquid edge is not squashed; the head's world x in units of W)
  const fp = { x: 0.55 }, drawFill = () => { fill.style.width = `${Math.max(th, fp.x * W - bx0)}px`; };
  drawFill();
  ft(fp, { x: 0.55 }, { x: 0.97, onUpdate: drawFill }, 0, K(128), "power1.inOut");
  ft(fp, { x: 0.97 }, { x: BAR / W, onUpdate: drawFill }, K(128), K(170), "power1.inOut");
  if (V.liquid && window.MLLook) MLLook.liquid(fill, tl, { fps: FPS, frames: FRAMES, U, look: L, color: L.signal, h: th, wave: th * 0.16 / U });
  // the letters of steps 2 and 3 tumble in one by one (3 f apart, 9 f each, from above, turned, decelerating)
  const tumble = (s, f0) => s.chars.forEach((c, i) => {
    const f = f0 + i * K(3), r = (i % 2 ? 1 : -1) * (25 + (i * 17) % 30);
    set(c, { opacity: 0 }, 0);
    ft(c, { opacity: 0, y: -fs * 1.4, rotation: r }, { opacity: 1, y: 0, rotation: 0 }, f, f + K(9), E.enter);
  });
  tumble(steps[1], K(40));
  tumble(steps[2], K(192));

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 31 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
