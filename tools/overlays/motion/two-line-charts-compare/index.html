  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},

]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "two-line-charts-compare" (2026-10-23): two small chart frames stacked on a dark page (axes with arrowheads, there from the first frame).
     A line is drawn left to right in each: the bottom one in 42 frames (f4-f46), the top one more slowly (f4-f58),
     each with a bright, thicker trail behind its tip that thins out; in the original the top line stays flat and the
     bottom one rises exponentially, here both are data points (smooth curve through them). Then both names are
     typed at the same time, one character every 3.5 frames from f46, each letter glowing. The names, the points,
     the size, the line width and the colour are settings. Numbers measured from the reference's frames
     (720 x 1280 units). Look-aware. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #grp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #grp > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; text-transform: uppercase; letter-spacing: 0.01em; }
  .lb > span.w { display: inline-block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs">
    <div id="grp"><svg id="sv" width="1080" height="1920"></svg></div>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 135;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };
  const hx = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const S = Math.round(V.start);
  const K = W / 720;                                        // the reference is 720 x 1280: its numbers below are in those units
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const pick = { signal: L.signal, mustard: L.mustard, paper: glare, deep: L.deep };
  const col = pick[V.col] || L.signal;
  const lite = (() => { const a = hx(col); return `rgb(${a.map(v => Math.round(v + (255 - v) * 0.35)).join(", ")})`; })();
  const nums = s => String(s == null ? "" : s).split("|").map(x => parseFloat(x)).filter(x => !isNaN(x)).slice(0, 24);

  // ---- the ground: a dark page with a faint lighter disc
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = `radial-gradient(ellipse 85% 48% at 50% 42%, ${rgba(glare, 0.055)} 0%, ${rgba(glare, 0.02)} 55%, ${rgba(glare, 0)} 100%), ${night}`;

  // ---- the two charts (clip units x K): origin x = 175.5, axes 364.5 long, origins at y = 554.5 and 1058.5; lines sit 7 above the axis
  const NS = "http://www.w3.org/2000/svg";
  const sv = q("sv"), grp = q("grp");
  const X0 = 175.5, AL = 364.5, BASE = 7, HV = AL - BASE - 0, DXW = 360, ORY = [554.5, 1058.5];
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k])); (parent || sv).appendChild(e); return e; };
  const axw = 2 * K, ac = rgba(glare, 0.88);
  const pchip = ys => {                                       // a smooth curve through the points, never overshooting them
    const n = ys.length; if (n === 1) return () => ys[0];
    const h = 1 / (n - 1), d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / h);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]);
    return x => { x = clamp01(x); const i = Math.min(n - 2, Math.floor(x / h)), t = (x - i * h) / h;
      return (2 * t ** 3 - 3 * t ** 2 + 1) * ys[i] + (t ** 3 - 2 * t ** 2 + t) * h * m[i] + (-2 * t ** 3 + 3 * t ** 2) * ys[i + 1] + (t ** 3 - t ** 2) * h * m[i + 1]; };
  };
  const NP = 160;
  const charts = [0, 1].map(ci => {
    const oy = ORY[ci], ax = (x1, y1, x2, y2) => mk("line", { x1: x1 * K, y1: y1 * K, x2: x2 * K, y2: y2 * K, stroke: ac, "stroke-width": axw, "stroke-linecap": "round" });
    ax(X0, oy, X0 + AL, oy); ax(X0, oy, X0, oy - AL);                                   // the axes
    mk("polyline", { points: `${(X0 + AL - 7) * K},${(oy - 7) * K} ${(X0 + AL) * K},${oy * K} ${(X0 + AL - 7) * K},${(oy + 7) * K}`, fill: "none", stroke: ac, "stroke-width": axw, "stroke-linecap": "round", "stroke-linejoin": "round" });
    mk("polyline", { points: `${(X0 - 7) * K},${(oy - AL + 7) * K} ${X0 * K},${(oy - AL) * K} ${(X0 + 7) * K},${(oy - AL + 7) * K}`, fill: "none", stroke: ac, "stroke-width": axw, "stroke-linecap": "round", "stroke-linejoin": "round" });
    const vals = nums(ci === 0 ? V.data_a : V.data_b), ys = vals.length >= 2 ? vals : (vals.length ? [vals[0], vals[0]] : [0, 0]);
    const f = pchip(ys.map(v => Math.min(100, Math.max(0, v))));
    const pts = Array.from({ length: NP + 1 }, (_, i) => { const u = i / NP; return [(X0 + 1 + u * DXW) * K, (oy - BASE - f(u) / 100 * HV) * K]; });
    const lw = V.line_w * U;
    const glowF = `drop-shadow(0 0 ${5 * U}px ${rgba(col, 0.55)})`;
    const base = mk("polyline", { fill: "none", stroke: col, "stroke-width": lw, "stroke-linecap": "round", "stroke-linejoin": "round" });
    base.style.filter = glowF;
    const tr = mk("polyline", { fill: "none", stroke: lite, "stroke-width": lw * 2.4, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.8 });
    tr.style.filter = `blur(${1.4 * U}px) drop-shadow(0 0 ${9 * U}px ${rgba(col, 0.7)})`;
    return { pts, base, tr };
  });
  const seg = (pts, a, b) => {                                // the part of the line between the fractions a and b, as an SVG point list
    const at = u => { const x = clamp01(u) * NP, i = Math.min(NP - 1, Math.floor(x)), t = x - i;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; };
    const out = [at(a)];
    for (let i = Math.floor(a * NP) + 1; i <= Math.floor(b * NP); i++) if (i / NP > a && i / NP < b) out.push(pts[i]);
    out.push(at(b));
    return out.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(" ");
  };

  // ---- the names (typed character by character; each letter glows)
  const lbs = [];
  const fam = V.body_font, fsz = V.size * U;
  [V.label_a, V.label_b].forEach((txt, ci) => {
    const d = document.createElement("div"); d.className = "lb ml-body";
    Object.assign(d.style, { fontSize: `${fsz}px`, fontWeight: String(fw(fam, 800)), color: col });
    if (window.MLLook) MLLook.rich(d, String(txt == null ? "" : txt), { look: L, family: fam, weight: 800 }); else d.textContent = String(txt == null ? "" : txt);
    if (window.MLLook) { MLLook.glow(d, col, 100, { kind: "text", U }); d.style.textShadow += `, 0 0 ${70 * U}px ${rgba(col, 0.38)}`; }
    grp.appendChild(d);
    const letters = []; let u = 0, pw = -1;
    d.querySelectorAll("span.w").forEach((w, wi) => { const s = w.textContent; w.textContent = "";
      for (const ch of s) { const sp = document.createElement("span"); sp.textContent = ch; sp.style.display = "inline-block"; w.appendChild(sp);
        if (letters.length && wi !== pw) u += 1; pw = wi; letters.push({ el: sp, u }); u += 1; } });
    lbs.push({ el: d, letters, n: u, ci });
  });
  const TYPE0 = 46;
  const nmax = Math.max(1, ...lbs.map(o => o.n));
  const stepF = Math.min(3.5, 22 / Math.max(1, nmax - 1));    // 3.5 f a character; a long name is squeezed into about 22 f

  // ---- the measured timings (g = the frame minus "Starts at frame"): how far along its x the tip of each line is
  const PA = [[4, 0], [6, 0.003], [8, 0.011], [12, 0.03], [16, 0.064], [20, 0.117], [24, 0.217], [28, 0.41], [30, 0.555], [32, 0.678], [34, 0.767], [36, 0.825], [38, 0.87], [40, 0.903], [42, 0.928], [46, 0.967], [50, 0.99], [57, 1]];
  const PB = [[4, 0], [8, 0.017], [12, 0.05], [14, 0.072], [16, 0.105], [18, 0.145], [20, 0.195], [22, 0.26], [24, 0.355], [26, 0.483], [28, 0.64], [30, 0.79], [32, 0.88], [34, 0.933], [36, 0.96], [38, 0.972], [40, 0.983], [44, 0.994], [46, 1]];
  const TRAIL = 6;                                           // frames of recent drawing that stay bright and thick

  let ready = false;
  function layout() {                                        // the names are measured here, with the real fonts: nothing may overflow
    lbs.forEach(o => {
      const w0 = o.el.offsetWidth, maxw = W - 166 * K - 40 * U;
      if (w0 > maxw) o.el.style.fontSize = `${(fsz * maxw / w0).toFixed(2)}px`;
      const h = o.el.offsetHeight;
      o.el.style.transform = `translate(${(167 * K).toFixed(2)}px, ${((ORY[o.ci] - AL - 68.5) * K - h / 2).toFixed(2)}px)`;
    });
    ready = true;
  }
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    const on = g >= 0;
    grp.style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    [[PA, 0], [PB, 1]].forEach(([tb, ci]) => {
      const c = charts[ci], p = tab(tb, g)[0], pl = tab(tb, g - TRAIL)[0];
      if (p <= 0.0005) { c.base.setAttribute("points", ""); c.tr.setAttribute("points", ""); return; }
      c.base.setAttribute("points", seg(c.pts, 0, p));
      if (V.trail && p < 0.9995 && p > pl) c.tr.setAttribute("points", seg(c.pts, pl, p)); else c.tr.setAttribute("points", "");
    });
    lbs.forEach(o => o.letters.forEach(l => { l.el.style.opacity = g >= TYPE0 + stepF * l.u - 0.01 ? "1" : "0"; }));
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 12, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 37 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the names are measured
  // here, with the real fonts
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 800].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
