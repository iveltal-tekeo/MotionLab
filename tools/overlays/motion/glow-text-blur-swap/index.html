<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "text_1", "type": "string", "label": "First text (*bold* _italic_ ==highlight== ^signal colour^)", "default": "Hold on"},
  {"id": "text_2", "type": "string", "label": "Second text", "default": "Now go"},

  {"id": "shake", "type": "number", "label": "Handheld camera (0 = steady, 10 = shaky)", "default": 0, "min": 0, "max": 10, "step": 0.5},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 600, "step": 1},
  {"id": "background", "type": "boolean", "label": "Paint the paper behind it (off = see-through, over a video)", "default": true},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "glow-text-blur-swap" (2026-10-22): a big glowing word whips in from the right, smeared by a sideways motion blur that clears as it
     lands (f0-f10, a small overshoot to the left at f8), holds sharp (f10-f22), then is swapped for a second word:
     the first one shrinks away (f23-f26) while the second whips in from the LEFT, smeared the other way, overshoots
     the middle a little, and clears to sharp by f30; it holds to the end (f60). Look-aware: the ground, the text
     colour and its glow come from the look tokens. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .tx { position: absolute; white-space: nowrap; line-height: 1; font-synthesis: none; letter-spacing: -0.01em; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.033333" data-width="1920"
     data-height="1080">
  <svg width="0" height="0" style="position:absolute; left:0; top:0">
    <defs>
      <filter id="fx1" x="-40%" y="-60%" width="180%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur id="gx1" stdDeviation="0 0"/></filter>
      <filter id="fx2" x="-40%" y="-60%" width="180%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur id="gx2" stdDeviation="0 0"/></filter>
    </defs>
  </svg>
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 61;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, a)).toFixed(3)})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };

  // ---- the look: a dark ground (the ink); the words in one token colour, their glow in another
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const tc = V.colour === "signal" ? L.signal : V.colour === "paper" ? glare : L.mustard;
  const gc = V.colour === "signal" ? L.mustard : L.signal;
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = night;
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });

  const gl = V.glow / 100, fam = V.body_font, FS = V.size * U, YC = 0.4985;
  const mk = (txt, id) => {
    const tx = document.createElement("div"); tx.className = "tx ml-body"; tx.id = id;
    Object.assign(tx.style, { fontSize: `${FS}px`, fontWeight: String(fw(fam, 800)), color: tc, textTransform: V.caps ? "uppercase" : "none",
      left: "0px", top: `${H * YC}px`,
      textShadow: `0 0 ${5 * U}px ${rgba(gc, 1.0 * gl)}, 0 0 ${14 * U}px ${rgba(gc, 0.85 * gl)}, 0 0 ${34 * U}px ${rgba(gc, 0.55 * gl)}` });
    if (window.MLLook) MLLook.rich(tx, txt, { look: L, family: fam, weight: 800 }); else tx.textContent = txt;
    hand.appendChild(tx);
    return tx;
  };
  const T1 = mk(V.text_1, "t1"), T2 = mk(V.text_2, "t2");
  const G1 = q("gx1"), G2 = q("gx2");

  // ---- the motion, frame by frame from one proxy (seek-safe). g = the frame, shifted by "Starts at frame".
  // X = where the word's centre is (fraction of the width) per frame, measured on the reference; the sideways blur
  // follows the word's speed (a shutter open for about a third of a frame), plus a little soft blur on landing
  const X1 = [[0, 1.19], [1, 1.129], [2, 1.034], [3, 0.911], [4, 0.776], [5, 0.648], [6, 0.542], [7, 0.478], [8, 0.466], [9, 0.487], [10, 0.498]];
  const S1 = [[22, 1], [23, 0.97], [24, 0.93], [25, 0.866], [26, 0.862]];
  const X2 = [[23, -0.3], [24, -0.137], [25, 0.037], [26, 0.287], [27, 0.474], [28, 0.5305], [29, 0.51], [30, 0.5005]];
  const S2 = [[27, 1.02], [28, 1.065], [29, 1]];
  const SOFT = [[26, 0], [27, 3], [28, 7], [29, 3], [30, 0]];
  const SHUTTER = 0.38, S = Math.round(V.start);
  const lim = Math.max(1, W * 0.84);
  const blur = (G, el, tab2, g, soft) => {
    const sp = Math.abs(tab(tab2, g + 0.5)[0] - tab(tab2, g - 0.5)[0]) * W * SHUTTER / 3.46;
    const sx = Math.sqrt(sp * sp + soft * soft) * U, sy = soft * U;
    if (sx < 0.4) { el.style.filter = "none"; return; }
    G.setAttribute("stdDeviation", `${sx.toFixed(2)} ${sy.toFixed(2)}`);
    el.style.filter = `url(#${el.id === "t1" ? "fx1" : "fx2"})`;
  };
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    // first word: whips in from the right, then shrinks away as the second one arrives
    const on1 = g < 26.5;
    T1.style.visibility = on1 ? "visible" : "hidden";
    if (on1) {
      const x = tab(X1, g)[0], s = tab(S1, g)[0], fit = Math.min(1, lim / Math.max(1, T1.offsetWidth));
      T1.style.transform = `translate(${(x * W).toFixed(2)}px, 0px) translate(-50%, -50%) scale(${(s * fit).toFixed(4)})`;
      blur(G1, T1, X1, g, 0);
    }
    // second word: whips in from the left, overshoots a little, clears to sharp
    const on2 = g >= 23.5;
    T2.style.visibility = on2 ? "visible" : "hidden";
    if (on2) {
      const x = tab(X2, g)[0], s = tab(S2, g)[0], fit = Math.min(1, lim / Math.max(1, T2.offsetWidth));
      T2.style.transform = `translate(${(x * W).toFixed(2)}px, 0px) translate(-50%, -50%) scale(${(s * fit).toFixed(4)})`;
      blur(G2, T2, X2, g, tab(SOFT, g)[0] * 1.5);
    }
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 4 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 19 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
