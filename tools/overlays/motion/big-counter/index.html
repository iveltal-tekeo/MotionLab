<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "label", "type": "string", "label": "Small line above (empty = none)", "default": "THIS YEAR"},
  {"id": "from", "type": "number", "label": "Counts from", "default": 0, "min": -1000000000, "max": 1000000000, "step": 1},
  {"id": "to", "type": "number", "label": "Counts to", "default": 41, "min": -1000000000, "max": 1000000000, "step": 1},
  {"id": "decimals", "type": "number", "label": "Decimals", "default": 0, "min": 0, "max": 3, "step": 1},
  {"id": "prefix", "type": "string", "label": "Before the number ($, +, ...)", "default": ""},
  {"id": "suffix", "type": "string", "label": "After the number (%, K, ...)", "default": "%"},
  {"id": "caption", "type": "string", "label": "Caption under it (a / starts a new line, empty = none)", "default": "of creators say / short videos grew their channel most"},
  {"id": "look", "type": "enum", "label": "Look", "default": "glow", "options": [{"value": "glow", "label": "Glow - a colour rising from the bottom"}, {"value": "chart", "label": "Chart - an area chart rising behind the number, a tag on its tip"}, {"value": "card", "label": "Card - the number on a white card"}]},
  {"id": "tag", "type": "string", "label": "Tag on the chart (chart look)", "default": "Growth"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent", "type": "color", "label": "Accent (the number, the glow, the chart)", "default": "#2bd34a"},
  {"id": "text_color", "type": "color", "label": "Other text", "default": "#ffffff"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#000000"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2.5, "step": 0.05},
  {"id": "y", "type": "number", "label": "Number height (% of the height)", "default": 40, "min": 0, "max": 100, "step": 1},
  {"id": "count_frames", "type": "number", "label": "Frames of counting", "default": 45, "min": 2, "max": 600, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "big-counter" (0.5.0, the Motion Graphics library): one big number counts up and lands
     with a small kick, a label above it and a caption under it; the glow look lights the frame from the bottom as it
     counts (graphics__upwork-ad: "34%" -> "41%" in green over a rising green glow, a two-line caption; a cut to black
     between stats), the chart look draws an area chart rising behind the number with a tag riding its tip
     (text__financials: "$0" -> "$10,000" over ~49 frames at 25 fps, an S-curve, the tag following the curve), the card
     look puts it on a white card (graphics__makin-bank). The count eases out (fast, then slow) and every frame's value
     is written into the timeline (no per-frame callbacks), so a snapshot = the render. MotionLab's own code.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .ctr { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; line-height: 1; font-synthesis: none; }
  #num::after { content: attr(data-v); }
  #tagv::after { content: attr(data-v); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="glow" class="abs"></div>
  <svg id="chart" class="abs" style="overflow:visible"></svg>
  <div id="cam" class="abs">
    <div id="cardbox" class="abs"></div>
    <div id="lab" class="ctr"></div><div id="num" class="ctr"></div><div id="cap" class="ctr"></div>
    <div id="tag" class="abs"><div id="tagl"></div><div id="tagv"></div></div>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const ONE = /^(Anton|Bebas Neue|Archivo Black|Bagel Fat One|Bangers|Lilita One|Luckiest Guy|Pacifico|Permanent Marker|DM Serif Display|Instrument Serif)$/;
  const fam = `"${V.font}", "Segoe UI", sans-serif`, heavy = ONE.test(V.font) ? 400 : 800, mid = ONE.test(V.font) ? 400 : 600;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#glow", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, cy = H * V.y / 100, look = V.look, card = look === "card";
  const nf = new Intl.NumberFormat("en-US", { minimumFractionDigits: V.decimals, maximumFractionDigits: V.decimals });
  const fmt = v => `${V.prefix}${nf.format(v)}${V.suffix}`;
  const longest = Math.max(fmt(V.from).length, fmt(V.to).length);
  const fs = Math.min(230 * U * s, W * 0.86 / (longest * 0.6));       // fits the width whatever the number
  const ink = card ? "#15171a" : V.text_color;
  Object.assign(q("num").style, { font: `${heavy} ${fs}px ${fam}`, color: card ? "#15171a" : V.accent, letterSpacing: "-0.02em" });
  Object.assign(q("lab").style, { font: `${mid} ${42 * U * s}px ${fam}`, color: ink, letterSpacing: "0.04em" });
  Object.assign(q("cap").style, { font: `${mid} ${40 * U * s}px ${fam}`, color: ink, lineHeight: 1.35, whiteSpace: "normal", opacity: 0.92 });
  q("lab").textContent = V.label || "";
  q("cap").innerHTML = (V.caption || "").split(/\s+\/\s+/).map(l => l.replace(/[&<>]/g, "")).join("<br>");
  gsap.set("#lab", { x: W / 2, y: cy - fs * 0.62 - 70 * U * s, xPercent: -50 });
  gsap.set("#num", { x: W / 2, y: cy, xPercent: -50, yPercent: -50, transformOrigin: "50% 50%" });
  gsap.set("#cap", { x: W / 2, y: cy + fs * 0.6 + 26 * U * s, xPercent: -50, width: W * 0.8 });
  if (card) {                                           // a white card behind the number, like a balance
    Object.assign(q("cardbox").style, { background: "#ffffff", borderRadius: `${30 * U * s}px`, boxShadow: `0 ${24 * U}px ${60 * U}px rgba(0,0,0,.25)` });
    const cwid = Math.min(W * 0.86, longest * fs * 0.62 + 120 * U * s), chei = fs * 1.2 + (V.label ? 110 * U * s : 40 * U * s);
    gsap.set("#cardbox", { x: W / 2 - cwid / 2, y: cy - chei / 2 - (V.label ? 30 * U * s : 0), width: cwid, height: chei });
    gsap.set("#lab", { y: cy - fs * 0.62 - 50 * U * s });
  }

  // ---- the motion
  const S = Math.round(V.start), C0 = S + K(10), N = Math.max(2, Math.round(V.count_frames * FPS / 30)), C1 = C0 + N;
  const ease = gsap.parseEase("power3.out");
  if (card) enter("#cardbox", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1 }, S, S + K(14), "back.out(1.6)");
  if (V.label) enter("#lab", { opacity: 0, y: cy - fs * 0.62 - (card ? 50 : 70) * U * s + 20 * U }, { opacity: 1, y: cy - fs * 0.62 - (card ? 50 : 70) * U * s }, S, S + K(12), "power2.out");
  enter("#num", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1 }, S + K(4), C0, "power2.out");
  for (let f = S; f <= C1 && f < FRAMES; f++) {           // the value on every frame of the count
    const p = f < C0 ? 0 : ease((f - C0) / N);
    set("#num", { attr: { "data-v": fmt(V.from + (V.to - V.from) * p) } }, f);
  }
  to("#num", { scale: 1.06 }, C0, C1 - K(3), "power1.in");                  // it grows as it counts...
  ft("#num", { scale: 1.1 }, { scale: 1 }, C1 - K(3), C1 + K(10), "back.out(3)");   // ...and kicks as it lands
  if (V.caption) enter("#cap", { opacity: 0, y: cy + fs * 0.6 + 50 * U * s }, { opacity: 0.92, y: cy + fs * 0.6 + 26 * U * s }, C1 - K(6), C1 + K(10), "power2.out");
  if (look === "glow" && V.background) {                  // the frame lights from the bottom while it counts
    gsap.set("#glow", { background: `linear-gradient(0deg, ${V.accent} 0%, ${V.accent}aa 18%, ${V.accent}33 45%, transparent 70%)`, transformOrigin: "50% 100%" });
    ft("#glow", { opacity: 0, scaleY: 0.25 }, { opacity: 1, scaleY: 1 }, S, C1, "power2.out");
    to("#glow", { scaleY: 0.92 }, C1 + K(2), FRAMES, "sine.inOut");        // it breathes during the hold
  }
  if (look === "chart") {                                 // an area chart rising behind the number, a tag on its tip
    const svg = q("chart"), x0 = 0, x1 = W, y0 = H * 0.86, y1 = cy - fs * 0.2;
    const path = `M${x0},${y0} C${W * 0.45},${y0} ${W * 0.55},${y1} ${x1},${y1 - 40 * U}`;
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.innerHTML = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${V.accent}" stop-opacity=".55"/><stop offset="1" stop-color="${V.accent}" stop-opacity="0"/></linearGradient>
      <clipPath id="cp"><rect id="cr" x="0" y="0" width="0" height="${H}"/></clipPath></defs>
      <g clip-path="url(#cp)"><path d="${path} L${x1},${H} L${x0},${H} Z" fill="url(#ga)"/><path d="${path}" fill="none" stroke="${V.accent}" stroke-width="${5 * U}"/></g>`;
    const bez = t => { const a = (1 - t) ** 3, b = 3 * (1 - t) ** 2 * t, c = 3 * (1 - t) * t * t, d = t ** 3;
      return [a * x0 + b * W * 0.45 + c * W * 0.55 + d * x1, a * y0 + b * y0 + c * y1 + d * (y1 - 40 * U)]; };
    const tag = q("tag");
    Object.assign(tag.style, { background: "#1f1f22", color: "#fff", borderRadius: `${10 * U}px`, padding: `${10 * U}px ${16 * U}px`,
                               font: `${mid} ${22 * U * s}px ${fam}`, border: `1px solid #ffffff22`, whiteSpace: "nowrap" });
    q("tagl").textContent = V.tag || "";
    Object.assign(q("tagl").style, { opacity: 0.7, fontSize: `${18 * U * s}px` });
    Object.assign(q("tagv").style, { font: `${heavy} ${28 * U * s}px ${fam}` });
    if (C0 > 0) set(tag, { opacity: 0 }, 0);
    for (let f = C0; f <= C1 && f < FRAMES; f++) {
      const p = ease((f - C0) / N), [tx, ty] = bez(Math.min(1, p));
      set("#cr", { attr: { width: tx } }, f);
      set(tag, { x: Math.min(tx, W - 200 * U) - 20 * U, y: ty - 110 * U, opacity: 1 }, f);
      set("#tagv", { attr: { "data-v": fmt(V.from + (V.to - V.from) * p) } }, f);
    }
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
