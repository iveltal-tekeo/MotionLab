  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},

<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "swinging-light-text-reveal" (2026-10-22): a dark headline lit by a small lamp that swings on a thread. The lamp (a ring on a thread hung from
     one point, the thread bending behind the swing like a rope) starts flung out to the left and swings through the
     bottom to the far right and back (f0-f34), once more to the left (f45) and back, the swing following the
     reference's measured angle frame by frame and smeared by motion blur; a short pull cord appears beside the
     thread at f39, is pulled down ~11 px f39-f47 and let go f52-f58. At f59 the lamp switches on: a white core, a
     soft warm halo and the headline lit in the light colour for the letters near it, falling off to the dim base
     over ~120 px each side of the lamp; the lit part follows the lamp while its swing dies away (about -15 deg at
     f82, still at about -4 deg from f133) to the last frame (f152). Look-aware: the ground, the dim base of the
     headline, the thread, the light colour, the headline font and the film grain come from the look tokens.
     MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #tw { position: absolute; white-space: nowrap; line-height: 1; font-synthesis: none; letter-spacing: 0.005em; }
  #tw .lay { white-space: nowrap; }
  #tl { position: absolute; left: 0; top: 0; visibility: hidden; }
  #halo { position: absolute; left: 0; top: 0; border-radius: 50%; visibility: hidden; pointer-events: none; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5.1" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs">
    <div id="halo"></div>
    <div id="tw" class="ml-display"><div id="tb" class="lay"></div><div id="tl" class="lay"></div></div>
    <svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 153;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = W / 720;                                     // the reference's pixels (720 wide) -> this frame's
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const toH = a => "#" + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  const mixh = (a, b, t) => { const x = hex(a), y = hex(b); return toH(x.map((v, i) => v + (y[i] - v) * t)); };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, a)).toFixed(3)})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };

  // ---- the look: a near-black ground, the headline's dim base a tenth of the paper colour, one light colour
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const ground = mixh(night, "#000000", 0.75);
  const lc = V.light === "signal" ? L.signal : V.light === "paper" ? glare : V.light === "deep" ? L.deep : L.mustard;
  const lit = mixh(lc, "#ffffff", 0.3), hot = mixh(lc, "#ffffff", 0.85);
  const GL = Math.max(0, V.glow) / 100;
  Object.assign(q("bgfill").style, { width: `${W}px`, height: `${H}px`, background: V.background ? ground : "transparent" });
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });

  // ---- the headline: a dim base and, over it, the same text in the light colour, masked to the lamp's reach
  const fam = V.display_font, tw = q("tw"), tb = q("tb"), tlit = q("tl");
  const FS0 = V.size * U, YC = 643.5 / 1280;
  Object.assign(tw.style, { fontSize: `${FS0}px`, fontWeight: String(fw(fam, 800)), top: "0px" });
  const fill = (el, c) => { if (window.MLLook) MLLook.rich(el, V.text, { look: L, family: fam, weight: 800 }); else el.textContent = V.text; el.style.color = c; };
  fill(tb, mixh(ground, glare, 0.1));
  fill(tlit, lit);
  tlit.style.textShadow = GL > 0 ? `0 0 ${0.03 * FS0}px ${rgba(lc, 0.5 * GL)}, 0 0 ${0.09 * FS0}px ${rgba(lc, 0.28 * GL)}` : "none";

  // ---- the lamp's swing: the reference's measured angle for every frame (degrees from straight down, + = right);
  // the thread is a quadratic curve from the pivot whose control point sits 0.6 of the way down (it bends behind the swing)
  const TH = [-98.7, -92.3, -80.4, -68.6, -64.0, -44.3, -25.5, -9.4, -3.7, 12.9, 32.8, 46.0, 50.7, 63.4, 76.6, 82.5, 84.1, 85.2, 87.3, 85.9, 83.3, 73.5, 65.9, 60.3, 49.2, 31.7, 19.9, 14.5, -1.4, -17.1,
    -23.8, -25.9, -30.2, -32.3, -33.6, -32.2, -29.9, -28.4, -28.9, -32.1, -36.1, -37.6, -38.7, -40.2, -41.8, -42.6, -40.2, -35.6, -32.1, -30.7, -25.3, -19.2, -14.0, -11.7, -5.5, 1.6, 5.2, 6.1, 8.9,
    10.8, 11.8, 11.4, 10.7, 9.5, 8.4, 7.3, 6.4, 5.9, 5.5, 4.1, 1.8, -0.8, -3.5, -5.9, -7.5, -8.1, -8.5, -9.5, -10.7, -12.1, -13.4, -14.5, -15.0, -15.0, -14.6, -13.9, -13.1, -12.3, -11.7, -11.3, -11.1, -10.9,
    -10.7, -10.4, -9.9, -9.4, -8.9, -8.3, -7.8, -7.1, -6.6, -6.1, -5.7, -5.4, -5.2, -5.1, -5.0, -5.0, -4.9, -4.7, -4.6, -4.4, -4.2, -4.0, -3.8, -3.6, -3.4, -3.3, -3.2, -3.1, -3.0, -3.1, -3.2, -3.3, -3.3,
    -3.3, -3.5, -3.6, -3.7, -3.8, -3.8, -3.9, -4.0, -4.1];
  const theta = g => { const x = Math.max(0, Math.min(TH.length - 1, g)), i = Math.floor(x), k = x - i; return TH[i] + ((TH[Math.min(TH.length - 1, i + 1)] - TH[i]) * k); };
  const PX = 360, PY = 283, LEN = 244;
  const CORD = [[39, 0], [47, 11], [52, 10], [58, 0]];                     // the pull cord's stretch (reference px)
  const NS = "http://www.w3.org/2000/svg", sv = q("sv");
  const mkEl = (t, at, par) => { const e = document.createElementNS(NS, t); Object.entries(at).forEach(([k, v]) => e.setAttribute(k, v)); (par || sv).appendChild(e); return e; };
  const N = 11, SHUT = 0.9;                                                   // motion blur: N copies across 0.9 of a frame
  const copies = Array.from({ length: N }, () => ({
    th: mkEl("path", { fill: "none", "stroke-linecap": "round" }),
    r1: mkEl("circle", { fill: "none" }), r2: mkEl("circle", { fill: "none" }), cc: mkEl("circle", { fill: hot, stroke: "none" }) }));
  const cord = mkEl("line", { "stroke-linecap": "butt" }), cdot = mkEl("circle", {});
  const halo = q("halo");
  const HR = 140 * K;
  Object.assign(halo.style, { width: `${2 * HR}px`, height: `${2 * HR}px`, background: GL > 0
    ? `radial-gradient(circle closest-side, ${rgba(lc, 0.30 * GL)} 0%, ${rgba(lc, 0.22 * GL)} 9%, ${rgba(lc, 0.17 * GL)} 21%, ${rgba(lc, 0.16 * GL)} 36%, ${rgba(lc, 0.12 * GL)} 57%, ${rgba(lc, 0.04 * GL)} 79%, ${rgba(lc, 0)} 100%)` : "none" });

  // ---- the motion, frame by frame from one proxy (seek-safe). g = the frame, shifted by "Starts at frame".
  const S = Math.round(V.start), ON = 59;
  const thr0 = mixh(glare, ground, 0.12), thr1 = mixh(lc, "#ffffff", 0.6);
  function pos(th) { const a = th * Math.PI / 180; return [PX + LEN * Math.sin(a), PY + LEN * Math.cos(a)]; }
  let lastFS = 0;
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    const gi = Math.round(g), on = g >= ON - 0.01;                       // on = the headline is lit
    const flash = gi >= 20 && gi <= 23, weak = gi >= 33 && gi <= 35;     // the bulb flickers on twice before (strong, then weak)
    const bulb = on || flash;
    // headline: fit its width (80 % of the frame at most), then centre it
    tw.style.fontSize = `${FS0}px`;
    const w0 = Math.max(1, tw.offsetWidth), fs = FS0 * Math.min(1, 0.8 * W / w0);
    if (Math.abs(fs - lastFS) > 0.05) { tw.style.fontSize = `${fs}px`; lastFS = fs; } else tw.style.fontSize = `${lastFS}px`;
    const wt = tw.offsetWidth, left = (W - wt) / 2;
    tw.style.left = `${left.toFixed(2)}px`; tw.style.top = `${(YC * H - 0.5 * fs).toFixed(2)}px`;
    // the lamp
    const [bx, by] = pos(theta(g));
    const a0 = bulb ? 0.8 : 0.7, per = 1 - Math.pow(1 - a0, 1 / N), perc = 1 - Math.pow(0.04, 1 / N);
    const col = bulb ? thr1 : weak ? mixh(glare, ground, 0.05) : thr0, rr = 8.5 * K, sw = 1.7 * K;
    copies.forEach((c, i) => {
      const gg = g + (N > 1 ? (i / (N - 1) - 0.5) * SHUT : 0);
      const [x, y] = pos(theta(gg)), dy = y - PY;
      c.th.setAttribute("d", `M ${(PX * K).toFixed(2)} ${(PY * K).toFixed(2)} Q ${(PX * K).toFixed(2)} ${((PY + 0.6 * dy) * K).toFixed(2)} ${(x * K).toFixed(2)} ${(y * K).toFixed(2)}`);
      c.th.setAttribute("stroke", col); c.th.setAttribute("stroke-width", sw.toFixed(2)); c.th.setAttribute("stroke-opacity", per.toFixed(3));
      c.r1.setAttribute("cx", (x * K).toFixed(2)); c.r1.setAttribute("cy", (y * K).toFixed(2)); c.r1.setAttribute("r", rr.toFixed(2));
      c.r1.setAttribute("stroke", col); c.r1.setAttribute("stroke-width", (1.8 * K).toFixed(2)); c.r1.setAttribute("stroke-opacity", per.toFixed(3));
      c.r2.setAttribute("cx", (x * K).toFixed(2)); c.r2.setAttribute("cy", (y * K).toFixed(2)); c.r2.setAttribute("r", (rr * 0.66).toFixed(2));
      c.r2.setAttribute("stroke", col); c.r2.setAttribute("stroke-width", (1.0 * K).toFixed(2)); c.r2.setAttribute("stroke-opacity", (per * 0.5).toFixed(3));
      c.r2.setAttribute("fill", weak ? rgba(glare, 0.5 / N * 2.2) : "none");
      c.cc.setAttribute("cx", (x * K).toFixed(2)); c.cc.setAttribute("cy", (y * K).toFixed(2)); c.cc.setAttribute("r", (6.2 * K).toFixed(2));
      c.cc.setAttribute("opacity", bulb ? perc.toFixed(3) : "0");
    });
    // the pull cord beside the thread (appears at f39)
    const showCord = g >= 39;
    const ce = tab(CORD, g)[0], cy1 = 330 + ce;
    cord.setAttribute("x1", (371.7 * K).toFixed(2)); cord.setAttribute("x2", (371.7 * K).toFixed(2));
    cord.setAttribute("y1", (PY * K).toFixed(2)); cord.setAttribute("y2", (cy1 * K).toFixed(2));
    cord.setAttribute("stroke", mixh(glare, ground, 0.55)); cord.setAttribute("stroke-width", (2 * K).toFixed(2));
    cord.setAttribute("opacity", showCord ? "1" : "0");
    cdot.setAttribute("cx", (371.7 * K).toFixed(2)); cdot.setAttribute("cy", (cy1 * K).toFixed(2)); cdot.setAttribute("r", (2.9 * K).toFixed(2));
    cdot.setAttribute("fill", mixh(lc, glare, 0.8)); cdot.setAttribute("opacity", showCord ? "1" : "0");
    // light on at f59: the white core, the halo, the lit headline
    if (bulb || weak) {
      halo.style.visibility = GL > 0 ? "visible" : "hidden"; halo.style.opacity = weak ? "0.22" : "1";
      halo.style.left = `${(bx * K - HR).toFixed(2)}px`; halo.style.top = `${(by * K - HR).toFixed(2)}px`;
    } else halo.style.visibility = "hidden";
    if (on) {
      tlit.style.visibility = "visible";
      const rel = bx * K - left, P = [[-260, 0], [-233, .06], [-210, .165], [-187, .35], [-165, .55], [-140, .87], [-100, 1], [100, 1], [140, .87], [165, .55], [187, .35], [210, .165], [233, .06], [260, 0]];
      const mask = `linear-gradient(90deg, ${P.map(([d, a]) => `rgba(0,0,0,${a}) ${(rel + d * K).toFixed(1)}px`).join(", ")})`;
      tlit.style.maskImage = mask; tlit.style.webkitMaskImage = mask;
    } else tlit.style.visibility = "hidden";
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 19 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font); the headline is measured per frame, so it is fitted with the right font
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { render(0); window.__timelines["main"] = tl; });
</script>
</body>
</html>
