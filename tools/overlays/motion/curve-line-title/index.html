<!-- MotionLab motion template "curve-line-title" (2026-10-22): a glowing line drawn through five points over a woven dark ground, filmed by a camera that rides its

     tip as it leaves (f21-f102: the line loops down-left, then rushes up and over, fastest around f60-f70 while it
     passes the next points and the title shows behind it, then slows to rest on the last point), and then pulls back
     and over to show the whole S (f102-f160, fastest around f131, then drifting a few px to f230) while the colours
     settle from "red at the tip, cold behind" to "red in the middle, cold at both ends" and a second title blurs in
     letter by letter in front (f150-f180). The line is drawn on a canvas by one function of the frame. Look-aware:
