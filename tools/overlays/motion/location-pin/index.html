<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "place", "type": "string", "label": "Place", "default": "Lisbon"},
  {"id": "sub", "type": "string", "label": "Line under it (empty = none)", "default": "Portugal"},
  {"id": "map", "type": "boolean", "label": "A map under it (streets drawn in)", "default": true},
  {"id": "pin_color", "type": "color", "label": "Pin colour", "default": "#ef2b2b"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background / map colour", "default": "#eef2f7"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "x", "type": "number", "label": "Pin across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Pin down (% of the height)", "default": 52, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Pin drops at frame", "default": 6, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "location-pin" (0.5.0, the Motion Graphics library): a map pin drops in and bounces, rings
     pulse out from its point the whole time, a place card pops up above it (back.out, from the pin); optionally a map
     whose streets draw themselves in first. Learned from overlays__location-pop-up (a red pin with a pulsing red
     ripple, a white card with the place name popping above it, f10-f49 (00:00:00:10-00:00:01:24) at 25 fps) and
     graphics__map (a route drawn on a pale blue map). MotionLab's own code. Size-independent; an overlay (background
     and map off) or a scene. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .ring { position: absolute; left: 0; top: 0; border-radius: 50%; }
  .t { white-space: nowrap; line-height: 1.15; font-synthesis: none; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <svg id="map" class="abs" style="overflow:visible"></svg>
  <div id="cam" class="abs"><div id="rings" class="abs"></div><div id="shadow" class="abs"></div>
    <svg id="pin" class="abs" viewBox="0 0 24 32" style="overflow:visible"><path d="M12 31s10-11.2 10-19A10 10 0 0 0 2 12c0 7.8 10 19 10 19z"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>
    <div id="card" class="abs"><div id="cp" class="t"></div><div id="cs" class="t"></div></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, px = W * V.x / 100, py = H * V.y / 100;    // px, py = the pin's point
  const pw = 110 * U * s, ph = pw * 32 / 24;
  q("pin").setAttribute("width", pw); q("pin").setAttribute("height", ph);
  q("pin").querySelector("path").setAttribute("fill", V.pin_color);
  gsap.set("#pin", { x: px - pw / 2, y: py - ph, transformOrigin: "50% 100%" });
  Object.assign(q("shadow").style, { width: `${pw * 0.7}px`, height: `${pw * 0.2}px`, borderRadius: "50%", background: "rgba(0,0,0,.22)", filter: `blur(${4 * U}px)` });
  gsap.set("#shadow", { x: px - pw * 0.35, y: py - pw * 0.1, opacity: 0 });
  const rs = pw * 2.6;
  const rings = [0, 1, 2].map(() => { const r = document.createElement("div"); r.className = "ring";
    Object.assign(r.style, { width: `${rs}px`, height: `${rs}px`, background: `radial-gradient(circle, ${V.pin_color}55, ${V.pin_color}22 60%, transparent 72%)` });
    q("rings").appendChild(r); gsap.set(r, { x: px - rs / 2, y: py - rs / 2, opacity: 0, scale: 0.2 }); return r; });
  // the card: the place + a line under it, a small pointer
  const card = q("card");
  q("cp").textContent = V.place; q("cs").textContent = V.sub || "";
  Object.assign(q("cp").style, { font: `700 ${56 * U * s}px ${fam}`, color: "#15171a" });
  Object.assign(q("cs").style, { font: `400 ${38 * U * s}px ${fam}`, color: "#15171a", opacity: 0.55, marginTop: `${6 * U * s}px` });
  Object.assign(card.style, { background: "#ffffff", borderRadius: `${24 * U * s}px`, padding: `${26 * U * s}px ${44 * U * s}px`,
    boxShadow: `0 ${16 * U}px ${40 * U}px rgba(20,24,40,.16)`, minWidth: `${260 * U * s}px` });
  gsap.set(card, { x: px, y: py - ph - 36 * U * s, xPercent: -50, yPercent: -100, transformOrigin: "50% 100%" });
  // the map: streets as lines (seeded), a river, blocks - drawn in, never fully still (a slow zoom)
  if (V.map && V.background) {
    const R = rnd(41), svg = q("map");
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    let g = `<path id="river" d="M-50,${H * 0.28} C${W * 0.3},${H * 0.22} ${W * 0.5},${H * 0.42} ${W + 50},${H * 0.36}" fill="none" stroke="#bfd6f2" stroke-width="${70 * U}" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>`;
    for (let i = 0; i < 12; i++) {                                     // 6 each way, spread evenly with a jitter
      const v = i % 2 === 0, k = Math.floor(i / 2), p = (k + 0.5) / 6 + (R() - 0.5) * 0.09, w = (k % 3 === 1 ? 24 : 12) * U;
      const d = v ? `M${p * W},-20 L${p * W + (R() - 0.5) * 200 * U},${H + 20}` : `M-20,${p * H} L${W + 20},${p * H + (R() - 0.5) * 200 * U}`;
      g += `<path class="st" d="${d}" fill="none" stroke="#ffffff" stroke-width="${w}" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>`;
    }
    svg.innerHTML = `<g id="mg">${g}</g>`;
  }

  // ---- the motion: streets draw (20 f, staggered); the pin drops (12 f, accelerating) and bounces (squash);
  // the card pops above it (back.out 14 f); the rings pulse out every 30 frames, overlapping, the whole time
  const S = Math.round(V.start);
  if (V.map && V.background) {
    ft("#river", { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 } }, 0, K(24), "power2.inOut");
    document.querySelectorAll(".st").forEach((p, i) => ft(p, { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 } }, i * K(1), i * K(1) + K(20), "power2.out"));
    to("#map", { scale: 1.06, transformOrigin: `${px}px ${py}px` }, 0, FRAMES, "sine.inOut");
  }
  enter("#pin", { opacity: 1, y: py - ph - 260 * U * s }, { y: py - ph }, S, S + K(12), "power2.in");
  ft("#pin", { scaleX: 1.25, scaleY: 0.72 }, { scaleX: 1, scaleY: 1 }, S + K(12), S + K(22), "elastic.out(1, 0.4)");
  ft("#shadow", { opacity: 0.2, scale: 0.4 }, { opacity: 1, scale: 1 }, S, S + K(12), "power2.in");
  enter(card, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1 }, S + K(16), S + K(30), "back.out(1.9)");
  to(card, { y: py - ph - 46 * U * s }, S + K(30), FRAMES, "sine.inOut");             // the card floats a little
  for (let f = S + K(12), i = 0; f + K(30) < FRAMES + K(30); f += K(20), i++) {
    const r = rings[i % 3];
    if (f + K(36) > FRAMES) break;
    ft(r, { opacity: 0.9, scale: 0.15 }, { opacity: 0, scale: 1 }, f, f + K(36), "power1.out");
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
