<!-- MotionLab motion template "newspaper-page-reveal" (2026-10-22): an upright frame, a dark photo above a printed newspaper page. The page is cut through seven layouts
     (italic headline over small columns, a big serif headline, a sans headline over a long paragraph, a headline with a
     portrait column, a condensed headline with a "who's who" strip of pictures, a short page on a grey desk) twice in
     a row, a hard cut every 10 frames: the first frame of each cut is smeared sideways, the next is nearly sharp, the
     frames after it hold with a slow push-in (0.9 % in 9 frames) and the last one smears a little before the next cut.
     The photo above is re-cropped (zoomed) at every cut. The headline is the one text; the pictures are two media slots.
     Look-aware: colours, fonts, corners, shadow and grain come from the look tokens. MotionLab's own code, own sample
     copy. Size-independent (1 reference px of the 720 x 1280 clip = 1.5 px at 1080 wide). -->

  .abs { position: absolute; left: 0; top: 0; }
</style>

  </defs></svg>

  pic(lE, 285, 413, 198, 330, { label: "your photo" });

  sub(lE, 500, 366, 235, 140, 44, SUB[7]);
  fill(lE, 500, 520, 215, 340, 9, { off: 5 });

  // ---- layout 5: a condensed headline, three columns, a black banner and a strip of pictures
  const lF = lay();
  head(lF, { cx: 357, cy: 61, size: 96, maxW: 330, cls: "ml-body", fam: V.body_font, wt: 800, sx: 0.62, up: true, ls: "0" });
  cap(lF, 15, 128, 220, 7.5, "By a staff reporter", {}); cap(lF, 15, 141, 220, 7, "City desk", { col: ink(0.5) });
  [[5, 0], [247, 2], [477, 4]].forEach(([x, o]) => fill(lF, x, 160, 225, 236, 10.5, { off: o }));
  const bn = box(lF, 0, 419, 720, 42, { background: L.ink });
  cap(bn.parentNode, 0, 431, 720, 15, "Who is who on the harbour board  -  who is who on the harbour board", { align: "center", col: L.paper });
  fill(lF, 10, 481, 190, 380, 9, { off: 1 });
  [0, 1, 2, 3, 4].forEach(i => {
    const fx = parseFloat(String(V.faces_focus || "50% 35%").split(/\s+/)[0]) || 50, fy = String(V.faces_focus || "50% 35%").split(/\s+/)[1] || "35%";
    pic(lF, 215 + i * 115, 481, 103, 150, { focus: `${Math.min(100, Math.max(0, fx + (i - 2) * 18))}% ${fy}`, seed: 5 + i });
  });
  fill(lF, 215, 645, 505, 220, 9, { off: 2, a: 0.7 });

  // ---- layout 6: a short page on a grey desk
  const lG = lay(577);
  cap(lG, -20, 60, 760, 11, DATE, { align: "center" });
  head(lG, { cx: 376, cy: 132, size: 54, maxW: 640, cls: "ml-display", fam: V.display_font });
  fill(lG, -40, 214, 800, 124, 21, { lh: 1.6, a: 0.85 });
  fill(lG, 52, 430, 245, 60, 9.5, { cls: "ml-body", wt: 700, a: 0.65, lh: 1.3 });
  fill(lG, 318, 430, 285, 60, 9.5, { cls: "ml-body", wt: 700, a: 0.65, lh: 1.3, off: 3 });
  fill(lG, 640, 430, 150, 60, 9.5, { cls: "ml-body", wt: 700, a: 0.65, lh: 1.3, off: 5 });
  box(lG, 0, 497, 720, 80, { background: `linear-gradient(to bottom, transparent, ${ink(0.12)})` });

  // ---- the motion: a hard cut every 10 frames through the 7 layouts, twice; each cut frame smears sideways, the next
  // is nearly sharp, the rest hold with a slow push-in, and the last one smears a little before the next cut
  const smb = q("smb");
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    const sc = Math.min(13, Math.max(0, Math.floor(g / 10))), lf = Math.min(9, Math.max(0, g - sc * 10)), li = sc % 7;
    const pt = PT[sc] * H;
    LAYS.forEach((d, i) => { d.style.display = i === li ? "block" : "none"; });
    LAYS[li].style.top = px(pt);
    const ins = INSET[li] || [0, 0];
    Object.assign(phEl.style, { top: px(r(ins[0])), height: px(Math.max(1, pt - r(ins[0]))), width: px(W - r(ins[1])) });
    pz.style.transform = `scale(${ZOOM[li]})`;
    scene.style.transform = `scale(${(1 + 0.0009 * lf).toFixed(5)})`;
    const sg = (g > 0 && lf === 0) ? 7 : lf === 1 ? 1.2 : (lf === 9 && sc < 13) ? 2.5 : 0;
    if (sg > 0) { smb.setAttribute("stdDeviation", `${(sg * R).toFixed(2)} 0`); scene.style.filter = "url(#sm)"; } else scene.style.filter = "none";
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 9 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the headlines are
  // fitted to their layouts here, with every layout shown for the measuring
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 800].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.load(`italic 400 100px "${V.display_font}"`), document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    LAYS.forEach(d => { d.style.display = "block"; });
    HLS.forEach(fitHead);
    render(0);
    window.__timelines["main"] = tl;
  });
</script>
