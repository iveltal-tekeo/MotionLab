<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "photos", "type": "string", "label": "Screens: pictures in the graphic’s assets folder (| between; empty = colour art)", "default": ""},
  {"id": "count", "type": "number", "label": "Phones", "default": 5, "min": 2, "max": 7, "step": 1},
  {"id": "title", "type": "string", "label": "A line under them (empty = none)", "default": "Every screen, designed"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent", "type": "color", "label": "Accent colour", "default": "#ff4fa3"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#ececec"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 1.5, "step": 0.05},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "phone-fan" (0.5.0, the Motion Graphics library): phones (or cards) drop onto a pile, then
     fan out into a row like cards in a hand - each turning and sliding to its place, the middle one forward and biggest;
     the fan breathes. Learned from social__app-video-showcase (phone-shaped cards - black, pink gradients - fanning out
     from a pile into a row, f8-f66 at 25 fps). Your screens go in the graphic's assets folder. MotionLab's own drawing.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .ph { position: absolute; left: 0; top: 0; overflow: hidden; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="fan" class="abs"></div><div id="tt" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam", "#fan"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const own = String(V.photos || "").split("|").map(x => x.trim().replace(/"/g, "")).filter(Boolean), n = own.length || Math.round(V.count), s = V.size;
  const pw = 250 * U * s, ph = pw * 2.05, cx = W / 2, cy = H * 0.45;
  const ART = i => i % 2 ? `linear-gradient(160deg, ${V.accent}, #7c3aed 60%, #1e1b4b)` : `repeating-linear-gradient(135deg, #1b1b1f 0 ${18 * U}px, #232329 ${18 * U}px ${36 * U}px)`;
  const phones = [];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div"); p.className = "ph";
    Object.assign(p.style, { width: `${pw}px`, height: `${ph}px`, borderRadius: `${pw * 0.14}px`, border: `${pw * 0.035}px solid #0d0d10`,
      background: own[i] ? `center / cover url("${own[i]}")` : ART(i), boxShadow: `0 ${24 * U}px ${50 * U}px rgba(0,0,0,.28)` });
    p.innerHTML = `<div style="position:absolute;left:35%;width:30%;top:3%;height:${pw * 0.06}px;border-radius:999px;background:#0d0d10"></div>`;
    q("fan").appendChild(p); phones.push(p);
    gsap.set(p, { x: cx - pw / 2, y: cy - ph / 2, transformOrigin: "50% 120%" });
  }
  if (V.title) { const tt = q("tt"); tt.textContent = V.title; Object.assign(tt.style, { font: `800 ${54 * U * s}px ${fam}`, color: "#141416" }); gsap.set(tt, { x: cx, y: cy + ph * 0.75, xPercent: -50 }); }

  // ---- the motion: the phones drop onto the pile (10 f each, 3 f apart, each a little turned); a beat; then they fan
  // out (22 f, S-curve): angle -spread..+spread, x spread, the middle one forward; then the fan breathes
  const S = Math.round(V.start), mid = (n - 1) / 2, spread = Math.min(13, 18 / Math.max(1, mid));
  // the fan stays inside the frame: the outer phone turns about a point 0.7 ph below its centre (origin 50% 120%)
  const oa = mid * spread * Math.PI / 180, ext = 1.2 * ph * Math.sin(oa) + pw / 2 * Math.cos(oa);
  const dx = Math.min(pw * 0.62, Math.max(pw * 0.25, (W / 2 - 40 * U - ext) / Math.max(1, mid)));
  phones.forEach((p, i) => {
    const f0 = S + i * K(3), r0 = (i % 2 ? 1 : -1) * (3 + i);
    enter(p, { opacity: 1, y: cy - ph / 2 - H * 0.5, rotation: r0 * 3 }, { y: cy - ph / 2, rotation: r0 }, f0, f0 + K(10), "power3.in");
    const fa = S + n * K(3) + K(14);
    to(p, { rotation: (i - mid) * spread, x: cx - pw / 2 + (i - mid) * dx, y: cy - ph / 2 + Math.abs(i - mid) * 26 * U, scale: 1 - Math.abs(i - mid) * 0.05, zIndex: 10 - Math.round(Math.abs(i - mid) * 2) },
       fa + Math.round(Math.abs(i - mid)) * K(2), fa + K(22) + Math.round(Math.abs(i - mid)) * K(2), "power3.inOut");
    for (let f = fa + K(30), k = 0; f + K(26) < FRAMES; f += K(26), k++) to(p, { rotation: (i - mid) * spread * (k % 2 ? 1 : 0.88) }, f, f + K(26), "sine.inOut");
  });
  if (V.title) enter("#tt", { opacity: 0, y: cy + ph * 0.75 + 20 * U }, { opacity: 1, y: cy + ph * 0.75 }, S + n * K(3) + K(30), S + n * K(3) + K(44), "power2.out");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
