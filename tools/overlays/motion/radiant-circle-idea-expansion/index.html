      const p = tab(o.tab, g), pa = tab(o.tab, g + 0.5), pb = tab(o.tab, g - 0.5);
      o.wrap.style.transform = `translate(${p[0].toFixed(2)}px, ${p[1].toFixed(2)}px)`;
      o.sc.style.transform = `scale(${sc.toFixed(4)})`;
      // motion blur along the move (the shutter) and a soft one while a ring grows or the camera pulls back
      const grow = Math.abs(scaleAt(o, g + 0.5) - scaleAt(o, g - 0.5)) * D0 / 2 * 0.2;
      const sx = (Math.abs(pa[0] - pb[0]) * 0.25 + grow) * BL, sy = (Math.abs(pa[1] - pb[1]) * 0.25 + grow) * BL;
      if (sx > 0.3 || sy > 0.3) { o.blurNode.setAttribute("stdDeviation", `${sx.toFixed(2)} ${sy.toFixed(2)}`); o.wrap.style.filter = `url(#mb${o.idx})`; }
      else o.wrap.style.filter = "none";
    });
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  const hits = V.shake > 0 ? [{ f: S + 6, amount: 3 }] : [];
  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 4, hits });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 19 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the labels are
  // measured here, with the real fonts, to fit inside their rings
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 800, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    defs.forEach(o => {
      const w = o.lb.offsetWidth;
      if (w > o.maxw) o.lb.style.fontSize = `${(o.base * o.maxw / w).toFixed(2)}px`;
    });
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
