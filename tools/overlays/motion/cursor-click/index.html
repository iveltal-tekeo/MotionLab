<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "look", "type": "enum", "label": "Look", "default": "subscribe", "options": [{"value": "subscribe", "label": "Subscribe - a red button that turns grey, a bell pops"}, {"value": "button", "label": "A plain button"}]},
  {"id": "text", "type": "string", "label": "Button text", "default": "Subscribe"},
  {"id": "after", "type": "string", "label": "Text after the click (empty = the same)", "default": "Subscribed"},
  {"id": "channel", "type": "string", "label": "Name above the button (empty = none)", "default": "YOUR NAME"},
  {"id": "color", "type": "color", "label": "Button colour", "default": "#ff0033"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Roboto", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#ffffff"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "x", "type": "number", "label": "Centre across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 62, "min": 0, "max": 100, "step": 1},
  {"id": "click_at", "type": "number", "label": "The click at frame", "default": 40, "min": 0, "max": 900, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "cursor-click" (0.5.0, the Motion Graphics library): a button pops in, a cursor glides to
     it on a curve (x and y on different eases), hovers, presses (the cursor and the button dip 4 frames, a ripple
     spreads), and the button changes - "Subscribe" turns grey "Subscribed", a bell pops and rings. Learned from
     overlays__click-animation (a cursor gliding to a "Click me" button, the dip and the soft ripple),
     overlays__youtube-subscribe-button and overlays__tech-youtube (the red button, the name above it and the cursor -
     still captures). MotionLab's own code: no platform's logo. Size-independent; an overlay (background off) or a
     scene. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #btn { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; font-synthesis: none; }
  .lbl { position: absolute; display: flex; align-items: center; gap: .4em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs">
    <div id="chan" class="abs"></div>
    <div id="btn"><div id="rip" class="abs"></div><div id="l1" class="lbl"></div><div id="l2" class="lbl"></div></div>
    <svg id="bell" class="abs" viewBox="0 0 24 24" style="overflow:visible"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.6 2H4.4z" fill="none" stroke-width="2" stroke-linejoin="round"/><path d="M10 21a2 2 0 0 0 4 0" fill="none" stroke-width="2"/></svg>
    <svg id="cur" class="abs" viewBox="0 0 24 24" style="overflow:visible"><path d="M4 2.5v16.8l4.4-4.2 3 6.7 3-1.4-3-6.6 6.2-.3z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, sub = V.look === "subscribe", cx = W * V.x / 100, cy = H * V.y / 100;
  const fs = 44 * U * s, bh = fs * 2.2, bw = Math.max(V.text.length, (V.after || "").length) * fs * 0.62 + fs * 2.6;
  const btn = q("btn");
  Object.assign(btn.style, { width: `${bw}px`, height: `${bh}px`, borderRadius: `${bh / 2}px`, background: V.color, font: `500 ${fs}px ${fam}`, color: "#fff" });
  gsap.set(btn, { x: cx - bw / 2, y: cy - bh / 2, transformOrigin: "50% 50%" });
  q("l1").textContent = V.text; q("l2").textContent = V.after || V.text;
  gsap.set("#l2", { opacity: 0 });
  Object.assign(q("rip").style, { width: `${bw}px`, height: `${bw}px`, borderRadius: "50%", background: "#ffffff" });
  gsap.set("#rip", { opacity: 0, scale: 0 });                         // the ripple waits for the click
  // the name above (a round picture + the name), the subscribe look only
  if (sub && V.channel) {
    const ch = q("chan");
    const av = document.createElement("div"), nm = document.createElement("div");
    Object.assign(av.style, { width: `${fs * 2.6}px`, height: `${fs * 2.6}px`, borderRadius: "50%", background: `radial-gradient(circle at 35% 30%, #ffffff55, transparent 45%), ${V.color}`, margin: "0 auto" });
    nm.textContent = V.channel;
    Object.assign(nm.style, { font: `700 ${fs * 0.82}px ${fam}`, color: V.background && parseInt(V.bg.slice(1), 16) < 0x888888 ? "#fff" : "#111", textAlign: "center", marginTop: `${fs * 0.45}px`, letterSpacing: "0.02em" });
    ch.append(av, nm);
    gsap.set(ch, { x: cx - W / 2, y: cy - bh / 2 - fs * 4.6, width: W });
  }
  const bs = fs * 1.4, bell = q("bell");
  bell.setAttribute("width", bs); bell.setAttribute("height", bs);
  bell.querySelectorAll("path").forEach(p => p.setAttribute("stroke", V.background && parseInt(V.bg.slice(1), 16) < 0x888888 ? "#fff" : "#222"));
  gsap.set(bell, { x: cx + bw / 2 + fs * 0.5, y: cy - bs / 2, opacity: 0, transformOrigin: "50% 10%" });
  const cs = fs * 1.6, cur = q("cur");
  cur.setAttribute("width", cs); cur.setAttribute("height", cs);

  // ---- the motion: the button pops (back.out 12 f); the cursor glides in on a curve (26 f), hovers, clicks at
  // click_at: a 4-frame dip, a ripple (18 f), the label swaps, the colour goes grey (subscribe), the bell pops and rings
  const S = Math.round(V.start), C = Math.max(S + K(28), Math.round(V.click_at));
  enter(btn, { opacity: 1, scale: 0.4 }, { scale: 1 }, S, S + K(12), "back.out(2.2)");
  if (sub && V.channel) enter("#chan", { opacity: 0, y: cy - bh / 2 - fs * 4.6 + 30 * U }, { opacity: 1, y: cy - bh / 2 - fs * 4.6 }, S + K(4), S + K(16), "power3.out");
  const tx = cx + bw * 0.12, ty = cy + bh * 0.05;                        // where the tip of the cursor presses
  const g0 = C - K(26) - K(6);
  if (g0 > 0) set(cur, { opacity: 0 }, 0);
  set(cur, { opacity: 1, x: W * 0.92, y: H * 0.95 }, Math.max(0, g0));
  to(cur, { x: tx }, Math.max(0, g0), C - K(6), "power2.out");            // x and y on different eases = a curved path
  to(cur, { y: ty }, Math.max(0, g0), C - K(6), "power3.inOut");
  to(btn, { scale: 1.04 }, C - K(8), C - K(2), "power2.out");               // hover
  ft(cur, { scale: 1 }, { scale: 0.82 }, C, C + K(4), "power2.in");          // press...
  to(cur, { scale: 1 }, C + K(4), C + K(10), "back.out(2)");               // ...release
  ft(btn, { scale: 1.04 }, { scale: 0.93 }, C, C + K(4), "power2.in");
  to(btn, { scale: 1 }, C + K(4), C + K(14), "back.out(3)");
  ft("#rip", { x: tx - cx + bw / 2 - bw / 2, y: bh / 2 - bw / 2, scale: 0, opacity: 0.38 }, { scale: 1.3, opacity: 0 }, C + K(1), C + K(19), "power2.out");
  set("#l1", { opacity: 0 }, C + K(3));
  set("#l2", { opacity: 1 }, C + K(3));
  if (sub) {
    to(btn, { backgroundColor: "#e8e8e8", color: "#222" }, C + K(2), C + K(8), "power1.out");
    ft(bell, { opacity: 1, scale: 0, rotation: 0 }, { scale: 1 }, C + K(8), C + K(18), "back.out(2.6)");
    [16, -14, 10, -6, 0].forEach((r, i) => to(bell, { rotation: r }, C + K(18) + i * K(3), C + K(21) + i * K(3), "sine.inOut"));
  }
  to(cur, { x: tx + 70 * U * s, y: ty + 120 * U * s, opacity: 0 }, C + K(24), C + K(40), "power2.in");   // the cursor leaves
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
