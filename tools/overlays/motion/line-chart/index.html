<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "look", "type": "enum", "label": "Look", "default": "chart", "options": [{"value": "chart", "label": "Chart - axes, one or two lines rising, a dot on the tip"}, {"value": "journey", "label": "Journey - a wavy road with milestones and a flag"}, {"value": "heartbeat", "label": "Heartbeat - a pulse line drawing across"}]},
  {"id": "title", "type": "string", "label": "Title (empty = none)", "default": "Subscribers"},
  {"id": "values", "type": "string", "label": "Line 1 values (| between)", "default": "2|3|5|4|9|16|30|58"},
  {"id": "values2", "type": "string", "label": "Line 2 values (empty = one line)", "default": ""},
  {"id": "labels", "type": "string", "label": "Labels along the bottom (| between)", "default": "JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG"},
  {"id": "tip", "type": "string", "label": "Number on the tip at the end (empty = none)", "default": "58K"},
  {"id": "milestones", "type": "string", "label": "Milestones (journey: | between)", "default": "Started|First 1K|Quit my job|Full time"},
  {"id": "bpm", "type": "number", "label": "Beats a minute (heartbeat)", "default": 72, "min": 30, "max": 200, "step": 1},
  {"id": "color", "type": "color", "label": "Line 1 colour", "default": "#ff4d4d"},
  {"id": "color2", "type": "color", "label": "Line 2 colour", "default": "#3b82f6"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "text_color", "type": "color", "label": "Text colour", "default": "#1b1d22"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#ffffff"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 1.4, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 48, "min": 0, "max": 100, "step": 1},
  {"id": "draw_frames", "type": "number", "label": "Frames to draw the line", "default": 70, "min": 6, "max": 900, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 4, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "line-chart" (0.5.0, the Motion Graphics library): a line that draws itself. Chart: axes
     and a grid fade in, one or two lines rise (S-curve), a dot rides each tip, the end value pops. Journey: a wavy road
     draws, milestone dots pop with their labels as the line reaches them, a flag waves at the end. Heartbeat: a pulse
     line draws across on the beat, the old trace fading behind it. Learned from graphics__github-stars and
     graphics__github-star-comparison (a light "history" chart, curves rising with a dot / picture on the tip),
     graphics__timeline (a wavy line with milestone dots ending on a red flag) and graphics__life-line-animation (a blue
     heartbeat line drawing across black). The tip follows the path itself (getPointAtLength, one set per frame).
     MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><svg id="g" class="abs" style="overflow:visible"></svg><div id="labels" class="abs"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const label = (text, x, y, size, color, weight = 500, xp = -50, op = 1) => {
    const e = document.createElement("div"); e.className = "t"; e.textContent = text;
    Object.assign(e.style, { font: `${weight} ${size}px ${fam}`, color, opacity: op });
    document.getElementById("labels").appendChild(e); gsap.set(e, { x, y, xPercent: xp, yPercent: -50 }); return e; };

  gsap.set(["#bgfill", "#cam", "#labels"], { width: W, height: H });
  const look = V.look, dark = look === "heartbeat";
  gsap.set("#bgfill", { background: V.background ? (dark && V.bg === "#ffffff" ? "#05070c" : V.bg) : "transparent" });
  const s = V.size, svg = document.getElementById("g");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const PW = W * 0.8 * Math.min(1.15, s), PH = H * 0.3 * s, x0 = (W - PW) / 2, yb = H * V.y / 100 + PH / 2, yt = yb - PH;
  const S = Math.round(V.start), D = Math.max(K(6), Math.round(V.draw_frames * FPS / 30));
  const ease = gsap.parseEase(look === "heartbeat" ? "none" : "power2.inOut");
  const ink = dark ? "#e8f0ff" : V.text_color;
  // a path's tip on every frame of its draw: the dash offset and a dot that rides the end
  const ride = (path, dot, f0, f1, eas = ease) => {
    const L = path.getTotalLength();
    path.setAttribute("stroke-dasharray", `${L} ${L}`); path.setAttribute("stroke-dashoffset", L);
    for (let f = f0; f <= f1 && f < FRAMES; f++) {
      const p = eas(Math.min(1, (f - f0) / Math.max(1, f1 - f0))), pt = path.getPointAtLength(L * p);
      set(path, { attr: { "stroke-dashoffset": L * (1 - p) } }, f);
      if (dot) set(dot, { attr: { cx: pt.x, cy: pt.y } }, f);
    }
    return L;
  };
  const smooth = pts => pts.reduce((d, [x, y], i) => { if (!i) return `M${x},${y}`; const [a, b] = pts[i - 1], m = (a + x) / 2; return d + ` C${m},${b} ${m},${y} ${x},${y}`; }, "");

  if (V.title) { const tt = label(V.title, W / 2, yt - 120 * U * s, 52 * U * s, ink, 800); enter(tt, { opacity: 0, y: yt - 100 * U * s }, { opacity: 1, y: yt - 120 * U * s }, S, S + K(12), "power2.out"); }
  if (look === "chart") {
    const A = String(V.values).split("|").map(Number).filter(x => !isNaN(x)), B = String(V.values2 || "").split("|").map(Number).filter(x => !isNaN(x));
    const n = Math.max(A.length, B.length, 2), mx = Math.max(...A, ...B, 1);
    const grid = el("g", { opacity: 0 }, svg);
    for (let i = 0; i <= 4; i++) el("line", { x1: x0, x2: x0 + PW, y1: yb - PH * i / 4, y2: yb - PH * i / 4, stroke: ink, "stroke-opacity": i ? 0.08 : 0.35, "stroke-width": 2 * U }, grid);
    ft(grid, { attr: { opacity: 0 } }, { attr: { opacity: 1 } }, S, S + K(14), "power1.out");
    const labs = String(V.labels || "").split("|");
    labs.slice(0, n).forEach((l, i) => { const e = label(l, x0 + PW * i / (n - 1), yb + 40 * U * s, 26 * U * s, ink, 500, -50, 0.5); enter(e, { opacity: 0 }, { opacity: 0.5 }, S + K(4) + i, S + K(16) + i, "power1.out"); });
    [[A, V.color], [B, V.color2]].forEach(([vals, col], k) => {
      if (vals.length < 2) return;
      const pts = vals.map((v, i) => [x0 + PW * i / (n - 1), yb - PH * v / mx]);
      const area = el("path", { d: smooth(pts) + ` L${pts[pts.length - 1][0]},${yb} L${pts[0][0]},${yb} Z`, fill: col, opacity: 0 }, svg);
      const p = el("path", { d: smooth(pts), fill: "none", stroke: col, "stroke-width": 7 * U * s, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
      const dot = el("circle", { r: 13 * U * s, fill: col, stroke: dark ? "#000" : "#fff", "stroke-width": 5 * U * s, opacity: 0 }, svg);
      const f0 = S + K(12) + k * K(6), f1 = f0 + D;
      ride(p, dot, f0, f1);
      set(dot, { attr: { opacity: 1 } }, f0);
      ft(area, { attr: { opacity: 0 } }, { attr: { opacity: 0.1 } }, f1 - K(10), f1 + K(10), "power1.out");
      if (k === 0 && V.tip) {
        const [ex, ey] = pts[pts.length - 1], tip = label(V.tip, ex, ey - 64 * U * s, 40 * U * s, "#fff", 800);
        Object.assign(tip.style, { background: col, padding: `${10 * U * s}px ${20 * U * s}px`, borderRadius: `${14 * U * s}px` });
        enter(tip, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1 }, f1 - K(2), f1 + K(10), "back.out(2.4)");
        if (f1 + K(14) < FRAMES) to(dot, { attr: { r: 18 * U * s } }, f1, f1 + K(6), "power2.out"), to(dot, { attr: { r: 13 * U * s } }, f1 + K(6), f1 + K(14), "power2.inOut");
      }
    });
  } else if (look === "journey") {
    const ms = String(V.milestones || "").split("|").map(x => x.trim()).filter(Boolean), n = Math.max(ms.length, 2);
    const pts = []; for (let i = 0; i <= 60; i++) { const t = i / 60; pts.push([x0 + PW * t, yb - PH * 0.5 - Math.sin(t * Math.PI * 2.2 + 0.4) * PH * 0.32 - (t - 0.5) * PH * 0.3]); }
    const d = pts.map(([x, y], i) => `${i ? "L" : "M"}${x},${y}`).join(" ");
    const p = el("path", { d, fill: "none", stroke: ink, "stroke-width": 6 * U * s, "stroke-linecap": "round" }, svg);
    const f0 = S + K(10), f1 = f0 + D, L = ride(p, null, f0, f1);
    ms.forEach((m, i) => {                                // milestone i sits where the drawn share reaches i / (n - 1)
      const share = n === 1 ? 1 : i / (n - 1), pt = p.getPointAtLength(L * share), fi = f0 + Math.round(D * share);
      const last = i === ms.length - 1;
      const dot = el("circle", { cx: pt.x, cy: pt.y, r: 15 * U * s, fill: last ? V.color : (dark ? "#000" : "#fff"), stroke: last ? V.color : ink, "stroke-width": 5 * U * s }, svg);
      enter(dot, { opacity: 1, attr: { r: 0 } }, { attr: { r: 15 * U * s } }, fi, fi + K(10), "back.out(2.6)");
      const lb = label(m, pt.x, pt.y + (i % 2 ? 70 : -70) * U * s, 30 * U * s, ink, 600);
      enter(lb, { opacity: 0, y: pt.y + (i % 2 ? 90 : -90) * U * s }, { opacity: 1, y: pt.y + (i % 2 ? 70 : -70) * U * s }, fi + K(2), fi + K(12), "power2.out");
      if (last) {                                       // the flag, waving
        const fl = el("path", { d: `M${pt.x},${pt.y} v${-90 * U * s} l${60 * U * s},${18 * U * s} l${-60 * U * s},${18 * U * s}`, fill: V.color, stroke: V.color, "stroke-width": 4 * U * s, "stroke-linejoin": "round" }, svg);
        enter(fl, { opacity: 1, svgOrigin: `${pt.x} ${pt.y}`, scaleY: 0 }, { scaleY: 1 }, fi + K(4), fi + K(14), "back.out(2)");
        for (let g = fi + K(14), k = 0; g + K(10) < FRAMES; g += K(10), k++) to(fl, { skewY: k % 2 ? -4 : 4 }, g, g + K(10), "sine.inOut");
      }
    });
  } else {                                              // heartbeat: a pulse every beat, drawn left to right, a fading trace
    const beat = PW / 3, n = 3, mid = yb - PH / 2, amp = PH * 0.42;   // three beats across the width
    let d = `M${x0},${mid}`;
    for (let i = 0; i < n; i++) {
      const bx = x0 + i * beat;
      d += ` L${bx + beat * 0.35},${mid} l${beat * 0.04},${-amp * 0.12} l${beat * 0.04},${amp * 0.12} l${beat * 0.05},0 l${beat * 0.03},${amp * 0.25} l${beat * 0.04},${-amp * 1.05} l${beat * 0.04},${amp * 1.2} l${beat * 0.03},${-amp * 0.4} l${beat * 0.06},0 l${beat * 0.06},${-amp * 0.18} l${beat * 0.06},${amp * 0.18} L${bx + beat},${mid}`;
    }
    const defs = el("defs", {}, svg);
    defs.innerHTML = `<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="${6 * U}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <clipPath id="cl"><rect x="${x0}" y="0" width="${PW}" height="${H}"/></clipPath>`;
    const grp = el("g", { "clip-path": "url(#cl)" }, svg);
    // like a monitor: the new sweep draws from the left (path A, 0 -> the point), the last sweep stays on screen
    // after a small gap ahead of the point (path B) and is overwritten as the point moves on
    const col = V.color === "#ff4d4d" ? "#3b6cff" : V.color;
    const pa = el("path", { d, fill: "none", stroke: col, "stroke-width": 6 * U * s, "stroke-linejoin": "round", filter: "url(#gl)" }, grp);
    const pb = el("path", { d, fill: "none", stroke: col, "stroke-opacity": 0.45, "stroke-width": 6 * U * s, "stroke-linejoin": "round" }, grp);
    const dot = el("circle", { r: 9 * U * s, fill: "#ffffff", filter: "url(#gl)" }, grp);
    const L = pa.getTotalLength(), perBeat = Math.round(FPS * 60 / V.bpm), total = Math.max(K(6), perBeat * n), gap = L * 0.06;
    pa.setAttribute("stroke-dasharray", `${L} ${L}`);
    pb.setAttribute("stroke-dasharray", `${L} ${L}`);
    for (let f = S; f < FRAMES; f++) {
      const sweep = Math.floor((f - S) / total), at = L * (((f - S) % total) / total);
      set(pa, { attr: { "stroke-dashoffset": L - at } }, f);                  // visible 0 .. at
      set(pb, { attr: { "stroke-dashoffset": sweep ? -(at + gap) : L } }, f);  // visible at + gap .. L (from the 2nd sweep)
      const pt = pa.getPointAtLength(at);
      set(dot, { attr: { cx: pt.x, cy: pt.y } }, f);
    }
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
