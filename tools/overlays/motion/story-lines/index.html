<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "card1", "type": "string", "label": "Card 1 (a / starts a new line, *stars* = the key words)", "default": "Some will say - *it’s a waste of time.* / Others will say - *just quit it.*"},
  {"id": "card2", "type": "string", "label": "Card 2", "default": "One thought keeps coming back…"},
  {"id": "card3", "type": "string", "label": "Card 3", "default": "*“What will people think?”*"},
  {"id": "card4", "type": "string", "label": "Card 4", "default": "But the truth is - / *if I had never started because I feared people,* / I wouldn’t be here today."},
  {"id": "card5", "type": "string", "label": "Card 5 (empty = not shown)", "default": ""},
  {"id": "card6", "type": "string", "label": "Card 6 (empty = not shown)", "default": ""},
  {"id": "look", "type": "enum", "label": "Look", "default": "dark", "options": [{"value": "dark", "label": "Dark - a vignette, grey lines, the key words white"}, {"value": "pastel", "label": "Pastel - a colour per card, the key words big in a serif, a cut between cards"}, {"value": "light", "label": "Light - white, a serif title, soft fades"}]},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "key_font", "type": "enum", "label": "Font of the key words (pastel and light)", "default": "Playfair Display", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "text_color", "type": "color", "label": "Text colour (dark look)", "default": "#8b8b93"},
  {"id": "key_color", "type": "color", "label": "Key words colour (dark look)", "default": "#ffffff"},
  {"id": "accent", "type": "color", "label": "Accent (pastel and light: the key words)", "default": "#1c2541"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour (dark and light looks)", "default": "#0b0b0d"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 2.5, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "dots", "type": "boolean", "label": "Progress dots at the bottom", "default": false},
  {"id": "start", "type": "number", "label": "First card at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "story-lines" (0.5.0, the Motion Graphics library): a story or a quote told card by card.
     Learned from launch-videos__storytime (a dark vignette; each line fades in ~15 frames at 25 fps, 6-10 frames after
     the last, the key phrase white and bold, the rest grey; the card fades to black before the next) and
     launch-videos__a-story-about-the-world (a colour per card cut on the change, one big serif keyword with a small
     lead-in, the keyword typed / slid / risen in - a different entrance per card -, progress dots). The cards share
     the length after the first card's frame evenly. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .card { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ln { text-align: center; font-synthesis: none; }
  .k { display: inline-block; }
  .dot { position: absolute; border-radius: 99px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="vig" class="abs"></div>
  <div id="cam" class="abs"></div>
  <div id="dots" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 360;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.round(n * FPS / 30);
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  // an entrance: hidden from frame 0 until it starts (one set at 0, the start pose at f0 - never two sets on one frame)
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const ONE = /^(Anton|Bebas Neue|Archivo Black|Bagel Fat One|Bangers|Lilita One|Luckiest Guy|Pacifico|Permanent Marker|DM Serif Display|Instrument Serif)$/;
  const fam = f => `"${f}", "Segoe UI", sans-serif`, wgt = (f, w) => ONE.test(f) ? 400 : w;
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  const look = V.look, dark = look === "dark";
  const PASTEL = ["#0f172a", "#fdf0c4", "#dcecfb", "#ffffff", "#f3f4fa", "#fde2e4"];
  const lum = h => { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
  gsap.set(["#bgfill", "#vig", "#cam", "#dots"], { width: W, height: H });
  const cards = [V.card1, V.card2, V.card3, V.card4, V.card5, V.card6].map(s => (s || "").trim()).filter(Boolean);
  const n = Math.max(1, cards.length), S = Math.round(V.start), D = Math.max(K(30), Math.floor((FRAMES - S) / n));
  const bgOf = i => look === "pastel" ? PASTEL[i % PASTEL.length] : V.bg;
  gsap.set("#bgfill", { background: V.background ? bgOf(0) : "transparent" });
  if (dark && V.background)       // the vignette: a soft light in the middle of a dark frame
    gsap.set("#vig", { background: `radial-gradient(ellipse ${W * 0.55}px ${H * 0.42}px at 50% ${V.y}%, rgba(255,255,255,.07), rgba(0,0,0,0) 70%)` });
  const fs = (dark ? 46 : 44) * U * V.size;
  const cam = document.getElementById("cam");
  const R = (s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296)(11);

  cards.forEach((txt, i) => {
    const a = S + i * D, b = i === n - 1 ? FRAMES : a + D;
    const bg = bgOf(i), onDark = lum(bg) < 0.5;
    const txtCol = dark ? V.text_color : onDark ? "rgba(255,255,255,.62)" : "rgba(20,24,40,.55)";
    const keyCol = dark ? V.key_color : onDark ? "#f6f1e6" : V.accent;
    const card = document.createElement("div");
    card.className = "card";
    gsap.set(card, { width: W, height: H, y: H * (V.y - 50) / 100 });
    cam.appendChild(card);
    const lines = txt.split(/\s+\/\s+|\s*\n\s*/).filter(Boolean);
    const els = [];
    lines.forEach(line => {
      const whole = /^\*[^*]+\*$/.test(line.trim());
      const e = document.createElement("div");
      e.className = "ln";
      const big = !dark && whole;
      const f = big ? V.key_font : V.font;
      const size = big ? fs * (line.length > 18 ? 2.1 : 2.9) : (dark && whole ? fs * 1.45 : fs);
      Object.assign(e.style, { font: `${wgt(f, big ? 700 : 500)} ${size}px ${fam(f)}`, color: txtCol, maxWidth: `${W * 0.84}px`,
                               lineHeight: big ? 1.02 : 1.35, margin: `${(big ? 0.12 : 0.28) * fs}px 0`,
                               letterSpacing: big && line.length < 12 ? "0.02em" : "0" });
      e.innerHTML = esc(line).replace(/\*([^*]+)\*/g, (_, k) => `<span class="k" style="color:${keyCol};font-weight:${wgt(f, 700)}">${k}</span>`);
      if (big) e.style.color = keyCol;
      card.appendChild(e);
      els.push({ e, big });
    });
    // the card's window: hidden outside [a, b)
    if (a > 0) set(card, { opacity: 0 }, 0);
    set(card, { opacity: 1 }, a);
    if (b < FRAMES) set(card, { opacity: 0 }, b);
    if (look === "pastel" && V.background && i > 0) set("#bgfill", { background: bg }, a);   // a cut, as measured
    // the lines come in one after another: 14 frames each, 9 frames apart (the reference: ~15 f at 25 fps, 6-10 apart)
    const style = i % 4;
    els.forEach(({ e, big }, j) => {
      const f0 = a + K(4) + j * K(9);
      if (big && style === 0) {                           // typed in, a letter every 2 frames, a cursor after it
        const chars = [...e.textContent];
        e.innerHTML = chars.map(c => `<span class="tc" style="display:none">${esc(c)}</span>`).join("") + `<span class="cur" style="opacity:0;font-weight:300">|</span>`;
        const cs = e.querySelectorAll(".tc"), cur = e.querySelector(".cur");
        set(cur, { opacity: 1 }, f0);
        cs.forEach((c, q) => set(c, { display: "inline" }, f0 + q * K(2)));     // the line grows from the middle
        const tEnd = f0 + cs.length * K(2);
        for (let f = tEnd + K(8), on = false; f < b - K(2); f += K(8), on = !on) set(cur, { opacity: on ? 1 : 0 }, f);
      } else if (big && style === 1) {                    // slides in from the right, a slow end
        enter(e, { x: W * 0.55, opacity: 1 }, { x: 0 }, f0, f0 + K(18), "expo.out");
      } else if (big && style === 2) {                    // rises from below, a slow end
        enter(e, { y: 120 * U, opacity: 0 }, { y: 0, opacity: 1 }, f0, f0 + K(20), "power3.out");
      } else {                                            // fades up out of a blur (the storytime lines)
        enter(e, { opacity: 0, y: 18 * U, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)" }, f0, f0 + K(14), "power2.out");
      }
      if (b - K(12) > f0 + K(22)) to(e, { y: -8 * U }, f0 + K(22), b - K(12), "none");   // a slow drift: never fully still
    });
    if (look !== "pastel" && b < FRAMES) to(card, { opacity: 0 }, b - K(12), b - 1, "power1.in");       // fades out before the next
  });
  // progress dots: one per card, the current one long
  if (V.dots && n > 1) {
    const box = document.getElementById("dots");
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      box.appendChild(d);
      const x0 = W / 2 + (i - (n - 1) / 2) * 22 * U;
      gsap.set(d, { left: x0 - 4 * U, top: H * 0.93, width: 8 * U, height: 8 * U, background: "rgba(128,128,140,.55)" });
      const a = S + i * D;
      ft(d, { width: 8 * U, background: "rgba(128,128,140,.55)" }, { width: 22 * U, background: "rgba(128,128,140,1)" }, Math.max(a, 0), Math.max(a, 0) + K(8), "power2.out");
      if (i < n - 1) to(d, { width: 8 * U, background: "rgba(128,128,140,.55)" }, a + D, a + D + K(8), "power2.out");
    }
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
