<!-- MotionLab motion template "reel-phone-fan" (2026-10-28): the user's reels fan out like a hand of phones under a
     headline, in the lower half, in front of the person. The headline lines rise in one after another (from f1, 3 f
     apart, 8 f, slow end; the last line on a box that opens from the middle), the five phones rise together from
     below (f3-f13, slow end) and fan out like a hand of cards (the inner pair from f9, the outer pair from f11, 12 f,
     a small overshoot), each tilting and dropping a little on an arc. Every screen is a reel: the user's cover or
     clip, else a placeholder that still reads as a reel (its own colour gradient, a short bold caption), with a play
     icon, the view count and a progress bar that runs. In the hold the hand sways and each phone bobs out of step;
     at the end the phones fold back and drop and the headline lifts away (the last 10 frames). On a wide video the
     whole unit sits at the side (setting "side"). The phones stay off the face ("guard"). Look-aware, size-independent.

  .abs { position: absolute; left: 0; top: 0; }

    }
  }

  // ---- the motion (g = frames at 30 fps since "Comes in at frame"; EN = g at the end)
  const ST = Math.round(V.start), EN = (FRAMES - ST) * 30 / FPS, LASTG = EN - 30 / FPS;   // LASTG = g at the last frame
  const LEAVE = !!V.leave && LASTG - 10 > 34;
  const RISE = Math.min(150 * s, H - CY);
  function render(t) {
    const g = (Math.round(t * FPS * 1000) / 1000 - ST) * 30 / FPS;
    hand.style.visibility = g >= 0 ? "visible" : "hidden";
    if (g < 0) return;
    const xo = LEAVE ? eIn((g - (LASTG - 10)) / 10) : 0;                      // the fold-away: the last 10 frames
    const live = c01((g - 24) / 20);
    // the hand sways from the wrist while it holds
    fan.style.transform = `rotate(${(1.1 * Math.sin(2 * Math.PI * (g - 24) / 96) * live).toFixed(3)}deg)`;
    const up = 1 - eOut((g - 3) / 10), op = c01((g - 2.5) / 3);
    P.forEach((p, k) => {
      const a = Math.abs(p.o), qk = backOut((g - (7 + 2 * a)) / 12, 1.3) * (1 - xo);
      const bob = 3 * U * Math.sin(2 * Math.PI * (g - 24) / 64 + k * 1.1) * live;
      const x = CX + p.o * DX * qk - PW / 2, y = CY + p.o * p.o * ARC * qk + up * RISE + xo * 90 * s + bob - PHH / 2;
      p.wrap.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${(p.o * ROT * qk).toFixed(3)}deg) scale(${(0.92 + 0.08 * (1 - up)).toFixed(4)})`;
      p.wrap.style.opacity = (op * (1 - xo)).toFixed(3);
      if (p.bar) p.bar.style.transform = `scaleX(${c01((g + 22 * k + 10) / 190).toFixed(4)})`;   // each reel playing (linear, like a real bar)
    });
    LN.forEach((l, j) => {
      const t0 = 1 + 3 * j, k1 = c01((g - t0 + 0.5) / 4), dy = (1 - eOut((g - t0) / 8)) * 26 * s;
      const xl = LEAVE ? eIn((g - (LASTG - 9 + j)) / (9 - j)) : 0;
      l.el.style.opacity = (k1 * (1 - xl)).toFixed(3);
      l.el.style.transform = `translate(${l.x.toFixed(2)}px, ${(l.y + dy - xl * 22 * s).toFixed(2)}px)`;
      if (l.bg) {                                    // the box opens from the middle, its words with it
        const cut = 32 * (1 - eIO((g - t0) / 7));
        l.el.style.clipPath = cut > 0.05 ? `inset(0% ${cut.toFixed(2)}% 0% ${cut.toFixed(2)}% round ${(0.2 * FS).toFixed(1)}px)` : "none";
      }
    });
  }
  const px = every(render);
  if (window.MLLook && V.background) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 53 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // registered once the fonts are in: the headline is fitted with the real font
  (document.fonts && document.fonts.load ? Promise.all([700, 800].map(w => document.fonts.load(`${w} 100px "${V.body_font}"`))
    .concat([document.fonts.ready])).catch(() => {}) : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
