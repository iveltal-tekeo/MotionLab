  }
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    const on = g >= 0;
    grp.style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    // the two source boxes: fade in, rise, deblur; their names fade in a little later
    const op = tab(OPA, g)[0], yo = tab(YO, g)[0] * K, tx = tab(TXO, g)[0];
    ["a", "b"].forEach(k => {
      const [cx, cy, w, h] = boxes[k]._c, b = boxes[k];
      b.style.opacity = op.toFixed(3); b.style.filter = op < 0.98 ? `blur(${(7 * (1 - op) * U).toFixed(2)}px)` : "none";
      b.style.transform = `translate(${(cx - w / 2).toFixed(2)}px, ${(cy - h / 2 + yo).toFixed(2)}px)`;
      texts[k].style.opacity = tx.toFixed(3);
    });
    // the curves
    const hd = tab(HD, g)[0];
    curves.forEach(c => drawCurve(c, hd));
    // the conclusion box: grows from a dot, its letters typed, a rim + glow + streaks flare around it
    const sc = tab(GS, g)[0], c = boxes.c, [cx, cy, w, h] = c._c;
    c.style.visibility = sc > 0.002 ? "visible" : "hidden";
    c.style.transform = `translate(${(cx - w / 2).toFixed(2)}px, ${(cy - h / 2).toFixed(2)}px) scale(${Math.max(0.001, sc).toFixed(4)})`;
    const gg = tab(GG, g)[0] * GL, rm = tab(RM, g)[0] * GL, inn = tab(IN, g)[0] * GL;
    const bgc = bgs.c;
    bgc.style.border = `${1.5 * K * (1 + 0.8 * rm)}px solid ${rgba(glare, 0.13 + 0.8 * rm)}`;
    bgc.style.boxShadow = `0 0 ${(14 * K * rm).toFixed(1)}px ${rgba(glare, 0.7 * rm)}, 0 0 ${(46 * K * gg).toFixed(1)}px ${rgba(glare, 0.5 * gg)}, 0 0 ${(120 * K * gg).toFixed(1)}px ${rgba(glare, 0.3 * gg)}, inset 0 0 ${(26 * K * inn).toFixed(1)}px ${rgba(glare, 0.8 * inn)}`;
    const fl = tab(FL, g)[0] * GL;
    q("st1").style.opacity = fl.toFixed(3); q("st2").style.opacity = fl.toFixed(3);
    q("bloom").style.opacity = Math.min(1, fl * 0.7 + gg * 0.25).toFixed(3);
    lettersC.forEach(o => { o.el.style.opacity = g >= o.t - 0.01 ? "1" : "0"; });
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 14, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 41 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the text is measured
  // here, with the real fonts
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
