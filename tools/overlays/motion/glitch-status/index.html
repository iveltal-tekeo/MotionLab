<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "text", "type": "string", "label": "The status", "default": "SIMULATION TERMINATED"},
  {"id": "kicker", "type": "string", "label": "Small line above (empty = none)", "default": "SYSTEM STATUS: OFFLINE"},
  {"id": "sub", "type": "string", "label": "Small line under it (empty = none)", "default": "connection lost - code 0x7F"},
  {"id": "brackets", "type": "boolean", "label": "Square brackets around it", "default": true},
  {"id": "font", "type": "enum", "label": "Font", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "color", "type": "color", "label": "Text colour", "default": "#2ef2d0"},
  {"id": "split", "type": "color", "label": "Glitch colour", "default": "#ff2e6e"},
  {"id": "scanlines", "type": "boolean", "label": "Scan lines", "default": true},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#06080a"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2.5, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 48, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 4, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "glitch-status" (0.5.0, the Motion Graphics library): a sci-fi status line - each letter
     scrambles through random signs before it locks (left to right), glitches jolt it now and then (a colour split, a
     slice shifted sideways, 2-3 frames), the small lines type in, scan lines roll. Learned from
     text__simulation-terminated ("[ SIMULATION TERMINATED ]" typing in teal mono on dark, a small status line,
     f6-f28 (00:00:00:06-00:00:01:03) at 25 fps). The scramble is seeded. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: pre; line-height: 1; font-synthesis: none; }
  .ch::after { content: attr(data-c); }
  #kick::after, #sub::after { content: attr(data-t); }
  #main2, #main3 { mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="kick" class="t"></div><div id="main2" class="t"></div><div id="main3" class="t"></div><div id="main" class="t"></div><div id="sub" class="t"></div></div>
  <div id="scan" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const mono = `"${V.font}", Consolas, monospace`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam", "#scan"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? `radial-gradient(ellipse ${W * 0.8}px ${H * 0.3}px at 50% ${V.y}%, ${V.color}14, transparent 70%), ${V.bg}` : "transparent" });
  if (V.scanlines) Object.assign(q("scan").style, { background: `repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 ${2 * U}px, transparent ${2 * U}px ${5 * U}px)` });
  const s = V.size, full = (V.brackets ? "[ " : "") + (V.text || "") + (V.brackets ? " ]" : ""), cy = H * V.y / 100;
  const fs = Math.min(W * 0.9 * s / (full.length * 0.62), 70 * U * s);
  const R = rnd(13), SIGNS = "#$%&*+<>/\\|=~^_!?0123456789ABCDEFXZ";
  const main = q("main"), letters = [];
  [...full].forEach(c => { const e = document.createElement("span"); e.className = "ch"; e.setAttribute("data-c", c === " " ? " " : ""); main.appendChild(e); letters.push({ e, c }); });
  Object.assign(main.style, { font: `700 ${fs}px ${mono}`, color: V.color, textShadow: `0 0 ${10 * U}px ${V.color}88` });
  ["#main2", "#main3"].forEach((id, i) => { q(id.slice(1)).textContent = full; Object.assign(q(id.slice(1)).style, { font: `700 ${fs}px ${mono}`, color: i ? "#2e7bff" : V.split, opacity: 0 }); });
  ["#main", "#main2", "#main3"].forEach(id => gsap.set(id, { x: W / 2, y: cy, xPercent: -50, yPercent: -50 }));
  [["#kick", V.kicker, cy - fs * 1.6], ["#sub", V.sub, cy + fs * 1.4]].forEach(([id, t, yy]) => {
    q(id.slice(1)).textContent = "";
    Object.assign(q(id.slice(1)).style, { font: `400 ${fs * 0.52}px ${mono}`, color: V.color, opacity: 0.7, letterSpacing: "0.12em" });
    gsap.set(id, { x: W / 2, y: yy, xPercent: -50, yPercent: -50 });
  });

  // ---- the motion: letter i starts scrambling at start + i * 1.5 f, locks 6-9 frames later; then the small lines type;
  // glitches: a colour split + a sideways slice for 2 frames, every ~30 frames after the lock
  const S = Math.round(V.start);
  let last = S;
  letters.forEach(({ e, c }, i) => {
    if (c === " ") return;
    const f0 = S + Math.round(i * 1.5 * FPS / 30), lock = f0 + K(6) + Math.floor(R() * K(4));
    for (let f = f0; f < lock; f++) set(e, { attr: { "data-c": SIGNS[Math.floor(R() * SIGNS.length)] } }, f);
    set(e, { attr: { "data-c": c } }, lock);
    last = Math.max(last, lock);
  });
  [["#kick", V.kicker, last + K(4)], ["#sub", V.sub, last + K(10)]].forEach(([id, t, f0]) => {
    if (!t) return;
    for (let i = 1; i <= t.length; i++) set(id, { attr: { "data-t": t.slice(0, i) } }, f0 + Math.round(i * FPS / 45));
  });
  for (let g = last + K(16); g + K(3) < FRAMES; g += K(26) + Math.floor(R() * K(10))) {
    const dx = (R() < 0.5 ? -1 : 1) * (8 + R() * 14) * U;
    set("#main2", { opacity: 0.85, x: W / 2 + dx }, g); set("#main3", { opacity: 0.7, x: W / 2 - dx * 0.7 }, g);
    set("#main", { x: W / 2 + dx * 0.3, skewX: dx > 0 ? -6 : 6 }, g);
    set(["#main2", "#main3"], { opacity: 0 }, g + K(2)); set("#main", { x: W / 2, skewX: 0 }, g + K(2));
  }
  if (V.scanlines) ft("#scan", { backgroundPositionY: "0px" }, { backgroundPositionY: `${60 * U}px` }, 0, FRAMES, "none");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
