<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "text", "type": "string", "label": "The words (| = a new line, *word* = the accent)", "default": "One letter|at a *time*"},
  {"id": "by", "type": "enum", "label": "Comes in", "default": "letters", "options": [{"value": "letters", "label": "Letter by letter"}, {"value": "words", "label": "Word by word"}]},
  {"id": "style", "type": "enum", "label": "Each one", "default": "rise", "options": [{"value": "rise", "label": "Rises out of a blur"}, {"value": "drop", "label": "Drops in with a bounce"}, {"value": "blur", "label": "Zooms down out of focus"}, {"value": "flip", "label": "Flips up (3D)"}]},
  {"id": "order", "type": "enum", "label": "Order", "default": "left", "options": [{"value": "left", "label": "Left to right"}, {"value": "centre", "label": "From the middle out"}, {"value": "random", "label": "Random"}]},
  {"id": "gap", "type": "number", "label": "Frames between letters (words: three times)", "default": 1.2, "min": 0.3, "max": 20, "step": 0.1},
  {"id": "font_role", "type": "enum", "label": "Font", "default": "body", "options": [{"value": "body", "label": "The look’s text font, bold"}, {"value": "display", "label": "The look’s headline font"}]},
  {"id": "colour", "type": "enum", "label": "Text colour", "default": "light", "options": [{"value": "light", "label": "Light"}, {"value": "dark", "label": "Dark"}, {"value": "signal", "label": "Signal (accent)"}, {"value": "mustard", "label": "Mustard"}]},
  {"id": "accent", "type": "enum", "label": "Accent words (*word*)", "default": "serif", "options": [{"value": "serif", "label": "Headline font, italic, in the accent colour"}, {"value": "colour", "label": "In the accent colour"}, {"value": "none", "label": "Like the rest"}]},
  {"id": "align", "type": "enum", "label": "Lines", "default": "center", "options": [{"value": "center", "label": "Centred"}, {"value": "left", "label": "On the left"}]},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 2.5, "step": 0.05},
  {"id": "y", "type": "number", "label": "Middle of the text (% of the height)", "default": 50, "min": 5, "max": 95, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 600, "step": 1},
  {"id": "leave", "type": "boolean", "label": "Leaves at the end", "default": true},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#15171C"},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "letter-stagger" (2026-10-31): text split into letters or words (this page's own split,
     after GSAP SplitText's chars / words), each coming in one after another - left to right, from the middle of its
     line out, or in a random order - one every `gap` frames from f0 (words three times as far apart), in one of four
     moves: rises 0.55 em out of a blur (14 f, decelerating hard), drops in from above with a small bounce (16 f), zooms
     down from 1.9x out of focus (14 f, slow end) or flips up around its foot in 3D (15 f, a small overshoot). While it
     holds the text pushes in 3 % (gentle S-curve); at the end the pieces leave in the same order, each the move's
     own way out (9 f, accelerating). Accent words (*word*) in the look's headline font, italic, in the accent colour.
     Size-independent, look-aware. MotionLab's own code. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .ln { position: relative; width: fit-content; white-space: nowrap; font-synthesis: none; }
  .pc { display: inline-block; }
  .wd { display: inline-block; white-space: nowrap; }
  .acc { font-synthesis: style; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="block" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const lum = h => window.MLLook ? MLLook.lum(h) : 0.5;
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const c01 = x => Math.min(1, Math.max(0, x));
  const eOut = x => 1 - Math.pow(1 - c01(x), 4);                            // decelerating hard (slow end)
  const eBack = x => { x = c01(x) - 1; return 1 + 2.4 * x * x * x + 1.4 * x * x; };                // slow end, a small overshoot
  const eSine = x => 0.5 - 0.5 * Math.cos(Math.PI * c01(x));               // a gentle S-curve (the slow push)
  const eIn = x => c01(x) * c01(x) * c01(x);                                 // accelerating (exits only)
  const rnd = (i, s) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v); };
  const every = fn => { const p = { t: 0 }; fn(0); tl.fromTo(p, { t: 0 }, { t: FRAMES / FPS, duration: FRAMES / FPS, ease: "none", immediateRender: false, onUpdate: () => fn(p.t) }, 0); return p; };
  const S0 = Math.round(V.start);
  const light = lum(L.paper) >= lum(L.ink) ? L.paper : L.ink, dark = light === L.paper ? L.ink : L.paper;

  // ---- the preview background (only when painted: over a video it is see-through)
  const bgfill = q("bgfill");
  Object.assign(bgfill.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) bgfill.style.background = `radial-gradient(ellipse ${0.55 * W}px ${0.28 * H}px at ${0.78 * W}px ${0.24 * H}px, ${rgba(L.deep, 0.55)}, ${rgba(L.deep, 0)} 100%), ` +
    `radial-gradient(ellipse ${0.5 * W}px ${0.22 * H}px at ${0.18 * W}px ${0.8 * H}px, ${rgba(L.mustard, 0.14)}, ${rgba(L.mustard, 0)} 100%), ${V.bg}`;

  // ---- the words: "|" = a new line, *a few words* = the accent
  const parse = t => { let on = false; return String(t || "").split("|").map(ln => ln.trim().split(/\s+/).filter(Boolean).map(w => {
    let s = w, acc = on;
    if (s[0] === "*") { s = s.slice(1); acc = on = true; }
    const m = s.match(/^(.*)\*([^*\w]*)$/);
    if (m) { s = m[1] + m[2]; acc = true; on = false; }
    return { t: s, acc };
  }).filter(w => w.t)).filter(l => l.length); };
  const lines = parse(V.text);
  if (!lines.length) lines.push([{ t: "Your words", acc: false }]);
  const display = V.font_role === "display";
  const fam = display ? V.display_font : V.body_font;
  const famCss = display ? `'${fam}', Georgia, serif` : `'${fam}', 'Segoe UI', sans-serif`;
  const accCss = `'${V.display_font}', Georgia, serif`;
  const col = { light, dark, signal: L.signal, mustard: L.mustard }[V.colour] || light;
  const accCol = V.accent === "none" ? col : (V.colour === "signal" ? L.mustard : L.signal);
  const shade = lum(col) > 0.5 && V.shadow > 0 ? `0 ${3 * U}px ${18 * U}px ${rgba("#000000", Math.min(0.8, 0.38 * V.shadow))}` : "none";

  // ---- the split: the pieces (letters or words), each with its rank in the order
  const block = q("block");
  const rows = [], pcs = [];
  lines.forEach((ws, li) => {
    const ln = document.createElement("div"); ln.className = "ln"; block.appendChild(ln); rows.push(ln);
    const row = [];
    ws.forEach((w, i) => {
      const wd = document.createElement("span"); wd.className = V.by === "words" ? "pc" : "wd";
      if (w.acc && V.accent !== "none") {
        wd.classList.add("acc");
        Object.assign(wd.style, { color: accCol });
        if (V.accent === "serif") Object.assign(wd.style, { fontFamily: accCss, fontStyle: "italic", fontWeight: String(fw(V.display_font, 400)), fontSize: "1.1em" });
      }
      if (V.by === "words") { wd.textContent = w.t; row.push(wd); }
      else Array.from(w.t).forEach(ch => { const c = document.createElement("span"); c.className = "pc"; c.textContent = ch; wd.appendChild(c); row.push(c); });
      ln.appendChild(wd);
      if (i < ws.length - 1) ln.appendChild(document.createTextNode(" "));
    });
    pcs.push(row);
  });
  const all = [].concat(...pcs);
  const rank = new Map();                                  // the order: left to right, from the middle out, random
  if (V.order === "random") {
    const ids = all.map((p, i) => [rnd(i, 3), i]).sort((a, b) => a[0] - b[0]);
    ids.forEach(([, i], r) => rank.set(all[i], r));
  } else {
    let off = 0;
    pcs.forEach(row => {
      const m = row.length, mid = (m - 1) / 2;
      let hi = 0;
      row.forEach((p, j) => { const r = V.order === "centre" ? Math.abs(j - mid) - (m % 2 ? 0 : 0.5) : j; rank.set(p, off + r); hi = Math.max(hi, r); });
      off += hi + 1;
    });
  }
  // ---- the layout: up to 124 px at 1080, fitted to 86 % of the width
  let S = 124 * U * V.size;
  const layout = () => {
    Object.assign(block.style, { width: `${W}px`, color: col, textShadow: shade, fontFamily: famCss,
      fontWeight: String(display ? fw(fam, 400) : fw(fam, 800)), fontSize: `${S}px`, lineHeight: "1.1", letterSpacing: display ? "0" : "-0.01em" });
    rows.forEach(ln => Object.assign(ln.style, { marginLeft: V.align === "left" ? `${0.08 * W}px` : "auto", marginRight: V.align === "left" ? "0px" : "auto" }));
    const bh = block.offsetHeight || lines.length * 1.1 * S;
    block.style.top = `${Math.min(H * 0.97 - bh, Math.max(H * 0.03, H * V.y / 100 - bh / 2))}px`;
  };
  layout();
  all.forEach(p => { p.style.transformOrigin = "50% 85%"; });

  // ---- the motion (d = frames at 30 fps since "Comes in at frame")
  const GAP = Math.max(0.2, V.by === "words" ? V.gap * 3 : V.gap);
  const DUR = { rise: 14, drop: 16, blur: 14, flip: 15 }[V.style] || 14;
  const maxR = Math.max(0, ...all.map(p => rank.get(p)));
  const at = p => rank.get(p) * GAP, allIn = maxR * GAP + DUR;
  const XD = 9, xs = Math.min(GAP * 0.6, 16 / Math.max(1, maxR)), exitLen = XD + xs * maxR;
  const T = (FRAMES - S0) * 30 / FPS, EX0 = T - exitLen - 1;
  const leave = V.leave && EX0 > allIn + 6;
  function render(t) {
    const d = (t - S0 / FPS) * 30;
    block.style.visibility = d >= 0 ? "visible" : "hidden";
    if (d < 0) return;
    all.forEach(p => {
      const k = d - at(p), x = k / DUR;
      let y = 0, sc = 1, rx = 0, bl = 0, op = 1;
      if (V.style === "drop") { y = -(1 - eBack(x)) * 0.7 * S; op = c01((k + 1) / 4); }
      else if (V.style === "blur") { sc = 1 + (1 - eOut(x)) * 0.9; bl = (1 - c01(k / 10)) * 0.12 * S; op = c01((k + 1) / 6); }
      else if (V.style === "flip") { rx = -(1 - eBack(x)) * 100; op = c01((k + 1) / 4); }
      else { y = (1 - eOut(x)) * 0.55 * S; bl = (1 - c01(k / 9)) * 0.09 * S; op = c01((k + 1) / 7); }
      if (leave) {
        const kx = d - EX0 - rank.get(p) * xs, e = eIn(kx / XD);
        if (V.style === "drop") y += e * 0.6 * S;
        else if (V.style === "blur") { sc *= 1 + e * 0.6; bl += e * 0.1 * S; }
        else if (V.style === "flip") rx += e * 90;
        else { y -= e * 0.45 * S; bl += e * 0.08 * S; }
        op *= 1 - c01(kx / XD);
      }
      p.style.opacity = op.toFixed(3);
      p.style.visibility = op > 0.001 ? "visible" : "hidden";
      p.style.filter = bl > 0.3 ? `blur(${bl.toFixed(2)}px)` : "none";
      p.style.transform = `perspective(${(6 * S).toFixed(0)}px) translateY(${y.toFixed(2)}px) rotateX(${rx.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    });
    const sc = 1 + 0.03 * eSine((d - allIn) / Math.max(20, (leave ? EX0 : T) - allIn));
    block.style.transformOrigin = `${W / 2}px ${block.offsetHeight / 2}px`;
    block.style.transform = `scale(${sc.toFixed(4)})`;
  }
  const px = every(render);
  if (window.MLLook && V.background) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 67 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // registered once the fonts are in: the lines are fitted with the real fonts
  (document.fonts && document.fonts.load ? Promise.all([`400 100px "${fam}"`, `800 100px "${fam}"`, `italic 400 100px "${V.display_font}"`, `400 100px "${V.display_font}"`]
    .map(f => document.fonts.load(f)).concat([document.fonts.ready])).catch(() => {}) : Promise.resolve()).then(() => {
    all.forEach(p => { p.style.transform = "none"; p.style.filter = "none"; });
    layout();
    const need = Math.max(...rows.map(ln => ln.offsetWidth));
    if (need > W * 0.86) { S *= W * 0.86 / need; layout(); }
    if (block.offsetHeight > H * 0.8) { S *= H * 0.8 / block.offsetHeight; layout(); }
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
