     camera then pans up and in (f54-f94) so the title leaves through the top while a white subtitle comes in
     pixelated and sharpens (f68-f92); the camera pans again (f134-f150) and a heart and a coin rise from the bottom,
     blurred and dim, and settle with a glow (f156-f176). The whole piece moves on twos, like the reference, with a

        const dy = tab(DY, D)[0] * H / ty[1], dx = tab(DX, D)[0] * W / ty[1], s = tab(DS, D)[0], b = tab(DB, D)[0] * U;
        sp.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${s.toFixed(3)})`;
        sp.style.filter = b > 0.3 ? `blur(${b.toFixed(1)}px)` : "none";
      });
      // the crown drops onto the left end of the title at f24-f32
      if (gq >= 24) {
        const off = tab(CROWN, gq)[0];
        crown.style.visibility = "visible";
        crown.style.left = `${(0.02 * W - CW / 2).toFixed(1)}px`;
        crown.style.top = `${(th / 2 + off * H - CH / 2).toFixed(1)}px`;
        crown.style.transform = "rotate(-14deg)";
      } else crown.style.visibility = "hidden";
    }
    // the subtitle: pixelated, sharpening, then panned up with the camera
    scx.setTransform(1, 0, 0, 1, 0, 0); scx.clearRect(0, 0, W, H);
    const so = tab(SUBO, gq)[0];
    if (gq >= 68 && so > 0 && subText) {
      const fpx = V.sub_size * U, wt = fw(fam, 800);
      tmx.setTransform(1, 0, 0, 1, 0, 0); tmx.clearRect(0, 0, W, H);
      tmx.font = `${wt} ${fpx}px '${fam}', sans-serif`; tmx.textAlign = "center"; tmx.textBaseline = "middle";
      const w0 = Math.max(1, tmx.measureText(subText).width), sf = Math.min(1, 0.728 * W / w0) * tab(SUBS, gq)[0];
      tmx.save(); tmx.translate(0.4965 * W, tab(SUBY, gq)[0] * H); tmx.scale(sf, sf);
      tmx.fillStyle = glare;
      tmx.shadowColor = rgba(glare, 0.55 * gl); tmx.shadowBlur = 0.3 * fpx; tmx.fillText(subText, 0, 0);
      tmx.shadowColor = rgba(glare, 0.8 * gl); tmx.shadowBlur = 0.09 * fpx; tmx.fillText(subText, 0, 0);
      tmx.shadowColor = "transparent"; tmx.shadowBlur = 0; tmx.fillText(subText, 0, 0);
      tmx.restore();
      const b = tab(PIX, gq)[0] * U;
      scx.globalAlpha = so;
      if (b > 1.2) {
        small.width = Math.ceil(W / b); small.height = Math.ceil(H / b);
        smx.imageSmoothingEnabled = true; smx.clearRect(0, 0, small.width, small.height); smx.drawImage(tmp, 0, 0, small.width, small.height);
        scx.imageSmoothingEnabled = false; scx.drawImage(small, 0, 0, small.width, small.height, 0, 0, small.width * b, small.height * b);
      } else scx.drawImage(tmp, 0, 0);
      scx.globalAlpha = 1;
    }
    // the heart and the coin rise from the bottom
    [[heart, HEART, HX, HW, HH], [coin, COIN, KX, KW, KH]].forEach(([el, tb, x, w, h]) => {
      if (gq < tb[0][0] + 2) { el.style.visibility = "hidden"; return; }
      const r = tab(tb, gq);
      el.style.visibility = "visible";
      el.style.opacity = String(r[2].toFixed(3));
      el.style.transform = `translate(${(x * W - w / 2).toFixed(1)}px, ${(r[0] * H - h / 2).toFixed(1)}px) scale(${r[1].toFixed(4)})`;
      const bl = r[3] * U * 1.5;
      el.style.filter = `${bl > 0.2 ? `blur(${bl.toFixed(1)}px) ` : ""}drop-shadow(0 0 ${14 * U}px ${rgba(tc, 0.55 * gl * r[2])})`;
    });
    // dust
    fxx.clearRect(0, 0, W, H);
    if (V.dust) SPECKS.forEach(sp => {
      if (gq < sp.s || gq >= sp.s + sp.life) return;
      fxx.fillStyle = rgba(glare, 0.5);
      sp.bl.forEach(b => { fxx.beginPath(); fxx.arc(sp.x * W + b[0] * U, sp.y * H + b[1] * U, sp.r * b[2] * U, 0, Math.PI * 2); fxx.fill(); });
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 12 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 29 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
