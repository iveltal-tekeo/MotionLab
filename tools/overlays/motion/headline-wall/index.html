<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "headline-wall" (2026-10-28): a wall of headline cards piles up behind the person's
     head, then a big total pops in FRONT of them under the chin (the Editor uses in_shot behind "top": hidden by the
     person above the chin, in front below it - so the cards sit above the shoulders, the total below 62 % of the
     height on 9:16). Each card (white, dark, paper or mustard in turn) has a bold headline and a small line with a
     play mark; they drop onto the wall one every 3 frames (7 f, a small overshoot, a turn). The total pill pops
     (9 f) and its number counts up (20 f, slow end), a light crosses it, the cards drift while they hold, and at the
     end the cards lift away and the pill sinks. Rebuilt in MotionLab's own HTML after a design in an MIT-licensed
     Python effect. Look-aware. Size-independent, laid out again for landscape. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .card { position: absolute; left: 0; top: 0; font-synthesis: none; transform-origin: 50% 50%; will-change: transform; }
  .hl { display: block; overflow-wrap: break-word; }
  .meta { display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .tri { flex: none; width: 0; height: 0; border-style: solid; border-color: transparent; }
  #pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; white-space: nowrap; overflow: hidden; font-synthesis: none; transform-origin: 50% 50%; }
  #num { display: block; text-align: center; }
  #lab { display: block; }
  #shine { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="wall" class="abs"></div>
  <div id="front" class="abs"><div id="pill"><span id="num"></span><span id="lab"></span><div id="shine"></div></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none" };
  const hex = h => { const t0 = String(h).replace("#", ""); const t = t0.length === 3 ? t0.split("").map(c => c + c).join("") : t0; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${a})`; };
  const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(", ")})`; };
  const lum = h => { const [r, g, b] = hex(h); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const EC = {};
  const ez = e => (EC[e] = EC[e] || gsap.parseEase(e));
  const P = (g, f0, f1, e) => { const k = clamp01((g - f0) / (f1 - f0)); return e ? ez(e)(k) : k; };
  const S = Math.round(V.start), END = FRAMES * 30 / FPS;   // END = the last frame + 1, in frames designed at 30 fps
  const PORT = H >= W;

  // ---- the cards: where they land (x, y as shares of the frame, a turn), above the shoulders, round the head
  const SLOTS = PORT ? [[0.27, 0.185, -5], [0.73, 0.2, 4], [0.24, 0.295, 3], [0.77, 0.305, -4], [0.5, 0.165, 2], [0.26, 0.395, -3],
      [0.74, 0.4, 5], [0.5, 0.28, -3], [0.36, 0.245, -7], [0.66, 0.255, 6], [0.42, 0.355, 4], [0.6, 0.19, -5], [0.2, 0.35, 5], [0.82, 0.36, -6]]
    : [[0.15, 0.22, -5], [0.85, 0.24, 4], [0.36, 0.17, 3], [0.64, 0.19, -4], [0.17, 0.47, 3], [0.83, 0.48, -3], [0.37, 0.43, -6],
      [0.63, 0.45, 5], [0.5, 0.12, 2], [0.26, 0.31, 6], [0.74, 0.33, -6], [0.1, 0.33, -2], [0.9, 0.35, 2], [0.5, 0.3, -3]];
  const items = String(V.headlines || "").split("|").map(x => x.trim()).filter(Boolean).slice(0, 14)
    .map(x => { const i = x.indexOf("::"); return i < 0 ? [x, ""] : [x.slice(0, i).trim(), x.slice(i + 2).trim()]; });
  const N = items.length;
  const sz = Number(V.size) || 1;
  const CW = (PORT ? 0.4 : 0.215) * W * sz, FS = 0.08 * CW;
  const LOOKS = [["#FFFFFF"], ["#17161A"], [L.paper], [L.mustard]].map(([bg]) => [bg, lum(bg) > 0.5 ? "#141414" : "#FFFFFF"]);
  Object.assign(q("bgfill").style, { width: `${W}px`, height: `${H}px`, background: V.background
    ? `radial-gradient(ellipse 80% 45% at 50% 28%, ${mix(L.paper, L.deep, 0.18)} 0%, ${mix(L.paper, L.deep, 0.6)} 100%)` : "transparent" });
  const wall = q("wall"), front = q("front");
  Object.assign(wall.style, { width: `${W}px`, height: `${H}px` });
  Object.assign(front.style, { width: `${W}px`, height: `${H}px` });
  const handle = String(V.handle || "").trim();
  const C = items.map(([hl, meta], i) => {
    const [bg, fg] = LOOKS[i % LOOKS.length];
    const el = document.createElement("div"); el.className = "card"; el.id = `card${i}`;
    Object.assign(el.style, { width: `${CW}px`, padding: `${0.07 * CW}px ${0.08 * CW}px ${0.06 * CW}px`, borderRadius: `${0.045 * CW}px`,
      background: bg, color: fg, visibility: "hidden", opacity: "0",
      boxShadow: `0 ${8 * U}px ${22 * U}px rgba(0, 0, 0, 0.28), 0 ${1.5 * U}px ${3 * U}px rgba(0, 0, 0, 0.18)` });
    const h = document.createElement("div"); h.className = "hl"; h.textContent = hl;
    Object.assign(h.style, { fontFamily: `'${V.body_font}', 'Segoe UI', sans-serif`, fontSize: `${FS}px`,
      fontWeight: String(fw(V.body_font, 800)), lineHeight: "1.14", letterSpacing: "-0.01em" });
    const m = document.createElement("div"); m.className = "meta";
    Object.assign(m.style, { marginTop: `${0.045 * CW}px`, gap: `${0.025 * CW}px`, fontFamily: `'${V.body_font}', 'Segoe UI', sans-serif`,
      fontSize: `${0.048 * CW}px`, fontWeight: String(fw(V.body_font, 600)), color: rgba(fg, 0.66) });
    const tri = document.createElement("div"); tri.className = "tri";
    const ts = 0.04 * CW;
    Object.assign(tri.style, { borderWidth: `${ts / 2}px 0 ${ts / 2}px ${ts * 0.9}px`, borderLeftColor: L.signal });
    const mt = document.createElement("span"); mt.textContent = [handle, meta].filter(Boolean).join("  ·  ");
    m.append(tri, mt);
    el.append(h, m);
    wall.appendChild(el);
    const s = SLOTS[i % SLOTS.length];
    return { el, h, m, s, ch: 0.3 * CW };
  });

  // ---- the total: a pill in front, under the chin
  const PILL = { signal: L.signal, deep: L.deep, mustard: L.mustard, ink: L.ink }[V.pill] || L.signal;
  const PFG = lum(PILL) > 0.55 ? "#141414" : "#FFFFFF";
  const pill = q("pill"), num = q("num"), lab = q("lab"), shine = q("shine");
  const NS = 112 * U * sz, PH = 1.22 * NS;
  Object.assign(pill.style, { height: `${PH}px`, padding: `0 ${0.32 * NS}px 0 ${0.26 * NS}px`, gap: `${0.2 * NS}px`, borderRadius: `${0.28 * PH}px`,
    background: `linear-gradient(180deg, ${mix(PILL, "#FFFFFF", 0.1)} 0%, ${PILL} 100%)`, color: PFG, visibility: "hidden",
    boxShadow: `0 ${10 * U}px ${28 * U}px rgba(0, 0, 0, 0.3), inset 0 ${2 * U}px 0 rgba(255, 255, 255, 0.25)` });
  Object.assign(num.style, { fontFamily: `'${V.total_font}', 'Impact', sans-serif`, fontSize: `${NS}px`, lineHeight: "1",
    fontWeight: String(fw(V.total_font, 800)), fontVariantNumeric: "tabular-nums" });
  Object.assign(lab.style, { fontFamily: `'${V.body_font}', 'Segoe UI', sans-serif`, fontSize: `${0.32 * NS}px`, lineHeight: "1.1",
    fontWeight: String(fw(V.body_font, 700)) });
  lab.textContent = String(V.label || "");
  const SHW = 0.45 * NS;                                  // half the light band's width
  // the number counts up: prefix, digits (with their own separators and decimals), suffix
  const TOT = String(V.total || "").trim();
  const mm = TOT.match(/^([^0-9]*)([0-9][0-9.,]*)(.*)$/);
  const pre = mm ? mm[1] : "", digits = mm ? mm[2] : "", suf = mm ? mm[3] : TOT;
  const commas = /,\d{3}/.test(digits), dec = (digits.match(/\.(\d+)$/) || ["", ""])[1].length;
  const value = parseFloat(digits.replace(/,/g, "")) || 0;
  const fmt = v => pre + (commas ? v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec)) + suf;
  const PX = W / 2, PY = PORT ? 0.67 * H : 0.8 * H;

  // ---- the timing (frames designed at 30 fps; overlay.json's cues use the same formulas)
  const GAP = N > 1 ? Math.min(3, 24 / (N - 1)) : 0;
  const IN = i => 1 + i * GAP;
  const T1 = 1 + (N > 1 ? (N - 1) * GAP : 0) + 8;          // the total pops in
  const OUT0 = END - 11;
  let PW = 0;

  function render(t) {
    const g = t * 30 - S * 30 / FPS;
    wall.style.visibility = front.style.visibility = g >= 0 ? "visible" : "hidden";
    if (g < 0) return;
    const ex = P(g, OUT0, END - 1.5, "power2.in");
    C.forEach((c, i) => {
      const t0 = IN(i);
      if (g < t0) { c.el.style.visibility = "hidden"; c.el.style.opacity = "0"; return; }
      c.el.style.visibility = "visible";
      // dropped onto the wall: from 55 % and a little higher, turning into place (7 f, a small overshoot)
      const k = P(g, t0, t0 + 7, "back.out(1.6)"), k2 = P(g, t0, t0 + 7, "power3.out");
      const live = P(g, t0 + 8, t0 + 24, "sine.inOut");
      const dx = 2 * U * Math.sin(2 * Math.PI * (g - t0) / 80 + i * 1.7) * live, dy = 2.4 * U * Math.sin(2 * Math.PI * (g - t0) / 64 + i) * live;
      const x = Math.min(W - CW / 2 - 6 * U, Math.max(CW / 2 + 6 * U, c.s[0] * W)), y = c.s[1] * H;
      const rot = c.s[2] + (1 - k2) * (c.s[2] > 0 ? 7 : -7);
      const lift = -24 * U * (1 - k2) - 26 * U * ex;
      c.el.style.transform = `translate(${(x - CW / 2 + dx).toFixed(2)}px, ${(y - c.ch / 2 + dy + lift).toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${(0.55 + 0.45 * k).toFixed(4)})`;
      c.el.style.opacity = (P(g, t0, t0 + 2) * (1 - ex)).toFixed(3);
    });
    // the total: pops in front (9 f), counts up (20 f, slow end), a light crosses it, it breathes; it sinks at the end
    if (g < T1) { pill.style.visibility = "hidden"; return; }
    pill.style.visibility = "visible";
    const pk = P(g, T1, T1 + 9, "back.out(1.7)"), pr = P(g, T1, T1 + 9, "power3.out");
    const br = 1 + 0.012 * Math.sin(2 * Math.PI * (g - T1 - 30) / 44) * P(g, T1 + 30, T1 + 44, "sine.inOut");
    pill.style.transform = `translate(${(PX - PW / 2).toFixed(2)}px, ${(PY - PH / 2 + 30 * U * (1 - pr) + 34 * U * ex).toFixed(2)}px) rotate(-3deg) scale(${((0.6 + 0.4 * pk) * br).toFixed(4)})`;
    pill.style.opacity = (P(g, T1, T1 + 3) * (1 - ex)).toFixed(3);
    num.textContent = mm && V.count_up ? fmt(value * P(g, T1 + 2, T1 + 22, "power2.out")) : TOT;
    const sh = P(g, T1 + 26, T1 + 40, "power2.inOut");
    const sc = -SHW + sh * (PW + 2 * SHW);                 // the light band crosses the pill as a gradient (no box of its own)
    shine.style.background = `linear-gradient(100deg, rgba(255, 255, 255, 0) ${(sc - SHW).toFixed(1)}px, rgba(255, 255, 255, 0.38) ${sc.toFixed(1)}px, rgba(255, 255, 255, 0) ${(sc + SHW).toFixed(1)}px)`;
    shine.style.opacity = sh > 0 && sh < 1 ? "1" : "0";
  }
  const pxx = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  if (window.MLLook && V.background) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 67 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the fonts are in: three lines of headline at most per card, the label on one line,
  // the number's box as wide as the full total (the pill keeps its size while it counts)
  (document.fonts && document.fonts.load ? Promise.all(["body_font", "total_font"].flatMap(k =>
    [400, 600, 700, 800].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    C.forEach(c => {
      let fs = FS;
      const max = 3 * 1.14 * FS + 1;
      for (let k = 0; k < 10 && (c.h.offsetHeight > max || c.h.scrollWidth > c.h.clientWidth + 0.5); k++) { fs *= 0.92; c.h.style.fontSize = `${fs}px`; }
      const mw = c.m.scrollWidth, room = c.m.clientWidth;
      if (mw > room + 0.5) c.m.style.fontSize = `${0.048 * CW * Math.max(0.5, room / mw)}px`;
      c.ch = c.el.offsetHeight;
    });
    num.textContent = TOT;
    num.style.minWidth = `${num.offsetWidth + 2}px`;
    const roomL = (PORT ? 0.86 : 0.6) * W - num.offsetWidth - 0.78 * NS;
    if (lab.offsetWidth > roomL) lab.style.fontSize = `${0.32 * NS * Math.max(0.45, roomL / lab.offsetWidth)}px`;
    PW = pill.offsetWidth;
    render(pxx.t);
    window.__timelines["main"] = tl;
  });
</script>
