<!-- MotionLab motion template "ribbon-swoosh-text-reveal" (2026-10-22): a thick ribbon is drawn along a long wave that scrolls left under it (the head sweeps across f3-f26
     while the whole wave slides left, fastest at f36, until it stops by f99); three words and five round pictures are
     fixed to the wave and ride away with it (each rises in or fades in as the ribbon reaches it); the wave flattens
     into a straight band whose end rests at 27 % of the width at f99; the band then opens into a horn that grows
     rightwards (accelerating, f100-f138) until it fills the right side; the name's letters flicker in on it f122-f158.
     The ribbon is one stroke of constant width along the measured curve, the scroll / head / horn each use the
     reference's measured cubic-bezier. Look-aware. MotionLab's own code. Size-independent. -->

<script>

  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };

  // shallower valley at 2.52 and runs out into the straight band at the middle (y 0.485)
  const CURVE = [[-0.5, .851], [0, .851], [0.1, .844], [0.2, .822], [0.3, .78], [0.4, .733], [0.5, .662], [0.6, .558], [0.7, .447], [0.8, .356], [0.9, .315],
    [1.0, .308], [1.05, .31], [1.1, .34], [1.15, .40], [1.2, .484], [1.25, .577], [1.3, .673], [1.35, .751], [1.4, .787], [1.45, .79], [1.5, .775],
    [1.55, .743], [1.6, .698], [1.65, .642], [1.7, .572], [1.75, .498], [1.8, .42], [1.85, .347], [1.9, .289], [1.95, .255], [2.0, .245], [2.05, .263],
    [2.1, .305], [2.15, .355], [2.2, .43], [2.25, .50], [2.3, .565], [2.35, .616], [2.4, .65], [2.45, .672], [2.5, .681], [2.55, .681], [2.6, .676],

    [3.2, .49], [3.25, .486], [3.3, .485], [4.2, .485]];

    const n = CURVE.length;
    if (u <= CURVE[0][0]) return CURVE[0][1];
    if (u >= CURVE[n - 1][0]) return CURVE[n - 1][1];
    let i = 0; while (CURVE[i + 1][0] < u) i++;
    const a = CURVE[Math.max(0, i - 1)], b = CURVE[i], c = CURVE[i + 1], d = CURVE[Math.min(n - 1, i + 2)];
    // x spacing is uneven in places: interpolate in index space, then correct with the true fraction
    const t = (u - b[0]) / (c[0] - b[0]);
    return cr(a[1], b[1], c[1], d[1], t);
  };
  // the horn's edges: how far the top / bottom edge lies beyond the straight band, by x (fraction of the width)
  const HT = [[0.25, 0], [0.30, .015], [0.35, .025], [0.40, .035], [0.45, .055], [0.50, .075], [0.55, .095], [0.60, .115], [0.65, .145], [0.70, .175], [0.75, .215], [0.80, .255],
    [0.85, .305], [0.90, .365], [0.95, .43], [1.0, .50], [1.6, 1.2]];
  const HB = [[0.25, 0], [0.30, .025], [0.35, .035], [0.40, .055], [0.45, .075], [0.50, .095], [0.55, .115], [0.60, .145], [0.65, .175], [0.70, .215], [0.75, .255], [0.80, .295],
    [0.85, .355], [0.90, .395], [0.95, .46], [1.0, .53], [1.6, 1.2]];
  const tabv = (rows, x) => {
    if (x <= rows[0][0]) return rows[0][1];
    const n = rows.length; if (x >= rows[n - 1][0]) return rows[n - 1][1];
    let i = 0; while (rows[i + 1][0] < x) i++;
    return lerp(rows[i][1], rows[i + 1][1], (x - rows[i][0]) / (rows[i + 1][0] - rows[i][0]));
  };

  // ---- the motion curves, measured on the clip (frames at 30 fps)
  const bzS = bz(0.257, -0.030, 0.244, 1.018), bzB = bz(0.182, 0.071, 0.307, 1.083), bzR = bz(0.356, 0.003, 0.681, 0.692);
  const scroll = g => 3.435 * bzS(clamp01((g - 11.82) / 104.83));            // how far the wave has slid left (widths)
  const headU = g => 3.632 * bzB(clamp01((g - 2.95) / 105.78));              // how far along the wave the ribbon is drawn
  const hornX = g => 0.268 + 1.203 * bzR(clamp01((g - 100.04) / 55.74));     // where the horn's right end is
  const SWAP = 99.5;                                                          // the straight band hands over to the horn

  // ---- the three words, fixed to the wave
  const WS = V.word_size * U;
  const mkWord = (txt, u, y, op) => {
    const el = document.createElement("div"); el.className = "wd ml-display";
    Object.assign(el.style, { left: `${u * W}px`, top: `${y * H}px`, fontSize: `${WS}px`, fontWeight: String(fw(V.display_font, 600)), color: rc, letterSpacing: "-0.01em" });
    if (window.MLLook) MLLook.rich(el, txt, { look: L, family: V.display_font, weight: 600 }); else el.textContent = txt;
    world.appendChild(el);
    return { el, op };
  };
  const words = [[V.word_1, 0.30, 0.325, 1, 5, 10, 8], [V.word_2, 0.925, 0.745, 0.8, 16, 26, 3], [V.word_3, 1.50, 0.29, 0.8, 28, 34, 0]].map(w => Object.assign(mkWord(w[0], w[1], w[2], w[3]), { a: w[4], b: w[5], blur: w[6] }));

  // ---- the five round pictures, fixed to the wave: [u, y, diameter at 1080, grows from f, to f, picture]
  const ring = mixh(rc, L.paper, 0.78);
  const cands = [L.deep, L.mustard, L.ink, L.signal].filter(c => c !== rc), cn = cands.length;      // disc colours that stand out from the ribbon
  const PH = [0, 1, 2, 3, 4].map(i => [cands[i % cn], cands[(i + 1) % cn]]);
  const AV = [[0.31, 0.635, 246, 3, 15, 0], [0.94, 0.19, 250, 9, 24, 1], [1.525, 0.736, 262, 28, 38, 0], [2.20, 0.555, 255, 33, 40, 1], [2.72, 0.73, 263, 44, 56, 0]];
  const avs = [];
  if (V.avatars) AV.forEach((a, i) => {
    const D = a[2] * U, el = document.createElement("div"); el.className = "av";
    Object.assign(el.style, { left: `${a[0] * W - D / 2}px`, top: `${a[1] * H - D / 2}px`, width: `${D}px`, height: `${D}px`, background: ring, boxShadow: L.shadow });
    const inner = document.createElement("div"); inner.className = "in";
    const d2 = D * 0.84; Object.assign(inner.style, { width: `${d2}px`, height: `${d2}px`, background: L.paper });
    const lg = a[5] === 0 ? V.avatar1_logo : V.avatar2_logo;
    const has = lg && window.MLLogo && MLLogo.fill(inner, lg, { scale: MLLogo.is(lg) ? 0.56 : 1, dark: L.dark });
    if (has && !MLLogo.is(lg)) inner.querySelectorAll("img").forEach(im => Object.assign(im.style, { objectFit: "cover", objectPosition: "50% 40%" }));
    if (!has) {                                            // a soft disc in the look with a simple head and shoulders
      const [c1, c2] = PH[i];
      inner.style.background = `radial-gradient(circle at 30% 25%, ${mixh(c1, "#ffffff", 0.25)}, ${c1} 55%, ${mixh(c2, c1, 0.35)})`;
      inner.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%" style="position:absolute;inset:0"><circle cx="50" cy="40" r="17" fill="${L.paper}" fill-opacity="0.9"/><path d="M16 100C16 74 31 64 50 64C69 64 84 74 84 100Z" fill="${L.paper}" fill-opacity="0.9"/></svg>`;
    }
    el.appendChild(inner); world.appendChild(el);
    avs.push({ el, a });
  });

  // ---- the name: its letters are spans so they can flicker in
  const bl = [...String(V.brand || "")].filter(c => c !== "*" && c !== "_" && c !== "=" && c !== "^").length || 1;
  const fb = Math.min(V.brand_size * U, 0.62 * W / (bl * 0.6));
  Object.assign(brand.style, { left: `${0.47 * W}px`, top: `${0.485 * H}px`, fontSize: `${fb}px`, fontWeight: String(fw(V.display_font, 700)), color: onRib, letterSpacing: "-0.01em" });
  const rr = window.MLLook ? MLLook.rich(brand, V.brand, { look: L, family: V.display_font, weight: 700 }) : { words: [] };
  if (!window.MLLook) brand.textContent = V.brand;
  const lets = [];
  rr.words.forEach(w => { const s = w.textContent; w.textContent = "";
    [...s].forEach(ch => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; w.appendChild(sp); lets.push(sp); }); });
  const rn = window.MLLook ? MLLook.rnd(77) : Math.random;
  const NZ = lets.map(() => Array.from({ length: 24 }, () => rn()));      // a random value per letter every 3 frames
  const noise = (i, g) => { const k = Math.max(0, g) / 3, j = Math.floor(k), t = k - j; const a = NZ[i][Math.min(23, j)], b = NZ[i][Math.min(23, j + 1)]; return lerp(a, b, t); };

  const S = Math.round(V.start);

  function render(t) {
    const g = t * 30 - S * 30 / FPS;
    // the ribbon: the wave drawn up to headU, slid left by scroll; from f99.5 the straight band is the horn instead
    const horn = g >= SWAP;
    q("rib").style.display = horn || g < 2.9 ? "none" : "block";
    hornp.parentNode.style.display = horn ? "block" : "none";
    const sc = scroll(g);
    world.style.transform = `translate(${(-sc * W).toFixed(2)}px, 0px)`;
    if (!horn && g >= 2.9) {
      const hu = headU(g), pts = [];
      for (let u = CURVE[0][0]; u < hu; u += 0.012) pts.push(`${(u * W).toFixed(1)} ${(yw(u) * H).toFixed(1)}`);
      pts.push(`${(hu * W).toFixed(1)} ${(yw(hu) * H).toFixed(1)}`);
      ribp.setAttribute("d", "M " + pts.join(" L "));
    }
    // the horn: a flat band from the left edge to x, its edges flaring out beyond 25 % of the width
    if (horn) {
      const xr = hornX(g), th = V.thick / 100 / 2, cy = 0.485, top = [], bot = [];
      for (let x = -0.05; x < xr; x += 0.01) { top.push([x, cy - th - tabv(HT, x)]); bot.push([x, cy + th + tabv(HB, x)]); }
      top.push([xr, cy - th - tabv(HT, xr)]); bot.push([xr, cy + th + tabv(HB, xr)]);
      const P = top.concat(bot.reverse()).map(p => `${(p[0] * W).toFixed(1)} ${(p[1] * H).toFixed(1)}`);
      hornp.setAttribute("d", "M " + P.join(" L ") + " Z");
    }
    // the words: fade (and unblur) in
    words.forEach(w => {
      const p = clamp01((g - w.a) / (w.b - w.a));
      w.el.style.opacity = String(p * w.op);
      w.el.style.filter = p < 1 && w.blur > 0 ? `blur(${((1 - p) * w.blur * U).toFixed(2)}px)` : "none";
    });
    // the round pictures: grow from a dot
    avs.forEach(({ el, a }) => {
      const p = bzG(clamp01((g - a[3]) / (a[4] - a[3])));
      el.style.transform = `scale(${lerp(0.12, 1, p).toFixed(4)})`;
      el.style.opacity = g >= a[3] ? "1" : "0";
    });
    // the name: each letter flickers on its own, more and more present until f158
    const r = clamp01((g - 122) / 36);
    lets.forEach((sp, i) => {
      let o = 0;
      if (g >= 158) o = 1;
      else if (g >= 122) o = clamp01(noise(i, g - 122) * 0.8 + 1.5 * r - 0.55);
      sp.style.opacity = String(o);
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 8 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 31 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
