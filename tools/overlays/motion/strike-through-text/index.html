<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "main_1", "type": "string", "label": "Main line 1 (struck through - *bold* _italic_ ==highlight== ^signal colour^)", "default": "Long intros"},
  {"id": "main_2", "type": "string", "label": "Main line 2 (left alone)", "default": "A clear hook"},
  {"id": "main_3", "type": "string", "label": "Main line 3 (struck through)", "default": "Filler words"},
  {"id": "sub_1", "type": "string", "label": "Subtext 1 (typed above line 1)", "default": "Start strong"},
  {"id": "sub_2", "type": "string", "label": "Subtext 2 (typed below line 3)", "default": "Cut them out"},
  {"id": "size", "type": "number", "label": "Text size (px at a 1080-px short side)", "default": 64, "min": 20, "max": 140, "step": 1},
  {"id": "strike", "type": "enum", "label": "Strike-through colour", "default": "signal", "options": [{"value": "signal", "label": "Signal"}, {"value": "deep", "label": "Deep"}, {"value": "mustard", "label": "Mustard"}]},
  {"id": "thick", "type": "number", "label": "Strike-through thickness (px at a 1080-px short side)", "default": 9, "min": 2, "max": 30, "step": 0.5},
  {"id": "cursor", "type": "boolean", "label": "A typing cursor while the subtexts are typed", "default": true},
  {"id": "shake", "type": "number", "label": "Handheld camera (0 = steady, 10 = shaky)", "default": 0, "min": 0, "max": 10, "step": 0.5},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 600, "step": 1},
  {"id": "background", "type": "boolean", "label": "Paint the paper behind it (off = see-through, over a video)", "default": true},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "strike-through-text" (2026-10-22): three centred lines of dark text on paper, 20 % larger at first; f15-f25 they settle to their real size
     (a fast S-curve). At f53 a hand-drawn marker line opens from the middle of line 1 outwards and strikes it through
     (13 f, slow start and long tail, a little longer than the words); a cursor then appears above-right of it (f66,
     fading in) and the first subtext types in letter by letter (f69-f81, the cursor blinks once), the cursor goes at
     f82. The same again for line 3 and the second subtext, below it, 57-61 f later (f114, f123-f139); line 2 is left
     alone. Look-aware: the paper, the ink and the marker colour come from the look tokens. MotionLab's own code.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #blk { position: absolute; width: 0; height: 0; }
  .mn { position: absolute; white-space: nowrap; line-height: 1; font-synthesis: none; transform: translate(-50%, -50%); letter-spacing: -0.005em; }
  .sb { position: absolute; white-space: pre; line-height: 1; font-synthesis: none; transform: translate(0, -50%); letter-spacing: -0.005em; }
  .cu { position: absolute; display: none; }
  .st { position: absolute; display: none; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"><div id="blk"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 195;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const bz = (x1, y1, x2, y2) => t => { let s = t; for (let i = 0; i < 12; i++) { const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s - t;
    const d = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2); if (Math.abs(d) < 1e-6) break; s = Math.min(1, Math.max(0, s - x / d)); }
    return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s; };
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };

  // ---- the look: ink on paper, a marker line in one token colour
  const sc = V.strike === "deep" ? L.deep : V.strike === "mustard" ? L.mustard : L.signal;
  gsap.set("#bgfill", { width: W, height: H, background: V.background ? L.paper : "transparent" });
  const hand = q("hand"), blk = q("blk");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });
  const em = V.size * U, pitch = 1.93 * em;
  Object.assign(blk.style, { left: `${0.5 * W}px`, top: `${0.494 * H}px` });
  const ff = V.body_font;

  // the three main lines (centred on the block, one pitch apart)
  const mains = [V.main_1, V.main_2, V.main_3].map((txt, i) => {
    const el = document.createElement("div"); el.className = "mn ml-body";
    Object.assign(el.style, { left: "0px", top: `${(i - 1) * pitch}px`, fontSize: `${em}px`, fontWeight: String(fw(ff, 700)), color: L.ink });
    if (window.MLLook) MLLook.rich(el, txt, { look: L, family: ff, weight: 700 }); else el.textContent = txt;
    blk.appendChild(el);
    return el;
  });

  // the marker lines: a slightly wavering stroke, a little longer than the words
  const NS = "http://www.w3.org/2000/svg", th = V.thick * U;
  const rn = window.MLLook ? MLLook.rnd(61) : Math.random;
  const mkStrike = () => {
    const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "st");
    const path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "none"); path.setAttribute("stroke", sc); path.setAttribute("stroke-width", String(th)); path.setAttribute("stroke-linecap", "round");
    const wob = Array.from({ length: 9 }, () => (rn() - 0.5) * 0.5 * th);
    svg.appendChild(path); blk.appendChild(svg);
    return { svg, path, wob };
  };
  const strikes = [mkStrike(), mkStrike()];                 // line 1 and line 3

  // the subtexts: every letter a span (typed in), a cursor after the last one
  const mkSub = txt => {
    const el = document.createElement("div"); el.className = "sb ml-body";
    Object.assign(el.style, { fontSize: `${em}px`, fontWeight: String(fw(ff, 700)), color: L.ink });
    const rr = window.MLLook ? MLLook.rich(el, txt, { look: L, family: ff, weight: 700 }) : { words: [] };
    if (!window.MLLook) el.textContent = txt;
    const units = [];
    [...el.childNodes].filter(n => n.nodeType === 3).forEach(n => n.remove());          // rich's plain spaces: replaced by spans below
    rr.words.forEach((w, i) => {
      if (i > 0) { const sp = document.createElement("span"); sp.textContent = " "; sp.style.whiteSpace = "pre"; sp.style.display = "inline-block"; sp.style.width = "0.26em"; w.parentNode.insertBefore(sp, w); units.push(sp); }
      const s = w.textContent; w.textContent = "";
      [...s].forEach(ch => { const c = document.createElement("span"); c.textContent = ch; c.style.display = "inline-block"; w.appendChild(c); units.push(c); });
    });
    const cu = document.createElement("div"); cu.className = "cu";
    Object.assign(cu.style, { width: `${0.6 * em}px`, height: `${0.16 * em}px`, background: L.ink, borderRadius: `${0.03 * em}px`, top: `${0.95 * em}px` });
    el.appendChild(cu);
    blk.appendChild(el);
    return { el, units, cu, n: Math.max(1, units.filter(u => u.textContent.trim()).length) };
  };
  const subs = [mkSub(V.sub_1), mkSub(V.sub_2)];

  // ---- the motion, frame by frame from one proxy (seek-safe). g = the frame in 30-fps frames, shifted by "Starts at frame"
  const zoomB = bz(0.700, 0.138, 0.170, 0.755), strikeB = bz(0.485, 0.048, 0.076, 0.971);
  // letters typed (of the clip's 9), frames after the cursor appears: irregular, like a person typing
  const TYPE = [[0, 0], [2.5, 0], [3, 1], [4, 1], [5, 3], [6, 4], [7, 5], [8, 5], [9, 6], [10, 7], [11, 8], [13, 8], [13.5, 9]];
  const CUR = [[0, 0.13], [1, 0.38], [2, 0.82], [3, 1]];
  const S = Math.round(V.start);
  function render(t) {
    const g = t * 30 - S * 30 / FPS;
    // the block settles from 120 % to its real size
    const z = 1 + 0.2 * (1 - zoomB(clamp01((g - 14.78) / 10.72)));
    blk.style.transform = `scale(${z.toFixed(4)})`;
    // the marker lines (lines 1 and 3): they open from the middle outwards
    [[0, 52.56], [2, 113.56]].forEach(([li, g0], k) => {
      const st = strikes[k], p = strikeB(clamp01((g - g0) / 13.11));
      if (p <= 0.001) { st.svg.style.display = "none"; return; }
      const el = mains[li], w = el.offsetWidth * 1.065, y0 = (li - 1) * pitch + 0.05 * em;
      st.svg.style.display = "block";
      Object.assign(st.svg.style, { left: `${-w / 2 - th}px`, top: `${y0 - 2 * th}px`, width: `${w + 2 * th}px`, height: `${4 * th}px`,
        clipPath: `inset(0% ${((1 - p) * 50).toFixed(2)}% 0% ${((1 - p) * 50).toFixed(2)}%)` });
      st.svg.setAttribute("viewBox", `0 0 ${(w + 2 * th).toFixed(1)} ${(4 * th).toFixed(1)}`);
      const n = st.wob.length - 1;
      let d = "";
      st.wob.forEach((o, i) => { d += `${i ? " L" : "M"} ${(th + w * i / n).toFixed(1)} ${(2 * th + o).toFixed(2)}`; });
      st.path.setAttribute("d", d);
    });
    // the subtexts: line 1's above-right of it (cursor f66, letters f69-f81), line 3's below-right of it (f123 -> f139)
    [[0, 66, -1.35 * em + (-pitch), 0.25], [2, 123, 1.45 * em + pitch, 0.30]].forEach(([li, g0, y, kx], k) => {
      const sb = subs[k], d = g - g0, el = mains[li];
      const x = kx * el.offsetWidth;
      Object.assign(sb.el.style, { left: `${x}px`, top: `${y}px` });
      const n = Math.floor(tab(TYPE, d)[0] * sb.n / 9 + 1e-6);
      let seen = 0, last = null;
      sb.units.forEach(u => {
        const isCh = u.textContent.trim() !== "";
        if (isCh) { seen++; u.style.opacity = seen <= n ? "1" : "0"; if (seen <= n) last = u; }
      });
      const on = V.cursor && d >= 0 && d < 16 && !(d >= 11 && d < 13);
      sb.cu.style.display = on ? "block" : "none";
      if (on) {
        sb.cu.style.opacity = String(tab(CUR, d)[0]);
        sb.cu.style.left = `${last ? last.offsetLeft + last.offsetWidth + 0.12 * em : 0}px`;
      }
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 9 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 29 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
