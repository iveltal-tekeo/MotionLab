<!-- MotionLab motion template "brush-stroke-text-typed" (2026-10-22): a worn-tape teaser title. On a dark, noisy, vignetted ground (a fresh speckle every frame, two
     bright scan lines, a slow decelerating zoom of 15 % over the clip) one line of text types on, one character every
     3 frames from f2 (spaces too), over a brush stroke that wipes in from the left (f4-f25, fast start, long settle)
     with a ragged front and ragged edges that re-draw every 10 frames. Thin tech marks, a circuit line and a turning
     wireframe globe sharpen in from blur (f5-f16). Look-aware: ground, stroke, text and mark colours, fonts and film
     grain come from the look tokens. MotionLab's own code. Size-independent. -->

  .abs { position: absolute; left: 0; top: 0; }
  #bg, #hud, #tg, #stroke { position: absolute; left: 0; top: 0; }

<body>

  </div>
</div>
<script>
  const FPS = 30, FRAMES = 180;

    background: `linear-gradient(90deg, rgba(0,0,0,0) 0%, ${L.rgba(glare, a)} 12%, ${L.rgba(glare, a * 0.35)} 45%, ${L.rgba(glare, a * 0.9)} 70%, ${L.rgba(glare, a * 0.5)} 90%, rgba(0,0,0,0) 100%)`, opacity: String(GR) });

  const hud = q("hud"), mk = (tag, at, par) => { const e = document.createElementNS(NS, tag); Object.entries(at || {}).forEach(([k, v]) => e.setAttribute(k, v)); (par || hud).appendChild(e); return e; };

  const WIPE = [[3, 0.02], [4, 0.146], [5, 0.226], [6, 0.336], [7, 0.45], [8, 0.545], [9, 0.628], [10, 0.683], [11, 0.738], [12, 0.784], [13, 0.818], [14, 0.852], [15, 0.879], [16, 0.905],
    [17, 0.92], [18, 0.94], [19, 0.955], [20, 0.958], [22, 0.977], [24, 0.99], [25, 1]];
  const ZOOM = [[0, 1], [3, 1], [10, 1.045], [20, 1.072], [30, 1.085], [40, 1.098], [60, 1.107], [100, 1.125], [170, 1.148], [180, 1.15]];
  const HZOOM = [[0, 0.94], [5, 0.94], [13, 0.953], [38, 1], [60, 1.012], [100, 1.025], [179, 1.038]];
  let lastKey = "";

  // ---- the motion, frame by frame from one proxy (seek-safe); g = the frame minus "Starts at frame"
  const S = Math.round(V.start);
  const maxW = 0.9 * W;
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    const gi = Math.floor(g + 1e-6), z = tab(ZOOM, g)[0], nz = 2 * Math.floor(gi / 5) + (gi % 5 >= 3 ? 1 : 0);   // the speckle refreshes at f3, f5, f8, f10, f13...: twelve times a second
    // the worn ground: a new speckle every frame, a slow zoom
    const rr = rnd(5000 + nz * 13);
    spk.style.backgroundImage = `url(${sheets[nz % 4]})`;
    spk.style.backgroundPosition = `${Math.floor(rr() * W)}px ${Math.floor(rr() * H)}px`;
    bg.style.transform = `scale(${z.toFixed(4)})`;
    // the marks
    const ho = cl((g - 5) / 11), hb = 9 * (1 - cl((g - 5) / 12)), go = cl((g - 6) / 10);
    hud.style.transformOrigin = "50% 50%"; hud.style.transform = `scale(${tab(HZOOM, g)[0].toFixed(4)})`;
    hg.setAttribute("opacity", (0.65 * ho).toFixed(3)); hud.style.filter = hb > 0.1 ? `blur(${(hb * K).toFixed(2)}px)` : "none";
    const cp = cl((g - 6) / 10);
    circ.setAttribute("opacity", (0.8 * cl((g - 5) / 4)).toFixed(3));
    cpath.setAttribute("stroke-dasharray", `${(CLEN * cp).toFixed(1)} ${CLEN}`);
    cd2.setAttribute("opacity", cl((g - 12) / 4).toFixed(3));
    gb.setAttribute("opacity", (0.62 * go).toFixed(3)); turn(0.012 * g);
    // the title
    const w = txt.offsetWidth || 1, base = probe.offsetTop, stw = w + PADL + PADR, fit = Math.min(1, maxW / stw);
    const left = CX - stw / 2;
    Object.assign(txt.style, { transform: `translate(${(left + PADL).toFixed(1)}px, ${(BASE - base).toFixed(1)}px)` });
    tg.style.transformOrigin = `${CX}px ${BASE}px`; tg.style.transform = `scale(${fit.toFixed(4)})`;
    chars.forEach((u, i) => { if (u) u.style.opacity = g >= 2 + 3 * i ? "1" : "0"; });
    // the stroke
    const vi = Math.floor(Math.max(0, g) / 10) % 4, key = `${vi}|${Math.round(stw)}|${V.stroke_colour}`;
    if (key !== lastKey) {
      lastKey = key;
      spath.setAttribute("d", pathFor(variants[vi], stw, STH));
      spath.setAttribute("transform", `translate(${left.toFixed(1)}, ${(BASE - 113 * K * szr).toFixed(1)})`);
      streaks.forEach((s, k) => { const a = variants[vi].st[k]; s.setAttribute("x", (left + stw * a[0]).toFixed(1)); s.setAttribute("y", (BASE - 113 * K * szr + STH * a[1]).toFixed(1));
        s.setAttribute("width", (stw * a[2]).toFixed(1)); s.setAttribute("height", (2.2 * K * szr).toFixed(1)); });
    }
    const p = tab(WIPE, g)[0], fx = left + stw * p;
    if (g < 3) stroke.style.clipPath = "polygon(0 0, 0 0, 0 0)";
    else {
      const top = BASE - 113 * K * szr - 10, hh = STH + 20, n = front.length;
      const poly = [`${(left - 30).toFixed(1)}px ${top.toFixed(1)}px`];
      for (let i = 0; i < n; i++) poly.push(`${(fx + (p < 1 ? (front[i] - 0.5) * 36 * K * szr * (1 - p * 0.6) : 0) + 14 * K * (p < 1 ? 1 : 3)).toFixed(1)}px ${(top + hh * i / (n - 1)).toFixed(1)}px`);
      poly.push(`${(left - 30).toFixed(1)}px ${(top + hh).toFixed(1)}px`);
      stroke.style.clipPath = `polygon(${poly.join(", ")})`;
    }
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 9 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 21 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { window.__timelines["main"] = tl; });
</script>
