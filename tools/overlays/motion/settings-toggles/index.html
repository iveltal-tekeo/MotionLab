<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "rows", "type": "string", "label": "Rows, one per switch (| between, up to 6)", "default": "Focus mode|No notifications|Deep work"},
  {"id": "accent", "type": "color", "label": "Switch colour when on", "default": "#34C759"},
  {"id": "tone", "type": "enum", "label": "Glass", "default": "clear", "options": [{"value": "clear", "label": "Clear (a light frost)"}, {"value": "smoke", "label": "Smoke (darker, for bright rooms)"}]},

  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 600, "step": 1},

  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#2E2925"},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "settings-toggles" (2026-10-27): a phone-settings card of glass under the chin. It pops
     in (f0-f11, a slow end with a small overshoot, rising 43 px), then its switches flip on one after another (the
     first at f14, then every `gap` frames: a press lights the row, the knob slides 7 f with a stretch, the track
     fills with the accent and glows); it floats a hair while it holds, a band of light crosses the glass after the
     last flip, and it sinks away over the last 9 frames. Over a video with a person it is a glass card: the renderer
     frosts the real footage under it (template.json "in_shot"), so the card paints only a thin translucent fill, a
     light rim and a soft highlight at its top edge - never a picture or a blur of its own (the preview background
     below is the only thing it blurs). After the "apple-toggles" effect of claude-video-effects (MIT); MotionLab's
     own code. Size-independent, look-aware. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #cardw { position: absolute; left: 0; top: 0; }
  #card { position: absolute; overflow: hidden; }
  #card > div, #card > svg { position: absolute; }
  .lbl { position: absolute; white-space: nowrap; font-synthesis: none; }
  .trk, .on, .knob, .tap, .sep { position: absolute; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cardw"><div id="card"><div id="hi"></div><div id="list"></div><svg id="rim"></svg></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const lum = h => window.MLLook ? MLLook.lum(h) : 0.5;
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const c01 = x => Math.min(1, Math.max(0, x));
  const eOut = x => 1 - Math.pow(1 - c01(x), 3);                            // decelerating (slow end)
  const eIO = x => { x = c01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };   // S-curve
  const eIn = x => c01(x) * c01(x);                                          // accelerating (exits only)
  const eBack = x => { x = c01(x) - 1; return 1 + 2.4 * x * x * x + 1.4 * x * x; };                // slow end, a small overshoot
  // a function run at every frame's time: seek-safe (a render, a snapshot and a preview land on the same picture)
  const every = fn => { const p = { t: 0 }; fn(0); tl.fromTo(p, { t: 0 }, { t: FRAMES / FPS, duration: FRAMES / FPS, ease: "none", immediateRender: false, onUpdate: () => fn(p.t) }, 0); return p; };
  const S = Math.round(V.start), s = V.size * U;
  const light = lum(L.paper) >= lum(L.ink) ? L.paper : L.ink, dark = light === L.paper ? L.ink : L.paper;
  const smoke = V.tone === "smoke";

  // ---- the preview background (only when painted: over a video the card is see-through and the renderer frosts the footage)
  const bgfill = q("bgfill");
  Object.assign(bgfill.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) bgfill.style.background = `radial-gradient(ellipse ${0.5 * W}px ${0.22 * H}px at ${0.2 * W}px ${0.28 * H}px, ${rgba(L.mustard, 0.55)}, ${rgba(L.mustard, 0)} 100%), ` +
    `radial-gradient(ellipse ${0.42 * W}px ${0.2 * H}px at ${0.84 * W}px ${0.6 * H}px, ${rgba(L.paper, 0.3)}, ${rgba(L.paper, 0)} 100%), ` +
    `radial-gradient(ellipse ${0.6 * W}px ${0.18 * H}px at ${0.45 * W}px ${0.9 * H}px, ${rgba(L.signal, 0.28)}, ${rgba(L.signal, 0)} 100%), ${V.bg}`;

  // ---- the card: her proportions at 1080 px (778 wide, rows of 135, switches 146 x 86)
  const rows = String(V.rows || "").split("|").map(r => r.trim()).filter(Boolean).slice(0, 6);
  if (!rows.length) rows.push("Focus mode");
  const n = rows.length;
  const cw = Math.min(778 * s, W * 0.92), k = cw / (778 * s);            // k < 1 only when a big size meets a narrow frame
  const rh = 135 * s * k, ch = rh * n, pad = 54 * s * k, tw = 146 * s * k, th = 86 * s * k, inset = 6.5 * s * k;
  const R = Math.min(ch / 2, Math.max(10 * U, L.radius * 4.2));          // the look's corners, scaled up for a big card
  const cx = Math.min(W - cw / 2 - W * 0.03, Math.max(cw / 2 + W * 0.03, W * V.x / 100));
  const cy = Math.min(H - ch / 2 - H * 0.04, Math.max(ch / 2 + H * 0.04, H * V.y / 100));
  const cardw = q("cardw"), card = q("card");
  Object.assign(card.style, { left: `${-cw / 2}px`, top: `${-ch / 2}px`, width: `${cw}px`, height: `${ch}px`, borderRadius: `${R}px`,
    background: smoke ? `linear-gradient(180deg, ${rgba(dark, 0.5)} 0%, ${rgba(dark, 0.42)} 100%)`
      : `linear-gradient(180deg, ${rgba("#ffffff", 0.22)} 0%, ${rgba("#ffffff", 0.14)} 45%, ${rgba("#ffffff", 0.17)} 100%)` });
  if (V.background) {          // the preview only: the real frost of the painted background behind it + its shadow
    card.style.backdropFilter = card.style.webkitBackdropFilter = `blur(${18 * U}px) saturate(1.25)`;
    card.style.boxShadow = `0 ${10 * U}px ${32 * U}px ${rgba("#000000", 0.28)}`;
  }
  // the soft highlight along the top edge + the rim (light from the top left)
  Object.assign(q("hi").style, { left: "0px", top: "0px", width: `${cw}px`, height: `${Math.min(ch, rh) * 0.7}px`,
    background: `linear-gradient(180deg, ${rgba("#ffffff", smoke ? 0.12 : 0.2)} 0%, ${rgba("#ffffff", 0)} 100%)` });
  const rim = q("rim"), sw = Math.max(1.2, 1.6 * U);
  rim.setAttribute("width", cw); rim.setAttribute("height", ch);
  Object.assign(rim.style, { left: "0px", top: "0px", overflow: "visible" });
  rim.innerHTML = `<defs><linearGradient id="rimg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>` +
    `<stop offset="0.45" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/></linearGradient>` +
    `<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.24"/>` +
    `<stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="tgc"><rect x="0" y="0" width="${cw}" height="${ch}" rx="${R}"/></clipPath></defs>` +
    `<g clip-path="url(#tgc)"><rect id="tgsh" x="0" y="${-ch * 0.5}" width="${cw * 0.3}" height="${ch * 2}" fill="url(#shg)" opacity="0"/></g>` +
    `<rect x="${sw / 2}" y="${sw / 2}" width="${cw - sw}" height="${ch - sw}" rx="${R - sw / 2}" fill="none" stroke="url(#rimg)" stroke-width="${sw}"/>`;
  // a band of light that crosses the glass once after the last flip (in the rim's svg, clipped to the card)
  const sheen = q("tgsh"), bw = cw * 0.3;

  // ---- the rows: a label, a hairline between rows, a switch (track, its "on" fill, the knob), a press highlight
  const list = q("list");
  Object.assign(list.style, { left: "0px", top: "0px", width: `${cw}px`, height: `${ch}px` });
  const offFill = rgba("#ffffff", smoke ? 0.16 : 0.24);
  const R_ = rows.map((txt, i) => {
    const tap = document.createElement("div"); tap.className = "tap";
    Object.assign(tap.style, { left: "0px", top: `${i * rh}px`, width: `${cw}px`, height: `${rh}px`, background: rgba("#ffffff", 0.14), opacity: "0" });
    list.appendChild(tap);
    if (i > 0) { const sep = document.createElement("div"); sep.className = "sep";
      Object.assign(sep.style, { left: `${pad}px`, top: `${i * rh - 0.75 * U}px`, width: `${cw - pad}px`, height: `${Math.max(1, 1.5 * U)}px`, background: rgba(light, 0.24) });
      list.appendChild(sep); }
    const lb = document.createElement("div"); lb.className = "lbl ml-body"; lb.textContent = txt;
    Object.assign(lb.style, { left: `${pad}px`, top: `${i * rh}px`, height: `${rh}px`, lineHeight: `${rh}px`, color: light,
      fontFamily: `'${V.body_font}', 'Segoe UI', sans-serif`, fontWeight: String(fw(V.body_font, 560)), fontSize: `${50 * s * k}px`,
      textShadow: smoke ? "none" : `0 ${1 * U}px ${7 * U}px ${rgba("#000000", 0.28)}` });
    list.appendChild(lb);
    const trk = document.createElement("div"); trk.className = "trk";
    const tx = cw - pad * 0.95 - tw, ty = i * rh + (rh - th) / 2;
    Object.assign(trk.style, { left: `${tx}px`, top: `${ty}px`, width: `${tw}px`, height: `${th}px`, borderRadius: `${th / 2}px`, background: offFill,
      boxShadow: `inset 0 ${1 * U}px ${2 * U}px ${rgba("#000000", 0.12)}` });
    const on = document.createElement("div"); on.className = "on";
    Object.assign(on.style, { left: "0px", top: "0px", width: `${tw}px`, height: `${th}px`, borderRadius: `${th / 2}px`, background: V.accent, opacity: "0" });
    const kd = th - 2 * inset;
    const knob = document.createElement("div"); knob.className = "knob";
    Object.assign(knob.style, { left: `${inset}px`, top: `${inset}px`, width: `${kd}px`, height: `${kd}px`, borderRadius: `${kd / 2}px`, background: "#ffffff",
      boxShadow: `0 ${2.5 * U}px ${6 * U}px ${rgba("#000000", 0.28)}, 0 0 0 ${0.5 * U}px ${rgba("#000000", 0.05)}` });
    trk.append(on, knob); list.appendChild(trk);
    return { lb, tap, trk, on, knob, kd };
  });

  // ---- the motion (d = frames at 30 fps since "Comes in at frame"; e = frames at 30 fps before the end)
  const GAP = Math.max(3, V.gap), FLIP = 7, first = 14;
  const flipAt = i => first + i * GAP, lastEnd = flipAt(n - 1) + FLIP;
  const leave = V.leave && (FRAMES - S) * 30 / FPS - 9 > lastEnd + 4;
  // the rise in and the sink out stay inside the frame when the card sits low
  const ROOM = H - (cy + ch / 2), RISE = Math.min(43 * s, Math.max(20 * s, ROOM - 4 * U)), SINK = Math.min(30 * s, Math.max(0, ROOM - 4 * U));
  function render(t) {
    const d = (t - S / FPS) * 30, e = (FRAMES / FPS - t) * 30;
    cardw.style.visibility = d >= 0 ? "visible" : "hidden";
    if (d < 0) return;
    // in: a pop from 60 % with a small overshoot, rising 43 px (11 f), seen within 3 f; out: sinks and fades (9 f)
    let sc = 0.6 + 0.4 * eBack(d / 11), lift = (1 - eOut(d / 11)) * RISE, op = c01((d + 0.5) / 3);
    lift += 3 * s * Math.sin(2 * Math.PI * (d - 22) / 96) * c01((d - 22) / 24);     // it floats a hair while it holds
    if (leave && e < 9) { const x = eIn(1 - e / 9); sc *= 1 - 0.1 * x; lift += SINK * x; op *= 1 - x; }
    cardw.style.transform = `translate(${cx.toFixed(2)}px, ${(cy + lift).toFixed(2)}px) scale(${sc.toFixed(4)})`;
    cardw.style.opacity = op.toFixed(3);
    R_.forEach((r, i) => {
      const f0 = flipAt(i), u = eOut((d - f0) / FLIP), p = d - (f0 - 3);
      r.on.style.opacity = u.toFixed(3);
      const st = 1 + 0.32 * Math.sin(Math.PI * c01((d - f0) / FLIP)), kw = r.kd * st;     // the knob stretches as it slides
      const mid = inset + r.kd / 2 + (tw - th) * u;
      r.knob.style.left = `${Math.max(inset, Math.min(tw - inset - kw, mid - kw / 2)).toFixed(2)}px`;
      r.knob.style.width = `${kw.toFixed(2)}px`;
      r.trk.style.boxShadow = `inset 0 ${1 * U}px ${2 * U}px ${rgba("#000000", 0.12 * (1 - u))}, 0 0 ${14 * U}px ${rgba(V.accent, 0.45 * u)}`;
      r.tap.style.opacity = (p < 0 ? 0 : p < 3 ? p / 3 : Math.max(0, 1 - (p - 3) / 10)).toFixed(3);   // the press: 3 f in, 10 f out
    });
    const sp = eIO((d - lastEnd - 6) / 24);
    const shx = -bw * 1.4 + (cw + bw * 2.2) * sp;
    sheen.setAttribute("transform", `translate(${shx.toFixed(2)} 0) rotate(18 ${(bw / 2).toFixed(1)} ${(ch / 2).toFixed(1)})`);
    sheen.setAttribute("opacity", sp > 0 && sp < 1 ? "1" : "0");
  }
  const px = every(render);
  if (window.MLLook && V.background) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 41 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // registered once the fonts are in; the labels are fitted beside their switch with the real font
  (document.fonts && document.fonts.load ? Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 100px "${V.body_font}"`))
    .concat([document.fonts.ready])).catch(() => {}) : Promise.resolve()).then(() => {
    const room = cw - pad - (pad * 0.95 + tw) - 26 * s * k;
    const widest = Math.max(1, ...R_.map(r => r.lb.offsetWidth));
    if (widest > room) R_.forEach(r => { r.lb.style.fontSize = `${50 * s * k * room / widest}px`; });
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
