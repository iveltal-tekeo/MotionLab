<!-- MotionLab motion template "blur-glow-text-to-footage-card" (2026-10-22): an upright title sequence over a soft colour glow on a dark ground. A big word types on
     letter by letter (f5-f38), then slides out to the left, speeding up (f34-f50), while the next line pops up
     small and sharpens word by word (f47-f62); that line slides out the same way (f67-f85) as the next one blurs
     in (f82-f90), which slides out (f100-f118) as the fourth blurs in (f108-f118) and shrinks away with the glow
     (f139-f147). Then a round logo pops in turning (f148-f158), shrinks (f165-f173), and a 16:9 footage card slams
     in big, settles (f174-f185) and swings up in perspective to fill the frame, tilted (f187-f213), then holds to the
     end. The words carry one colour gradient fixed to the screen (pale at the left, vivid at the right) so each
     word changes colour as it slides. Look-aware: ground, glow, text and disc colours, fonts, corners and film grain
     come from the look tokens. MotionLab's own code. Size-independent. -->

</style>

  const DS = [[148, 1.277], [149, 1.215], [150, 1.154], [151, 1.123], [152, 1.092], [153, 1.062], [154, 1.046], [155, 1.03], [156, 1.015], [157, 1.007], [158, 1], [165, 1], [166, 0.98],
    [167, 0.942], [168, 0.896], [169, 0.842], [170, 0.78], [171, 0.735], [172, 0.68], [173, 0.635]];
  const DR = [[148, -17], [149, -14.5], [150, -12], [151, -9.5], [152, -8], [153, -6.5], [154, -5], [155, -4], [156, -3], [157, -1.5], [158, 0]];

  const CW = 535 * K, CH = CW * 9 / 16, card = q("card"), cbox = q("cbox");
  Object.assign(card.style, { left: `${W / 2 - CW / 2}px`, top: `${H / 2 - CH / 2}px`, width: `${CW}px`, height: `${CH}px`, display: "none" });
  if (window.MLLook) { MLLook.card(cbox, L); MLLook.card(card, L, { shadow: false }); card.style.boxShadow = L.shadow; }
  if (window.MLLook) {
    const mv = MLLook.media(cbox, V.video_media, { look: L, kind: "video", label: "your video", fit: "cover", focus: V.video_focus, seed: 23,
      r: L.radius, start: 174 / FPS, duration: (FRAMES - 174) / FPS, id: "card-media", slot: "video_media" });
    if (!mv && cbox.lastElementChild) Object.assign(cbox.lastElementChild.style, { left: "50%", bottom: "50%", transform: "translateX(-50%)", opacity: "0.7" });   // the label stays on the visible part of the tilted card
  }
  const CS = [[174, 1.45], [175, 1.35], [176, 1.287], [177, 1.225], [178, 1.175], [179, 1.131], [180, 1.087], [181, 1.062], [182, 1.05], [183, 1.012], [184, 1.0], [185, 0.997], [186, 0.997],
    [187, 0.99], [188, 1.003], [189, 1.016], [190, 1.035], [191, 1.057], [192, 1.084], [193, 1.12], [194, 1.159], [195, 1.215], [196, 1.3], [197, 1.39], [198, 1.5], [199, 1.6], [200, 1.69],
    [201, 1.75], [202, 1.8], [203, 1.84], [204, 1.865], [205, 1.885], [206, 1.9], [207, 1.91], [208, 1.915], [209, 1.92]];
  const PERSP = 1500 * K;

  // ---- the motion, frame by frame from one proxy (seek-safe); g = the frame minus "Starts at frame"
  const S = Math.round(V.start);
  const maxW = 0.8 * W;
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    // the glow
    const ag = cl((g - 15) / 4) * (1 - cl((g - 139) / 9)), sg = g < 139 ? tab([[15, 0.35], [20, 0.5], [24, 0.62], [28, 0.7], [34, 0.8], [40, 0.9], [48, 1]], g)[0] : 1 - 0.45 * cl((g - 139) / 9);
    glow.style.opacity = String(ag * Number(V.glow) / 100);
    glow.style.transform = `scale(${sg.toFixed(4)})`;
    // the words
    phrases.forEach((p, i) => {
      const st = phraseState(i, g);
      p.el.style.display = st.vis ? "block" : "none";
      if (!st.vis) return;
      const w = p.el.offsetWidth || 1, base = p.probe.offsetTop;
      const fit = Math.min(1, maxW / w), s = st.s * fit;
      const wsc = w * fit, dx = st.dx * K * (p.ex ? Math.max(1, wsc / (p.ex * K)) : 1);
      p.el.style.transform = `translate(${W / 2}px, ${H / 2}px) scale(${s.toFixed(4)}) translate(${dx.toFixed(2)}px, ${((p.by - 640) * K).toFixed(2)}px) translate(${(-w / 2).toFixed(2)}px, ${(-base).toFixed(2)}px)`;
      p.units.forEach((u, k) => {
        const [o, b] = st.w[k] || [1, 0];
        u.style.opacity = o.toFixed(3);
        u.style.filter = b > 0.05 ? `blur(${(b * K).toFixed(2)}px)` : "none";
        if (!u.dataset.solid) {
          const sl = W / 2 + s * (u.offsetLeft - w / 2 + dx);
          u.style.backgroundSize = `${(W / s).toFixed(1)}px 100%`;
          u.style.backgroundPosition = `${(-sl / s).toFixed(1)}px 0px`;
        }
      });
    });
    // the round logo
    if (g >= 148 && g < 174) {
      const ds = tab(DS, g)[0], dr = tab(DR, g)[0];
      disc.style.display = "block";
      disc.style.transform = `translate(${W / 2}px, ${H / 2}px) rotate(${dr.toFixed(2)}deg) scale(${ds.toFixed(4)}) translate(${-D0 / 2}px, ${-D0 / 2}px)`;
    } else disc.style.display = "none";
    // the footage card
    if (g >= 174) {
      const s = tab(CS, g)[0], pr = g >= 187 ? cl((s - 0.99) / 0.93) : 0, th = 23.5 * pr, tx = 28 * pr * K, ty = 29 * pr * K;
      card.style.display = "block";
      card.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) perspective(${PERSP}px) rotateY(${th.toFixed(3)}deg) scale(${s.toFixed(4)})`;
    } else card.style.display = "none";
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 17 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { window.__timelines["main"] = tl; });
</script>
</body>
</html>
