<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "footage_media", "type": "string", "label": "The card: your video or picture, wide 16:9 (empty = a placeholder)", "default": ""},
  {"id": "footage_focus", "type": "string", "label": "What stays in view on the card (x% y%)", "default": "50% 50%"},
  {"id": "top", "type": "string", "label": "Top line, its words wiggle in (*bold* _italic_ ==highlight== ^signal^)", "default": "Make it count"},
  {"id": "middle", "type": "string", "label": "Big word behind the card", "default": "FOCUS"},
  {"id": "bottom", "type": "string", "label": "Bottom line, its words wiggle in (*bold* _italic_ ==highlight== ^signal^)", "default": "One idea at a time"},
  {"id": "top_colour", "type": "enum", "label": "Top line colour", "default": "mustard", "options": [{"value": "mustard", "label": "Mustard"}, {"value": "paper", "label": "Paper"}, {"value": "signal", "label": "Signal"}, {"value": "deep", "label": "Deep"}]},
  {"id": "mid_colour", "type": "enum", "label": "Big word colour (fades into mustard)", "default": "signal", "options": [{"value": "signal", "label": "Signal"}, {"value": "paper", "label": "Paper"}, {"value": "deep", "label": "Deep"}, {"value": "mustard", "label": "Mustard"}]},
  {"id": "bot_colour", "type": "enum", "label": "Bottom line colour", "default": "paper", "options": [{"value": "paper", "label": "Paper"}, {"value": "mustard", "label": "Mustard"}, {"value": "signal", "label": "Signal"}, {"value": "deep", "label": "Deep"}]},
  {"id": "size", "type": "number", "label": "Line text size (px at a 1080-px short side)", "default": 120, "min": 30, "max": 260, "step": 1},
  {"id": "mid_size", "type": "number", "label": "Big word size (px at a 1080-px short side; it shrinks to fit the frame)", "default": 580, "min": 100, "max": 900, "step": 5},
  {"id": "blur", "type": "number", "label": "Motion blur while the card moves (% of the real speed)", "default": 100, "min": 0, "max": 200, "step": 5},
  {"id": "shake", "type": "number", "label": "Handheld camera (0 = steady, 10 = shaky)", "default": 0, "min": 0, "max": 10, "step": 0.5},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 600, "step": 1},
  {"id": "background", "type": "boolean", "label": "Paint the paper behind it (off = see-through, over a video)", "default": true},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "footage-shrink-to-text" (2026-10-22): the user's footage fills the frame, then shrinks (f0-f10, S-curve with a small undershoot back to
     half size by f14, motion blur) to a card in the middle of the frame; a top line of words wiggles in above it (f11,
     f15, f18, each word dropping in and settling), a big word rises behind the card (f25-f31, decelerating), a bottom
     line wiggles up from below (f32, f35, f38); the card holds (f14-f46), then drops out of the bottom of the frame
     (f47-f62, accelerating, blurred) leaving the three texts, which drift a hair to the end. Numbers measured from
     the reference's frames (1280 x 720 units). Look-aware. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #card { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  #mid, #top, #bot { position: absolute; left: 0; top: 0; white-space: nowrap; font-synthesis: none; transform-origin: 50% 50%; }
  #mid { line-height: 1; letter-spacing: -0.02em; }
  #top, #bot { line-height: 1.05; letter-spacing: -0.01em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="mbc" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbcg" stdDeviation="0 0"/></filter>
</defs></svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="3.033333" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"><div id="stage">
    <div id="mid" class="ml-body"></div>
    <div id="top" class="ml-body"></div>
    <div id="bot" class="ml-body"></div>
    <div id="card"></div>
  </div></div>
</div>
<script>
  const FPS = 30, FRAMES = 91;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };
  const S = Math.round(V.start);
  const kx = W / 1280, ky = H / 720;                       // the reference is 1280 x 720: its numbers below are in those units

  // ---- the look: a dark ground (the ink) with a faint lighter middle
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const pick = { ink: L.ink, paper: L.paper, signal: L.signal, deep: L.deep, mustard: L.mustard };
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = `radial-gradient(ellipse at 50% 50%, ${mix(night, glare, 0.12)} 0%, ${mix(night, glare, 0.06)} 45%, ${night} 100%)`;
  const hand = q("hand"), stage = q("stage");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });

  // ---- the card (the user's footage, full frame size; the timeline scales it)
  const card = q("card");
  if (window.MLLook) {
    const t = MLLook.media(card, V.footage_media, { look: L, kind: "video", label: "your footage", fit: "cover", focus: V.footage_focus, seed: 27, r: 0,
      start: S / FPS, duration: Math.max(0.2, (FRAMES - S) / FPS), id: "m1", slot: "footage_media" });
    if (t && t.tagName === "VIDEO") {
      t.setAttribute("data-start", (Math.floor(S / FPS * 1e6) / 1e6).toFixed(6));          // rounded down: never a hair after the frame
      t.setAttribute("data-duration", Math.max(0.2, (FRAMES - S) / FPS).toFixed(4));
    }
  }
  card.style.backgroundColor = L.deep;               // an opaque base: the placeholder's gradient is see-through
  card.style.boxShadow = L.shadow;
  const RR = Math.max(L.radius * 1.3, 14 * U);

  // ---- the three texts
  const fam = V.body_font;
  const mid = q("mid"), topEl = q("top"), bot = q("bot");
  const fsL = V.size * U, fsM = V.mid_size * U;
  const dk = rgba("#000000", 0.55);
  Object.assign(topEl.style, { fontSize: `${fsL}px`, fontWeight: String(fw(fam, 800)), color: pick[V.top_colour] || L.mustard,
    textShadow: `0 ${0.045 * fsL}px 0 ${dk}, 0 ${0.08 * fsL}px ${0.12 * fsL}px ${rgba("#000000", 0.35)}` });
  Object.assign(bot.style, { fontSize: `${fsL}px`, fontWeight: String(fw(fam, 800)), color: pick[V.bot_colour] || glare,
    textShadow: `0 ${0.045 * fsL}px 0 ${rgba(L.mustard, 0.7)}, 0 ${0.09 * fsL}px ${0.12 * fsL}px ${rgba("#000000", 0.4)}` });
  Object.assign(mid.style, { fontSize: `${fsM}px`, fontWeight: String(fw(fam, 900)) });
  const rT = window.MLLook ? MLLook.rich(topEl, V.top, { look: L, family: fam, weight: 800 }) : { words: [] };
  const rB = window.MLLook ? MLLook.rich(bot, V.bottom, { look: L, family: fam, weight: 800 }) : { words: [] };
  const rM = window.MLLook ? MLLook.rich(mid, V.middle, { look: L, family: fam, weight: 900 }) : { words: [] };
  if (!window.MLLook) { topEl.textContent = V.top; bot.textContent = V.bottom; mid.textContent = V.middle; }
  const c1 = pick[V.mid_colour] || L.signal, c2 = V.mid_colour === "mustard" ? L.signal : L.mustard;
  rM.words.forEach(w => { if (w.classList.contains("ml-hl")) return;
    Object.assign(w.style, { backgroundImage: `linear-gradient(180deg, ${c1} 18%, ${c2} 92%)`, webkitBackgroundClip: "text", backgroundClip: "text",
      webkitTextFillColor: "transparent", color: "transparent" }); });
  mid.style.filter = `drop-shadow(0 ${0.016 * fsM}px 0 ${rgba("#000000", 0.4)})`;

  // ---- the measured tables (1280 x 720 units; g = the frame minus "Starts at frame")
  // CS = the card's width as a share of the frame (an S-curve down, a small undershoot, settling at half);
  // CD = how far the card has dropped from its resting place (accelerating)
  const CS = [[0,1],[1,0.9945],[2,0.967],[3,0.927],[4,0.869],[5,0.79],[6,0.69],[7,0.589],[8,0.505],[9,0.459],[10,0.449],[11,0.46],[12,0.477],[13,0.495],[14,0.5]];
  const CD = [[46,0],[47,2],[48,5],[49,11],[50,20],[51,30],[52,46],[53,64],[54,86],[55,116],[56,150],[57,192],[58,244],[59,305],[60,385],[61,490],[62,620],[64,900]];
  let fitL = 1, fitLb = 1, fitM = 1, wT = 1, hT = 1, wB = 1, hB = 1, wM = 1, hM = 1;
  const BL = V.blur / 100;
  const mbcg = q("mbcg");
  // words that drop (dir -1, from above) or rise (dir +1, from below) and settle: a third of the distance left each frame
  const wiggle = (words, a0, gap, off, dir, g) => words.forEach((w, i) => {
    const k = g - (a0 + gap * i);
    if (k < -0.001) { w.style.opacity = "0"; return; }
    const e = Math.pow(1 / 3, k);
    w.style.opacity = String(clamp01((k + 1) / 2).toFixed(3));
    w.style.transform = `translate(0px, ${(dir * off * ky * e).toFixed(2)}px) rotate(${(dir * 7 * e).toFixed(2)}deg)`;
    const b = 7 * U * e; w.style.filter = b > 0.3 ? `blur(${b.toFixed(2)}px)` : "none";
  });

  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    stage.style.visibility = g >= 0 ? "visible" : "hidden";
    if (g < 0) return;
    // the card: shrinks to the middle, holds, then drops out of the bottom
    const s = tab(CS, g)[0], dy = tab(CD, g)[0] * ky;
    const cyc = (357 - 1.5 * clamp01(g / 14)) * ky;
    card.style.transform = `translate(${W / 2}px, ${(cyc + dy).toFixed(2)}px) scale(${s.toFixed(4)}) translate(${-W / 2}px, ${-H / 2}px)`;
    card.style.borderRadius = `${(RR / s).toFixed(2)}px`;
    const sp = Math.abs(tab(CS, g + 0.5)[0] - tab(CS, g - 0.5)[0]) * W, sd = Math.abs(tab(CD, g + 0.5)[0] - tab(CD, g - 0.5)[0]) * ky;
    const bx = 0.028 * sp * BL / s, by = (0.028 * sp + 0.05 * sd) * BL / s;
    if (bx > 0.3 || by > 0.3) { mbcg.setAttribute("stdDeviation", `${bx.toFixed(2)} ${by.toFixed(2)}`); card.style.filter = "url(#mbc)"; } else card.style.filter = "none";
    // the texts
    const dr = clamp01((g - 62) / 28), drift = dr * dr * (3 - 2 * dr);
    topEl.style.transform = `translate(${(0.4975 * W - wT / 2).toFixed(2)}px, ${(0.16 * H - hT / 2).toFixed(2)}px) scale(${(fitL * (1 - 0.02 * drift)).toFixed(4)})`;
    bot.style.transform = `translate(${(0.4975 * W - wB / 2).toFixed(2)}px, ${(0.795 * H - hB / 2).toFixed(2)}px) scale(${(fitLb * (1 - 0.02 * drift)).toFixed(4)})`;
    wiggle(rT.words, 11, 3.5, 48, -1, g);
    wiggle(rB.words, 32, 3, 100, 1, g);
    topEl.style.visibility = g >= 10.5 ? "visible" : "hidden";
    bot.style.visibility = g >= 31.5 ? "visible" : "hidden";
    // the big word rises behind the card, decelerating, out of a blur
    const k = g - 25, e = Math.pow(0.52, Math.max(0, k));
    mid.style.visibility = k >= -0.5 ? "visible" : "hidden";
    if (k >= -0.5) {
      const yc = 357.5 * ky + 0.04 * fsM + 100 * ky * e;
      mid.style.transform = `translate(${(0.5 * W - wM / 2 + 4.5 * kx * drift).toFixed(2)}px, ${(yc - hM / 2).toFixed(2)}px) scale(${(fitM * (0.97 + 0.03 * (1 - e))).toFixed(4)})`;
      mid.style.opacity = String(clamp01(k / 2.5).toFixed(3));
      const bm = 14 * U * 1.5 * e;
      mid.style.filter = `drop-shadow(0 ${0.016 * fsM}px 0 ${rgba("#000000", 0.4)})` + (bm > 0.3 ? ` blur(${bm.toFixed(2)}px)` : "");
    }
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  const hits = V.shake > 0 ? [{ f: S + 27, amount: 3 }] : [];
  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 9, hits });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the texts are
  // measured here, with the real fonts, to fit the frame
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    wT = topEl.offsetWidth; hT = topEl.offsetHeight; wB = bot.offsetWidth; hB = bot.offsetHeight; wM = mid.offsetWidth; hM = mid.offsetHeight;
    fitL = Math.min(1, (W * 0.86) / Math.max(1, wT)); fitLb = Math.min(1, (W * 0.86) / Math.max(1, wB));
    fitM = Math.min(1, (W * 0.943) / Math.max(1, wM));
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
