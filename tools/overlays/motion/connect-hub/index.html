<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "hub", "type": "string", "label": "The hub (letters, an emoji or :claude:)", "default": "⚡"},
  {"id": "nodes", "type": "string", "label": "Around it (| between; letters, emoji, :slack:)", "default": "M|G|S|N|F|D"},
  {"id": "label", "type": "string", "label": "A line under it (empty = none)", "default": "Everything, connected"},
  {"id": "accent", "type": "color", "label": "Hub colour", "default": "#2f6bff"},
  {"id": "line", "type": "color", "label": "Line colour", "default": "#2f6bff"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#f6f7fa"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 1.5, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 45, "min": 0, "max": 100, "step": 1},
  {"id": "gap", "type": "number", "label": "Frames between connections", "default": 12, "min": 2, "max": 120, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script src="assets/logos/logos.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "connect-hub" (0.5.0, the Motion Graphics library): how things plug together - the hub
     pops in the middle, then one node after another appears around it and a dashed curve draws from it to the hub;
     dots of light run along the connected lines, the hub pulses each time one connects. Learned from
     graphics__mcp-animation (app icons joining a central hub with dashed curved lines drawn one after another).
     MotionLab's own code - letters or emoji for the nodes, no app's logo. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .nd { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; line-height: 1; font-synthesis: none; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><svg id="g" class="abs" style="overflow:visible"></svg><div id="nodes" class="abs"></div><div id="lb" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", "Segoe UI Emoji", sans-serif`;
  const q = id => document.getElementById(id);
  const LG = window.MLLogo, say = (b, t, o) => LG ? LG.text(b, t, o) : (b.textContent = t, false);   // ":youtube:" = a logo of the library
  const NS = "http://www.w3.org/2000/svg";

  gsap.set(["#bgfill", "#cam", "#nodes"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, cx = W / 2, cy = H * V.y / 100, hs = 170 * U * s, ns = 110 * U * s, R = W * 0.36 * s;
  const svg = q("g"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const mk = (cls, txt, size, bg, col, rad) => { const e = document.createElement("div"); e.className = "nd"; say(e, txt, { scale: 0.56, dark: LG && LG.isDark(bg) });
    Object.assign(e.style, { width: `${size}px`, height: `${size}px`, borderRadius: rad, background: bg, color: col, font: `800 ${size * 0.42}px ${fam}`,
      boxShadow: `0 ${12 * U}px ${30 * U}px rgba(20,30,60,.16)` }); q("nodes").appendChild(e); return e; };
  const hub = mk("nd", V.hub, hs, V.accent, "#fff", `${hs * 0.28}px`);
  gsap.set(hub, { x: cx - hs / 2, y: cy - hs / 2, transformOrigin: "50% 50%" });
  const halo = document.createElementNS(NS, "rect");
  Object.assign(halo, {}); halo.setAttribute("x", cx - hs * 0.62); halo.setAttribute("y", cy - hs * 0.62); halo.setAttribute("width", hs * 1.24); halo.setAttribute("height", hs * 1.24);
  halo.setAttribute("rx", hs * 0.34); halo.setAttribute("fill", "none"); halo.setAttribute("stroke", V.accent); halo.setAttribute("stroke-width", 4 * U); halo.setAttribute("stroke-dasharray", `${10 * U} ${10 * U}`); halo.setAttribute("opacity", 0);
  svg.appendChild(halo);
  const nodes = String(V.nodes || "").split("|").map(x => x.trim()).filter(Boolean), PAL = ["#f5b400", "#ea4335", "#7c3aed", "#10b981", "#ff7a00", "#0ea5e9"];
  const items = nodes.map((t, i) => {
    const a = (-90 + 360 * i / nodes.length + (i % 2 ? 12 : -8)) * Math.PI / 180, rr = R * (i % 2 ? 1 : 0.86);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 1.25;
    const e = mk("nd", t, ns, "#ffffff", PAL[i % PAL.length], "50%");
    gsap.set(e, { x: x - ns / 2, y: y - ns / 2, transformOrigin: "50% 50%" });
    // a curve from the node to the hub's edge: a bend to one side
    const ex = cx + (x - cx) * 0.18, ey = cy + (y - cy) * 0.18, mx = (x + ex) / 2 + (y - cy) * 0.25 * (i % 2 ? 1 : -1), my = (y + ey) / 2 - (x - cx) * 0.25 * (i % 2 ? 1 : -1);
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", `M${x},${y} Q${mx},${my} ${ex},${ey}`); p.setAttribute("fill", "none");
    p.setAttribute("stroke", V.line); p.setAttribute("stroke-width", 4 * U * s); p.setAttribute("stroke-linecap", "round"); p.setAttribute("opacity", ".7");
    svg.insertBefore(p, halo);
    const dot = document.createElementNS(NS, "circle"); dot.setAttribute("r", 8 * U * s); dot.setAttribute("fill", V.line); dot.setAttribute("opacity", 0); svg.appendChild(dot);
    return { e, p, dot, L: 0 };
  });
  if (V.label) { const lb = q("lb"); lb.textContent = V.label; Object.assign(lb.style, { font: `700 ${46 * U * s}px ${fam}`, color: "#151821" });
    gsap.set(lb, { x: cx, y: cy + R * 1.25 + ns, xPercent: -50 }); }

  // ---- the motion: the hub pops (back.out 14 f) and its dashed halo turns; a node every gap frames pops (10 f) and its
  // dashed curve draws to the hub (14 f, S-curve: drawn as a dash that grows, then switched to dashes); the hub kicks;
  // then dots run along the connected lines (24 f, staggered)
  const S = Math.round(V.start), G = Math.max(K(2), Math.round(V.gap * FPS / 30));
  enter(hub, { opacity: 1, scale: 0, rotation: -20 }, { scale: 1, rotation: 0 }, S, S + K(14), "back.out(2)");
  ft(halo, { attr: { opacity: 0 } }, { attr: { opacity: 0.6 } }, S + K(10), S + K(20), "power1.out");
  ft(halo, { svgOrigin: `${cx} ${cy}`, rotation: 0 }, { rotation: 90 }, S + K(10), FRAMES, "none");
  const ease = gsap.parseEase("power2.inOut");
  items.forEach((it, i) => {
    const f0 = S + K(16) + i * G, L = it.p.getTotalLength();
    enter(it.e, { opacity: 1, scale: 0 }, { scale: 1 }, f0, f0 + K(10), "back.out(2.4)");
    it.p.setAttribute("stroke-dasharray", `${L} ${L}`);
    for (let f = f0 + K(4), N = K(14); f <= f0 + K(4) + N && f < FRAMES; f++) set(it.p, { attr: { "stroke-dashoffset": L * (1 - ease((f - f0 - K(4)) / N)) } }, f);
    if (f0 + K(4) > 0) set(it.p, { attr: { "stroke-dashoffset": L } }, 0);
    set(it.p, { attr: { "stroke-dasharray": `${12 * U} ${10 * U}`, "stroke-dashoffset": 0 } }, f0 + K(19));
    if (f0 + K(26) < FRAMES) { to(hub, { scale: 1.08 }, f0 + K(18), f0 + K(22), "power2.out"); to(hub, { scale: 1 }, f0 + K(22), f0 + K(30), "power2.inOut"); }
    it.L = L; it.done = f0 + K(19);
  });
  const run0 = S + K(16) + items.length * G + K(20);
  items.forEach((it, i) => { for (let f = Math.max(run0, it.done) + i * K(4); f + K(24) < FRAMES; f += K(30)) {
    set(it.dot, { attr: { opacity: 1 } }, f);
    for (let g = f; g <= f + K(24); g += 1) { const pt = it.p.getPointAtLength(it.L * (g - f) / K(24)); set(it.dot, { attr: { cx: pt.x, cy: pt.y } }, g); }
    set(it.dot, { attr: { opacity: 0 } }, f + K(24) + 1);
  } });
  if (V.label) enter("#lb", { opacity: 0, y: cy + R * 1.25 + ns + 20 * U }, { opacity: 1, y: cy + R * 1.25 + ns }, run0 - K(10), run0 + K(4), "power2.out");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
