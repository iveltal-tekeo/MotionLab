<!doctype html>
<html lang="en" data-composition-variables='[

  {"id": "series_a", "type": "string", "label": "First line, one value for each label (| between)", "default": "40|32|38|42|84"},

  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "bar-chart-grow-labels" (2026-10-22): soft translucent bars and two thin axes fade in (f0-f26), the labels come in one after another
     (the values on the left bottom to top f9-f51, the names under the bars left to right f15-f57); a line for the second
     series is drawn along the axis (f24-f51); then the first line (f66-f130) and the second (f124-f198) rise point by
     point, each point on its own S-curve, until they show the data. The first line, the axes, the bars and the labels
     float together a few pixels (the second line stays put) to the end. The values, labels and bar heights are
     settings. Numbers measured from the reference's frames (1280 x 720 units). Look-aware. MotionLab's own code.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #grp, #sb { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #grp > div, #grp > svg, #sb > svg { position: absolute; left: 0; top: 0; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs">
    <div id="grp"><svg id="sa" width="1920" height="1080" style="overflow:visible"></svg></div>
    <div id="sb"><svg width="1920" height="1080" style="overflow:visible"></svg></div>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 300;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };
  const S = Math.round(V.start);
  const K = W / 1280;                                       // the reference is 1280 x 720: its numbers below are in those units
  const pick = { ink: L.ink, paper: L.paper, signal: L.signal, deep: L.deep, mustard: L.mustard };
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const nums = s => String(s == null ? "" : s).split("|").map(x => parseFloat(x)).filter(x => !isNaN(x));
  const labs = String(V.labels || "").split("|").map(x => x.trim()).filter(x => x.length);
  const N = Math.max(2, Math.min(8, labs.length || 5));
  const A = nums(V.series_a), B = nums(V.series_b), BR = nums(V.bars);
  const MAXV = Math.max(1e-6, V.max);

  // ---- the ground: a dark page with red washing in from the left and from the bottom left corner
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = `radial-gradient(ellipse 72% 95% at 0% 100%, ${rgba(L.signal, 0.5)} 0%, ${rgba(L.signal, 0)} 100%), linear-gradient(90deg, ${rgba(L.signal, 0.2)} 0%, ${rgba(L.signal, 0.05)} 60%, ${rgba(L.signal, 0)} 100%), ${night}`;

  // ---- the chart's frame (clip px): the axes cross at (212, 615); the top of the scale is at y = 142; the bars sit between x = 356 and 913
  const OX = 212, OY = 615, YTOP = 100, SY = 473, X1 = 1047, C0 = 356, C1 = 913;
  const cx = i => C0 + (C1 - C0) * (N === 1 ? 0 : i / (N - 1));
  const vy = v => OY - (v / MAXV) * SY;
  const grp = q("grp"), sb = q("sb");
  const mk = (css, parent) => { const d = document.createElement("div"); d.style.position = "absolute"; Object.assign(d.style, css); (parent || grp).insertBefore(d, (parent || grp).querySelector("svg")); return d; };
  const bw = Math.min(97, (C1 - C0) / (N - 1) * 0.7);
  const barEls = [];
  for (let i = 0; i < N; i++) {
    const h = BR.length ? (BR[Math.min(i, BR.length - 1)] / 100) * (OY - YTOP) : 0;
    if (!(h > 0)) continue;
    barEls.push(mk({ left: `${(cx(i) - bw / 2) * K}px`, top: `${(OY - h) * K}px`, width: `${bw * K}px`, height: `${h * K}px`,
      background: `linear-gradient(0deg, ${rgba(glare, 0.4)} 0%, ${rgba(glare, 0.28)} 100%)`, borderRadius: `${Math.min(18 * K, bw * K * 0.2)}px` }));
  }
  const axW = 3 * K;
  const axY = mk({ left: `${OX * K - axW / 2}px`, top: `${YTOP * K}px`, width: `${axW}px`, height: `${(OY - YTOP) * K + axW / 2}px`, background: glare });
  const axX = mk({ left: `${OX * K - axW / 2}px`, top: `${OY * K - axW / 2}px`, width: `${(X1 - OX) * K + axW / 2}px`, height: `${axW}px`, background: glare });
  const tickEls = [];
  for (let i = 0; i < N; i++) tickEls.push(mk({ left: `${cx(i) * K - axW / 2}px`, top: `${(OY - 18) * K}px`, width: `${axW}px`, height: `${18 * K}px`, background: glare }));
  const fam = V.body_font, fs = V.size * U;
  const mkL = (text, align) => { const d = document.createElement("div"); d.className = "lb ml-body"; d.textContent = text;
    Object.assign(d.style, { fontSize: `${fs}px`, fontWeight: String(fw(fam, 400)), color: glare }); grp.insertBefore(d, grp.querySelector("svg")); return d; };
  const yl = [0.25, 0.5, 0.75, 1].map(f => { const v = MAXV * f; return { el: mkL(String(Math.round(v * 100) / 100)), y: vy(v) }; });
  const xl = Array.from({ length: N }, (_, i) => ({ el: mkL(labs[i] || ""), x: cx(i) }));

  // ---- the two lines (an SVG polyline each; round joins and ends)
  const NS = "http://www.w3.org/2000/svg";
  const sa = q("sa"), sbs = sb.querySelector("svg");
  const lw = V.line_w * U;
  const mkLine = (svg, col) => { const p = document.createElementNS(NS, "polyline"); p.setAttribute("fill", "none"); p.setAttribute("stroke", col); p.setAttribute("stroke-width", lw);
    p.setAttribute("stroke-linejoin", "round"); p.setAttribute("stroke-linecap", "round"); svg.appendChild(p); return p; };
  const la = mkLine(sa, pick[V.line_a] || L.paper), lb = mkLine(sbs, pick[V.line_b] || L.signal);
  const defs = document.createElementNS(NS, "defs"); const cp = document.createElementNS(NS, "clipPath"); cp.setAttribute("id", "lbclip");
  const cr = document.createElementNS(NS, "rect"); cr.setAttribute("x", 0); cr.setAttribute("y", 0); cr.setAttribute("height", H); cp.appendChild(cr); defs.appendChild(cp); sbs.appendChild(defs);
  lb.setAttribute("clip-path", "url(#lbclip)");

  // ---- the measured tables (g = the frame minus "Starts at frame")
  const BAR = [[0, 0], [2, 0.07], [6, 0.28], [10, 0.54], [14, 0.76], [18, 0.88], [22, 0.96], [26, 1]];
  const AXO = [[0, 0], [2, 0.1], [4, 0.16], [6, 0.28], [8, 0.42], [10, 0.55], [12, 0.61], [14, 0.69], [16, 0.79], [20, 0.85], [26, 0.95], [32, 1]];
  const YS = [9, 19, 25, 31], XS = [15, 21, 25, 31, 37];                          // when each label starts to fade in (20 f each)
  const HEAD = [[24, 241], [27, 273], [30, 332], [33, 463], [36, 697], [39, 829], [42, 887], [45, 919], [48, 933], [51, 937]];   // the second line's head along the axis
  // each point's rise: start, end (frames) - the first line, then the second; the shape of each is an S-curve
  const RA = [[72, 94, 0.55], [72, 100, 1], [88, 108, 1], [97, 120, 1], [106, 130, 1]];
  const RB = [[126, 154, 1], [134, 170, 1], [148, 172, 1], [158, 188, 1], [164, 198, 1]];
  const FLX = [[0, 4], [10, 4], [20, 5], [30, 9], [40, 14], [50, 20], [60, 23], [70, 22], [80, 18], [90, 11], [100, 7], [110, 4], [120, 3], [130, 3], [140, 5], [150, 8], [160, 9], [170, 11],
               [180, 15], [190, 17], [200, 17], [210, 14], [220, 10], [230, 9], [240, 10], [250, 13], [260, 15], [270, 15], [280, 11], [290, 5], [299, 0]];
  const FLY = [[0, 7], [10, 6], [20, 4], [30, 1], [40, 0], [50, -1], [60, -2], [70, -2], [80, 0], [90, 2], [100, 6], [110, 8], [120, 10], [130, 11], [140, 10], [150, 8], [160, 6], [170, 2],
               [180, -3], [190, -6], [200, -6], [210, -6], [220, -5], [230, -1], [240, 1], [250, 2], [260, 2], [270, 1], [280, 1], [290, 2], [299, 0]];
  const sig = (u, a) => { u = clamp01(u); if (a < 1) return 1 - Math.pow(1 - u, 3); return u * u * (3 - 2 * u); };

  let ready = false;
  function layout() {
    yl.forEach(o => { const w = o.el.offsetWidth, h = o.el.offsetHeight;
      o.el.style.transform = `translate(${(OX - 14) * K - w}px, ${(o.y * K - h / 2).toFixed(2)}px)`; });
    xl.forEach(o => { const w = o.el.offsetWidth, h = o.el.offsetHeight;
      o.el.style.transform = `translate(${(o.x * K - w / 2).toFixed(2)}px, ${((OY + 20) * K).toFixed(2)}px)`; });
    ready = true;
  }
  const pts = (arr, rise, g, x0, ox) => {
    const out = [`${(ox * K).toFixed(2)},${((OY - 1) * K).toFixed(2)}`];
    for (let i = 0; i < N; i++) {
      const v = arr.length ? arr[Math.min(i, arr.length - 1)] : 0;
      const r = rise[Math.min(i, rise.length - 1)] || [999, 1000, 1];
      const e = sig((g - r[0]) / (r[1] - r[0]), r[2]);
      out.push(`${(cx(i) * K).toFixed(2)},${((OY - 1 - (OY - 1 - vy(v)) * e) * K).toFixed(2)}`);
    }
    return out.join(" ");
  };
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    const on = g >= 0;
    grp.style.visibility = sb.style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    const fl = V.float;
    grp.style.transform = `translate(${(tab(FLX, g)[0] * K * fl).toFixed(2)}px, ${(tab(FLY, g)[0] * K * fl).toFixed(2)}px)`;
    const bo = tab(BAR, g)[0], ao = tab(AXO, g)[0];
    barEls.forEach(b => { b.style.opacity = bo.toFixed(3); });
    [axX, axY].concat(tickEls).forEach(e => { e.style.opacity = ao.toFixed(3); });
    yl.forEach((o, i) => { o.el.style.opacity = clamp01((g - YS[i]) / 20).toFixed(3); });
    xl.forEach((o, i) => { o.el.style.opacity = clamp01((g - (i < XS.length ? XS[i] : XS[XS.length - 1] + 6 * (i - XS.length + 1))) / 20).toFixed(3); });
    // the first line (white) rises point by point; the second is drawn along the axis, then rises
    la.setAttribute("points", pts(A, RA, g, 0, OX + 4));
    la.style.visibility = (A.length && g >= 66) ? "visible" : "hidden";
    lb.setAttribute("points", pts(B, RB, g, 0, OX + 10));
    const head = g < 24 ? 0 : (g >= 51 ? 3000 : tab(HEAD, g)[0] * K);
    cr.setAttribute("width", Math.max(0, head).toFixed(2));
    lb.style.visibility = (B.length && g >= 24) ? "visible" : "hidden";
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the labels are measured
  // here, with the real font
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
