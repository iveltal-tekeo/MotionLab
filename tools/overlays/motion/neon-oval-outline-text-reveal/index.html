     clip's measured scroll), each new word sliding in ~100 px; f20-f45 a colour wave runs through the letters
     (front f20-f32, tail f25-f45); f47-f55 the line tilts clockwise to 30 deg; f56 it is replaced by a neon capsule
     (outline gradient left to right) at 1.63x and tilted 41.5 deg, which unwinds exponentially to level and 1.0x
     (x0.86 a frame, f56-f78) while the glow turns from blue to magenta; three rings appear round it (f62, f68, f74);

        c.style.color = p > 0.01 ? mix(FG, WAVE, 0.85 * p) : ""; ci++;
      }));
    }
    // -- part 2: the capsule, the rings, the typed line
    const show2 = g >= 55.5;
    q("sg").style.display = show2 ? "block" : "none";
    l2.style.display = show2 && g >= 80 ? "block" : "none";
    if (show2) {
      const s = g < 78 ? tab(CS, g)[0] : 1, th = g < 83 ? tab(CT, g)[0] : 0, c = g < 80 ? tab(CC, g) : [CX, CY];
      q("grp").setAttribute("transform", `translate(${(c[0] * KR).toFixed(2)} ${(c[1] * KR).toFixed(2)}) rotate(${th.toFixed(2)}) scale(${(KR * s).toFixed(4)})`);
      Object.keys(RO).forEach(id => { const [t0, a] = RO[id]; q(id).setAttribute("opacity", (a * clamp((g - t0) / 1.5)).toFixed(3)); });
      if (g >= 80) {
        const N = P2.chars.length, typed = g < 83 ? 0 : Math.min(N, Math.ceil((g - 83) * N / 25));
        l2.style.transform = `translate(${(CX * KR - 5 * KR).toFixed(2)}px, ${(CY * KR).toFixed(2)}px) translate(-50%, -50%)`;
        P2.chars.forEach((cEl, i) => {
          cEl.style.display = i < typed ? "inline" : "none";
          const tc = 83 + i * 25 / Math.max(1, N);
          const p = clamp(1 - (g - tc) / 12);
          cEl.style.color = (g >= tc && p > 0.01) ? mix(FG, WAVE, 0.85 * p) : "";
        });
        wrapCur.style.opacity = cursorOn(g) ? "1" : "0";
      }
    }
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, t => render(t * FPS)); else render(0);

  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 43 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 113 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font); the two lines are laid out in that wait
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [300, 400, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { build(); render(0); window.__timelines["main"] = tl; });
</script>
