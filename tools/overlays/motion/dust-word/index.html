<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "word", "type": "string", "label": "The big word", "default": "ENERGY"},
  {"id": "top_left", "type": "string", "label": "Small word, top left (empty = none)", "default": "BE"},
  {"id": "top_right", "type": "string", "label": "Small word, top right", "default": "THE"},
  {"id": "bottom", "type": "string", "label": "Small words along the bottom (| between)", "default": "YOU|WANT|TO|ATTRACT"},
  {"id": "mode", "type": "enum", "label": "Motion", "default": "dissolve", "options": [{"value": "dissolve", "label": "Dissolve into dust and come back"}, {"value": "form", "label": "Form out of dust (and stay)"}, {"value": "blow", "label": "Hold, then blow away to the side"}]},
  {"id": "font", "type": "enum", "label": "Font", "default": "Archivo Black", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "color", "type": "color", "label": "Text colour", "default": "#111111"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#ffffff"},
  {"id": "size", "type": "number", "label": "Size (1 = fills the width)", "default": 1, "min": 0.3, "max": 1.3, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 48, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 10, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "dust-word" (0.5.0, the Motion Graphics library): one big word turns to grain - its edge
     breaks up, the grains scatter and thin out - then gathers back (or forms out of dust, or blows away sideways), small
     words framing it at the corners. The dust is an SVG filter (fractal noise thresholded against the letters, a
     displacement that scatters it), its two numbers tweened - the same noise every render. Learned from
     text__energy-text ("ENERGY" breaking into dust and coming back over f17-f59 (00:00:00:17-00:00:02:09) at 25 fps,
     "BE / THE / YOU WANT TO ATTRACT" around it). MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="dust" x="-30%" y="-60%" width="160%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feComponentTransfer in="n" result="m"><feFuncA id="th" type="linear" slope="18" intercept="1"/></feComponentTransfer>
    <feComposite in="SourceGraphic" in2="m" operator="in" result="g"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3" result="w"/>
    <feDisplacementMap id="dm" in="g" in2="w" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="big" class="t"></div><div id="tl" class="t"></div><div id="tr" class="t"></div><div id="bt" class="abs"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const ONE = /^(Anton|Bebas Neue|Archivo Black|Bagel Fat One|Bangers|Lilita One|Luckiest Guy|Pacifico|Permanent Marker|DM Serif Display|Instrument Serif)$/;
  const font = `"${V.font}", "Arial Black", sans-serif`, weight = ONE.test(V.font) ? 400 : 900;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, word = (V.word || "WORD").toUpperCase(), fs = Math.min(W * 0.9 * s / (word.length * 0.72), 320 * U), cy = H * V.y / 100;
  const big = q("big");
  big.textContent = word;
  Object.assign(big.style, { font: `${weight} ${fs}px ${font}`, color: V.color, filter: "url(#dust)" });
  gsap.set(big, { x: W / 2, y: cy, xPercent: -50, yPercent: -50 });
  const sm = 30 * U * s, mx = W * 0.06;
  [["#tl", V.top_left, mx, 0], ["#tr", V.top_right, W - mx, -100]].forEach(([id, t, x, xp]) => {
    q(id.slice(1)).textContent = t || "";
    Object.assign(q(id.slice(1)).style, { font: `600 ${sm}px "Inter", "Segoe UI", sans-serif`, color: V.color, letterSpacing: "0.08em" });
    gsap.set(id, { x, y: cy - fs * 1.1, xPercent: xp });
  });
  const bw = String(V.bottom || "").split("|").map(x => x.trim()).filter(Boolean), bt = q("bt");
  bw.forEach((t, i) => { const e = document.createElement("div"); e.className = "t"; e.textContent = t;
    Object.assign(e.style, { font: `600 ${sm}px "Inter", "Segoe UI", sans-serif`, color: V.color, letterSpacing: "0.08em" }); bt.appendChild(e);
    gsap.set(e, { x: mx + (W - 2 * mx) * (bw.length === 1 ? 0.5 : i / (bw.length - 1)), y: cy + fs * 1.0, xPercent: bw.length === 1 ? -50 : -100 * i / (bw.length - 1) }); });

  // ---- the motion: intercept 1 = solid; it falls to -17 = gone (the grains vanish where the noise is lowest first);
  // the displacement scatters what is left (0 -> 140 px); a slow push-in the whole time
  const S = Math.round(V.start), GO = K(30), BACK = K(30);
  ["#tl", "#tr", "#bt"].forEach((id, i) => enter(id, { opacity: 0 }, { opacity: 1 }, i * K(3), i * K(3) + K(10), "power1.out"));
  if (V.mode === "form") {
    set("#th", { attr: { intercept: -17 } }, 0); set("#dm", { attr: { scale: 140 * U } }, 0);
    to("#th", { attr: { intercept: 1 } }, S, S + BACK, "power2.out");
    to("#dm", { attr: { scale: 0 } }, S, S + BACK, "power3.out");
  } else if (V.mode === "blow") {
    to("#th", { attr: { intercept: -17 } }, S + K(20), S + K(20) + GO, "power1.in");
    to("#dm", { attr: { scale: 200 * U } }, S + K(20), S + K(20) + GO, "power2.in");
    to(big, { x: W / 2 + W * 0.35 }, S + K(20), S + K(20) + GO, "power2.in");
  } else {
    to("#th", { attr: { intercept: -12 } }, S, S + GO, "power1.inOut");
    to("#dm", { attr: { scale: 90 * U } }, S, S + GO, "power2.in");
    const b = S + GO + K(10);
    if (b + BACK <= FRAMES) { to("#th", { attr: { intercept: 1 } }, b, b + BACK, "power2.out"); to("#dm", { attr: { scale: 0 } }, b, b + BACK, "power3.out"); }
  }
  to("#cam", { scale: 1.04 }, 0, FRAMES, "sine.inOut");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
