<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "values", "type": "string", "label": "Slices: name value (| between)", "default": "Filming 45|Editing 30|Sound 15|Posting 10"},
  {"id": "title", "type": "string", "label": "Title (empty = none)", "default": "Where the time goes"},
  {"id": "centre", "type": "string", "label": "Words in the middle (empty = the biggest slice’s %)", "default": ""},
  {"id": "look", "type": "enum", "label": "Look", "default": "donut", "options": [{"value": "donut", "label": "Donut"}, {"value": "pie", "label": "Pie"}]},
  {"id": "unit", "type": "string", "label": "After the numbers", "default": "%"},
  {"id": "palette", "type": "string", "label": "Colours (| between)", "default": "#6366f1|#22d3ee|#f472b6|#fbbf24|#34d399|#fb7185"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Text colour", "default": "#111827"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#f6f7fb"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 2, "step": 0.05},
  {"id": "y", "type": "number", "label": "Chart centre down (% of the height)", "default": 40, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "donut-chart" (0.5.0, the Motion Graphics library): shares of a whole - a donut (or pie)
     whose slices draw in one after another around the circle, each slice's number counting up in the legend as it
     draws; the biggest slice pushes out a little at the end. Not learned from a clip: pie / donut charts are the
     infographic every marketplace's "Infographics" category has (Envato Elements, Videohive; researched 2026-10-16);
     the bar and line charts came from the Swishy clips. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.1; font-synthesis: none; }
  .num::after { content: attr(data-v); }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <svg id="g" class="abs"></svg>
  <div id="txt" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `'${V.font}', 'Segoe UI', sans-serif`;
  const q = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";

  gsap.set(["#bgfill", "#txt"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const svg = q("g"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const s = V.size * U, cx = W / 2, cy = H * V.y / 100, R = 300 * s, donut = V.look !== "pie", sw = donut ? 120 * s : R;
  const pal = String(V.palette || "").split("|").map(x => x.trim()).filter(Boolean);
  const items = String(V.values || "").split("|").map(x => x.trim()).map(x => { const m = x.match(/^(.*?)[\s:]+(-?[\d.,]+)\s*$/); return m ? [m[1].trim(), parseFloat(m[2].replace(",", "."))] : null; }).filter(x => x && x[1] > 0);
  const total = items.reduce((a, b) => a + b[1], 0) || 1, rr = donut ? R - sw / 2 : R / 2, C = 2 * Math.PI * rr;
  const add = (cls, st, html) => { const e = document.createElement("div"); e.className = cls; Object.assign(e.style, st); if (html != null) e.innerHTML = html; q("txt").appendChild(e); return e; };
  const fmt = v => (Math.abs(v - Math.round(v)) < 1e-6 ? String(Math.round(v)) : v.toFixed(1));
  // each slice = a circle stroke (dash = its share), turned to where the slices before it end; drawn from 12 o'clock
  let acc = 0;
  const sl = items.map(([name, v], i) => {
    const share = v / total, col = pal[i % Math.max(1, pal.length)] || "#6366f1";
    const c = document.createElementNS(NS, "circle");
    Object.entries({ cx, cy, r: rr, fill: "none", stroke: col, "stroke-width": sw, "stroke-dasharray": `0 ${C}`, transform: `rotate(${-90 + acc * 360} ${cx} ${cy})` }).forEach(([k, x]) => c.setAttribute(k, x));
    const grp = document.createElementNS(NS, "g"); grp.appendChild(c); svg.appendChild(grp);       // moved as a group: the circle keeps its own turn
    const mid = (acc + share / 2) * 2 * Math.PI - Math.PI / 2;
    acc += share;
    return { name, v, share, col, c, grp, mid };
  });
  // the legend under the chart: a colour dot, the name, the number (counts up while its slice draws)
  const ly = cy + R + 110 * s, rowH = 78 * s;
  sl.forEach((it, i) => {
    const y = ly + i * rowH;
    it.dot = add("abs", { width: `${30 * s}px`, height: `${30 * s}px`, borderRadius: "50%", background: it.col });
    it.lab = add("t", { font: `600 ${44 * s}px ${fam}`, color: V.ink }, it.name.replace(/[&<>]/g, ""));
    it.num = add("t num", { font: `800 ${44 * s}px ${fam}`, color: V.ink, textAlign: "right" });
    it.num.setAttribute("data-v", "0" + V.unit);
    gsap.set(it.dot, { x: W * 0.2, y: y - 15 * s }); gsap.set(it.lab, { x: W * 0.2 + 52 * s, y, yPercent: -50 }); gsap.set(it.num, { x: W * 0.8, y, xPercent: -100, yPercent: -50 });
  });
  const big = sl.reduce((a, b) => (b.v > (a ? a.v : -1) ? b : a), null);
  const ct = add("t num", { font: `900 ${(donut ? 92 : 0) * s}px ${fam}`, color: V.ink });
  ct.setAttribute("data-v", V.centre || (big ? fmt(big.share * 100) + "%" : ""));
  gsap.set(ct, { x: cx, y: cy, xPercent: -50, yPercent: -50 });
  if (!donut) ct.style.display = "none";
  const tt = V.title ? add("t", { font: `800 ${62 * s}px ${fam}`, color: V.ink }, V.title.replace(/[&<>]/g, "")) : null;
  if (tt) gsap.set(tt, { x: cx, y: cy - R - 140 * s, xPercent: -50 });

  // ---- the motion: the title rises (14 f); the slices draw one after another around the circle (each over a time
  // for its share, 60 f in all, S-curve across the whole turn), the legend row's number counting with it; the middle
  // number pops at the end (back.out 12 f) and the biggest slice pushes out 4 % and back
  const S = Math.round(V.start), DR = K(60), T0 = S + K(12), ez = gsap.parseEase("power2.inOut");
  if (tt) enter(tt, { opacity: 0, y: cy - R - 110 * s }, { opacity: 1, y: cy - R - 140 * s }, S, S + K(14), "power3.out");
  let a0 = 0;
  sl.forEach((it, i) => {
    const a1 = a0 + it.share, f0 = T0 + Math.round(DR * ez(a0)), f1 = Math.max(f0 + 2, T0 + Math.round(DR * ez(a1)));
    ft(it.c, { attr: { "stroke-dasharray": `0 ${C}` } }, { attr: { "stroke-dasharray": `${it.share * C} ${C}` } }, f0, f1, "none");
    [it.dot, it.lab, it.num].forEach(e => enter(e, { opacity: 0 }, { opacity: 1 }, f0, f0 + K(8), "power2.out"));
    for (let f = f0; f <= f1; f++) { const v = it.v * Math.min(1, (f - f0 + 1) / (f1 - f0 + 1)); set(it.num, { attr: { "data-v": fmt(v === it.v ? v : Math.round(v)) + V.unit } }, f); }
    a0 = a1;
  });
  const E = T0 + DR;
  if (donut) enter(ct, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1 }, E, E + K(12), "back.out(2)");
  if (big && E + K(24) < FRAMES) {
    const dx = Math.cos(big.mid) * 18 * s, dy = Math.sin(big.mid) * 18 * s;
    to(big.grp, { x: dx, y: dy }, E + K(4), E + K(14), "power2.out");
    to(big.grp, { x: 0, y: 0 }, E + K(30), E + K(42), "power2.inOut");
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
