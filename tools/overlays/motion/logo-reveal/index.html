<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "mark", "type": "string", "label": "Letter(s) in the mark", "default": "M"},
  {"id": "name", "type": "string", "label": "Name under it", "default": "MOTION STUDIO"},
  {"id": "tagline", "type": "string", "label": "Small line (empty = none)", "default": ""},
  {"id": "logo", "type": "string", "label": "Logo instead of the letter: from the library, or your picture (empty = the letter)", "default": ""},
  {"id": "style", "type": "enum", "label": "Motion", "default": "morph", "options": [{"value": "morph", "label": "Morph - a square drops, turns into a circle, the letter appears"}, {"value": "spin", "label": "Spin - the mark spins in and the name rises"}]},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "mark_color", "type": "color", "label": "Mark colour", "default": "#111113"},
  {"id": "letter_color", "type": "color", "label": "Letter colour", "default": "#ffffff"},
  {"id": "text_color", "type": "color", "label": "Name colour", "default": "#111113"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#f7f7f5"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 47, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script src="assets/logos/logos.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "logo-reveal" (0.5.0, the Motion Graphics library): a logo sting. Morph: a rounded square
     drops in, lands with a squash, turns into a circle (its corners round off and it turns a quarter), the letter
     scales up inside it, the name fades up letter-spaced under it. Spin: the mark spins in from small, the name and a
     tagline rise. Learned from logos__logo-reveal (a black rounded square at f1, a circle with a letter at f31
     (00:00:01:06) at 25 fps, the studio name fading in under it at f45) and logos__logo-spin (a dot-grid mark spinning
     in with "Welcome" and a small line under it on navy). MotionLab's own code; the user's own logo picture can stand
     in for the letter, or a logo of the lab's library (tools\logos.py; drawn to stand out on the mark's colour).
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
  #lt { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="shadow" class="abs"></div><div id="mark" class="abs"><div id="lt" class="abs"></div></div>
    <div id="nm" class="t"></div><div id="tg" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 90;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, M = 230 * U * s, cx = W / 2, cy = H * V.y / 100, my = cy - M * 0.75;
  Object.assign(q("mark").style, { width: `${M}px`, height: `${M}px`, background: V.mark_color, borderRadius: `${M * 0.2}px`,
                                   boxShadow: `0 ${18 * U}px ${40 * U}px rgba(0,0,0,.18)` });
  gsap.set("#mark", { x: cx - M / 2, y: my, transformOrigin: "50% 50%" });
  const lt = q("lt");
  gsap.set(lt, { width: M, height: M });
  const LG = window.MLLogo;
  if (V.logo && LG && LG.fill(lt, V.logo, { scale: 0.62, dark: LG.isDark(V.mark_color), tint: V.letter_color })) {
    // a logo of the library or the user's picture, centred in the mark
  } else {
    lt.textContent = V.mark || "";
    Object.assign(lt.style, { font: `800 ${M * (String(V.mark).length > 1 ? 0.36 : 0.5)}px ${fam}`, color: V.letter_color });
  }
  Object.assign(q("shadow").style, { width: `${M * 0.9}px`, height: `${M * 0.14}px`, borderRadius: "50%", background: "rgba(0,0,0,.25)", filter: `blur(${8 * U}px)` });
  gsap.set("#shadow", { x: cx - M * 0.45, y: my + M * 1.08, opacity: 0 });
  q("nm").textContent = V.name || "";
  Object.assign(q("nm").style, { font: `700 ${40 * U * s}px ${fam}`, color: V.text_color, letterSpacing: "0.32em" });
  gsap.set("#nm", { x: cx, y: cy + M * 0.55, xPercent: -50 });
  q("tg").textContent = V.tagline || "";
  Object.assign(q("tg").style, { font: `400 ${30 * U * s}px ${fam}`, color: V.text_color, opacity: 0.55 });
  gsap.set("#tg", { x: cx, y: cy + M * 0.55 + 66 * U * s, xPercent: -50 });

  // ---- the motion (the reference: square f1, circle + letter by f31, the name f45 at 25 fps -> 1, 37, 54 at 30)
  const S = Math.round(V.start);
  if (V.style === "morph") {
    enter("#mark", { opacity: 1, y: my - 420 * U * s, rotation: -12 }, { y: my, rotation: 0 }, S, S + K(12), "power2.in");     // drops
    ft("#mark", { scaleX: 1.18, scaleY: 0.82 }, { scaleX: 1, scaleY: 1 }, S + K(12), S + K(22), "elastic.out(1, 0.45)");    // lands
    ft("#shadow", { opacity: 0.2, scale: 0.4 }, { opacity: 1, scale: 1 }, S, S + K(12), "power2.in");
    ft("#mark", { borderRadius: `${M * 0.2}px`, rotation: 0 }, { borderRadius: `${M / 2}px`, rotation: 90 }, S + K(22), S + K(36), "power3.inOut"); // a circle
    enter("#lt", { opacity: 0, scale: 0.3, rotation: -90 }, { opacity: 1, scale: 1, rotation: -90 }, S + K(30), S + K(42), "back.out(2.4)");
  } else {
    enter("#mark", { opacity: 0, scale: 0.2, rotation: -270 }, { opacity: 1, scale: 1, rotation: 0 }, S, S + K(24), "expo.out");
    ft("#shadow", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1 }, S, S + K(24), "expo.out");
    enter("#lt", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1 }, S + K(10), S + K(24), "power3.out");
  }
  const N0 = S + K(V.style === "morph" ? 40 : 20);
  enter("#nm", { opacity: 0, y: cy + M * 0.55 + 24 * U, letterSpacing: "0.6em" }, { opacity: 1, y: cy + M * 0.55, letterSpacing: "0.32em" }, N0, N0 + K(18), "power3.out");
  if (V.tagline) enter("#tg", { opacity: 0, y: cy + M * 0.55 + 90 * U * s }, { opacity: 0.55, y: cy + M * 0.55 + 66 * U * s }, N0 + K(6), N0 + K(22), "power3.out");
  if (FRAMES - (N0 + K(18)) > K(10)) to("#mark", { scale: 1.03 }, N0 + K(18), FRAMES, "sine.inOut");     // it breathes during the hold
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
