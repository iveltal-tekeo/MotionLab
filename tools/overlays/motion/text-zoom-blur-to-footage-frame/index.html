     scene 2, which starts tiny and tiled, rushes in to 1.74 x in one frame (f71) and settles back to 1 x over ~19
     frames (decelerating, the blur fading) while a line above the footage frame and a big word below are typed

  const all = [];
  function mkGroup(mk) {
    const grp = document.createElement("div"); grp.className = "grp"; hand.appendChild(grp);
    const tiles = document.createElement("div"); tiles.className = "grp"; grp.appendChild(tiles);
    const nb = [];
    for (const j of [-1, 0, 1]) for (const i of [-1, 0, 1]) {
      if (!i && !j) continue;
      const w = document.createElement("div"); w.className = "nb"; w.style.left = `${i * W}px`; w.style.top = `${j * H * 0.8}px`;
      const sc = mk(false, true); w.appendChild(sc.el); tiles.appendChild(w); if (sc.media) sc.media(); nb.push({ w, sc, i, j }); all.push(sc);
    }
    const layers = [];
    const wts = [WMAIN].concat(Array.from({ length: NG }, () => (1 - WMAIN) / NG));
    let cum = 0;
    for (let k = 0; k <= NG; k++) {
      const stg = document.createElement("div"); stg.className = "stg"; grp.appendChild(stg);
      const sc = mk(k === 0); stg.appendChild(sc.el); if (sc.media) sc.media(); all.push(sc);
      cum += wts[k];
      layers.push({ stg, sc, u: k === 0 ? 0 : -0.5 + (k - 0.5) / NG, a: wts[k] / cum });
    }
    return { grp, tiles, nb, layers };
  }
  const G1 = mkGroup(mkS1), G2 = mkGroup(mkS2);
  const tr = sc => `translate(${W / 2}px, ${H / 2}px) scale(${sc.toFixed(4)}) translate(${-W / 2}px, ${-H / 2}px)`;
  function showGroup(G, g, s, beta) {
    const blurOn = beta > 0.02;
    G.layers.forEach((ly, k) => {
      const on = k === 0 || blurOn;
      ly.stg.style.display = on ? "block" : "none";
      if (!on) return;
      ly.stg.style.transform = tr(k === 0 ? s : s * (1 + beta * ly.u));
      ly.stg.style.opacity = blurOn ? ly.a.toFixed(4) : "1";
      ly.sc.upd(g);
    });
    const tilesOn = s < 0.995;
    G.tiles.style.display = tilesOn ? "block" : "none";
    if (tilesOn) {
      G.tiles.style.transform = tr(s);
      const px = Math.max(0.01, beta) * 60 * U / Math.max(0.2, s);
      q("nbxg").setAttribute("stdDeviation", `${px.toFixed(2)} 0`); q("nbyg").setAttribute("stdDeviation", `0 ${px.toFixed(2)}`);
      q("nbzg").setAttribute("stdDeviation", `${(px * 0.8).toFixed(2)} ${(px * 0.8).toFixed(2)}`);
      G.nb.forEach(n => { n.w.style.filter = `url(#${n.i && n.j ? "nbz" : n.i ? "nbx" : "nby"})`; n.sc.upd(g); });
    }
  }

  // ---- the measured tables (g = the frame minus "Starts at frame"); the zoom is around the middle of the frame
  const S1T = [[59, 1], [60, 0.987], [61, 0.98], [62, 0.972], [63, 0.955], [64, 0.935], [65, 0.908], [66, 0.875], [67, 0.83], [68, 0.743], [69, 0.618]];
  const S2T = [[70, 0.5], [71, 1.74], [72, 1.46], [73, 1.30], [74, 1.20], [75, 1.163], [76, 1.126], [77, 1.104], [78, 1.081], [79, 1.067], [80, 1.052],
               [81, 1.037], [82, 1.03], [83, 1.022], [84, 1.015], [86, 1.006], [90, 1.0]];
  const BL = V.blur / 100;
  const rel = (T, gg) => Math.abs(tab(T, gg + 0.5)[0] - tab(T, gg - 0.5)[0]) / Math.max(0.2, tab(T, gg)[0]);
  function render(t) {
    const gg = Math.round(t * FPS * 1000) / 1000 - S;
    const on1 = gg >= 0 && gg < 70, on2 = gg >= 70;
    G1.grp.style.display = on1 ? "block" : "none";
    G2.grp.style.display = on2 ? "block" : "none";
    if (on1) showGroup(G1, gg, tab(S1T, gg)[0], Math.min(0.9, 0.77 * Math.pow(rel(S1T, gg) / 0.18, 1.5) * BL));
    if (on2) showGroup(G2, gg, tab(S2T, gg)[0], Math.min(0.9, 0.77 * Math.pow(rel(S2T, gg) / 0.18, 1.5) * BL));
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5, hits: V.shake > 0 ? [{ f: S + 71, amount: 3 }] : [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 17 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the lines are measured
  // here, with the real fonts, to fit the frame
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    // every group is shown while it is measured
    [G1, G2].forEach(G => { G.grp.style.display = "block"; G.tiles.style.display = "block"; G.layers.forEach(l => { l.stg.style.display = "block"; }); });
    all.forEach(sc => sc.layout());
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
