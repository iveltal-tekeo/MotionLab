<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "text", "type": "string", "label": "Text (*bold* _italic_ ==highlight== ^signal colour^)", "default": "Hot take"},
  {"id": "size", "type": "number", "label": "Text size (px at a 1080-px short side)", "default": 100, "min": 20, "max": 260, "step": 1},

  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},

]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "target-circle-text-pop" (2026-10-22): a retro target around one label. A dot appears left of the centre at f4 while a tiny disc starts at
     the centre; the dot sweeps round as a comet (an orange band with a yellow band trailing 4 frames behind) while
     the disc grows with the label tilted on it, straightening from upright-sideways to level by f40; at f42 the orange
     band closes into a full ring; the yellow ring blinks off at f44 and f48 (the solid-orange flashes) and the whole
     target grows to its full size by f86; then it holds. Measured on the reference: rings at 4 / 8 / 6 fractions of
     the radius, a 15-pictures-a-second step (the "Choppy" setting). Look-aware: ground, colours, fonts and film grain
     come from the look tokens. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #tx { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; letter-spacing: -0.01em; transform-origin: 0 0; }
  svg.fig { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs">
    <svg class="fig" id="fig" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs>
        <filter id="fx" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur id="gb" stdDeviation="0"/></filter>
      </defs>
      <g id="arcs">
        <circle id="oa" cx="960" cy="540" r="10" fill="none" stroke-dasharray="0 9999"/>
        <circle id="oh" r="0"/><circle id="ot" r="0"/>
        <circle id="ya" cx="960" cy="540" r="10" fill="none" stroke-dasharray="0 9999"/>
        <circle id="yh" r="0"/><circle id="yt" r="0"/>
      </g>
      <circle id="disc" cx="960" cy="540" r="0"/>
    </svg>
    <div id="tx" class="ml-body"></div>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, a)).toFixed(3)})`; };
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  // table lookup: rows = [x, v1, v2, ...]; linear between the rows, held outside
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };

  // ---- the look: a dark ground (the ink), a faint paper grid; every colour from the tokens
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const pick = n => n === "signal" ? L.signal : n === "deep" ? L.deep : n === "paper" ? glare : L.mustard;
  const cOuter = pick(V.outer), cRing = pick(V.ring), cText = pick(V.text_colour);
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = night;
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });
  if (V.background && window.MLLook) MLLook.grid(hand, tl, { kind: "flat", U, W, H, look: L, size: 64, color: glare, alpha: 0.06, vignette: false });

  // ---- the geometry, measured on the reference (1280 x 720 px, centre 640,360); K = reference px -> this frame
  const K = 1.5 * U, CX = W / 2, CY = H / 2;
  // outer radius R of the orange band per frame (it sits at 133 from the first frame and grows later)
  const RR = [[4, 133], [16, 133], [18, 136], [20, 137], [22, 138], [24, 139], [26, 141], [28, 143], [30, 145], [32, 148], [34, 151], [36, 155], [38, 160],
    [40, 166], [42, 175], [44, 187], [46, 208], [48, 233], [50, 249], [52, 259], [54, 267], [56, 272], [58, 276], [60, 279], [62, 282], [64, 285],
    [66, 287], [68, 288.5], [70, 290], [72, 291.5], [74, 292.5], [76, 293.5], [80, 294.5], [86, 295]];
  // the centre disc's radius while it catches up with the ring (then it is 0.6 of R)
  const DD = [[4, 2], [6, 5], [8, 13], [10, 25], [12, 41], [14, 57], [16, 70], [18, 80]];
  // the orange band's inner edge as a fraction of R (a dark crescent shows between it and the disc until f22)
  const RI = [[4, 0.68], [18, 0.68], [20, 0.64], [22, 0.6]];
  // orange arc: tail and head angle (degrees, clockwise from the top, unwrapped), caps included in the measure
  const OA = [[4, 250, 250], [6, 252, 256], [8, 252, 264], [10, 256, 276], [12, 264, 304], [14, 272, 344], [16, 284, 408], [18, 300, 468], [20, 304, 512],
    [22, 320, 548], [24, 328, 580], [26, 332, 604], [28, 336, 620], [30, 340, 636], [32, 344, 652], [34, 348, 664], [36, 348, 672], [38, 352, 680], [40, 352, 688]];
  // yellow arc: tail edge, head cap centre; it trails the orange head by about 4 frames
  const YA = [[8, 240, 254], [10, 244, 254], [12, 244, 262], [14, 248, 274], [16, 252, 302], [18, 264, 346], [20, 280, 406], [22, 292, 466], [24, 304, 510],
    [26, 312, 546], [28, 316, 578], [30, 324, 598], [32, 328, 626], [34, 332, 634], [36, 336, 650], [38, 336, 662], [40, 340, 670], [42, 340, 682], [46, 340, 700]];
  // the label: tilt (degrees) and size (fraction of its final size) per frame
  const TX = [[8, -90, 0.055], [10, -88, 0.12], [12, -73, 0.2], [14, -59, 0.27], [16, -49, 0.32], [18, -41, 0.36], [20, -34, 0.4], [22, -29, 0.42], [24, -24, 0.45],
    [26, -20, 0.466], [28, -17, 0.483], [30, -14, 0.5], [32, -12, 0.517], [34, -10, 0.528], [36, -8, 0.542], [38, -7, 0.556], [40, -5, 0.562], [42, -4, 0.62],
    [44, -3, 0.664], [46, -2, 0.74], [48, -2, 0.825], [50, -1, 0.876], [52, -1, 0.915], [54, 0, 0.93], [56, 0, 0.94], [58, 0, 0.944], [60, 0, 0.95], [62, 0, 0.958],
    [64, 0, 0.966], [66, 0, 0.975], [68, 0, 0.98], [70, 0, 0.983], [72, 0, 0.99], [74, 0, 0.994], [78, 0, 0.997], [80, 0, 1]];

  const oa = q("oa"), oh = q("oh"), ot = q("ot"), ya = q("ya"), yh = q("yh"), yt = q("yt"), disc = q("disc"), gb = q("gb"), arcs = q("arcs");
  disc.setAttribute("fill", cOuter);
  oa.setAttribute("stroke", cOuter); oh.setAttribute("fill", cOuter); ot.setAttribute("fill", cOuter);
  ya.setAttribute("stroke", cRing); yh.setAttribute("fill", cRing); yt.setAttribute("fill", cRing);

  // the label: heavy body font, a retro extrusion in a darker shade of its colour
  const tx = q("tx"), fam = V.body_font, FS = V.size * U;
  const dark = mix(cText, "#1a0f08", 0.62);
  const ext = [];
  for (let i = 1; i <= 6; i++) ext.push(`${(i * 0.8 * U).toFixed(2)}px ${(i * 1.0 * U).toFixed(2)}px 0 ${dark}`);
  ext.push(`${(5 * U).toFixed(1)}px ${(12 * U).toFixed(1)}px ${(10 * U).toFixed(1)}px ${rgba("#000000", 0.35)}`);
  Object.assign(tx.style, { fontSize: `${FS}px`, fontWeight: String(fw(fam, 900)), color: cText, textTransform: V.caps ? "uppercase" : "none", textShadow: ext.join(", ") });
  if (window.MLLook) MLLook.rich(tx, V.text, { look: L, family: fam, weight: 900 }); else tx.textContent = V.text;
  const maxW = 0.87 * 2 * 0.6 * 295 * K;
  const finalR = RR[RR.length - 1][1] * K;

  // a ring-shaped arc on a circle: stroke dash from the tail angle, clockwise
  function arc(el, r, w, a0, a1) {
    el.setAttribute("r", r.toFixed(2)); el.setAttribute("stroke-width", w.toFixed(2));
    const sweep = Math.max(0, a1 - a0), C = 2 * Math.PI * r;
    if (sweep >= 359.5) { el.removeAttribute("stroke-dasharray"); el.removeAttribute("transform"); return; }
    el.setAttribute("stroke-dasharray", `${(C * sweep / 360).toFixed(2)} ${(C * 2).toFixed(2)}`);
    el.setAttribute("transform", `rotate(${(a0 - 90).toFixed(2)} ${CX} ${CY})`);
  }
  const pt = (r, a) => [CX + r * Math.sin(a * Math.PI / 180), CY - r * Math.cos(a * Math.PI / 180)];
  const cap = (el, r, a, rad) => { const [x, y] = pt(r, a); el.setAttribute("cx", x.toFixed(2)); el.setAttribute("cy", y.toFixed(2)); el.setAttribute("r", Math.max(0, rad).toFixed(2)); };

  // ---- the motion, frame by frame from one proxy (seek-safe); g = the frame minus "Starts at frame"
  const S = Math.round(V.start);
  function render(t) {
    const g0 = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g0 >= 0 ? "1" : "0";
    if (g0 < 0) return;
    const g = V.choppy ? 2 * Math.floor((g0 + 1e-6) / 2) : g0;
    if (g < 4) { arcs.style.display = "none"; disc.setAttribute("r", "0"); tx.style.visibility = "hidden"; return; }
    arcs.style.display = "";
    const R = tab(RR, g)[0] * K, ri = tab(RI, g)[0];
    // the centre disc
    const dr = g < 18 ? tab(DD, g)[0] * K : 0.6 * R;
    disc.setAttribute("r", Math.max(0, dr).toFixed(2));
    // the orange band: inner edge ri * R, outer edge R
    const wo = R * (1 - ri), ro = R * (1 + ri) / 2;
    let a0, a1;
    if (g >= 42) { a0 = 344; a1 = 704; } else { [a0, a1] = tab(OA, g); }
    arc(oa, ro, wo, a0, a1);
    const full = a1 - a0 >= 359.5;
    cap(oh, ro, a1, full ? 0 : wo / 2); cap(ot, ro, a0, full ? 0 : wo / 2);
    // the yellow band (from f8): 0.61 R .. 0.888 R, a round head, a tail that goes flat from f28
    const blink = (g >= 44 && g < 46) || (g >= 48 && g < 50);
    if (g >= 8 && !blink) {
      const wy = 0.278 * R, ry = 0.749 * R;
      let b0, b1; [b0, b1] = tab(YA, g);
      const yfull = g >= 46;
      if (yfull) b1 = b0 + 360;
      arc(ya, ry, wy, b0, b1);
      cap(yh, ry, b1, yfull ? 0 : wy / 2);
      cap(yt, ry, b0, yfull ? 0 : wy / 2 * Math.max(0, Math.min(1, (34 - g) / 6)));
    } else { arc(ya, 0.749 * R, 0, 0, 0); cap(yh, 0, 0, 0); cap(yt, 0, 0, 0); }
    // a soft blur that follows how fast the arcs sweep
    const sp = Math.abs(tab(OA, g + 1)[1] - tab(OA, g - 1)[1]) / 2;
    const sg = g >= 42 ? 0 : (0.2 + 0.03 * sp) * K;
    if (sg > 0.4) { gb.setAttribute("stdDeviation", sg.toFixed(2)); arcs.setAttribute("filter", "url(#fx)"); } else arcs.removeAttribute("filter");
    // the label: tilted on the disc, growing with it
    if (g >= 8) {
      const [rot, sc] = tab(TX, g), fit = Math.min(1, maxW / Math.max(1, tx.offsetWidth));
      tx.style.visibility = "visible";
      tx.style.transform = `translate(${CX}px, ${(CY - 0.062 * dr).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${(sc * fit).toFixed(4)}) translate(-50%, -50%)`;
    } else tx.style.visibility = "hidden";
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
