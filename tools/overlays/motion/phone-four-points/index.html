<!doctype html>

  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "phone-four-points" (2026-10-18): a column of phones scrolls down like a feed and settles on the middle one (30 f, slow start, long
     settle), which shows the user's video or picture (a media slot, 9:16, cover at a focus point); a progress bar
     fills along its bottom edge; four curly arrows draw out from its sides and four points appear at their ends (two
     right, two left). Look-aware. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #col { position: absolute; left: 0; top: 0; }
  .ph { position: absolute; overflow: hidden; }
  .scr { position: absolute; overflow: hidden; }
  .pt { position: absolute; white-space: nowrap; line-height: 1.05; }
  #arrows { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5.833333" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="grid" class="abs"></div>
  <div id="col"></div>
  <svg id="arrows"></svg>
</div>
<script>
  const FPS = 30, FRAMES = 175;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const bz = (x1, y1, x2, y2) => t => { let s = t; for (let i = 0; i < 8; i++) { const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s - t;
    const d = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2); if (Math.abs(d) < 1e-6) break; s = Math.min(1, Math.max(0, s - x / d)); }
    return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s; };
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const E = window.MLLook ? MLLook.EASE : { enter: "expo.out", exit: "expo.in", move: "expo.inOut" };

  gsap.set("#bgfill", { width: W, height: H, background: V.background ? L.paper : "transparent" });
  if (V.grid) {                                       // the reference's faint grid, in the look's ink
    const g = 60 * U, c = window.MLLook ? MLLook.rgba(L.ink, 0.06) : "rgba(0,0,0,.06)";
    Object.assign(q("grid").style, { width: `${W}px`, height: `${H}px`, backgroundImage:
      `linear-gradient(${c} 1px, transparent 1px), linear-gradient(90deg, ${c} 1px, transparent 1px)`, backgroundSize: `${g}px ${g}px`,
      backgroundPosition: `${(W / 2) % g}px ${(H / 2) % g}px` });
  }

  // ---- the phones: the reference's size (86 % of the height, 9:19.5), a column with a gap of 4 % of the height
  const ph = H * 0.86, pw = ph * 9 / 19.5, gap = H * 0.04, px = (W - pw) / 2, py = (H - ph) / 2, pitch = ph + gap;
  const pr = Math.max(L.radius * 3, 36 * U), bd = 5 * U;
  const col = q("col");
  const phones = [-1, 0, 1, 2].map(k => {
    const p = document.createElement("div"); p.className = "ph";
    Object.assign(p.style, { left: `${px}px`, top: `${py + k * pitch}px`, width: `${pw}px`, height: `${ph}px`, borderRadius: `${pr}px`,
      background: L.ink, boxShadow: L.shadow });
    const s = document.createElement("div"); s.className = "scr";
    Object.assign(s.style, { left: `${bd}px`, top: `${bd}px`, width: `${pw - 2 * bd}px`, height: `${ph - 2 * bd}px`, borderRadius: `${pr - bd}px`,
      background: k === 0 ? L.deep : (window.MLLook ? MLLook.rgba(L.paper, 0.92) : L.paper) });
    p.appendChild(s); col.appendChild(p);
    return { p, s, k };
  });
  const main = phones.find(x => x.k === 0);
  if (window.MLLook) MLLook.media(main.s, V.screen_media, { look: L, kind: "video", label: "your video", fit: "cover", focus: V.focus, seed: 41,
    r: pr - bd, start: 0, duration: FRAMES / FPS, id: "screen-media", slot: "screen_media" });
  // the progress bar along the bottom edge of the screen
  const bar = document.createElement("div");
  Object.assign(bar.style, { position: "absolute", left: "0", bottom: "0", height: `${Math.max(8 * U, ph * 0.035)}px`, width: "100%",
    background: L.signal, transformOrigin: "0% 50%", display: V.progress ? "block" : "none" });
  main.s.appendChild(bar);

  // ---- the points: two right (1 top, 2 bottom), two left (3 bottom, 4 top), each at the end of a curly arrow
  const fs = V.size * U, ys = [H * 0.33, H * 0.67], reach = W * 0.085;
  const pts = [
    { t: V.point1, side: 1, y: ys[0] }, { t: V.point2, side: 1, y: ys[1] },
    { t: V.point3, side: -1, y: ys[1] }, { t: V.point4, side: -1, y: ys[0] }];
  const svg = q("arrows"); svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const NS = "http://www.w3.org/2000/svg", sw = 4 * U;
  pts.forEach((o, i) => {
    const x0 = o.side > 0 ? px + pw + 18 * U : px - 18 * U, x1 = x0 + o.side * reach, y0 = o.y + (i % 3 === 0 ? 34 : -34) * U;
    // a little S: out from the phone, a curl, then level into the point
    const d = `M ${x0} ${y0} C ${x0 + o.side * reach * 0.25} ${y0} ${x0 + o.side * reach * 0.2} ${o.y} ${x0 + o.side * reach * 0.55} ${o.y} L ${x1} ${o.y}`;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d); path.setAttribute("fill", "none"); path.setAttribute("stroke", L.ink); path.setAttribute("stroke-width", sw); path.setAttribute("stroke-linecap", "round");
    const head = document.createElementNS(NS, "path"), hs = 14 * U;
    head.setAttribute("d", `M ${x1 - o.side * hs} ${o.y - hs * 0.7} L ${x1} ${o.y} L ${x1 - o.side * hs} ${o.y + hs * 0.7}`);
    head.setAttribute("fill", "none"); head.setAttribute("stroke", L.ink); head.setAttribute("stroke-width", sw); head.setAttribute("stroke-linecap", "round"); head.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path); svg.appendChild(head);
    const len = Math.abs(x1 - x0) * 1.25 + Math.abs(o.y - y0);
    path.setAttribute("stroke-dasharray", `${len} ${len}`);
    const el = document.createElement("div"); el.className = "pt ml-display"; if (window.MLLook) MLLook.rich(el, o.t, { look: L, family: V.display_font }); else el.textContent = o.t || "";
    Object.assign(el.style, { font: `400 ${fs}px var(--font-display)`, color: L.signal, top: `${o.y - fs * 0.55}px` });
    if (o.side > 0) el.style.left = `${x1 + 16 * U}px`; else el.style.right = `${W - x1 + 16 * U}px`;
    root.appendChild(el);
    Object.assign(o, { path, head, len, el });
  });

  // ---- the motion (30 fps frames; K() keeps them at any rate)
  // 1. the column scrolls down 0.76 of a phone pitch and settles on the middle phone: f0-f30, slow start, long settle
  ft(col, { y: -pitch * 0.76 }, { y: 0 }, 0, K(30), bz(0.45, 0, 0.2, 1));
  // 2. the progress bar fills f44-f66 (S-curve)
  gsap.set(bar, { scaleX: 0 });
  if (V.progress) ft(bar, { scaleX: 0 }, { scaleX: 1 }, K(44), K(66), "power2.inOut");
  // 3. the arrows draw out f80-f90 (decelerating), their heads on the last 3 f; the points rise in f90-f98, 2 f apart
  pts.forEach((o, i) => {
    gsap.set(o.path, { strokeDashoffset: o.len });
    ft(o.path, { strokeDashoffset: o.len }, { strokeDashoffset: 0 }, K(80), K(90), E.enter);
    set(o.head, { opacity: 0 }, 0);
    ft(o.head, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1 }, K(87), K(91), E.enter);
    set(o.el, { opacity: 0 }, 0);
    ft(o.el, { opacity: 0, y: 14 * U, x: -o.side * 10 * U }, { opacity: 1, y: 0, x: 0 }, K(90 + 2 * i), K(100 + 2 * i), E.enter);
  });
  // 4. the hold stays alive: the column drifts a few px (the reference's floating dust does this job)
  to(col, { y: -10 * U }, K(30), FRAMES, "sine.inOut");

  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 41 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
