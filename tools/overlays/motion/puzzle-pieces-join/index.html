     label fades in word by word (f44-f58). A second piece slides in from the right and snaps into the first one's notch
     (f57-f92, the camera pans left and pulls back about 7 % as it joins), its leader and label follow (f84-f116); a third
     one slides in the same way (f112-f149, the camera stays) with its label (f137-f171). The original is stepped:
     eight different pictures in every 15 frames (16 steps a second), which the "stepped" setting keeps. Pieces,

  const P1 = [[8, 455, 640, 21.5], [10, 470, 528, 21], [12, 492, 443, 20.3], [14, 515, 370, 19.5], [15, 533.8, 306, 19], [17, 552.2, 250, 17.8], [19, 570.5, 200, 15.7], [21, 588, 155, 12.9],
    [23, 601, 118, 10.7], [25, 612.4, 88, 8.1], [27, 620.5, 64, 6.4], [29, 626.9, 44, 4.9], [30, 631.8, 28, 3.6], [32, 635, 17, 2.8], [34, 637.4, 9, 1.9], [36, 639.1, 4, 1.1],
    [38, 639.5, 2, 0.9], [40, 639.5, 2, 0.2], [42, 639.5, 0, 0]];
  // how far a piece still has to slide (scene units): the second piece (slides in from f57), the next ones (the same curve a little later)
  const R2 = [[56, 700], [57, 660], [60, 571], [62, 525], [64, 457], [66, 383], [68, 313.5], [70, 253], [72, 202], [74, 158], [75, 123.5], [77, 95], [79, 69], [81, 50], [83, 35], [85, 22], [87, 12], [89, 5], [90, 2], [92, 0]];

  const CAM = [[59, 0], [60, 0.042], [62, 0.126], [64, 0.244], [66, 0.378], [68, 0.496], [70, 0.597], [72, 0.681], [74, 0.756], [75, 0.815], [77, 0.857], [79, 0.899], [81, 0.929], [83, 0.95], [85, 0.975], [87, 0.983], [89, 0.992], [90, 1]];

    // the leaders and labels follow their piece
    lbs.forEach((b, k) => {
      const p = pcs[k], px = x0[k];
      const sx = px + (b.kind === 0 ? 45 : b.kind === 1 ? 112 : b.kind === 2 ? 37.6 : p.w - 112), sy = y0[k] + (b.above ? 0 : BH);
      const prog = k === 0 && g < 42 ? 0 : tab(LP, g - LS(k))[0];
      b.pth.setAttribute("transform", `translate(${sx.toFixed(2)} ${sy.toFixed(2)})`);
      b.pth.setAttribute("stroke-dasharray", `${(prog * 1000).toFixed(1)} 3000`);
      b.pth.style.visibility = (prog > 0.003 && g >= 30) ? "visible" : "hidden";
      const ex = sx + b.end[0], ey = sy + b.end[1];
      const left = b.kind === 0 || b.kind === 3;                  // text on the left of the line's end
      b.lbl.style.left = `${(left ? ex - (b.above ? 29 : 14) * SC : ex + 29 * SC).toFixed(2)}px`;
      b.lbl.style.top = `${(ey + (b.above ? -27 : 5.4) * SC).toFixed(2)}px`;
      b.lbl.style.transform = left ? "translate(-100%, -50%)" : "translate(0, -50%)";
      const gt = g - TS(k);
      b.words.forEach((w, i) => { w.style.opacity = clamp01((gt - 6 * Math.min(i, 3)) / 6).toFixed(3); });
      b.lbl.style.visibility = g >= TS(k) - 1 ? "visible" : "hidden";
    });
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [300, 400, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
