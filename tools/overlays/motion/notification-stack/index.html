<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "n1", "type": "string", "label": "Notification 1 (title | line under it; an emoji or :slack: first)", "default": "✅ Payment received | $2,400 from Sarah"},
  {"id": "n2", "type": "string", "label": "Notification 2 (an emoji or :slack: first)", "default": "📦 Order shipped | Your package is on the way"},
  {"id": "n3", "type": "string", "label": "Notification 3 (empty = none; :slack: first)", "default": "🎉 New milestone! | 1,000 followers"},
  {"id": "n4", "type": "string", "label": "Notification 4 (empty = none; :slack: first)", "default": ""},
  {"id": "n5", "type": "string", "label": "Notification 5 (empty = none; :slack: first)", "default": ""},
  {"id": "when", "type": "string", "label": "Time on each card", "default": "now"},
  {"id": "order", "type": "enum", "label": "Where a new one goes", "default": "bottom", "options": [{"value": "bottom", "label": "Under the others"}, {"value": "top", "label": "On top, pushing the others down"}]},
  {"id": "look", "type": "enum", "label": "Look", "default": "light", "options": [{"value": "light", "label": "Light cards"}, {"value": "glass", "label": "Dark glass (like a lock screen)"}]},
  {"id": "clock", "type": "boolean", "label": "A lock-screen clock above (glass look)", "default": false},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent", "type": "color", "label": "Icon tile colour (no emoji)", "default": "#22c55e"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#f6f7fb"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 2, "step": 0.05},
  {"id": "y", "type": "number", "label": "Top of the stack (% of the height)", "default": 38, "min": 0, "max": 90, "step": 1},
  {"id": "gap", "type": "number", "label": "Frames between notifications", "default": 26, "min": 4, "max": 300, "step": 1},
  {"id": "start", "type": "number", "label": "First one at frame", "default": 4, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script src="assets/logos/logos.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "notification-stack" (0.5.0, the Motion Graphics library): notification cards arrive one
     after another - each slides in from the side and settles (a slow end), the others make room; a buzz-like nudge on
     arrival. Learned from ui-elements__notifications (cards "Payment received / Order shipped / New milestone!" sliding
     in faded from the right at f9-f28 (00:00:00:09-00:00:01:03) at 25 fps and stacking under each other),
     overlays__instagram-update-notification-animation (one dark pill with an app icon and a red badge) and
     app-website__phone-notification-pop-up (a banner on a lock screen). MotionLab's own code - no app's logo.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .card { position: absolute; left: 0; top: 0; display: flex; align-items: center; overflow: hidden; }
  .ic { flex: none; display: flex; align-items: center; justify-content: center; }
  .tx { flex: 1; min-width: 0; }
  .tx div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="clock" class="abs"></div><div id="stack" class="abs"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", "Segoe UI Emoji", sans-serif`;

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  const glass = V.look === "glass";
  const LG = window.MLLogo, say = (b, t, o) => LG ? LG.text(b, t, o) : (b.textContent = t, false);   // ":youtube:" = a logo of the library
  gsap.set("#bgfill", { background: !V.background ? "transparent" : glass ? "linear-gradient(160deg, #3b2b6e, #12182e 55%, #0b0f1c)" : V.bg });
  const s = V.size, cw = W * 0.9 * Math.min(1.05, s), ch = 158 * U * s, gap = 22 * U * s, x0 = (W - cw) / 2, y0 = H * V.y / 100;
  const ink = glass ? "#ffffff" : "#15171c", sub = glass ? "rgba(255,255,255,.72)" : "#6b7280";
  if (glass && V.clock) {
    const c = document.getElementById("clock");
    const d1 = document.createElement("div"), d2 = document.createElement("div");      // (a font name has quotes: set by JS)
    d1.textContent = "Friday, 16 October"; d2.textContent = "9:41";
    Object.assign(d1.style, { font: `400 ${34 * U * s}px ${fam}`, color: "#fff", opacity: 0.85, textAlign: "center" });
    Object.assign(d2.style, { font: `600 ${220 * U * s}px ${fam}`, color: "#fff", textAlign: "center", lineHeight: 1 });
    c.append(d1, d2);
    gsap.set(c, { width: W, y: y0 - 380 * U * s });
  }
  const list = [V.n1, V.n2, V.n3, V.n4, V.n5].map(t => (t || "").trim()).filter(Boolean);
  const stack = document.getElementById("stack");
  const cards = list.map((t, i) => {
    const [logo, rest] = LG ? LG.lead(t) : [null, t];              // ":slack: New message | ..." = the app's logo
    let [title, line] = rest.split("|").map(x => x.trim());
    const m = logo ? null : (title || "").match(/^(\p{Extended_Pictographic}️?|\p{Emoji_Presentation})\s*/u);
    const icon = m ? m[1] : null;
    if (m) title = title.slice(m[0].length);
    const e = document.createElement("div");
    e.className = "card";
    Object.assign(e.style, { width: `${cw}px`, height: `${ch}px`, padding: `0 ${30 * U * s}px`, gap: `${24 * U * s}px`, borderRadius: `${30 * U * s}px`,
      background: glass ? "rgba(255,255,255,.16)" : "#ffffff", boxShadow: glass ? "none" : `0 ${10 * U}px ${30 * U}px rgba(20,24,40,.10)`,
      border: glass ? `1px solid rgba(255,255,255,.18)` : `1px solid rgba(20,24,40,.06)`, backdropFilter: glass ? "blur(12px)" : "none" });
    const ic = document.createElement("div");
    ic.className = "ic";
    const is = 92 * U * s;
    Object.assign(ic.style, { width: `${is}px`, height: `${is}px`, borderRadius: `${20 * U * s}px`,
      background: icon || logo ? (glass ? "rgba(255,255,255,.18)" : "#f1f3f7") : V.accent, font: `${icon ? 400 : 700} ${is * 0.52}px ${fam}`, color: "#fff" });
    if (logo) LG.fill(ic, logo, { scale: 0.64, dark: glass });
    else ic.textContent = icon || "✓";
    const tx = document.createElement("div");
    tx.className = "tx";
    tx.innerHTML = "<div></div><div></div>";
    Object.assign(tx.children[0].style, { font: `700 ${40 * U * s}px ${fam}`, color: ink });
    Object.assign(tx.children[1].style, { font: `400 ${33 * U * s}px ${fam}`, color: sub, marginTop: `${6 * U * s}px` });
    tx.children[0].textContent = title || "";
    tx.children[1].textContent = line || "";
    const wh = document.createElement("div");
    wh.textContent = V.when || "";
    Object.assign(wh.style, { font: `400 ${26 * U * s}px ${fam}`, color: sub, flex: "none", alignSelf: "flex-start", marginTop: `${30 * U * s}px` });
    e.append(ic, tx, wh);
    stack.appendChild(e);
    return e;
  });

  // ---- the motion: card i arrives at f_i (from the right, 16 frames, a slow end); with "on top" the others slide down
  const S = Math.round(V.start), GAP = Math.max(K(4), Math.round(V.gap * FPS / 30)), IN = K(16), n = cards.length;
  const slotY = k => y0 + k * (ch + gap);
  if (glass && V.clock) enter("#clock", { opacity: 0, y: y0 - 380 * U * s - 30 * U }, { opacity: 1, y: y0 - 380 * U * s }, 0, K(14), "power2.out");
  cards.forEach((c, i) => {
    const f0 = S + i * GAP, top = V.order === "top";
    const y = top ? slotY(0) : slotY(i);
    gsap.set(c, { x: x0, y });
    enter(c, { opacity: 0, x: x0 + 110 * U, scale: 0.97 }, { opacity: 1, x: x0, scale: 1 }, f0, f0 + IN, "power3.out");
    // a short buzz as it lands (2 frames each way), like a phone in the hand
    if (f0 + IN + K(6) < FRAMES) { to(c, { x: x0 + 6 * U }, f0 + IN - K(2), f0 + IN, "sine.inOut"); to(c, { x: x0 }, f0 + IN, f0 + IN + K(3), "sine.out"); }
    if (top) for (let j = 0; j < i; j++) to(cards[j], { y: slotY(i - j) }, f0, f0 + K(12), "power3.inOut");
  });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
