<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "look", "type": "enum", "label": "Look", "default": "ring", "options": [{"value": "ring", "label": "Ring - the word repeated around a spinning pinwheel"}, {"value": "ribbon", "label": "Ribbon - words running along a winding band"}, {"value": "wave", "label": "Wave - a wavy band of stacked words scrolling up"}]},
  {"id": "text", "type": "string", "label": "Word(s) (wave: | between the lines)", "default": "brand"},
  {"id": "copies", "type": "number", "label": "Copies around the ring", "default": 14, "min": 4, "max": 40, "step": 1},
  {"id": "font", "type": "enum", "label": "Font", "default": "Archivo Black", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "color", "type": "color", "label": "Text colour", "default": "#ffffff"},
  {"id": "band", "type": "color", "label": "Band colour (ribbon, wave)", "default": "#ffffff"},
  {"id": "band_text", "type": "color", "label": "Text on the band", "default": "#111111"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#000000"},
  {"id": "speed", "type": "number", "label": "Speed (1 = normal)", "default": 1, "min": 0.1, "max": 4, "step": 0.05},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2.5, "step": 0.05},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "word-ring" (0.5.0, the Motion Graphics library): one word, many times, moving along a
     shape. Ring: copies appear one after another around a pinwheel that spins (the reference builds it from the
     middle and keeps turning). Ribbon: a thick band winds across the frame and the words run along it (text on a path,
     its offset moving - a loop). Wave: a wavy band of stacked words scrolls up, each line swinging on its own phase.
     Learned from text__brand-spinning ("brand" repeated around a spinning ring that spirals in), text__funnel-text-
     animation (words running along a winding white ribbon on violet) and text__squiggle-flow-text (a wavy white band of
     stacked words scrolling up on blue). MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .w { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
  .ln { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; text-align: center; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="ring" class="abs"></div><svg id="g" class="abs" style="overflow:visible"></svg><div id="wave" class="abs"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 180;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const ONE = /^(Anton|Bebas Neue|Archivo Black|Bagel Fat One|Bangers|Lilita One|Luckiest Guy|Pacifico|Permanent Marker|DM Serif Display|Instrument Serif)$/;
  const font = `"${V.font}", "Arial Black", sans-serif`, weight = ONE.test(V.font) ? 400 : 900;
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  gsap.set(["#bgfill", "#cam", "#ring", "#wave"], { width: W, height: H });
  const look = V.look, s = V.size, sp = V.speed, S = Math.round(V.start);
  const bgc = V.background ? (look === "ribbon" && V.bg === "#000000" ? "#4f3cf0" : look === "wave" && V.bg === "#000000" ? "#1d34e8" : V.bg) : "transparent";
  gsap.set("#bgfill", { background: bgc });
  if (look === "ring") {
    // copies around the centre, each pointing out like a pinwheel blade; they appear from the first one around
    const n = Math.round(V.copies), R = W * 0.2 * s, fs = 92 * U * s, ring = document.getElementById("ring");
    gsap.set(ring, { transformOrigin: "50% 50%" });
    for (let i = 0; i < n; i++) {
      const e = document.createElement("div"), a = 360 * i / n;
      e.className = "w"; e.textContent = V.text;
      Object.assign(e.style, { font: `${weight} ${fs}px ${font}`, color: V.color });
      ring.appendChild(e);
      gsap.set(e, { x: W / 2, y: H / 2, xPercent: 0, yPercent: -50, rotation: a + 22, transformOrigin: "0% 50%" });
      gsap.set(e, { x: W / 2 + Math.cos((a) * Math.PI / 180) * R, y: H / 2 + Math.sin(a * Math.PI / 180) * R });
      const f0 = S + Math.round(i * K(4) / Math.max(0.3, sp));
      enter(e, { opacity: 1, scale: 0.2 }, { scale: 1 }, f0, f0 + K(12), "back.out(1.8)");
    }
    ft(ring, { rotation: 0 }, { rotation: -60 * sp * (FRAMES - S) / FPS }, S, FRAMES, "none");   // 60 degrees a second
    ft(ring, { scale: 1.25 }, { scale: 1 }, S, S + K(40), "power3.out");
  } else if (look === "ribbon") {
    const svg = document.getElementById("g"); svg.setAttribute("width", W); svg.setAttribute("height", H);
    const bw = 130 * U * s, fs = 62 * U * s;
    const d = `M${-0.1 * W},${0.06 * H} C${0.5 * W},${0.0 * H} ${1.25 * W},${0.12 * H} ${0.75 * W},${0.25 * H} S${0.0 * W},${0.32 * H} ${0.25 * W},${0.48 * H} S${1.1 * W},${0.52 * H} ${0.8 * W},${0.68 * H} S${-0.05 * W},${0.78 * H} ${0.3 * W},${0.9 * H} S${0.9 * W},${1.0 * H} ${1.15 * W},${1.06 * H}`;
    const word = (V.text || "WORD").toUpperCase() + "   ";
    svg.innerHTML = `<path id="rb" d="${d}" fill="none" stroke="${V.band}" stroke-width="${bw}" stroke-linecap="round"/><path id="tp" d="${d}" fill="none"/>
      <text font-family='${font.replace(/'/g, "")}' font-weight="${weight}" font-size="${fs}" fill="${V.band_text}" dominant-baseline="middle" letter-spacing="${fs * 0.06}"><textPath id="tx" href="#tp" startOffset="0">${esc(word.repeat(60))}</textPath></text>`;
    const L = document.getElementById("rb").getTotalLength();
    const rb = document.getElementById("rb");
    rb.setAttribute("stroke-dasharray", `${L} ${L}`);
    ft(rb, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 } }, S, S + K(30), "power2.inOut");
    ft("#tx", { attr: { startOffset: -L * 0.5 } }, { attr: { startOffset: -L * 0.5 - 220 * U * sp * (FRAMES - S) / FPS } }, S, FRAMES, "none");
    const txt = svg.querySelector("text");                 // the words show once the band is half drawn
    set(txt, { opacity: 0 }, 0); set(txt, { opacity: 1 }, S + K(18));
  } else {                                              // wave: lines of words on a band, each swinging, the whole scrolling up
    const words = String(V.text || "WORD").split("|").map(x => x.trim()).filter(Boolean), fs = 96 * U * s, lh = fs * 1.02;
    const total = (FRAMES - S) * lh * 0.08 * sp, n = Math.ceil((H + total) / lh) + 6;
    const wave = document.getElementById("wave"), lines = [];
    for (let i = 0; i < n; i++) {
      const e = document.createElement("div"); e.className = "ln"; e.textContent = words[i % words.length].toUpperCase();
      Object.assign(e.style, { font: `${weight} ${fs}px ${font}`, color: V.band_text, background: V.band, padding: `${fs * 0.04}px ${fs * 0.5}px`, width: `${W * 0.62}px` });
      wave.appendChild(e); lines.push(e);
    }
    // the swing: every line goes left - right - left (half a period each, sine) and starts a little later than the
    // line above it, so the band waves; the whole band scrolls up
    const A = W * 0.13, half = Math.max(K(6), Math.round(K(26) / sp)), cxL = W / 2 - W * 0.31;
    lines.forEach((e, i) => {
      const delay = Math.round((i * half * 0.35) % (2 * half));
      gsap.set(e, { x: cxL - A, y: (i - 3) * lh });
      let f = S - delay, right = true;
      for (; f < FRAMES; f += half, right = !right) {
        const a = Math.max(f, S), b = f + half;
        if (b <= S) continue;
        const p0 = (a - f) / half, x0 = right ? -A + 2 * A * (1 - Math.cos(Math.PI * p0)) / 2 : A - 2 * A * (1 - Math.cos(Math.PI * p0)) / 2;
        ft(e, { x: cxL + x0 }, { x: cxL + (right ? A : -A) }, a, Math.min(FRAMES, b), "sine.inOut");
      }
    });
    ft(wave, { y: 0 }, { y: -total }, S, FRAMES, "none");
    enter(wave, { opacity: 0 }, { opacity: 1 }, S, S + K(10), "power1.out");
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
