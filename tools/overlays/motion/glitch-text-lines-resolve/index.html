<!-- MotionLab motion template "glitch-text-lines-resolve" (2026-10-22): three lines of text stacked down a dark frame, each starting as a blocky glitch bar (a mosaic of
     orange blocks in three rows that follows the shape of its words) and clearing into clean glowing text one after the
     other, 15 frames apart (f15, f30, f45). The whole block drifts on the way (up and to the right on f0-f5, over to
     the left and squashed flat around f41, then back home by f60) and keeps breathing a little sideways to the end; the
     very last frame is empty. Look-aware. MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .ln { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .tx { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.1; font-synthesis: none; letter-spacing: -0.005em; transform-origin: 50% 50%; }
  .cv { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .ch { display: inline-block; }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.033333" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 121;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`; };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${a})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };
  const hash = (f, i, k) => { let h = (Math.imul(f + 3, 374761393) + Math.imul(i + 11, 668265263) + Math.imul(k + 5, 2147483647)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };

  // ---- the look: a near-black ground from the ink; the text in a neon colour
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const neon = V.colour === "mustard" ? L.mustard : V.colour === "paper" ? glare : L.signal;
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = night;
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });

  // ---- the three lines: each has its clean text and a canvas for the glitch bar
  const fam = V.body_font, a = V.glow / 100, Z = W / 1280;
  const glowTxt = `0 0 ${8 * U}px ${rgba(neon, 0.55 * a)}, 0 0 ${22 * U}px ${rgba(neon, 0.42 * a)}, 0 0 ${50 * U}px ${rgba(neon, 0.24 * a)}`;
  const YS = [0.198, 0.4924, 0.7938], RES = [15, 30, 45];
  const LN = [V.text_1, V.text_2, V.text_3].map((txt, k) => {
    const ln = document.createElement("div"); ln.className = "ln";
    Object.assign(ln.style, { left: `${W / 2}px`, top: `${H * YS[k]}px` });
    const cv = document.createElement("canvas"); cv.className = "cv";
    cv.style.filter = `drop-shadow(0 0 ${10 * U}px ${rgba(neon, 0.6 * a)}) drop-shadow(0 0 ${26 * U}px ${rgba(neon, 0.3 * a)})`;
    const tx = document.createElement("div"); tx.className = "tx ml-body";
    Object.assign(tx.style, { fontSize: `${V.size * U}px`, fontWeight: String(fw(fam, 700)), color: neon, textShadow: glowTxt });
    const rr = window.MLLook ? MLLook.rich(tx, txt, { look: L, family: fam, weight: 700 }) : { words: [] };
    if (!window.MLLook) tx.textContent = txt;
    const lets = [];
    rr.words.forEach(w => { const s = w.textContent; w.textContent = "";
      [...s].forEach(ch => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; w.appendChild(sp); lets.push(sp); }); });
    ln.appendChild(cv); ln.appendChild(tx); hand.appendChild(ln);
    return { k, ln, cv, tx, lets };
  });

  // ---- the glitch bar: three rows of blocks, their brightness following where the letters are
  const barH = 0.74 * V.size * U, rh = barH / 3;
  const ver = (id, ph) => { for (let p = ph; p > 0; p--) if (hash(id, p, 5) < 0.16) return p; return 0; };   // a block changes now and then
  function drawBar(o, f) {
    const tw = Math.max(40, o.tx.offsetWidth), bw = Math.round(tw * 0.99), pad = Math.round(barH * 0.9);
    const cv = o.cv, cx = cv.getContext("2d");
    const cw = bw + 2 * pad, chh = Math.round(barH * 1.5);
    if (cv.width !== cw || cv.height !== chh) { cv.width = cw; cv.height = chh; Object.assign(cv.style, { width: `${cw}px`, height: `${chh}px` }); }
    cx.clearRect(0, 0, cw, chh);
    const left = (tw - bw) / 2, ink = o.lets.map(sp => [sp.offsetLeft - left, sp.offsetLeft - left + sp.offsetWidth]);
    const cover = (x0, x1) => { let s = 0; ink.forEach(([p, r]) => { s += Math.max(0, Math.min(x1, r) - Math.max(x0, p)); }); return Math.min(1, 0.9 * s / Math.max(1, x1 - x0)); };
    const ph = Math.floor(f / 2), y0 = (chh - barH) / 2;
    for (let r = 0; r < 3; r++) {
      let x = 0, col = 0;
      while (x < bw - 0.5) {
        const id = o.k * 997 + r * 61 + col, w = Math.min(bw - x, rh * (0.7 + 3.0 * hash(id, 0, 91)));
        const v = hash(id, ver(id, ph), 17), c = cover(x, x + w);
        const t = clamp01(0.16 + 0.74 * c * (0.62 + 0.38 * v) + 0.24 * v);
        cx.fillStyle = mix(night, neon, t);
        cx.fillRect(pad + x, y0 + r * rh, w + 0.6, rh + 0.6);
        x += w; col++;
      }
      // torn lines: thin strips that stick out of the bar's ends on the first frames
      if (f <= 12 && r > 0 && hash(f, o.k * 3 + r, 41) < 0.55) {
        const e0 = pad * (0.1 + 0.6 * hash(f, r, 42)), e1 = pad * (0.1 + 0.6 * hash(f, r, 43));
        cx.fillStyle = mix(night, neon, 0.45);
        cx.fillRect(pad - e0, y0 + r * rh + rh * 0.4, bw + e0 + e1, Math.max(2, rh * 0.16));
      }
    }
  }

  // ---- the motion, frame by frame from one proxy (seek-safe). g = the frame, shifted by "Starts at frame".
  // BLK = how the whole block moves, measured on the reference's lines (1280-px frame): [frame, dx, dy, width, height]
  const BLK = [[0,0,0,0.9998,1],[1,2.5,-4,0.9984,1],[2,4,-7,0.9998,1],[3,5.5,-10.5,1.0012,1],[4,7.5,-13.5,1.0012,1],[5,9,-16,0.9998,1],[6,9.5,-15.5,1.0012,1],[7,9.5,-14.5,1.0012,1],[9,9.5,-14.5,1.0012,1],[10,9,-15.5,0.9998,1],[11,9,-16,0.9998,1],[17,9,-17,0.9998,1],[18,10,-18,0.9998,1],[19,12,-18,0.9998,1],[20,15,-18,0.9998,1],[21,18,-16.5,0.9998,1],[22,22,-15.5,0.9998,1],[23,25,-14,0.9998,1],[24,27.5,-14,1.0012,1],[25,27.5,-14.5,1.0012,1],[26,26.5,-15.5,0.9984,1],[27,26,-16,0.9998,1],[28,25,-16.5,0.9998,1],[29,24.5,-17.5,0.9984,1],[30,24.5,-18,0.9984,1],[31,24,-18,0.9941,1],[32,22,-19,0.9776,0.969],[33,17.5,-20.5,0.9734,0.923],[34,12,-22,0.9721,0.877],[35,7.5,-24,0.9679,0.815],[36,3.5,-25,0.9651,0.785],[37,-1,-26.5,0.9609,0.738],[38,-5,-27.5,0.9581,0.708],[39,-9,-28.5,0.9581,0.677],[40,-12.5,-29,0.9623,0.662],[41,-15.5,-29,0.9651,0.662],[42,-16.5,-28,0.9734,0.692],[43,-16.5,-25.5,0.979,0.769],[44,-15.5,-24,0.9818,0.815],[45,-14.5,-24,0.979,0.815],[46,-14.5,-24,0.979,0.815],[47,-14,-23.5,0.9776,0.831],[48,-14,-23,0.9776,0.846],[49,-13,-22.5,0.9804,0.862],[50,-12.5,-22,0.9846,0.877],[51,-11.5,-21,0.9874,0.908],[52,-9.5,-20,0.9929,0.938],[53,-8,-19,0.9999,0.969],[54,-6.5,-18,1.0069,1],[55,-4,-16.5,1.0138,1],[56,-2,-14,1.0194,1],[57,0,-12,1.0166,1],[58,1.5,-9,1.0124,1],[59,1.5,-4,1.0069,1],[60,0,0.5,1.0055,1],[61,0,0.5,1.0027,1],[62,0,1,1.0027,1],[63,0,1.5,1.0055,1],[66,0,1.5,1.0055,1],[67,-0.5,1.5,1.0041,1],[68,0,1,1.0027,1],[69,-0.5,0.5,1.0069,1],[70,0,0.5,1.0083,1],[71,-0.5,0,1.0069,1],[72,-0.5,0,1.0069,1],[73,0,-0.5,1.0055,1],[74,0.5,-0.5,0.9985,1],[75,0,-0.5,0.9915,1],[76,0.5,-0.5,0.9874,1],[77,0.5,0,0.9846,1],[78,0.5,0,0.9846,1],[79,0.5,0,0.9874,1],[80,0.5,0,0.9902,1],[81,0.5,0,0.9957,1],[82,1,0,0.9999,1],[83,0.5,0,1.0041,1],[84,1,0,1.0083,1],[85,1,0.5,1.011,1],[86,1,0.5,1.0138,1],[88,1,0.5,1.0138,1],[89,1.5,0.5,1.0124,1],[90,2,0,1.011,1],[91,1.5,0,1.0069,1],[92,2,0,1.0027,1],[93,2,0,0.9999,1],[94,2,0,0.9971,1],[95,2.5,0,0.9929,1],[96,2,-0.5,0.9915,1],[97,2,-0.5,0.9888,1],[99,2,-0.5,0.9888,1],[100,2,-1,0.9888,1],[101,1.5,-1,0.9846,1],[102,1,-1,0.9804,1],[104,1,-1.5,0.9804,1],[105,0.5,-1.5,0.9818,1],[106,0.5,-1.5,0.9874,1],[107,0.5,-1.5,0.9929,1],[108,0.5,-1.5,0.9929,1],[109,0,-1,0.9943,1],[110,0,-0.5,0.9943,1],[111,0.5,-0.5,0.9985,1],[112,0,-0.5,1.0027,1],[113,-0.5,0,1.0069,1],[114,-0.5,0,1.0124,1],[115,-0.5,0,1.018,1],[119,-0.5,0,1.018,1]];
  const S = Math.round(V.start), maxW = W * 0.8;
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S, f = Math.floor(g + 1e-4);
    const on = g >= 0 && g < 119.5;                          // the very last frame is empty
    hand.style.opacity = on ? "1" : "0";
    if (!on) return;
    const b = tab(BLK, g);
    LN.forEach(o => {
      const bar = f < RES[o.k];
      o.cv.style.display = bar ? "block" : "none"; o.tx.style.visibility = bar ? "hidden" : "visible";   // hidden, not removed: it is still measured
      const w0 = Math.max(1, o.tx.offsetWidth), fit = Math.min(1, maxW / w0);
      const sy = (bar && f < 32) ? 1 : b[3];
      const tr = `translate(${(b[0] * Z).toFixed(2)}px, ${(b[1] * Z).toFixed(2)}px) translate(-50%, -50%) scale(${(b[2] * fit).toFixed(4)}, ${(sy * fit).toFixed(4)})`;
      if (bar) { drawBar(o, f); o.cv.style.transform = tr; } else o.tx.style.transform = tr;
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 9 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { window.__timelines["main"] = tl; });
</script>
