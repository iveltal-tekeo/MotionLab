     through it and the word shatters. The word is typed one letter every ~2 frames (f2-f19) and shrinks about 9 %
     (f31-f40), then squeezes a little taller and narrower to f79 as the ball's dive nears it. The ball enters from the
     left edge (f16), slows to rest above the word's left end (f49), is thrown up and to the right to rest again
     (f53-f67), winds up (f69-f77) and dives: it passes through the word at f80, which bursts into wedge-shaped
     pieces around the impact point - pieces fly outward at a steady 24 px a frame or so and fall (about 3.8 px a
     frame squared from f81), tilting, the middle pieces fastest - and the ball leaves at the bottom right (f86). The
     frame is empty again from f103 (the clip loops). The ball's and the word's paths are the reference's measured
     ones. Look-aware: the ground, the text and ball colours, the glow, the font and the film grain come from the
     look tokens. MotionLab's own code. Size-independent. -->

    tsp.forEach((sp, i) => sp.setAttribute("fill-opacity", gi >= TT[i] ? "1" : "0"));
    tg.setAttribute("transform", tgT(sxy(Math.min(gi, 79))));
    tg.setAttribute("visibility", gi <= 80 ? "visible" : "hidden");
    const burst = gi >= 81;
    shardLayer.setAttribute("visibility", burst ? "visible" : "hidden");
    if (burst) {
      const tt = g - 80, tg2 = Math.max(0, g - 81);
      cells.forEach(c => {
        const x = c.vx * tt, y = c.vy * tt + 0.5 * GRAV * tg2 * tg2, r = c.w * tt;
        c.outer.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)} ${c.cx.toFixed(2)} ${c.cy.toFixed(2)})`);
      });
    }
    // the ball (copies at moments across the frame: a streak when it is fast)
    const on = g >= 15.5 && g < 88;
    ballG.setAttribute("visibility", on ? "visible" : "hidden");
    if (on) {
      const per = 1 - Math.pow(0.015, 1 / NB), perG = 1 - Math.pow(0.4, 1 / NB);
      balls.forEach((b, i) => {
        const gg2 = g + (i / (NB - 1) - 0.5) * SHUT, [bx, by, bs] = tab(BALL, gg2), r = BR * bs;
        b.disc.setAttribute("cx", bx.toFixed(2)); b.disc.setAttribute("cy", by.toFixed(2)); b.disc.setAttribute("r", r.toFixed(2)); b.disc.setAttribute("opacity", per.toFixed(3));
        b.glow.setAttribute("cx", bx.toFixed(2)); b.glow.setAttribute("cy", by.toFixed(2)); b.glow.setAttribute("r", (r + 34).toFixed(2)); b.glow.setAttribute("opacity", perG.toFixed(3));
      });
    }
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 15 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 41 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font); the word is measured per frame to fit the frame, so it is fitted with the right font
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { render(0); window.__timelines["main"] = tl; });
</script>
