     f28 the pen leaves the dot and draws down and round the right lobe, through the crossing and over the top of the
     left lobe (f28-f71), the camera racing left with it and settling from 1.54x to 1.24x; at f55-f80 the left label
     fades in and at f69-f81 the left dot; the pen waits at the left end (f71-f102) while the camera slides on and the
     soft band fades in (f79-f122); then it draws the bottom of the left lobe and up through the crossing to close the

    el.style.color = FG; el.style.fontSize = `${V.label_size * U}px`;
    const txt = i === 0 ? V.text1 : V.text2;
    if (window.MLLook) MLLook.rich(el, txt, { look: L, family: V.body_font, weight: 500 }); else el.textContent = txt;
  });
  // the labels sit in the lobes beside their dots: the right one ends 27 px short of its dot, the left one starts 22 px after its
  // dot (reference px, at the centre line y = 638); a longer text grows toward the crossing and is fitted to the lobe
  const LAB1 = [576, 638], LAB2 = [121, 638], MAXW = 195 * KR;

  function render(f) {
    const g = (f - S) * 30 / FPS;
    document.getElementById("hand").style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    const c = tab(CAM, g), s = c[0], cx = c[1], cy = c[2];
    cam.setAttribute("transform", `matrix(${KR * s} 0 0 ${KR * s} ${KR * (360 - s * cx)} ${KR * (640 - s * cy)})`);
    // the pen
    if (g < 27.5) ln.setAttribute("display", "none");
    else {
      ln.removeAttribute("display");
      const te = g >= 160.5 ? 2 * Math.PI + 0.05 : tab(TIPROWS, g)[0] - 0.02;
      const Lv = Math.min(LT, arcAt(te)) + (g >= 160.5 ? 40 : 0);
      ln.setAttribute("stroke-dasharray", `${Lv.toFixed(2)} ${(LT + 200).toFixed(2)}`);
    }
    const aR = tab(A_R, g)[0], aL = tab(A_L, g)[0], aT2 = tab(A_T2, g)[0], aB = tab(A_B, g)[0];
    dR.setAttribute("opacity", aR.toFixed(3)); dL.setAttribute("opacity", aL.toFixed(3));
    band.setAttribute("opacity", (aB * V.band / 100).toFixed(3));
    // the labels: fixed in the scene, so they ride the camera
    [[t1, LAB1, aR, -100], [t2, LAB2, aT2, 0]].forEach(([el, p, a, ox]) => {
      const fit = Math.min(1, MAXW / Math.max(1, el.offsetWidth));
      const X = KR * (s * (p[0] - cx) + 360), Y = KR * (s * (p[1] - cy) + 640);
      el.style.opacity = a.toFixed(3);
      el.style.transform = `translate(${X.toFixed(2)}px, ${Y.toFixed(2)}px) scale(${(s * fit).toFixed(4)}) translate(${ox}%, -50%)`;
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, t => render(t * FPS)); else render(0);

  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 17 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 71 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 500, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { render(0); window.__timelines["main"] = tl; });
</script>
