  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},

<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "expanding-title-box" (2026-10-18): a single title in a box that opens from a hairline. A vertical line stands at the centre on the first
     frame; it opens sideways into the box over 38 frames (slow start, long decelerating finish - the reference's
     measured curve, cubic-bezier(0.25, 0, 0.24, 1)) and the title is revealed inside it, clipped by the box's edges;
     then it holds. Look-aware: every colour, font, corner, shadow and the film grain come from the look tokens
     (tools\overlays\motion\_looks). MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #box { position: absolute; overflow: hidden; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); }
  #edge { position: absolute; inset: 0; border-radius: var(--radius); pointer-events: none; }
  #tw { position: absolute; display: flex; align-items: center; justify-content: center; }
  #tt { white-space: nowrap; color: var(--ink); line-height: 1.05; font-synthesis: none; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7.766667" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"><div id="box"><div id="tw"><div id="tt" class="ml-display"></div></div><div id="edge"></div></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 233;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  // a CSS-style cubic-bezier as a GSAP ease (the reference's measured curve)
  const bz = (x1, y1, x2, y2) => t => { let s = t; for (let i = 0; i < 8; i++) { const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s - t;
    const d = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2); if (Math.abs(d) < 1e-6) break; s = Math.min(1, Math.max(0, s - x / d)); }
    return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s; };
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep };

  gsap.set("#bgfill", { width: W, height: H, background: V.background ? L.paper : "transparent" });
  const bw = W * V.box_w / 100, bh = H * V.box_h / 100, bx = (W - bw) / 2, by = (H - bh) / 2;
  const box = q("box"), tw = q("tw"), tt = q("tt"), edge = q("edge");
  Object.assign(box.style, { left: `${bx}px`, top: `${by}px`, width: `${bw}px`, height: `${bh}px` });
  Object.assign(tw.style, { left: "0px", top: "0px", width: `${bw}px`, height: `${bh}px` });   // the words stay put; the box clips them
  edge.style.border = `${V.line_w * U}px solid ${L[V.line] || L.ink}`;
  if (window.MLLook) { MLLook.card(box, L); MLLook.card(edge, L, { shadow: false }); }
  if (window.MLLook) MLLook.rich(tt, V.title, { look: L, family: V.display_font }); else tt.textContent = V.title;
  tt.style.fontSize = `${V.size * U}px`;

  // ---- the motion: a hairline at the centre on the first frame, opening into the box over 38 f with the measured
  // curve; the title is revealed by the box's edges (the words stay where they are, the box clips them)
  const S = Math.round(V.start), OPEN = K(38);
  const lw = Math.max(1, V.line_w * U) * 2;
  if (S > 0) set(box, { opacity: 0 }, 0);
  set(box, { opacity: 1 }, S);
  const st = { p: 0 };
  const draw = () => {
    const w = lw + (bw - lw) * st.p, x = bx + (bw - w) / 2;
    box.style.left = `${x}px`; box.style.width = `${w}px`; tw.style.left = `${bx - x}px`;
  };
  draw();
  ft(st, { p: 0 }, { p: 1, onUpdate: draw }, S, S + OPEN, bz(0.25, 0, 0.24, 1));

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 3 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 11 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
