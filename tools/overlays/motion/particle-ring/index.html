<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "dots", "type": "number", "label": "Dots", "default": 64, "min": 12, "max": 240, "step": 1},
  {"id": "label", "type": "string", "label": "Words in the middle (empty = none)", "default": "loading"},
  {"id": "color", "type": "color", "label": "Dot colour", "default": "#ffffff"},
  {"id": "accent", "type": "color", "label": "Glow when it forms", "default": "#22c55e"},
  {"id": "cycles", "type": "number", "label": "Times it breaks and forms", "default": 2, "min": 1, "max": 6, "step": 1},
  {"id": "font", "type": "enum", "label": "Font", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#000000"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2.5, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 45, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "particle-ring" (0.5.0, the Motion Graphics library): a ring of dots that turns, breaks
     into a cloud of stars drifting across the frame, then pulls back into the ring (glowing as it closes) - a loading
     moment, a transition, a "thinking" beat. Learned from overlays__loading (a ring of dots scattering into stars and
     pulling back into a ring on black, f139-f174 (00:00:05:14-00:00:06:24) at 25 fps). Seeded star places. MotionLab's
     own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .d { position: absolute; left: 0; top: 0; border-radius: 50%; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="glow" class="abs"></div>
  <div id="cam" class="abs"><div id="ring" class="abs"></div><div id="lb" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 210;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };

  gsap.set(["#bgfill", "#glow", "#cam", "#ring"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const n = Math.round(V.dots), s = V.size, cx = W / 2, cy = H * V.y / 100, Rr = 200 * U * s, R = rnd(71);
  Object.assign(document.getElementById("glow").style, { background: `radial-gradient(circle ${Rr * 2.2}px at ${cx}px ${cy}px, ${V.accent}44, transparent 70%)` });
  gsap.set("#glow", { opacity: 0 });
  const dots = [];
  for (let i = 0; i < n; i++) {
    const e = document.createElement("div"), z = (5 + (i % 3) * 2) * U * s; e.className = "d";
    Object.assign(e.style, { width: `${z}px`, height: `${z}px`, background: V.color, boxShadow: `0 0 ${8 * U}px ${V.color}88` });
    document.getElementById("ring").appendChild(e);
    const a = i / n * Math.PI * 2, rx = cx + Math.cos(a) * Rr * (1 + (R() - 0.5) * 0.06) - z / 2, ry = cy + Math.sin(a) * Rr * (1 + (R() - 0.5) * 0.06) - z / 2;
    gsap.set(e, { x: rx, y: ry });
    dots.push({ e, rx, ry, z });
  }
  if (V.label) { const lb = document.getElementById("lb"); lb.textContent = V.label;
    Object.assign(lb.style, { font: `400 ${40 * U * s}px "${V.font}", Consolas, monospace`, color: V.color, letterSpacing: "0.3em", opacity: 0.8 });
    gsap.set(lb, { x: cx, y: cy, xPercent: -50, yPercent: -50 }); }

  // ---- the motion: the ring appears dot by dot (around, 12 f) and turns the whole time; each cycle: hold 20 f, burst
  // into stars (16 f, slow end) that drift (24 f), pull back (20 f, S-curve) with a glow pulse as it closes, hold 16 f
  const S = Math.round(V.start);
  dots.forEach((d, i) => enter(d.e, { opacity: 1, scale: 0 }, { scale: 1 }, S + Math.round(i * K(12) / n), S + Math.round(i * K(12) / n) + K(6), "back.out(2)"));
  ft("#ring", { rotation: 0, transformOrigin: `${cx}px ${cy}px` }, { rotation: 140 }, S, FRAMES, "none");
  if (V.label) { enter("#lb", { opacity: 0 }, { opacity: 0.8 }, S + K(8), S + K(20), "power1.out");
    for (let f = S + K(24), on = true; f + K(14) < FRAMES; f += K(14), on = !on) to("#lb", { opacity: on ? 0.35 : 0.8 }, f, f + K(14), "sine.inOut"); }
  let f = S + K(20) + K(20);
  for (let c = 0; c < Math.round(V.cycles) && f + K(60) < FRAMES; c++) {
    dots.forEach(d => {
      const sx = W * (0.04 + 0.92 * R()) - d.z / 2, sy = H * (0.06 + 0.88 * R()) - d.z / 2, j = Math.round(R() * K(4));
      to(d.e, { x: sx, y: sy, scale: 0.6 + R() * 0.8 }, f + j, f + j + K(16), "expo.out");
      to(d.e, { x: sx + (R() - 0.5) * 60 * U, y: sy - R() * 50 * U }, f + j + K(16), f + K(40), "none");
      to(d.e, { x: d.rx, y: d.ry, scale: 1 }, f + K(40) + j, f + K(60) + j, "power3.inOut");
    });
    ft("#glow", { opacity: 0 }, { opacity: 1 }, f + K(56), f + K(64), "power2.out");
    to("#glow", { opacity: 0 }, f + K(64), Math.min(FRAMES, f + K(80)), "power2.in");
    f += K(60) + K(16);
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
