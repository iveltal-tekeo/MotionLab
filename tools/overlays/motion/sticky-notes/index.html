<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "notes", "type": "string", "label": "Notes (| between; one note each)", "default": "Don’t forget!|Call mom ♥|Buy milk|Post the video|Drink water"},
  {"id": "title", "type": "string", "label": "A label in the middle (empty = none)", "default": ""},
  {"id": "font", "type": "enum", "label": "Handwriting font", "default": "Permanent Marker", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "c1", "type": "color", "label": "Note colour 1", "default": "#fdeb7a"},
  {"id": "c2", "type": "color", "label": "Note colour 2", "default": "#ffa3b8"},
  {"id": "c3", "type": "color", "label": "Note colour 3", "default": "#9cc8ff"},
  {"id": "ink", "type": "color", "label": "Ink", "default": "#2a2a2a"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Board colour", "default": "#eadcc4"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2, "step": 0.05},
  {"id": "gap", "type": "number", "label": "Frames between notes", "default": 12, "min": 2, "max": 120, "step": 1},
  {"id": "fly_off", "type": "boolean", "label": "They fly off at the end", "default": true},
  {"id": "start", "type": "number", "label": "First note at frame", "default": 4, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "sticky-notes" (0.5.0, the Motion Graphics library): handwritten sticky notes slap onto a
     board one after another - each lands tilted with a squash, a strip of tape on top, its words written in; they lift
     a little in a draft during the hold; at the end they peel off and fly away. Learned from
     ui-elements__sticky-notes-animation (yellow, pink and blue notes with handwriting popping onto a beige board and
     falling off) and text__sticky-notes (colourful notes scattered around a label, then flying off). Seeded places.
     MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .note { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; font-synthesis: none; }
  .tape { position: absolute; left: 50%; top: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="board" class="abs"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const hand = `"${V.font}", cursive`;

  gsap.set(["#bgfill", "#cam", "#board"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? `radial-gradient(ellipse at 50% 40%, ${V.bg}, ${V.bg} 55%, #00000022), ${V.bg}` : "transparent" });
  const notes = String(V.notes || "").split("|").map(x => x.trim()).filter(Boolean), s = V.size, ns = 330 * U * s, pal = [V.c1, V.c2, V.c3];
  const R = rnd(37), board = document.getElementById("board"), items = [];
  // places: a loose grid of two columns, jittered, top to bottom
  notes.forEach((t, i) => {
    const col = i % 2, row = Math.floor(i / 2), rows = Math.ceil(notes.length / 2);
    const x = W / 2 + (col ? 1 : -1) * ns * 0.58 + (R() - 0.5) * 60 * U - ns / 2;
    const y = H / 2 - rows * ns * 0.55 + row * ns * 1.08 + (col ? ns * 0.3 : 0) + (R() - 0.5) * 40 * U - ns / 2;
    const rot = (R() - 0.5) * 14;
    const e = document.createElement("div"); e.className = "note";
    Object.assign(e.style, { width: `${ns}px`, height: `${ns}px`, background: `linear-gradient(170deg, ${pal[i % 3]}, ${pal[i % 3]} 70%, #00000014)`, color: V.ink,
      font: `400 ${52 * U * s}px ${hand}`, padding: `${36 * U * s}px`, boxShadow: `0 ${18 * U}px ${30 * U}px rgba(60,40,20,.22)` });
    e.innerHTML = `<span class="w"></span><div class="tape"></div>`;
    e.firstChild.textContent = t;
    Object.assign(e.lastChild.style, { width: `${ns * 0.36}px`, height: `${ns * 0.12}px`, background: "rgba(255,255,255,.55)", transform: `translate(-50%, -45%) rotate(${(R() - 0.5) * 10}deg)` });
    board.appendChild(e);
    gsap.set(e, { x, y, rotation: rot, transformOrigin: "50% 0%" });
    items.push({ e, x, y, rot });
  });
  if (V.title) {
    const tt = document.createElement("div"); tt.className = "note"; tt.textContent = V.title;
    Object.assign(tt.style, { font: `400 ${90 * U * s}px ${hand}`, color: V.ink, padding: `${10 * U}px ${30 * U}px`, background: "#ffffffcc", borderRadius: `${12 * U}px` });
    board.appendChild(tt); gsap.set(tt, { x: W / 2, y: H * 0.12, xPercent: -50 });
    enter(tt, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1 }, 0, K(12), "back.out(2)");
  }

  // ---- the motion: a note every gap frames slaps on (from above, 9 f, then a squash 6 f), the words appear 4 f
  // later; hold: each lifts and settles in a draft; fly off: peel (lift a corner) and away, 3 f apart
  const S = Math.round(V.start), G = Math.max(K(2), Math.round(V.gap * FPS / 30));
  items.forEach(({ e, x, y, rot }, i) => {
    const f0 = S + i * G;
    enter(e, { opacity: 1, y: y - 260 * U, scale: 1.25, rotation: rot - 10 }, { y, scale: 1, rotation: rot }, f0, f0 + K(9), "power3.in");
    to(e, { scaleY: 0.93, scaleX: 1.04 }, f0 + K(9), f0 + K(12), "power2.out");
    to(e, { scaleY: 1, scaleX: 1 }, f0 + K(12), f0 + K(16), "power2.inOut");
    set(e.firstChild, { opacity: 0 }, f0);                                 // the words come a moment after the note
    ft(e.firstChild, { opacity: 0 }, { opacity: 1 }, f0 + K(4), f0 + K(12), "power1.out");
  });
  const done = S + items.length * G + K(16), OUT = V.fly_off ? FRAMES - K(26) : FRAMES;
  items.forEach(({ e, rot }, i) => { for (let f = done + i * K(5), k = 0; f + K(16) < OUT; f += K(16), k++) to(e, { rotation: rot + (k % 2 ? -1.5 : 1.5), skewX: k % 2 ? 1 : -1 }, f, f + K(16), "sine.inOut"); });
  if (V.fly_off && OUT > done) items.forEach(({ e, x, y, rot }, i) => {
    const f0 = OUT + i * K(3), dir = i % 2 ? 1 : -1;
    to(e, { rotation: rot + dir * 18, skewX: dir * 6 }, f0, f0 + K(5), "power2.in");
    to(e, { x: x + dir * W * 0.9, y: y + H * 0.35, rotation: rot + dir * 70 }, f0 + K(5), Math.min(FRAMES, f0 + K(22)), "power2.in");
  });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
