<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "title", "type": "string", "label": "Title (empty = none)", "default": "Views per month"},
  {"id": "values", "type": "string", "label": "Values (| between; a minus = below the line)", "default": "12|28|19|46|64"},
  {"id": "labels", "type": "string", "label": "Labels under the bars (| between)", "default": "JAN|FEB|MAR|APR|MAY"},
  {"id": "suffix", "type": "string", "label": "After each value (K, %, ...)", "default": "K"},
  {"id": "colours", "type": "enum", "label": "Bar colours", "default": "four", "options": [{"value": "four", "label": "Four colours (blue, violet, pink, orange)"}, {"value": "accent", "label": "All in the accent colour"}, {"value": "updown", "label": "Up green, down red"}]},
  {"id": "accent", "type": "color", "label": "Accent colour", "default": "#3b82f6"},
  {"id": "line", "type": "boolean", "label": "A line drawn over the bars", "default": false},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "text_color", "type": "color", "label": "Text colour", "default": "#e8ebf2"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#1e2638"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 1.6, "step": 0.05},
  {"id": "y", "type": "number", "label": "Base line (% of the height)", "default": 62, "min": 10, "max": 95, "step": 1},
  {"id": "stagger", "type": "number", "label": "Frames between bars", "default": 6, "min": 0, "max": 40, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "bar-chart" (0.5.0, the Motion Graphics library): bars grow from the base one after
     another with a slow end, each value counting up on its bar, the labels under them; up / down bars grow from a zero
     line in green / red; an optional line draws across the tops. Learned from graphics__bar-chart (four coloured bars
     on navy, decelerating, measured f31-f36 (00:00:01:06-00:00:01:11) at 25 fps), charts-data__simple-chart (bars
     one after another, a thin line curve drawing over them) and graphics__wins-vs-losses (gainers up green, losers down
     red with their values). MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .bar { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; line-height: 1; font-synthesis: none; }
  .val::after { content: attr(data-v); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="ttl" class="t"></div><div id="zero" class="abs"></div><div id="bars" class="abs"></div>
    <svg id="ln" class="abs" style="overflow:visible"></svg></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const ONE = /^(Anton|Bebas Neue|Archivo Black|Bagel Fat One|Bangers|Lilita One|Luckiest Guy|Pacifico|Permanent Marker|DM Serif Display|Instrument Serif)$/;
  const fam = `"${V.font}", "Segoe UI", sans-serif`, heavy = ONE.test(V.font) ? 400 : 800, mid = ONE.test(V.font) ? 400 : 600;

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const vals = String(V.values).split("|").map(x => parseFloat(x)).filter(x => !isNaN(x));
  const labs = String(V.labels || "").split("|").map(x => x.trim());
  const n = Math.max(1, vals.length), s = V.size;
  const PAL = ["#3b82f6", "#8b5cf6", "#ec4899", "#f59e0b", "#14b8a6", "#ef4444"];
  const colOf = (v, i) => V.colours === "accent" ? V.accent : V.colours === "updown" ? (v >= 0 ? "#22c55e" : "#ef4444") : PAL[i % PAL.length];
  const maxUp = Math.max(0, ...vals), maxDown = Math.max(0, ...vals.map(v => -v));
  const span = H * 0.42 * s, base = H * V.y / 100;
  const hUp = maxUp + maxDown > 0 ? span * maxUp / (maxUp + maxDown) : span;
  const zeroY = maxDown > 0 ? base - span + hUp : base;                     // the zero line: lower when nothing goes down
  const unit = span / Math.max(1e-9, maxUp + maxDown);
  const areaW = W * 0.78 * Math.min(1.15, s), bw = areaW / n * 0.62, step = areaW / n, x0 = (W - areaW) / 2;
  const dec = vals.some(v => Math.round(v) !== v) ? 1 : 0;
  const fmt = v => `${v < 0 ? "-" : ""}${Math.abs(v).toFixed(dec)}${V.suffix || ""}`;
  const ttl = document.getElementById("ttl");
  ttl.textContent = V.title || "";
  Object.assign(ttl.style, { font: `${heavy} ${48 * U * s}px ${fam}`, color: V.text_color });
  gsap.set(ttl, { x: W / 2, y: zeroY - hUp - 150 * U * s, xPercent: -50 });
  Object.assign(document.getElementById("zero").style, { background: V.text_color, opacity: 0.25 });
  gsap.set("#zero", { x: x0 - 20 * U, y: zeroY, width: areaW + 40 * U, height: Math.max(1, 2 * U) });
  const box = document.getElementById("bars"), bars = [];
  vals.forEach((v, i) => {
    const b = document.createElement("div"), val = document.createElement("div"), lab = document.createElement("div");
    b.className = "bar"; val.className = "t val"; lab.className = "t";
    box.append(b, val, lab);
    const h = Math.abs(v) * unit, x = x0 + i * step + (step - bw) / 2, up = v >= 0;
    Object.assign(b.style, { background: colOf(v, i), borderRadius: up ? `${10 * U}px ${10 * U}px ${2 * U}px ${2 * U}px` : `${2 * U}px ${2 * U}px ${10 * U}px ${10 * U}px` });
    gsap.set(b, { x, y: up ? zeroY - h : zeroY, width: bw, height: Math.max(h, 2 * U), transformOrigin: up ? "50% 100%" : "50% 0%" });
    Object.assign(val.style, { font: `${heavy} ${36 * U * s}px ${fam}`, color: V.text_color });
    gsap.set(val, { x: x + bw / 2, y: up ? zeroY - h - 46 * U * s : zeroY + h + 14 * U * s, xPercent: -50 });
    lab.textContent = labs[i] || "";
    Object.assign(lab.style, { font: `${mid} ${28 * U * s}px ${fam}`, color: V.text_color, opacity: 0.6, letterSpacing: "0.06em" });
    gsap.set(lab, { x: x + bw / 2, y: (maxDown > 0 && !up ? zeroY - 40 * U * s : zeroY + 22 * U * s), xPercent: -50 });
    bars.push({ b, val, lab, v, h, x, up });
  });

  // ---- the motion: title, then each bar grows (14 frames, a slow end) with its value counting, labels with it
  const S = Math.round(V.start), G = Math.max(0, Math.round(V.stagger * FPS / 30)), GROW = K(14);
  if (V.title) enter(ttl, { opacity: 0, y: zeroY - hUp - 150 * U * s + 20 * U }, { opacity: 1, y: zeroY - hUp - 150 * U * s }, S, S + K(12), "power2.out");
  ft("#zero", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1 }, S, S + K(12), "power2.inOut");
  const ease = gsap.parseEase("power3.out");
  bars.forEach((B, i) => {
    const f0 = S + K(8) + i * G;
    if (f0 > 0) set(B.b, { scaleY: 0 }, 0);                                // no bar before it grows
    ft(B.b, { scaleY: 0 }, { scaleY: 1 }, f0, f0 + GROW, "power3.out");
    enter(B.lab, { opacity: 0 }, { opacity: 0.6 }, f0, f0 + K(8), "power1.out");
    enter(B.val, { opacity: 0, y: B.up ? zeroY - 46 * U * s : zeroY + 14 * U * s }, { opacity: 1, y: B.up ? zeroY - B.h - 46 * U * s : zeroY + B.h + 14 * U * s }, f0, f0 + GROW, "power3.out");
    for (let f = f0; f <= f0 + GROW && f < FRAMES; f++) set(B.val, { attr: { "data-v": fmt(B.v * ease(Math.min(1, (f - f0) / GROW))) } }, f);
  });
  if (V.line && bars.length > 1) {                       // a thin line through the tops, drawn after the bars land
    const pts = bars.map(B => [B.x + bw / 2, (B.up ? zeroY - B.h : zeroY + B.h) - 70 * U * s]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) { const [a, b] = pts[i - 1], [c, e] = pts[i], m = (a + c) / 2; d += ` C${m},${b} ${m},${e} ${c},${e}`; }
    const svg = document.getElementById("ln");
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.innerHTML = `<path id="lp" d="${d}" fill="none" stroke="${V.text_color}" stroke-width="${4 * U}" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>`;
    const fl = S + K(8) + bars.length * G + GROW;
    ft("#lp", { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 } }, fl, fl + K(24), "power2.inOut");
  }
  const hold = S + K(8) + bars.length * G + GROW + K(4);                    // the hold: the bars breathe a little
  if (FRAMES - hold > K(20)) bars.forEach((B, i) => to(B.b, { scaleY: 0.97 + 0.03 * ((i % 2) ? 1 : 0) }, hold, FRAMES, "sine.inOut"));
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
