<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "look", "type": "enum", "label": "Look", "default": "circle", "options": [{"value": "circle", "label": "Circle - bars around a round picture"}, {"value": "bars", "label": "Bars - a row of bars"}, {"value": "wave", "label": "Wave - a glowing line"}]},
  {"id": "bpm", "type": "number", "label": "Beats a minute (beats.py gives a song’s)", "default": 120, "min": 40, "max": 220, "step": 0.1},
  {"id": "offset", "type": "number", "label": "First beat at frame", "default": 4, "min": 0, "max": 600, "step": 1},
  {"id": "count", "type": "number", "label": "Bars", "default": 48, "min": 8, "max": 128, "step": 1},
  {"id": "color", "type": "color", "label": "Colour", "default": "#22d3ee"},
  {"id": "color2", "type": "color", "label": "Second colour (gradient)", "default": "#a855f7"},
  {"id": "picture", "type": "string", "label": "Picture in the middle, in the graphic’s assets folder (empty = colour)", "default": ""},
  {"id": "title", "type": "string", "label": "Song / episode title (empty = none)", "default": "Episode 12 · The edit"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 45, "min": 0, "max": 100, "step": 1},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2.5, "step": 0.05},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#0b0b14"},
  {"id": "seed", "type": "number", "label": "Pattern (any number)", "default": 7, "min": 0, "max": 9999, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "audio-bars" (0.5.0, the Motion Graphics library): an audio visualizer for music and
     podcasts - bars around a round picture, a row of bars, or a glowing wave - jumping on every beat of the tempo you
     set (each bar its own height: more in the lows, a bigger hit on the downbeat, a smaller one between beats) and
     falling back; the picture pulses on the downbeats. It follows a tempo, not the sound itself: give it the song's BPM
     and first beat (tools\beats.py). Not learned from a clip: audio visualizers are a main category on Mixkit (researched
     2026-10-16). MotionLab's own code. Seeded, size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .b { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.1; font-synthesis: none; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="vis" class="abs"></div>
  <svg id="wv" class="abs"></svg>
  <div id="pic" class="abs"></div>
  <div id="tt" class="t"></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const fam = `'${V.font}', 'Segoe UI', sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#vis"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? `radial-gradient(circle at 50% ${V.y}%, ${V.color2}22, transparent 55%), ${V.bg}` : "transparent" });
  const R = rnd(1000 + Math.round(V.seed)), s = V.size * U, n = Math.round(V.count), cy = H * V.y / 100, cx = W / 2, look = V.look;
  const shape = i => 0.35 + 0.65 * Math.exp(-Math.pow(i / Math.max(1, n - 1) - 0.25, 2) / 0.09);  // more in the lows
  const mix = (a, b, t) => { const h = x => [1, 3, 5].map(k => parseInt(x.slice(k, k + 2), 16)); const A = h(a), B = h(b); return `rgb(${A.map((v, k) => Math.round(v + (B[k] - v) * t)).join(",")})`; };
  // the beats: every 60 / bpm seconds from `offset`, every 4th a downbeat; the 8ths between them are small hits
  const step = FPS * 60 / Math.max(1, V.bpm), beats = [];
  for (let b = 0, f = Math.round(V.offset); f < FRAMES; b++, f = Math.round(V.offset + b * step)) beats.push({ f, down: b % 4 === 0, half: Math.round(f + step / 2) });
  const levels = () => Array.from({ length: n }, (_, i) => shape(i) * (0.55 + 0.45 * R()));
  const bars = [];
  const R0 = 220 * s, BL = look === "circle" ? 190 * s : 520 * s, bw = look === "circle" ? Math.max(3, (2 * Math.PI * R0 / n) * 0.55) : (W * 0.86 / n) * 0.62;
  if (look !== "wave") for (let i = 0; i < n; i++) {
    // a holder placed (and turned, around the ring's centre) once; the bar inside grows from its own foot
    const hold = document.createElement("div"); hold.className = "b"; q("vis").appendChild(hold);
    const e = document.createElement("div"); e.className = "b"; hold.appendChild(e);
    const c = mix(V.color, V.color2, i / Math.max(1, n - 1));
    Object.assign(hold.style, { width: `${bw}px`, height: `${BL}px` });
    Object.assign(e.style, { width: `${bw}px`, height: `${BL}px`, borderRadius: `${bw / 2}px`, background: c, boxShadow: `0 0 ${10 * s}px ${c}` });
    if (look === "circle") {
      const a = i / n * 360;                                // each bar stands on the ring, growing outwards
      gsap.set(hold, { x: cx - bw / 2, y: cy - R0 - BL, rotation: a, transformOrigin: `50% ${BL + R0}px` });
    } else gsap.set(hold, { x: W * 0.07 + (W * 0.86 / n) * (i + 0.19), y: cy - BL });
    gsap.set(e, { scaleY: 0.08, transformOrigin: "50% 100%" });
    bars.push(e);
  }
  // the wave: a line through n points whose heights jump on the beats (the same number of points in every shape, so
  // GSAP tweens the path's numbers); a soft copy under it for the glow
  const svg = q("wv"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const wpath = lv => { const x0 = W * 0.06, x1 = W * 0.94; let d = `M${x0},${cy}`;
    for (let i = 0; i < n; i++) { const x = x0 + (x1 - x0) * (i + 0.5) / n, a = lv[i] * 260 * s * (i % 2 ? -1 : 1); d += ` Q${x},${cy + a} ${x + (x1 - x0) / n / 2},${cy}`; } return d; };
  let waves = [];
  if (look === "wave") {
    const NS = "http://www.w3.org/2000/svg", gid = "wg" + Math.round(V.seed);
    svg.innerHTML = `<defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="${V.color}"/><stop offset="1" stop-color="${V.color2}"/></linearGradient></defs>`;
    waves = [[14, 0.35], [5, 1]].map(([w, o]) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", wpath(Array(n).fill(0.04)));
      p.setAttribute("fill", "none"); p.setAttribute("stroke", `url(#${gid})`); p.setAttribute("stroke-width", w * s); p.setAttribute("stroke-linecap", "round"); p.setAttribute("opacity", o);
      if (w > 10) p.setAttribute("filter", "blur(6px)"); svg.appendChild(p); return p; });
  }
  // the middle: a round picture (circle look) and the title
  const pic = q("pic");
  if (look === "circle") {
    const d = R0 * 1.62;
    Object.assign(pic.style, { width: `${d}px`, height: `${d}px`, borderRadius: "50%", border: `${6 * s}px solid ${V.color}`,
      background: V.picture ? `center / cover url("${String(V.picture).replace(/"/g, "")}")` : `linear-gradient(135deg, ${V.color}, ${V.color2})`, boxShadow: `0 0 ${40 * s}px ${V.color2}88` });
    gsap.set(pic, { x: cx - d / 2, y: cy - d / 2, transformOrigin: "50% 50%" });
  } else pic.style.display = "none";
  if (V.title) { const tt = q("tt"); tt.textContent = V.title;
    Object.assign(tt.style, { font: `700 ${48 * s}px ${fam}`, color: "#ffffff", textShadow: `0 0 ${20 * s}px ${V.color2}` });
    gsap.set(tt, { x: cx, y: look === "circle" ? cy + R0 + BL + 60 * s : cy + (look === "bars" ? 60 * s : 330 * s), xPercent: -50 }); }

  // ---- the motion: on each beat every bar jumps to its level in 2 f (slow end) and falls back over the beat
  // (power2.out); downbeats hit 100 %, the other beats 80 %, the 8th between them 45 %; the picture pulses 6 % on
  // the downbeats; everything fades in over the first 8 f
  ft("#root", { opacity: 0 }, { opacity: 1 }, 0, K(8), "power1.out");
  beats.forEach((b, k) => {
    const next = k + 1 < beats.length ? beats[k + 1].f : FRAMES, hits = [[b.f, b.down ? 1 : 0.8]];
    if (b.half - b.f >= K(4) && b.half < next) hits.push([b.half, 0.45]);
    hits.forEach(([f, amp], j) => {
      const until = j + 1 < hits.length ? hits[j + 1][0] : next, lv = levels().map(v => v * amp), up = Math.min(f + K(2), until);
      if (bars.length) bars.forEach((e, i) => { to(e, { scaleY: Math.max(0.08, lv[i]) }, f, up, "power2.out"); if (until - up >= 2) to(e, { scaleY: 0.1 + 0.08 * R() }, up, until, "power2.out"); });
      else waves.forEach(p => { to(p, { attr: { d: wpath(lv) } }, f, up, "power2.out"); if (until - up >= 2) to(p, { attr: { d: wpath(lv.map(v => v * 0.15)) } }, up, until, "power2.out"); });
    });
    if (look === "circle" && b.down) { to(pic, { scale: 1.06 }, b.f, Math.min(next, b.f + K(3)), "power2.out"); to(pic, { scale: 1 }, Math.min(next, b.f + K(3)), Math.min(next, b.f + K(14)), "power2.inOut"); }
  });
  if (look === "circle") ft("#vis", { rotation: 0, transformOrigin: `${cx}px ${cy}px` }, { rotation: 12 }, 0, FRAMES, "none");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
