<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "what", "type": "enum", "label": "What falls", "default": "money", "options": [{"value": "money", "label": "Coins and notes"}, {"value": "confetti", "label": "Confetti"}, {"value": "hearts", "label": "Hearts"}, {"value": "stars", "label": "Stars"}]},
  {"id": "amount", "type": "number", "label": "How many at once", "default": 46, "min": 4, "max": 160, "step": 1},
  {"id": "speed", "type": "number", "label": "Speed (1 = normal)", "default": 1, "min": 0.2, "max": 4, "step": 0.05},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "glow", "type": "boolean", "label": "Some of them glow", "default": true},
  {"id": "c1", "type": "color", "label": "Colour 1 (coins / confetti)", "default": "#f6c344"},
  {"id": "c2", "type": "color", "label": "Colour 2 (notes / confetti)", "default": "#7fc98f"},
  {"id": "c3", "type": "color", "label": "Colour 3 (confetti)", "default": "#ff5d8f"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#000000"},
  {"id": "start", "type": "number", "label": "Starts at frame (0 = already falling)", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "money-rain" (0.5.0, the Motion Graphics library): things raining through the frame - coins
     that flip as they fall and paper notes that sway, near ones bigger, faster and sharper, far ones small, slow and
     soft; some glow. Confetti, hearts or stars the same way. Learned from graphics__money-falling (coins and notes
     falling through a black frame at different speeds, a few glowing; moving 84 % of the frames). Each piece's path is
     seeded and written into the timeline (fall, spin, sway), so a render is the same every time; with start 0 the
     frame is already full on the first frame. MotionLab's own code. Size-independent; over a video with the
     background off. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .p { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; line-height: 1; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="rain" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };

  gsap.set(["#bgfill", "#rain"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const R = rnd(77), rain = document.getElementById("rain"), n = Math.round(V.amount), S = Math.round(V.start);
  const coin = (d, c) => `<svg width="${d}" height="${d}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9.3" fill="${c}"/><circle cx="10" cy="10" r="7" fill="none" stroke="#00000033" stroke-width="1.1"/><text x="10" y="13.6" font-size="10" font-weight="700" text-anchor="middle" fill="#00000055" font-family="Arial">$</text></svg>`;
  const note = (w, c) => `<svg width="${w}" height="${w * 0.5}" viewBox="0 0 40 20"><rect x=".5" y=".5" width="39" height="19" rx="2" fill="${c}"/><rect x="3" y="3" width="34" height="14" rx="1.5" fill="none" stroke="#00000030"/><circle cx="20" cy="10" r="4.2" fill="#00000026"/></svg>`;
  const heart = (d, c) => `<svg width="${d}" height="${d}" viewBox="0 0 24 24"><path d="M12 21s-7.6-4.6-9.4-9.3C1.4 8.4 3.4 5 6.9 5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.5 0 5.5 3.4 4.3 6.7C19.6 16.4 12 21 12 21z" fill="${c}"/></svg>`;
  const star = (d, c) => `<svg width="${d}" height="${d}" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="${c}"/></svg>`;
  const pal = [V.c1, V.c2, V.c3];
  for (let i = 0; i < n; i++) {
    const depth = 0.35 + 0.65 * R();                     // 1 = near: big, fast, sharp; small = far: small, slow, soft
    const d = (22 + 46 * depth) * U * V.size;
    const e = document.createElement("div");
    e.className = "p";
    const kind = V.what;
    const isNote = kind === "money" && R() < 0.42;
    e.innerHTML = kind === "money" ? (isNote ? note(d * 1.9, V.c2) : coin(d, V.c1))
      : kind === "hearts" ? heart(d, pal[i % 3]) : kind === "stars" ? star(d, pal[i % 3])
      : `<div style="width:${d * 0.42}px;height:${d * 0.75}px;background:${pal[i % 3]};border-radius:${2 * U}px"></div>`;
    if (depth < 0.55) e.style.filter = `blur(${(0.55 - depth) * 8 * U}px)`;
    if (V.glow && R() < 0.18) e.style.filter = `drop-shadow(0 0 ${12 * U}px ${kind === "money" ? V.c1 : pal[i % 3]})`;
    e.style.opacity = String(0.55 + 0.45 * depth);
    rain.appendChild(e);
    // its fall: top to bottom in T frames (near ones faster), repeated; a phase so the frame is full on frame 0
    const T = Math.max(12, Math.round((150 - 70 * depth) / V.speed * FPS / 30));
    const x = R() * W, sway = (isNote || kind === "confetti" ? 70 : 24) * U * depth, phase = R();
    const y0 = -d * 2, y1 = H + d * 2;
    let f = S - Math.round(phase * T);
    const spin = (R() < 0.5 ? -1 : 1) * (90 + 270 * R());
    gsap.set(e, { x, y: y0, rotation: R() * 360 });
    for (let k = 0; f < FRAMES; k++, f += T) {
      const a = Math.max(f, S), part = (a - f) / T;     // the first fall may start part-way (already on screen)
      if (a >= FRAMES) break;
      ft(e, { y: y0 + (y1 - y0) * part, rotation: spin * part }, { y: y1, rotation: spin }, a, f + T, "none");
      // sway / flip: a coin flips (scaleX), a note sways side to side, two swings per fall
      const half = Math.max(2, Math.round(T / 4));
      for (let g = a, side = 1; g + half <= Math.min(FRAMES, f + T); g += half, side = -side) {
        if (kind === "money" && !isNote) to(e, { scaleX: side > 0 ? -1 : 1 }, g, g + half, "sine.inOut");
        else to(e, { x: x + side * sway }, g, g + half, "sine.inOut");
      }
    }
    if (S > 0) { set(e, { opacity: 0 }, 0); set(e, { opacity: 0.55 + 0.45 * depth }, S); }
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
