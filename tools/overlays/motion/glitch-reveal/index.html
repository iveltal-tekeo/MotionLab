<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "text", "type": "string", "label": "Text (*bold* _italic_ ==highlight== ^signal colour^)", "default": "Neon after dark"},
  {"id": "size", "type": "number", "label": "Text size (px at a 1080-px short side)", "default": 104, "min": 30, "max": 300, "step": 1},
  {"id": "colour", "type": "enum", "label": "Neon colour", "default": "signal", "options": [{"value": "signal", "label": "Signal"}, {"value": "mustard", "label": "Mustard"}, {"value": "paper", "label": "Paper"}]},
  {"id": "glow", "type": "number", "label": "Glow around the letters (0-100)", "default": 90, "min": 0, "max": 100, "step": 1},
  {"id": "scramble", "type": "boolean", "label": "The letters shuffle before the text settles", "default": true},
  {"id": "sweep", "type": "boolean", "label": "A bright glint sweeps across the text", "default": true},
  {"id": "shake", "type": "number", "label": "Handheld camera (0 = steady, 10 = shaky)", "default": 0, "min": 0, "max": 10, "step": 0.5},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 600, "step": 1},
  {"id": "background", "type": "boolean", "label": "Paint the paper behind it (off = see-through, over a video)", "default": true},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "glitch-reveal" (2026-10-22): a line of neon text on a dark ground. On f1 it flashes in as a squashed, dim band, f2-f19 every letter is
     swapped for another one each frame (more of them right as it goes; on f18-f19 every letter is the next one in the
     alphabet, a few lit lighter along the way), and on f20 it reads right. It then keeps growing - slowly to f44, then
     faster to f66 (from 72 % to its full size, fixed on its baseline) - and between f48 and f57 a white glint with a
     bloom sweeps across it from right to left; at the end one letter lights up (f112-f119). Look-aware. MotionLab's
     own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #tx { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #tt, #hl { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; letter-spacing: -0.01em;
             transform-origin: 50% 80%; }
  #bloom { position: absolute; left: 0; top: 0; pointer-events: none; }
  .ch { display: inline-block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs">
    <div id="tx">
      <div id="tt" class="ml-body"></div>
      <div id="bloom"></div>
      <div id="hl" class="ml-body"></div>
    </div>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`; };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r}, ${g}, ${b}, ${a})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };

  // ---- the look: a dark ground from the ink, a little lighter in the middle; the text in a neon colour
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const neon = V.colour === "mustard" ? L.mustard : V.colour === "paper" ? glare : L.signal;
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = `radial-gradient(ellipse 62% 78% at 50% 50%, ${mix(night, glare, 0.075)} 0%, ${mix(night, glare, 0.04)} 55%, ${night} 100%)`;
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });

  // ---- the text, one span a letter; hl is a white copy (the glint shows it through a moving mask)
  const fam = V.body_font, tx = q("tx"), tt = q("tt"), hl = q("hl"), bloom = q("bloom");
  Object.assign(tx.style, { left: `${W * 0.499}px`, top: `${H * 0.5625}px` });
  const a = V.glow / 100;
  const stack = (c, k) => `0 0 ${4 * U}px ${rgba(c, 1 * k)}, 0 0 ${16 * U}px ${rgba(c, 0.9 * k)}, 0 0 ${40 * U}px ${rgba(c, 0.75 * k)}, 0 0 ${90 * U}px ${rgba(c, 0.5 * k)}`;
  Object.assign(tt.style, { fontSize: `${V.size * U}px`, fontWeight: String(fw(fam, 800)), color: neon, textShadow: stack(neon, a) });
  const rr = window.MLLook ? MLLook.rich(tt, V.text, { look: L, family: fam, weight: 800 }) : { words: [] };
  if (!window.MLLook) tt.textContent = V.text;
  const lets = [];
  rr.words.forEach(w => {
    const s = w.textContent; w.textContent = "";
    [...s].forEach(ch => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; sp.dataset.o = ch; w.appendChild(sp); lets.push(sp); });
  });
  const baseCol = lets.map(sp => sp.parentElement.style.color || "");
  hl.innerHTML = tt.innerHTML;
  Object.assign(hl.style, { fontSize: `${V.size * U}px`, fontWeight: String(fw(fam, 800)), color: glare, textShadow: `0 0 ${5 * U}px ${rgba(glare, 0.9)}, 0 0 ${20 * U}px ${rgba(glare, 0.55)}`, opacity: "0" });
  hl.querySelectorAll("span").forEach(sp => { sp.style.color = glare; });
  const fx = Math.min(lets.length - 1, Math.floor(lets.length * 0.55));       // the letter that lights up at the end

  // ---- the motion, frame by frame from one proxy (seek-safe). g = the frame, shifted by "Starts at frame".
  // SC = the text's size (1 = full) f20-f66, measured on the reference; GL = where the glint is (0 = left end, 1 = right)
  const SC = [[20,0.7228],[21,0.7287],[22,0.7307],[23,0.7347],[24,0.7406],[25,0.7446],[26,0.7505],[27,0.7564],[28,0.7584],[29,0.7663],[30,0.7663],[31,0.7743],[32,0.7782],[33,0.7822],[34,0.7861],[35,0.7881],[36,0.7921],[37,0.7941],[38,0.7941],[39,0.7941],[40,0.798],[41,0.8],[42,0.8],[43,0.8],[44,0.802],[45,0.8178],[46,0.8376],[47,0.8574],[48,0.8812],[49,0.897],[50,0.9089],[51,0.9208],[52,0.9327],[53,0.9446],[54,0.9525],[55,0.9604],[56,0.9683],[57,0.9723],[58,0.9762],[59,0.9762],[60,0.9842],[61,0.9842],[62,0.9921],[63,0.9921],[64,0.996],[65,0.996],[66,1.0]];
  const GL = [[48, 0.99], [49, 0.93], [50, 0.826], [51, 0.71], [52, 0.554], [53, 0.434], [54, 0.235], [55, 0.175], [56, 0.07], [57, -0.05]];
  const SQ = [[1, 0.65, 0.65], [2, 0.92, 0.9], [3, 1, 1]];                 // squash and brightness of the first frames
  const S = Math.round(V.start);
  // an integer hash: the same letters on every machine and every frame
  const hash = (f, i, k) => { let h = (Math.imul(f + 3, 374761393) + Math.imul(i + 11, 668265263) + Math.imul(k + 5, 2147483647)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const shift = c => /[a-y]/.test(c) ? String.fromCharCode(c.charCodeAt(0) + 1) : c === "z" ? "a" : /[A-Y]/.test(c) ? String.fromCharCode(c.charCodeAt(0) + 1) : c === "Z" ? "A" : c;
  const maxW = W * 0.86, litC = mix(neon, "#ffffff", 0.55);
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S, f = Math.floor(g + 1e-4);
    const on = g >= 1;
    tx.style.visibility = on ? "visible" : "hidden";
    if (!on) return;
    // the letters
    lets.forEach((sp, i) => {
      const o = sp.dataset.o;
      let ch = o, col = baseCol[i];
      if (V.scramble && f < 20 && /[A-Za-z]/.test(o)) {
        if (f >= 18) ch = shift(o);
        else if (hash(f, i, 1) > 0.04 + 0.016 * f) {
          const r = hash(f, i, 2), pick = Math.floor(r * 26);
          ch = /[a-z]/.test(o) ? String.fromCharCode(97 + pick) : String.fromCharCode(65 + pick);
          if (f >= 9 && f <= 17 && hash(f, i, 3) < 0.1) col = litC;
        }
      }
      if (i === fx && g >= 112) col = mix(neon, glare, clamp01((g - 112.5) / 3) * 0.9);
      if (sp.textContent !== ch) sp.textContent = ch;
      sp.style.color = col;
    });
    // the size: squashed on the first frames, then the measured growth; fixed on the baseline, centred
    const sq = tab(SQ, g), s = g < 20 ? 0.72 : tab(SC, g)[0];
    const nat = Math.max(1, hl.offsetWidth), fit = Math.min(1, maxW / nat);
    const tr = `translate(-50%, -80%) scale(${(s * fit).toFixed(4)}, ${(s * fit * sq[0]).toFixed(4)})`;
    tt.style.transform = tr; hl.style.transform = tr;
    tt.style.opacity = String(sq[1]);
    // the glint: a white copy of the text seen through a soft vertical band that sweeps right to left
    const gl = V.sweep && g >= 47.5 && g <= 57.5;
    hl.style.opacity = gl ? "1" : "0"; bloom.style.opacity = gl ? "1" : "0";
    if (gl) {
      const u = tab(GL, g)[0], p = u * 100;
      const m = `linear-gradient(90deg, transparent ${p - 10}%, #000 ${p - 2}%, #000 ${p + 2}%, transparent ${p + 10}%)`;
      hl.style.webkitMaskImage = m; hl.style.maskImage = m;
      const tw = nat * s * fit, th = hl.offsetHeight * s * fit;
      Object.assign(bloom.style, { width: `${tw * 0.3}px`, height: `${th * 1.7}px`,
        left: `${(u - 0.5) * tw - tw * 0.15}px`, top: `${-th * 1.2}px`,
        background: `radial-gradient(ellipse 50% 50% at 50% 50%, ${rgba(glare, 0.5)} 0%, ${rgba(glare, 0.18)} 45%, transparent 100%)` });
    }
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 13 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
