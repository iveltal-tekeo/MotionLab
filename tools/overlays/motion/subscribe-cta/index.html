<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "label", "type": "string", "label": "Button words", "default": "SUBSCRIBE"},
  {"id": "done_label", "type": "string", "label": "Button words after the click", "default": "SUBSCRIBED"},
  {"id": "like", "type": "boolean", "label": "A Like button first", "default": true},
  {"id": "bell", "type": "boolean", "label": "A bell after it", "default": true},
  {"id": "cursor", "type": "boolean", "label": "A cursor clicks them", "default": true},
  {"id": "color", "type": "color", "label": "Button colour", "default": "#e62117"},
  {"id": "liked", "type": "color", "label": "Like colour once clicked", "default": "#3b82f6"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": false},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#1f2430"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 2.5, "step": 0.05},
  {"id": "x", "type": "number", "label": "Centre across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 78, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 6, "min": 0, "max": 900, "step": 1},
  {"id": "leave", "type": "boolean", "label": "Leaves at the end", "default": true}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "subscribe-cta" (0.5.0, the Motion Graphics library): the call to action - a Like button,
     a Subscribe button and a bell pop in; a cursor glides to each and clicks: the like fills with a little burst, the
     button turns grey and says Subscribed, the bell rings with a dot; then they pop away. Not learned from a clip:
     subscribe animations are among the most listed YouTube templates (Mixkit's "Subscribe" / "Notification Bell",
     Envato Elements' YouTube packs; researched 2026-10-16). MotionLab's own drawing - no platform logo. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; font-synthesis: none; }
  .lab { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 0.35em; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="row" class="abs"></div>
  <svg id="cur" class="abs" viewBox="0 0 20 28"><path d="M1 1 L1 22 L6.5 17 L10.5 26 L14.5 24.3 L10.5 15.5 L18 15.5 Z" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `'${V.font}', 'Segoe UI', sans-serif`;
  const q = id => document.getElementById(id);
  const esc = s => String(s || "").replace(/[&<>]/g, "");

  gsap.set(["#bgfill", "#row"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size * U, ph = 104 * s, gap = 22 * s, cx = W * V.x / 100, cy = H * V.y / 100;
  const THUMB = `<svg viewBox="0 0 24 24" width="${46 * s}" height="${46 * s}"><path class="ic" d="M2 10h4v11H2zM8 21h9.2a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 18.6 10H14l.8-4a2 2 0 0 0-3.6-1.5L8 10z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
  const BELL = `<svg viewBox="0 0 24 24" width="${50 * s}" height="${50 * s}"><g class="bg0"><path d="M12 2.5a1 1 0 0 1 1 1v1.1A6 6 0 0 1 18 10.5v4l2 3H4l2-3v-4a6 6 0 0 1 5-5.9V3.5a1 1 0 0 1 1-1zM10 19h4a2 2 0 0 1-4 0z" fill="#fff"/></g><circle class="dot" cx="18.5" cy="5" r="3.6" fill="${V.color}" stroke="#fff" stroke-width="1.2"/></svg>`;
  const parts = [];
  const pill = (w, html, bg) => { const e = document.createElement("div"); e.className = "pill"; e.innerHTML = html;
    Object.assign(e.style, { width: `${w}px`, height: `${ph}px`, borderRadius: `${ph / 2}px`, background: bg, color: "#fff", font: `800 ${40 * s}px ${fam}`, letterSpacing: "0.03em", boxShadow: `0 ${10 * s}px ${30 * s}px rgba(0,0,0,.35)` });
    q("row").appendChild(e); parts.push({ e, w }); return e; };
  const like = V.like ? pill(250 * s, `<div class="lab l1">${THUMB}<span>Like</span></div>`, "rgba(30,30,34,.92)") : null;
  const lw = Math.max(330, 26 * Math.max(String(V.label).length, String(V.done_label).length) + 70) * s;
  const sub = pill(lw, `<div class="lab s1">${esc(V.label)}</div><div class="lab s2" style="opacity:0">${esc(V.done_label)}</div>`, V.color);
  const bell = V.bell ? pill(ph, `<div class="lab">${BELL}</div>`, "rgba(30,30,34,.92)") : null;
  const total = parts.reduce((a, p) => a + p.w, 0) + gap * (parts.length - 1);
  let x0 = cx - total / 2;
  parts.forEach(p => { p.x = x0; gsap.set(p.e, { x: x0, y: cy - ph / 2, transformOrigin: "50% 50%" }); x0 += p.w + gap; });
  const cur = q("cur"), cw = 54 * s; cur.setAttribute("width", cw); cur.setAttribute("height", cw * 1.4);
  gsap.set(cur, { opacity: 0, transformOrigin: "5% 4%" });
  const dot = bell && bell.querySelector(".dot");
  if (dot) gsap.set(dot, { scale: 0, transformOrigin: "50% 50%" });

  // ---- the motion: the buttons pop in (back.out 12 f, 4 f apart); the cursor comes in from below (14 f) and, for each
  // button, glides to it (14 f, S-curve) and clicks (a 3 f press + 5 f release): Like fills with a ring burst,
  // Subscribe dips and turns grey with the new words, the bell rings (6 swings of 3 f) and gets its dot; the cursor
  // leaves (12 f, slow start); at the end the buttons pop away (back.in 8 f, 3 f apart)
  const S = Math.round(V.start);
  parts.forEach((p, i) => enter(p.e, { opacity: 1, scale: 0 }, { scale: 1 }, S + i * K(4), S + i * K(4) + K(12), "back.out(2)"));
  const tgt = parts.map(p => [p.x + p.w * 0.55, cy + ph * 0.1]);
  let f = S + parts.length * K(4) + K(8);
  if (V.cursor) {
    set(cur, { opacity: 1, x: cx + 180 * s, y: cy + 420 * s }, f);
    to(cur, { x: tgt[0][0], y: tgt[0][1] }, f, f + K(14), "power2.inOut");
    f += K(14);
  }
  parts.forEach((p, i) => {
    if (V.cursor && i) { to(cur, { x: tgt[i][0], y: tgt[i][1] }, f, f + K(14), "power2.inOut"); f += K(14); }
    const c = f + K(1);
    if (V.cursor) { to(cur, { scale: 0.82 }, c, c + K(3), "power2.out"); to(cur, { scale: 1 }, c + K(3), c + K(8), "back.out(2)"); }
    to(p.e, { scale: 0.92 }, c, c + K(3), "power2.out"); to(p.e, { scale: 1 }, c + K(3), c + K(10), "back.out(2.5)");
    if (p.e === like) {
      to(like, { backgroundColor: V.liked }, c + K(2), c + K(8), "power2.out");
      set(like.querySelector(".ic"), { attr: { fill: "#fff" } }, c + K(3));
      const ring = document.createElement("div"); ring.className = "abs"; q("row").appendChild(ring);
      Object.assign(ring.style, { width: `${ph * 1.6}px`, height: `${ph * 1.6}px`, borderRadius: "50%", border: `${5 * s}px solid ${V.liked}` });
      gsap.set(ring, { x: p.x + 70 * s - ph * 0.8, y: cy - ph * 0.8, opacity: 0 });
      ft(ring, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.25 }, c + K(3), c + K(15), "power2.out");
    } else if (p.e === sub) {
      to(sub, { backgroundColor: "#3d3d42" }, c + K(2), c + K(8), "power2.out");
      set(sub.querySelector(".s1"), { opacity: 0 }, c + K(3)); set(sub.querySelector(".s2"), { opacity: 1 }, c + K(3));
    } else {
      const g = bell.querySelector(".bg0"); gsap.set(g, { svgOrigin: "12 3" });
      for (let k = 0; k < 6; k++) to(g, { rotation: k === 5 ? 0 : (k % 2 ? -1 : 1) * (22 - k * 3) }, c + k * K(3), c + (k + 1) * K(3), "sine.inOut");
      ft(dot, { scale: 0 }, { scale: 1 }, c + K(4), c + K(12), "back.out(3)");
    }
    f = c + K(10);
  });
  if (V.cursor) to(cur, { x: cx + 260 * s, y: cy + 520 * s, opacity: 0 }, f + K(2), f + K(14), "power2.in");
  if (V.leave) {
    const L = FRAMES - K(14) - (parts.length - 1) * K(3);
    if (L > f + K(16)) parts.forEach((p, i) => to(p.e, { scale: 0 }, L + i * K(3), L + i * K(3) + K(8), "back.in(2)"));
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
