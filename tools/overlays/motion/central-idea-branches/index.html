  const GROW = [[15, [0.0, 0.02, 0.02, 0.03, 0.03, 0.03, 0.07, 0.1, 0.14, 0.17, 0.22, 0.27, 0.34, 0.41, 0.47, 0.54, 0.59, 0.64, 0.68, 0.71, 0.75, 0.78, 0.81, 0.83, 0.86, 0.88, 0.9, 0.92, 0.93, 0.95, 0.97, 0.97, 0.98, 0.98, 1]],
                [25, [0.0, 0.02, 0.02, 0.05, 0.09, 0.14, 0.19, 0.26, 0.33, 0.4, 0.47, 0.53, 0.58, 0.63, 0.67, 0.72, 0.77, 0.79, 0.81, 0.84, 0.86, 0.88, 0.91, 0.93, 0.95, 0.95, 0.98, 0.98, 1]],
                [34, [0.0, 0.02, 0.04, 0.09, 0.11, 0.15, 0.22, 0.28, 0.37, 0.43, 0.52, 0.59, 0.65, 0.67, 0.72, 0.76, 0.78, 0.83, 0.85, 0.87, 0.89, 0.91, 0.93, 0.93, 0.96, 0.98, 0.98, 1]],
                [36, [0.0, 0.02, 0.02, 0.04, 0.06, 0.08, 0.12, 0.16, 0.2, 0.25, 0.31, 0.41, 0.49, 0.55, 0.63, 0.69, 0.73, 0.76, 0.78, 0.82, 0.84, 0.86, 0.88, 0.9, 0.92, 0.94, 0.94, 0.96, 0.98, 0.98, 1]],
                [39, [0.0, 0.03, 0.03, 0.03, 0.04, 0.06, 0.06, 0.09, 0.13, 0.16, 0.22, 0.3, 0.36, 0.43, 0.49, 0.55, 0.6, 0.65, 0.68, 0.72, 0.76, 0.79, 0.82, 0.84, 0.85, 0.89, 0.9, 0.92, 0.94, 0.94, 0.95, 0.97, 0.98, 0.98, 0.98, 1]],
                [45, [0.0, 0.02, 0.02, 0.04, 0.04, 0.06, 0.08, 0.12, 0.16, 0.2, 0.27, 0.35, 0.41, 0.49, 0.55, 0.61, 0.67, 0.69, 0.73, 0.76, 0.8, 0.82, 0.84, 0.88, 0.9, 0.92, 0.92, 0.94, 0.96, 0.96, 0.98, 0.98, 1]]];
  const LFADE = [57, 51, 61, 67, 64, 69];                                                         // each label's fade-in: the frame it reaches 20 % (10 f long: -2.4 .. +8)

  // ---- build: the ring, the branches (turned to the number of labels) and the labels
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, at, parent) => { const e = document.createElementNS(NS, tag); Object.entries(at || {}).forEach(([k, v]) => e.setAttribute(k, v)); if (parent) parent.appendChild(e); return e; };
  const labs = String(V.labels || "").split("|").map(x => x.trim()).filter(x => x.length).slice(0, 8);
  const N = Math.max(1, labs.length || 6);
  const RR = 167.2, CIRC = 2 * Math.PI * RR;
  const ringsvg = q("ringsvg"), brsvg = q("brsvg"), cam = q("cam");
  const ring = el("circle", { cx: 0, cy: 0, r: RR, fill: "none", stroke: "url(#gNeon)", "stroke-width": 9, "stroke-linecap": "round", transform: "rotate(-90)", "stroke-dasharray": `0 ${CIRC}` }, ringsvg);
  const rot = (x, y, d) => { const c = Math.cos(d * Math.PI / 180), s = Math.sin(d * Math.PI / 180); return [x * c - y * s, x * s + y * c]; };
  const branches = [];
  for (let k = 0; k < N; k++) {
    const sh = SHAPES[k % 6];
    const delta = N === 6 ? 0 : (46.6 - k * 360 / N) - sh.a;
    const P = sh.p.map(([x, y]) => rot(x, y, delta));
    const cum = [0]; for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
    const path = el("path", { fill: "url(#gNeon)" }, brsvg), tip = el("circle", { r: 2.5, fill: "url(#gNeon)" }, brsvg);
    const lp = rot(sh.l[0], sh.l[1], delta);
    const lab = document.createElement("div"); lab.className = "bl ml-body"; cam.appendChild(lab);
    if (window.MLLook) MLLook.rich(lab, labs[k] || "", { look: L, family: V.body_font, weight: 700 }); else lab.textContent = labs[k] || "";
    Object.assign(lab.style, { color: glare, fontSize: `${V.label_size * U / K}px`, fontWeight: String(fw(V.body_font, 700)), opacity: 0 });
    const g0 = GROW[k % 6], shift = k < 6 ? 0 : 6 * (k - 5);
    branches.push({ P, cum, L: cum[cum.length - 1], path, tip, lab, lx: lp[0], ly: lp[1], la: sh.l[2] + delta, f0: g0[0] + shift, rows: g0[1], fade: LFADE[k % 6] + shift });
  }
  // the title
  const title = document.createElement("div"); title.id = "title"; title.className = "ml-display"; cam.appendChild(title);
  if (window.MLLook) MLLook.rich(title, V.title, { look: L, family: V.display_font, weight: 700 }); else title.textContent = V.title;
  Object.assign(title.style, { color: fillC, fontSize: `${V.size * U / K}px`, fontWeight: String(fw(V.display_font, 700)),
    textShadow: `0 0 5px ${rgba(other, 0.95)}, 0 0 14px ${rgba(other, 0.6)}` });
  const glowF = `drop-shadow(0 0 5px ${rgba(C, 0.6)}) drop-shadow(0 0 13px ${rgba(C, 0.3)})`;
  brsvg.style.filter = glowF;
  q("dia").style.transform = `translate(${W / 2}px, ${H / 2}px) scale(${V.diagram / 100}) translate(${-W / 2}px, ${-H / 2}px)`;

  // the title's size: its words must sit inside the ring (measured with the real font)
  let ready = false;
  function layout() {
    const maxw = 2 * 0.86 * RR, w = title.offsetWidth;
    if (w > maxw && w > 0) title.style.fontSize = `${V.size * U / K * maxw / w}px`;
    ready = true;
  }

  // ---- one frame
  function taper(t) { const u = clamp01((t - 0.7) / 0.3); return 13 - 8 * Math.pow(u, 2.2); }
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    const on = g >= 1;
    q("dia").style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    // the camera: pulls back from x2.4 to x1 (f2-f66), then rests with the ring at the frame's centre
    const s = g >= 66 ? 1 : seq(2, CAMS, g), cx = g >= 66 ? 0 : seq(2, CAMX, g), cy = g >= 66 ? 0 : seq(2, CAMY, g);
    cam.style.transform = `translate(${((640 + cx) * K).toFixed(2)}px, ${((360 + cy) * K).toFixed(2)}px) scale(${(s * K).toFixed(4)})`;
    // the ring and the title come into focus
    const blur = g >= 16 ? 0 : seq(1, BLUR, g), fo = seq(1, FOP, g), ro = seq(1, ROP, g), rp = g >= 10 ? 1 : seq(1, RING, g);
    ring.setAttribute("stroke-dasharray", `${(rp * CIRC).toFixed(2)} ${CIRC.toFixed(2)}`);
    ringsvg.style.opacity = ro.toFixed(3);
    ringsvg.style.filter = `${glowF}${blur > 0.2 ? ` blur(${blur.toFixed(2)}px)` : ""}`;
    ringsvg.style.visibility = rp > 0.001 ? "visible" : "hidden";
    title.style.opacity = fo.toFixed(3);
    title.style.filter = blur > 0.2 ? `blur(${blur.toFixed(2)}px)` : "none";
    title.style.transform = `translate(-50%, -50%) translate(0px, ${(4.8 + seq(1, DYT, g)).toFixed(2)}px)`;
    // the branches and their labels
    branches.forEach(b => {
      const p = clamp01((seq(b.f0, b.rows, g) - 0.04) / 0.96);
      const l = p * b.L;
      if (l < 2.5) { b.path.setAttribute("d", ""); b.tip.setAttribute("r", 0); }
      else {
        const left = [], right = [], n = b.P.length;
        let end = 0; while (end < n - 1 && b.cum[end + 1] <= l) end++;
        const pts = b.P.slice(0, end + 1), cs = b.cum.slice(0, end + 1);
        if (end < n - 1 && b.cum[end + 1] > cs[end]) {
          const u = (l - cs[end]) / (b.cum[end + 1] - cs[end]);
          pts.push([b.P[end][0] + (b.P[end + 1][0] - b.P[end][0]) * u, b.P[end][1] + (b.P[end + 1][1] - b.P[end][1]) * u]); cs.push(l);
        }
        for (let i = 0; i < pts.length; i++) {
          const a = pts[Math.max(0, i - 1)], c = pts[Math.min(pts.length - 1, i + 1)];
          let dx = c[0] - a[0], dy = c[1] - a[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
          const w = taper(cs[i] / l) / 2;
          left.push(`${(pts[i][0] - dy * w).toFixed(2)},${(pts[i][1] + dx * w).toFixed(2)}`);
          right.push(`${(pts[i][0] + dy * w).toFixed(2)},${(pts[i][1] - dx * w).toFixed(2)}`);
        }
        b.path.setAttribute("d", `M ${left.join(" L ")} L ${right.reverse().join(" L ")} Z`);
        const e = pts[pts.length - 1];
        b.tip.setAttribute("cx", e[0].toFixed(2)); b.tip.setAttribute("cy", e[1].toFixed(2)); b.tip.setAttribute("r", (taper(1) / 2).toFixed(2));
      }
      const o = clamp01((g - (b.fade - 2.4)) / 10.4);
      b.lab.style.opacity = o.toFixed(3);
      b.lab.style.visibility = o > 0 ? "visible" : "hidden";
      b.lab.style.transform = `translate(${b.lx.toFixed(2)}px, ${b.ly.toFixed(2)}px) translate(-50%, -50%) rotate(${b.la.toFixed(2)}deg)`;
    });
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 4, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 29 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the title is measured here
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
