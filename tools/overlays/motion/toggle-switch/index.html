<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "title", "type": "string", "label": "Line beside the switch (empty = none)", "default": "Notifications"},
  {"id": "sub", "type": "string", "label": "Small line under it (empty = none)", "default": "for every new video"},
  {"id": "off_word", "type": "string", "label": "Word when off (empty = none)", "default": "OFF"},
  {"id": "on_word", "type": "string", "label": "Word when on (empty = none)", "default": "ON"},
  {"id": "flips", "type": "number", "label": "Flips (1 = off to on; 3 = on, off, on)", "default": 1, "min": 1, "max": 9, "step": 1},
  {"id": "on_color", "type": "color", "label": "On colour", "default": "#22c55e"},
  {"id": "glow", "type": "boolean", "label": "Glows when on", "default": true},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "text_color", "type": "color", "label": "Text colour", "default": "#15171a"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#f5f6f8"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "x", "type": "number", "label": "Centre across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 40, "min": 0, "max": 100, "step": 1},
  {"id": "flip_at", "type": "number", "label": "First flip at frame", "default": 34, "min": 0, "max": 900, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "toggle-switch" (0.5.0, the Motion Graphics library): a switch pops in off, then flips -
     the knob slides with an S-curve and squashes as it goes, the track turns the on colour and glows, the word under it
     changes; it can flip on-off-on. Learned from overlays__on-off-toggle (OFF -> ON: the knob slides, the track turns
     green, a green glow grows, f58-f86 (00:00:02:08-00:00:03:11) at 25 fps) and overlays__alarm-toggle (a toggle beside
     a time and a label - a still capture). MotionLab's own code. Size-independent; an overlay (background off) or a
     scene. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="glow" class="abs"></div><div id="track" class="abs"></div><div id="knob" class="abs"></div>
    <div id="ttl" class="t"></div><div id="sub" class="t"></div><div id="woff" class="t"></div><div id="won" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, tw = 230 * U * s, th = 132 * U * s, pad = 12 * U * s, ks = th - 2 * pad;
  const hasT = !!V.title, cx = W * V.x / 100, cy = H * V.y / 100;
  const tx = hasT ? cx + W * 0.38 * Math.min(1, s) - tw : cx - tw / 2;     // with a title: the switch on the right
  const OFF = "#c9ccd3";
  Object.assign(q("track").style, { width: `${tw}px`, height: `${th}px`, borderRadius: `${th / 2}px`, background: OFF });
  gsap.set("#track", { x: tx, y: cy - th / 2 });
  Object.assign(q("knob").style, { width: `${ks}px`, height: `${ks}px`, borderRadius: `${ks / 2}px`, background: "#ffffff", boxShadow: `0 ${4 * U}px ${10 * U}px rgba(0,0,0,.22)` });
  const kx0 = tx + pad, kx1 = tx + tw - pad - ks;
  gsap.set("#knob", { x: kx0, y: cy - ks / 2, transformOrigin: "50% 50%" });
  const gs = tw * 2.4;
  Object.assign(q("glow").style, { width: `${gs}px`, height: `${gs}px`, borderRadius: "50%", background: `radial-gradient(circle, ${V.on_color}66, transparent 62%)` });
  gsap.set("#glow", { x: tx + tw / 2 - gs / 2, y: cy - gs / 2, opacity: 0 });
  if (hasT) {
    q("ttl").textContent = V.title; q("sub").textContent = V.sub || "";
    Object.assign(q("ttl").style, { font: `700 ${58 * U * s}px ${fam}`, color: V.text_color });
    Object.assign(q("sub").style, { font: `400 ${36 * U * s}px ${fam}`, color: V.text_color, opacity: 0.55 });
    const lx = cx - W * 0.38 * Math.min(1, s);
    gsap.set("#ttl", { x: lx, y: cy - (V.sub ? 62 : 32) * U * s });
    gsap.set("#sub", { x: lx, y: cy + 10 * U * s });
  }
  [["#woff", V.off_word, "#8b8f98"], ["#won", V.on_word, V.on_color]].forEach(([id, w, c]) => {
    q(id.slice(1)).textContent = w || "";
    Object.assign(q(id.slice(1)).style, { font: `800 ${26 * U * s}px ${fam}`, color: c, letterSpacing: "0.14em" });
    gsap.set(id, { x: tx + tw / 2, y: cy + th / 2 + 22 * U * s, xPercent: -50 });
  });
  gsap.set("#won", { opacity: 0 });

  // ---- the motion: in (back.out 12 f); flips 10 f each (S-curve), the knob stretches mid-way, the colour and the glow
  // follow; flips 20 frames apart
  const S = Math.round(V.start), F0 = Math.max(S + K(16), Math.round(V.flip_at)), FL = K(10), GAPF = K(20);
  ["#track", "#knob", "#woff"].forEach(id => enter(id, { opacity: 1, scale: 0.6 }, { scale: 1 }, S, S + K(12), "back.out(2)"));
  if (hasT) { enter("#ttl", { opacity: 0 }, { opacity: 1 }, S + K(4), S + K(16), "power2.out"); enter("#sub", { opacity: 0 }, { opacity: 0.55 }, S + K(8), S + K(20), "power2.out"); }
  for (let i = 0; i < Math.round(V.flips); i++) {
    const f = F0 + i * (FL + GAPF), on = i % 2 === 0;
    if (f + FL >= FRAMES) break;
    to("#knob", { x: on ? kx1 : kx0 }, f, f + FL, "power3.inOut");
    to("#knob", { scaleX: 1.28, scaleY: 0.9 }, f, f + Math.round(FL / 2), "power2.out");
    to("#knob", { scaleX: 1, scaleY: 1 }, f + Math.round(FL / 2), f + FL, "power2.in");
    to("#track", { backgroundColor: on ? V.on_color : OFF }, f + K(2), f + FL, "power1.inOut");
    if (V.glow) to("#glow", { opacity: on ? 1 : 0 }, f + K(2), f + FL + K(8), "power2.out");
    set(on ? "#woff" : "#won", { opacity: 0 }, f + Math.round(FL / 2));
    set(on ? "#won" : "#woff", { opacity: 1 }, f + Math.round(FL / 2));
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
