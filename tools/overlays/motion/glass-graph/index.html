<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "label", "type": "string", "label": "Label (small capitals, top left)", "default": "Weekly views"},
  {"id": "from", "type": "string", "label": "Counts from (a number; K, M, % or a unit after it are kept)", "default": "0"},

  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.5, "max": 1.6, "step": 0.05},

  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#2E2925"},
  {"id": "display_font", "type": "enum", "label": "Headline font", "default": "Instrument Serif", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "body_font", "type": "enum", "label": "Text font", "default": "Hanken Grotesk", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "accent_font", "type": "enum", "label": "Label font (small caps, numbers)", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Ink (text)", "default": "#14120F"},
  {"id": "paper", "type": "color", "label": "Paper (background)", "default": "#F2EDE4"},
  {"id": "signal", "type": "color", "label": "Signal (accent)", "default": "#FF4D2E"},
  {"id": "deep", "type": "color", "label": "Deep (second colour)", "default": "#1C3D5A"},
  {"id": "mustard", "type": "color", "label": "Mustard (highlight)", "default": "#E6B422"},
  {"id": "radius", "type": "number", "label": "Corners (px)", "default": 14, "min": 0, "max": 80, "step": 1},
  {"id": "shadow", "type": "number", "label": "Shadow (0 = none, 1 = soft and low)", "default": 1, "min": 0, "max": 3, "step": 0.1},
  {"id": "grain", "type": "number", "label": "Film grain (%)", "default": 8, "min": 0, "max": 40, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "glass-graph" (2026-10-27): a stat card of glass under the chin. It rises into place
     (f0-f12, slow end, from 88 % and 86 px lower) while its grid lines draw in; from f8 a line graph climbs across it
     (`climb` frames, S-curve) with a glowing head and a soft fill under it while the big number counts from `from` to
     `to` with the same curve; on landing the number pops (8 f) and the head sends out a ring every second; a band
     of light crosses the glass; the last 9 frames it sinks away. Over a video with a person it is a glass card: the
     renderer frosts the real footage under it (template.json "in_shot"), so the card paints only a thin translucent
     fill, a light rim and a soft highlight at its top edge (the preview background below is the only thing it
     blurs). After the "liquid-glass-graph" effect of claude-video-effects (MIT); MotionLab's own code.
     Size-independent, look-aware. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #cardw { position: absolute; left: 0; top: 0; }
  #card { position: absolute; overflow: hidden; }
  #card > div, #card > svg { position: absolute; }
  #glab, #gnum { white-space: nowrap; font-synthesis: none; line-height: 1; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cardw"><div id="card"><div id="hi"></div><svg id="plot"></svg><div id="glab" class="ml-accent"></div><div id="gnum"></div><svg id="rim"></svg></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const lum = h => window.MLLook ? MLLook.lum(h) : 0.5;
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const c01 = x => Math.min(1, Math.max(0, x));
  const eOut = x => 1 - Math.pow(1 - c01(x), 3);                            // decelerating (slow end)
  const eIO = x => { x = c01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };   // S-curve
  const eIn = x => c01(x) * c01(x);                                          // accelerating (exits only)
  const every = fn => { const p = { t: 0 }; fn(0); tl.fromTo(p, { t: 0 }, { t: FRAMES / FPS, duration: FRAMES / FPS, ease: "none", immediateRender: false, onUpdate: () => fn(p.t) }, 0); return p; };
  const S = Math.round(V.start), s = V.size * U;
  const light = lum(L.paper) >= lum(L.ink) ? L.paper : L.ink, dark = light === L.paper ? L.ink : L.paper;
  const smoke = V.tone === "smoke", NS = "http://www.w3.org/2000/svg";

  // ---- the preview background (only when painted: over a video the card is see-through and the renderer frosts the footage)
  const bgfill = q("bgfill");
  Object.assign(bgfill.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) bgfill.style.background = `radial-gradient(ellipse ${0.5 * W}px ${0.22 * H}px at ${0.2 * W}px ${0.28 * H}px, ${rgba(L.mustard, 0.55)}, ${rgba(L.mustard, 0)} 100%), ` +
    `radial-gradient(ellipse ${0.42 * W}px ${0.2 * H}px at ${0.84 * W}px ${0.6 * H}px, ${rgba(L.paper, 0.3)}, ${rgba(L.paper, 0)} 100%), ` +
    `radial-gradient(ellipse ${0.6 * W}px ${0.18 * H}px at ${0.45 * W}px ${0.9 * H}px, ${rgba(L.signal, 0.28)}, ${rgba(L.signal, 0)} 100%), ${V.bg}`;

  // ---- the card: 800 x 497 at 1080 px (her 0.74 x 0.46 of the width)
  const cw = Math.min(800 * s, W * 0.92), k = cw / (800 * s);
  const ch = 497 * s * k, pad = cw * 0.07;
  const R = Math.min(ch / 2, Math.max(10 * U, L.radius * 4.2));
  const cx = Math.min(W - cw / 2 - W * 0.03, Math.max(cw / 2 + W * 0.03, W * V.x / 100));
  const cy = Math.min(H - ch / 2 - H * 0.04, Math.max(ch / 2 + H * 0.04, H * V.y / 100));
  const cardw = q("cardw"), card = q("card");
  Object.assign(card.style, { left: `${-cw / 2}px`, top: `${-ch / 2}px`, width: `${cw}px`, height: `${ch}px`, borderRadius: `${R}px`,
    background: smoke ? `linear-gradient(180deg, ${rgba(dark, 0.5)} 0%, ${rgba(dark, 0.42)} 100%)`
      : `linear-gradient(180deg, ${rgba("#ffffff", 0.2)} 0%, ${rgba("#ffffff", 0.13)} 50%, ${rgba("#ffffff", 0.15)} 100%)` });
  if (V.background) {          // the preview only: the real frost of the painted background behind it + its shadow
    card.style.backdropFilter = card.style.webkitBackdropFilter = `blur(${18 * U}px) saturate(1.25)`;
    card.style.boxShadow = `0 ${10 * U}px ${32 * U}px ${rgba("#000000", 0.28)}`;
  }
  Object.assign(q("hi").style, { left: "0px", top: "0px", width: `${cw}px`, height: `${ch * 0.42}px`,
    background: `linear-gradient(180deg, ${rgba("#ffffff", smoke ? 0.1 : 0.18)} 0%, ${rgba("#ffffff", 0)} 100%)` });
  const rim = q("rim"), sw = Math.max(1.2, 1.6 * U), bw = cw * 0.3;
  rim.setAttribute("width", cw); rim.setAttribute("height", ch);
  Object.assign(rim.style, { left: "0px", top: "0px", overflow: "visible" });
  rim.innerHTML = `<defs><linearGradient id="ggrim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>` +
    `<stop offset="0.45" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/></linearGradient>` +
    `<linearGradient id="ggshg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>` +
    `<stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="ggc"><rect x="0" y="0" width="${cw}" height="${ch}" rx="${R}"/></clipPath></defs>` +
    `<g clip-path="url(#ggc)"><rect id="ggsh" x="0" y="${-ch * 0.5}" width="${bw}" height="${ch * 2}" fill="url(#ggshg)" opacity="0"/></g>` +
    `<rect x="${sw / 2}" y="${sw / 2}" width="${cw - sw}" height="${ch - sw}" rx="${R - sw / 2}" fill="none" stroke="url(#ggrim)" stroke-width="${sw}"/>`;
  const sheen = q("ggsh");

  // ---- the plot: grid lines, the soft fill, the glow, the line, its head and the ring it sends out
  const x0 = pad, x1 = cw - pad, yb = ch - pad * 0.9, yt = ch * 0.36, lw = Math.max(2, cw * 0.011);
  const plot = q("plot");
  plot.setAttribute("width", cw); plot.setAttribute("height", ch);
  Object.assign(plot.style, { left: "0px", top: "0px" });
  const gy = j => yb - (yb - yt) * j / 3.4;
  plot.innerHTML = `<defs><linearGradient id="ggfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${V.color}" stop-opacity="0.42"/>` +
    `<stop offset="1" stop-color="${V.color}" stop-opacity="0.03"/></linearGradient>` +
    `<filter id="ggglow" filterUnits="userSpaceOnUse" x="0" y="0" width="${cw}" height="${ch}"><feGaussianBlur stdDeviation="${(lw * 1.4).toFixed(2)}"/></filter></defs>` +
    [1, 2, 3].map(j => `<line class="gl" x1="${x0}" y1="${gy(j)}" x2="${x1}" y2="${gy(j)}" stroke="${rgba(light, 0.18)}" stroke-width="${Math.max(1, 1.5 * U)}" stroke-dasharray="${x1 - x0}" stroke-dashoffset="${x1 - x0}"/>`).join("") +
    `<path id="ggarea" fill="url(#ggfill)" d=""/><path id="ggglowp" fill="none" stroke="${V.color}" stroke-width="${lw * 3}" stroke-linecap="round" stroke-linejoin="round" filter="url(#ggglow)" opacity="0.85" d=""/>` +
    `<path id="ggline" fill="none" stroke="${V.color}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round" d=""/>` +
    `<circle id="ggring" r="0" fill="none" stroke="${V.color}" stroke-width="${lw * 0.6}" opacity="0"/>` +
    `<circle id="gghead" r="${lw * 1.9}" fill="#ffffff" stroke="${V.color}" stroke-width="${Math.max(1.5, lw * 0.55)}" opacity="0"/>`;
  const grid = [...plot.querySelectorAll(".gl")], area = q("ggarea"), glowp = q("ggglowp"), line = q("ggline"), head = q("gghead"), ring = q("ggring");
  // a climb with a few honest dips: from 7 % to the top, faster at the end
  const curve = u => yb - (yb - yt) * Math.min(1, Math.max(0, 0.07 + 0.93 * Math.pow(u, 1.55) + 0.05 * Math.sin(u * 12.5 + 0.4) * (1 - u) * (1 - u)));

  // ---- the label and the number
  const parse = str => {
    const m = String(str == null ? "" : str).trim().match(/^([^\d.,-]*)(-?\d[\d,]*(?:\.\d+)?|-?\.\d+)(.*)$/);
    if (!m) return { p: "", v: 0, s: String(str || "").trim(), dec: 0, grp: false };
    const clean = m[2].replace(/,/g, "");
    return { p: m[1], v: parseFloat(clean) || 0, s: m[3], dec: clean.includes(".") ? clean.split(".")[1].length : 0, grp: /\d,\d{3}/.test(m[2]) };
  };
  const A = parse(V.from), B = parse(V.to);
  const dec = Math.max(A.dec, B.dec), grp = B.grp || A.grp, pre = B.p || A.p, suf = B.s || A.s;
  const fmt = v => pre + (grp ? Number(v.toFixed(dec)).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec)) + suf;
  const glab = q("glab"), gnum = q("gnum");
  glab.textContent = String(V.label || "").toUpperCase();
  let labFs = cw * 0.04, numFs = cw * 0.12;
  Object.assign(glab.style, { left: `${pad}px`, top: `${pad * 0.92}px`, color: rgba(light, 0.82), fontFamily: `'${V.accent_font}', Consolas, monospace`,
    fontWeight: String(fw(V.accent_font, 700)), fontSize: `${labFs}px`, letterSpacing: "0.1em",
    textShadow: smoke ? "none" : `0 0 ${10 * U}px ${rgba("#000000", 0.35)}` });
  Object.assign(gnum.style, { right: `${pad}px`, top: `${pad * 0.5}px`, color: light, fontFamily: `'${V.body_font}', 'Segoe UI', sans-serif`,
    fontWeight: String(fw(V.body_font, 800)), fontSize: `${numFs}px`, fontVariantNumeric: "tabular-nums", letterSpacing: "-0.02em",
    transformOrigin: "100% 60%", textShadow: smoke ? "none" : `0 0 ${14 * U}px ${rgba("#000000", 0.35)}` });

  // ---- the motion (d = frames at 30 fps since "Comes in at frame"; e = frames at 30 fps before the end)
  const D0 = 8, CL = Math.max(12, V.climb), land = D0 + CL;
  const leave = V.leave && (FRAMES - S) * 30 / FPS - 9 > land + 10;
  // the rise in and the sink out stay inside the frame when the card sits low
  const ROOM = H - (cy + ch / 2), RISE = Math.min(86 * s, Math.max(20 * s, ROOM - 4 * U)), SINK = Math.min(30 * s, Math.max(0, ROOM - 4 * U));
  function render(t) {
    const d = (t - S / FPS) * 30, e = (FRAMES / FPS - t) * 30;
    cardw.style.visibility = d >= 0 ? "visible" : "hidden";
    if (d < 0) return;
    const qv = eOut(d / 12);
    let sc = 0.88 + 0.12 * qv, lift = (1 - qv) * RISE, op = c01((d + 0.5) / 4);
    lift += 3 * s * Math.sin(2 * Math.PI * (d - land) / 96) * c01((d - land) / 20);   // it floats a hair once it landed
    if (leave && e < 9) { const x = eIn(1 - e / 9); sc *= 1 - 0.1 * x; lift += SINK * x; op *= 1 - x; }
    cardw.style.transform = `translate(${cx.toFixed(2)}px, ${(cy + lift).toFixed(2)}px) scale(${sc.toFixed(4)})`;
    cardw.style.opacity = op.toFixed(3);
    grid.forEach((g, j) => g.setAttribute("stroke-dashoffset", ((x1 - x0) * (1 - eOut((d - 3 - 3 * j) / 12))).toFixed(1)));
    // the climb and the count share one S-curve
    const g = eIO((d - D0) / CL), N = 72, pts = [];
    const nn = N * g;
    for (let j = 0; j <= Math.floor(nn); j++) pts.push([x0 + (x1 - x0) * j / N, curve(j / N)]);
    if (nn % 1 > 0.001) pts.push([x0 + (x1 - x0) * nn / N, curve(nn / N)]);
    if (pts.length < 2) pts.push([x0 + 0.01, curve(0)]);
    const dl = "M " + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" L ");
    const on = d >= D0 ? "1" : "0";
    line.setAttribute("d", dl); glowp.setAttribute("d", dl);
    line.setAttribute("opacity", on); glowp.setAttribute("opacity", d >= D0 ? "0.85" : "0");
    const [hx, hy] = pts[pts.length - 1];
    area.setAttribute("d", d >= D0 ? `${dl} L ${hx.toFixed(1)} ${yb.toFixed(1)} L ${x0.toFixed(1)} ${yb.toFixed(1)} Z` : "");
    head.setAttribute("cx", hx.toFixed(1)); head.setAttribute("cy", hy.toFixed(1));
    head.setAttribute("opacity", c01((d - D0) / 3).toFixed(3));
    head.setAttribute("r", (lw * 1.9 * (1 + 0.35 * Math.sin(Math.PI * c01((d - land) / 8)))).toFixed(2));
    // once it landed, a ring every 30 frames (12 f out, slow end)
    const rp = d >= land ? ((d - land) % 30) / 14 : 1;
    ring.setAttribute("cx", hx.toFixed(1)); ring.setAttribute("cy", hy.toFixed(1));
    ring.setAttribute("r", (lw * (1.9 + 3.2 * eOut(rp))).toFixed(2));
    ring.setAttribute("opacity", (rp < 1 ? 0.7 * (1 - rp) : 0).toFixed(3));
    // the number counts, then pops as it lands (8 f)
    gnum.textContent = fmt(A.v + (B.v - A.v) * g);
    const pop = d >= land ? 1 + 0.07 * (1 - eOut((d - land) / 8)) : 1;
    gnum.style.transform = `scale(${pop.toFixed(4)})`;
    const sp = eIO((d - land - 4) / 24);

    sheen.setAttribute("opacity", sp > 0 && sp < 1 ? "1" : "0");
  }
  const px = every(render);
  if (window.MLLook && V.background) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 43 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};

  (document.fonts && document.fonts.load ? Promise.all([400, 700, 800].flatMap(w => [document.fonts.load(`${w} 100px "${V.body_font}"`), document.fonts.load(`${w} 100px "${V.accent_font}"`)])
    .concat([document.fonts.ready])).catch(() => {}) : Promise.resolve()).then(() => {
    let wn = 0;
    [A.v, B.v, (A.v + B.v) / 2].forEach(v => { gnum.textContent = fmt(v); wn = Math.max(wn, gnum.offsetWidth); });
    // the number first (up to 64 % of the line), the label beside it on up to two lines, smaller only after that
    const room = cw - 2 * pad - 30 * s * k;
    if (wn > room * 0.64) { numFs *= room * 0.64 / wn; gnum.style.fontSize = `${numFs}px`; wn = room * 0.64; }
    if (glab.offsetWidth > room - wn) {
      Object.assign(glab.style, { whiteSpace: "normal", width: `${room - wn}px`, lineHeight: "1.3" });
      for (let i = 0; i < 10 && (glab.offsetHeight > labFs * 1.3 * 2 + 1 || glab.scrollWidth > glab.clientWidth + 1); i++) {
        labFs *= 0.9; glab.style.fontSize = `${labFs}px`;
      }
    }

    window.__timelines["main"] = tl;
  });
