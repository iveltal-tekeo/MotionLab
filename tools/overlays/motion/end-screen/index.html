<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "title", "type": "string", "label": "Title", "default": "Thanks for watching!"},
  {"id": "label1", "type": "string", "label": "First video label", "default": "Watch next"},
  {"id": "label2", "type": "string", "label": "Second video label (empty = one video)", "default": "Best of the channel"},
  {"id": "video1", "type": "string", "label": "First video picture in the graphic’s assets folder (empty = colour)", "default": ""},
  {"id": "video2", "type": "string", "label": "Second video picture (empty = colour)", "default": ""},
  {"id": "channel", "type": "string", "label": "Channel name", "default": "MotionLab"},
  {"id": "picture", "type": "string", "label": "Channel picture in the assets folder (empty = a letter)", "default": ""},
  {"id": "button", "type": "string", "label": "Button words (empty = no button)", "default": "SUBSCRIBE"},
  {"id": "accent", "type": "color", "label": "Accent colour", "default": "#ff3b5c"},
  {"id": "c1", "type": "color", "label": "Background colour 1", "default": "#141826"},
  {"id": "c2", "type": "color", "label": "Background colour 2", "default": "#2a1240"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "end-screen" (0.5.0, the Motion Graphics library): the last seconds of a video - a title,
     one or two video cards (where the platform's end-screen links go) sliding in, the channel's round picture popping
     in a turning ring and a Subscribe button that pulses; the background drifts slowly. Lays itself out side by side
     on a wide frame and stacked on a tall one. Not learned from a clip: end screens are a main YouTube template kind
     (Mixkit "End Screen", Envato Elements' YouTube packs; researched 2026-10-16). MotionLab's own drawing. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .card { position: absolute; left: 0; top: 0; overflow: hidden; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.1; font-synthesis: none; }
  .pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="glow" class="abs"></div>
  <div id="ui" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 240;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `'${V.font}', 'Segoe UI', sans-serif`;
  const q = id => document.getElementById(id);
  const esc = s => String(s || "").replace(/[&<>]/g, "");
  const url = s => String(s || "").replace(/"/g, "");

  gsap.set(["#bgfill", "#glow", "#ui"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? `linear-gradient(160deg, ${V.c1}, ${V.c2})` : "transparent" });
  if (V.background) Object.assign(q("glow").style, { background: `radial-gradient(circle ${Math.max(W, H) * 0.45}px at 30% 30%, ${V.accent}33, transparent 70%)` });
  const wide = W >= H, two = !!V.label2;
  const add = (cls, st, html) => { const e = document.createElement("div"); e.className = cls; Object.assign(e.style, st); if (html != null) e.innerHTML = html; q("ui").appendChild(e); return e; };
  // the layout: wide = title on top, the cards in a row, the channel under them; tall = everything stacked
  const cw = wide ? W * (two ? 0.3 : 0.42) : W * 0.74, ch = cw * 9 / 16, gapc = wide ? W * 0.04 : H * 0.025;
  const titleY = wide ? H * 0.08 : H * 0.07;
  const cardsY = wide ? H * 0.24 : H * 0.15;
  const cards = [[V.label1, V.video1, 0], ...(two ? [[V.label2, V.video2, 1]] : [])].map(([lab, pic, i]) => {
    const x = wide ? W / 2 - (two ? cw + gapc / 2 : cw / 2) + i * (cw + gapc) : W / 2 - cw / 2, y = wide ? cardsY : cardsY + i * (ch + gapc + 70 * U);
    const grad = i ? `linear-gradient(135deg, ${V.accent}, #7c3aed)` : `linear-gradient(135deg, #22d3ee, #6366f1)`;
    const c = add("card", { width: `${cw}px`, height: `${ch}px`, borderRadius: `${24 * U}px`, background: pic ? `center / cover url("${url(pic)}")` : grad,
      boxShadow: `0 ${20 * U}px ${50 * U}px rgba(0,0,0,.45)`, border: `${4 * U}px solid rgba(255,255,255,.85)` },
      `<svg width="100%" height="100%" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid meet" style="position:absolute;left:0;top:0"><g class="pl"><circle cx="80" cy="45" r="15" fill="rgba(0,0,0,.45)"/><path d="M75 37 L88 45 L75 53 Z" fill="#fff"/></g></svg>`);
    const l = add("t", { font: `700 ${42 * U}px ${fam}`, color: "#ffffff" }, esc(lab));
    gsap.set(c, { x, y, transformOrigin: "50% 50%" }); gsap.set(l, { x: x + 6 * U, y: y + ch + 18 * U });
    return { c, l, x, y, i };
  });
  const lastY = cards.length ? cards[cards.length - 1].y + ch + 70 * U : cardsY;
  // tall: the picture, the name and the button stacked under the cards; wide: one row under them
  const av = (wide ? 130 : 170) * U, ax = wide ? W * 0.3 : W / 2, ay = wide ? lastY + (H - lastY) / 2 : lastY + gapc + av * 0.6;
  const ring = add("abs", { width: `${av * 1.22}px`, height: `${av * 1.22}px`, borderRadius: "50%", background: `conic-gradient(${V.accent}, #fbbf24, #22d3ee, #a855f7, ${V.accent})` });
  const pic = add("pill", { width: `${av}px`, height: `${av}px`, borderRadius: "50%", border: `${6 * U}px solid ${V.c1}`,
    background: V.picture ? `center / cover url("${url(V.picture)}")` : `linear-gradient(135deg, #f472b6, ${V.accent})`, color: "#fff", font: `800 ${av * 0.42}px ${fam}` }, V.picture ? "" : esc((V.channel || "?").trim().charAt(0).toUpperCase()));
  const nm = add("t", { font: `800 ${46 * U}px ${fam}`, color: "#ffffff" }, esc(V.channel));
  const title = add("t", { font: `900 ${(wide ? 76 : 84) * U}px ${fam}`, color: "#ffffff", textAlign: "center" }, esc(V.title));
  const bh = 92 * U, bw = Math.max(300, 26 * String(V.button).length + 90) * U;
  const btn = V.button ? add("pill", { width: `${bw}px`, height: `${bh}px`, borderRadius: `${bh / 2}px`, background: V.accent, color: "#fff", font: `800 ${38 * U}px ${fam}`, letterSpacing: "0.04em", boxShadow: `0 ${10 * U}px ${30 * U}px ${V.accent}66` }, esc(V.button)) : null;
  gsap.set(ring, { x: ax - av * 0.61, y: ay - av * 0.61, transformOrigin: "50% 50%" });
  gsap.set(pic, { x: ax - av / 2, y: ay - av / 2, transformOrigin: "50% 50%" });
  if (wide) gsap.set(nm, { x: ax + av * 0.8, y: ay, yPercent: -50 }); else gsap.set(nm, { x: ax, y: ay + av * 0.7, xPercent: -50 });
  gsap.set(title, { x: W / 2, y: titleY, xPercent: -50 });
  if (btn) gsap.set(btn, wide ? { x: W * 0.7 - bw / 2, y: ay - bh / 2, transformOrigin: "50% 50%" } : { x: ax - bw / 2, y: ay + av * 0.7 + 74 * U, transformOrigin: "50% 50%" });

  // ---- the motion: the title rises (16 f, slow end); the cards slide in from the side (18 f, power3.out, 5 f apart)
  // and their play buttons breathe; the picture pops (back.out 14 f) inside its ring, which turns the whole time; the
  // name fades in, the button pops and pulses every 40 f; the background glow drifts
  const S = Math.round(V.start);
  enter(title, { opacity: 0, y: titleY + 40 * U }, { opacity: 1, y: titleY }, S, S + K(16), "power3.out");
  cards.forEach(({ c, l, x, y, i }) => {
    const f = S + K(8) + i * K(5), from = wide ? { x: x + (i ? 1 : -1) * W * 0.25 } : { x: x + (i ? 1 : -1) * W };
    enter(c, { opacity: 1, ...from, rotation: (i ? 4 : -4) }, { x, rotation: 0 }, f, f + K(18), "power3.out");
    enter(l, { opacity: 0, y: y + ch + 38 * U }, { opacity: 1, y: y + ch + 18 * U }, f + K(12), f + K(24), "power2.out");
    const pl = c.querySelector(".pl"); gsap.set(pl, { svgOrigin: "80 45" });
    for (let g = f + K(30) + i * K(10), k = 0; g + K(20) < FRAMES; g += K(20), k++) to(pl, { scale: k % 2 ? 1 : 1.18 }, g, g + K(20), "sine.inOut");
  });
  const P = S + K(22);
  enter(ring, { opacity: 1, scale: 0 }, { scale: 1 }, P, P + K(14), "back.out(1.8)");
  ft(ring, { rotation: 0 }, { rotation: 300 }, P, FRAMES, "none");
  enter(pic, { opacity: 1, scale: 0 }, { scale: 1 }, P + K(3), P + K(17), "back.out(2.2)");
  enter(nm, { opacity: 0 }, { opacity: 1 }, P + K(12), P + K(24), "power1.out");
  if (btn) {
    enter(btn, { opacity: 1, scale: 0 }, { scale: 1 }, P + K(18), P + K(30), "back.out(2.4)");
    for (let g = P + K(50); g + K(14) < FRAMES; g += K(40)) { to(btn, { scale: 1.08 }, g, g + K(6), "power2.out"); to(btn, { scale: 1 }, g + K(6), g + K(14), "power2.inOut"); }
  }
  if (V.background) ft("#glow", { x: 0, y: 0 }, { x: W * 0.25, y: H * 0.2 }, 0, FRAMES, "sine.inOut");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
