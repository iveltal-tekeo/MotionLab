<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "paper-sweep-transition" (2026-10-18): a transition between two scenes (media slots: the user's videos or pictures). Scene A pushes in
     slowly; a curved sheet tumbles in from the top right and sweeps diagonally down to the bottom left (f54-f190);
     behind it scene A blurs out, scene B crossfades in through the blur (f83-f108) and sharpens (to f165), then holds
     with a slow push. Look-aware: the sheet is paper (or a look colour) with soft shading. MotionLab's own code.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; left: 0; top: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; perspective: 1600px; }
  #sheet { position: absolute; transform-style: preserve-3d; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9.066667" data-width="1920"
     data-height="1080">
  <div id="hand" class="abs">
  <div id="sa" class="scene"></div>
  <div id="sb" class="scene"></div>
  <div id="stage"><div id="sheet"></div></div>
  </div>
</div>
<script>
  const FPS = 30, FRAMES = 272;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;

  // ---- the two scenes (media slots), full frame, cover at their focus points
  const sa = q("sa"), sb = q("sb");
  [sa, sb].forEach(s => Object.assign(s.style, { width: `${W}px`, height: `${H}px` }));
  if (window.MLLook) {
    MLLook.media(sa, V.from_media, { look: L, kind: "video", label: "scene before", fit: "cover", focus: V.from_focus, seed: 61, r: 0, slot: "from_media" });
    MLLook.media(sb, V.to_media, { look: L, kind: "video", label: "scene after", fit: "cover", focus: V.to_focus, seed: 62, r: 0, slot: "to_media", light: true });
  }
  // ---- the sheet: a bent page in 3D (MLLook.sheet: 20 strips on an arc, each shaded by how it faces the light),
  // the reference's rolled panel; a soft shadow under the whole stage
  const sw = 0.26 * W, sh = 0.72 * H, sheet = q("sheet"), base = L[V.sheet] || L.paper;
  Object.assign(q("stage").style, { width: `${W}px`, height: `${H}px`, filter: `drop-shadow(0 ${26 * U}px ${40 * U}px ${rgba("#000000", 0.30)})` });
  const page = window.MLLook ? MLLook.sheet(sheet, { w: sw, h: sh, strips: 20, color: base, look: L, U, radius: Math.max(L.radius * 2.5, 34 * U), bend: V.bend }) : null;
  // ---- the motion (30 fps frames; K() keeps them at any rate)
  const bl = V.blur * U;
  // scene A pushes in slowly; blurs out f60-f95; scene B crossfades in f83-f108 through the blur, sharpens to f165
  ft(sa, { scale: 1 }, { scale: 1.06 }, 0, K(95), "sine.inOut");
  ft(sa, { filter: "blur(0px)" }, { filter: `blur(${bl}px)` }, K(60), K(95), "power2.in");
  set(sb, { opacity: 0 }, 0);
  ft(sb, { opacity: 0, filter: `blur(${bl}px)`, scale: 1.08 }, { opacity: 1, filter: `blur(${bl * 0.7}px)`, scale: 1.05 }, K(83), K(108), "power1.inOut");
  ft(sb, { filter: `blur(${bl * 0.7}px)`, scale: 1.05 }, { filter: "blur(0px)", scale: 1.0 }, K(108), K(165), E());
  ft(sb, { scale: 1.0 }, { scale: 1.03 }, K(165), FRAMES, "sine.inOut");
  function E() { return window.MLLook ? MLLook.EASE.settle : "power3.out"; }
  // the sheet: snaps in from beyond the top right (f52-f68, decelerating), drifts slowly down-left while it turns
  // (f68-f160), then leaves past the bottom left (f160-f190, accelerating); it turns on all three axes throughout
  set(sheet, { opacity: 0 }, 0);
  set(sheet, { opacity: 1 }, K(52));
  ft(sheet, { x: 1.15 * W, y: -0.25 * H, rotation: -35 }, { x: 0.72 * W, y: 0.36 * H, rotation: -12 }, K(52), K(68), "expo.out");
  ft(sheet, { x: 0.72 * W, y: 0.36 * H, rotation: -12 }, { x: 0.30 * W, y: 0.58 * H, rotation: 58 }, K(68), K(160), "power1.inOut");
  ft(sheet, { x: 0.30 * W, y: 0.58 * H, rotation: 58 }, { x: -0.30 * W, y: 1.05 * H, rotation: 80 }, K(160), K(190), "expo.in");
  ft(sheet, { rotationY: -50, rotationX: 18 }, { rotationY: 30, rotationX: -12 }, K(52), K(190), "sine.inOut");
  if (page) {
    const bd = { b: V.bend * 1.5 };
    const draw = () => page.setBend(bd.b);
    ft(bd, { b: V.bend * 1.5 }, { b: V.bend * 0.7, onUpdate: draw }, K(52), K(110), "sine.inOut");
    ft(bd, { b: V.bend * 0.7 }, { b: V.bend * 1.2, onUpdate: draw }, K(110), K(190), "sine.inOut");
  }
  set(sheet, { opacity: 0 }, K(190));
  q("hand").style.width = `${W}px`; q("hand").style.height = `${H}px`;
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 7 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 61 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
