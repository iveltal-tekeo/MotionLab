  const LN = [[8, 0], [10, 0.018], [12, 0.043], [14, 0.068], [16, 0.097], [18, 0.126], [20, 0.162], [22, 0.197], [26, 0.272], [30, 0.34], [34, 0.438], [38, 0.526], [42, 0.614], [46, 0.7], [50, 0.771], [54, 0.847], [58, 0.905], [62, 0.957], [66, 0.985], [68, 1]];   // how much of the line is drawn
  const WR = [[0, 90], [1, 80], [2, 70], [3, 61], [4, 54], [5, 48], [6, 42], [7, 37], [8, 32], [9, 28], [10, 25], [11, 22], [12, 19], [13, 16], [14, 14], [15, 12], [16, 10], [17, 8], [18, 7], [19, 5], [20, 4], [21, 3], [22, 2], [24, 1], [27, 0]];   // a word's rise (clip px below its place) since it started
  const WO = [[0, 0], [1, 0.5], [2, 0.65], [4, 0.73], [7, 0.82], [9, 0.9], [12, 0.95], [14, 1]];                                                                                         // and its opacity
  const GD = [[30, 0], [33, 22], [36, 95], [39, 135], [42, 235], [48, 285], [54, 320], [60, 385], [66, 450], [72, 520], [81, 700], [87, 800], [91, 900], [94, 980], [97, 1100]];       // how far round the edge the light has got (clip px, counter-clockwise from the top centre)

  let ready = false;
  function layout() { ready = true; }
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    const on = g >= 0;
    GRP.style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    const dy = (tab(RISE, g)[0] + (V.lift ? tab(LIFT, g)[0] : 0)) * K;
    card.style.transform = `translateY(${dy.toFixed(2)}px)`;
    const vis = tab(LN, g)[0] * LEN;
    pl.setAttribute("stroke-dasharray", `${vis.toFixed(2)} ${(LEN * 2 + 10).toFixed(2)}`);
    pl.style.visibility = vis > 0.5 ? "visible" : "hidden";
    TWD.forEach((w, i) => {
      const tau = g - (42.5 + WSTEP * i);
      const o = tau <= 0 ? 0 : tab(WO, tau)[0];
      w.style.opacity = o.toFixed(3);
      w.style.transform = `translateY(${(tab(WR, Math.max(0, tau))[0] * K).toFixed(2)}px)`;
    });
    if (V.glint) {
      const d = tab(GD, g)[0] * K;
      GLN.forEach(o => { o.p.setAttribute("stroke-dasharray", `${o.len.toFixed(2)} ${(PER + 50).toFixed(2)}`);
        o.p.setAttribute("stroke-dashoffset", (-(OFF0 + d - o.len / 2)).toFixed(2)); });
    }
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 16, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 43 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
