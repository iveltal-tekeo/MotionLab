<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "photos", "type": "string", "label": "Pictures in the graphic’s assets folder (| between; empty = colour art)", "default": ""},
  {"id": "count", "type": "number", "label": "Pictures (without your own: how many art cards)", "default": 5, "min": 1, "max": 12, "step": 1},
  {"id": "frame", "type": "boolean", "label": "A white border, like a print", "default": true},
  {"id": "caption", "type": "string", "label": "A line under the pile (empty = none)", "default": "summer ’26"},
  {"id": "font", "type": "enum", "label": "Caption font", "default": "Permanent Marker", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "text_color", "type": "color", "label": "Caption colour", "default": "#1a1a1a"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#efede8"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 2, "step": 0.05},
  {"id": "ratio", "type": "enum", "label": "Picture shape", "default": "portrait", "options": [{"value": "portrait", "label": "Portrait 4:5"}, {"value": "square", "label": "Square"}, {"value": "landscape", "label": "Landscape 3:2"}]},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 46, "min": 0, "max": 100, "step": 1},
  {"id": "gap", "type": "number", "label": "Frames between pictures", "default": 18, "min": 2, "max": 300, "step": 1},
  {"id": "start", "type": "number", "label": "First picture at frame", "default": 2, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "photo-shuffle" (0.5.0, the Motion Graphics library): pictures land on a pile one after
     another - each flies in from off the frame with a spin, overshoots a little and settles tilted (every one a
     different angle, seeded), its shadow growing as it lands; the pile drifts closer the whole time. Learned from
     social__image-shuffle (product photos shuffling in tilted one after another, f44-f139 (00:00:01:19-00:00:05:14) at
     25 fps), social__instagram-story-3-images (photos sliding in and stacking) and graphics__apple-folder-open (photos
     fanning out and settling in a tilted pile). MotionLab's own code: your pictures go in the graphic's assets folder
     (Claude puts them there), nothing is drawn from the original's photos. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .ph { position: absolute; left: 0; top: 0; }
  .ph .im { width: 100%; height: 100%; background-size: cover; background-position: center; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="pile" class="abs"></div><div id="cap" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam", "#pile"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const own = (V.photos || "").split("|").map(x => x.trim().replace(/"/g, "")).filter(Boolean);
  const n = own.length || Math.max(1, Math.round(V.count)), s = V.size;
  const ar = { portrait: 1.25, square: 1, landscape: 2 / 3 }[V.ratio] || 1.25;
  const pw = W * 0.56 * s, ph = pw * ar, b = V.frame ? pw * 0.045 : 0, cx = W / 2, cy = H * V.y / 100;
  // colour art for the empty template: a sky, a sun, two hills - a different palette per card
  const ART = [["#ffb88c", "#de6262", "#ffe29f", "#5b3a29"], ["#a1c4fd", "#c2e9fb", "#fff6b7", "#2f6f5e"], ["#f6d365", "#fda085", "#fff1c1", "#6b4226"],
               ["#89f7fe", "#66a6ff", "#ffffff", "#1f3b73"], ["#fbc2eb", "#a6c1ee", "#fff3d6", "#4b3f72"], ["#d4fc79", "#96e6a1", "#fffbe0", "#2b5a3a"]];
  const art = i => { const [a, c, sun, hill] = ART[i % ART.length];
    return `radial-gradient(ellipse 60% 30% at ${30 + (i * 23) % 40}% 100%, ${hill} 70%, transparent 71%), radial-gradient(ellipse 80% 28% at ${70 - (i * 17) % 40}% 104%, ${hill}cc 70%, transparent 71%), radial-gradient(circle at ${60 - (i * 11) % 30}% 38%, ${sun} 9%, transparent 10%), linear-gradient(180deg, ${a}, ${c})`; };
  const R = rnd(61), pile = q("pile"), cards = [];
  for (let i = 0; i < n; i++) {
    const e = document.createElement("div");
    e.className = "ph";
    e.innerHTML = `<div class="im"></div>`;
    Object.assign(e.style, { width: `${pw}px`, height: `${ph}px`, padding: `${b}px ${b}px ${V.frame ? b * 3.2 : 0}px`, background: V.frame ? "#fbfaf7" : "transparent",
      boxShadow: `0 ${18 * U}px ${44 * U}px rgba(0,0,0,.22)`, borderRadius: `${V.frame ? 4 * U : 18 * U}px` });
    Object.assign(e.firstChild.style, own.length ? { backgroundImage: `url("${own[i]}")` } : { background: art(i) }, { borderRadius: V.frame ? "0" : `${18 * U}px` });
    if (V.frame) e.style.height = `${ph + b * 2.2}px`;
    pile.appendChild(e);
    const rot = (R() - 0.5) * 22, dx = (R() - 0.5) * 70 * U * s, dy = (R() - 0.5) * 50 * U * s;
    const from = [[-1, -0.2], [1, -0.4], [-0.6, 1], [0.8, 0.9], [0, -1]][i % 5];      // in from a side, a different one each time
    gsap.set(e, { x: cx - pw / 2 + dx, y: cy - ph / 2 + dy, rotation: rot, transformOrigin: "50% 50%" });
    cards.push({ e, rot, dx, dy, from });
  }
  const cap = q("cap");
  cap.textContent = V.caption || "";
  Object.assign(cap.style, { font: `400 ${64 * U * s}px "${V.font}", "Segoe UI", sans-serif`, color: V.text_color });
  gsap.set(cap, { x: cx, y: cy + ph / 2 + 110 * U * s, xPercent: -50, rotation: -4 });

  // ---- the motion: card i at S + i * gap flies in (18 frames, a slow end, a quarter-turn of spin), overshoots its
  // tilt by 4 degrees and settles (8 frames); the pile drifts closer; the caption is written last
  const S = Math.round(V.start), G = Math.max(K(2), Math.round(V.gap * FPS / 30));
  cards.forEach(({ e, rot, dx, dy, from }, i) => {
    const f0 = S + i * G, x1 = cx - pw / 2 + dx, y1 = cy - ph / 2 + dy;
    enter(e, { opacity: 1, x: x1 + from[0] * W * 0.95, y: y1 + from[1] * H * 0.6, rotation: rot - 70 * (from[0] || 1), scale: 1.12 },
             { x: x1, y: y1, rotation: rot + 4 * Math.sign(rot || 1), scale: 1 }, f0, f0 + K(18), "power3.out");
    to(e, { rotation: rot }, f0 + K(18), f0 + K(26), "power2.inOut");
  });
  if (V.caption) {
    const fc = S + n * G + K(8);
    enter(cap, { opacity: 0, scale: 0.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -4 }, fc, fc + K(12), "back.out(2.4)");
  }
  to("#pile", { scale: 1.05, transformOrigin: `50% ${V.y}%` }, S, FRAMES, "sine.inOut");
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
