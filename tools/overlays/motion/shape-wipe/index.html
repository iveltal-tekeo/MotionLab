<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "mode", "type": "enum", "label": "Shape", "default": "bars", "options": [{"value": "bars", "label": "Bars - they grow one after another, then slide on out"}, {"value": "circle", "label": "Circle - grows from a point, then a hole opens"}, {"value": "diagonal", "label": "Diagonal - a slanted panel sweeps across"}, {"value": "split", "label": "Split - two halves close, then open"}, {"value": "stripes", "label": "Stripes - thin stripes from both sides"}]},
  {"id": "direction", "type": "enum", "label": "Direction", "default": "right", "options": [{"value": "right", "label": "To the right"}, {"value": "left", "label": "To the left"}, {"value": "down", "label": "Down"}, {"value": "up", "label": "Up"}]},
  {"id": "c1", "type": "color", "label": "Front colour", "default": "#111111"},
  {"id": "c2", "type": "color", "label": "Back colour (the layer just ahead of it)", "default": "#ff5a36"},
  {"id": "layers", "type": "number", "label": "Layers (1 or 2)", "default": 2, "min": 1, "max": 2, "step": 1},
  {"id": "pieces", "type": "number", "label": "Bars / stripes", "default": 6, "min": 2, "max": 24, "step": 1},
  {"id": "x", "type": "number", "label": "Circle centre across (%)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Circle centre down (%)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "text", "type": "string", "label": "Words while it covers (empty = none)", "default": ""},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "ink", "type": "color", "label": "Words colour", "default": "#ffffff"},
  {"id": "cover_frames", "type": "number", "label": "Frames to cover", "default": 12, "min": 2, "max": 120, "step": 1},
  {"id": "hold_frames", "type": "number", "label": "Frames fully covered", "default": 6, "min": 0, "max": 300, "step": 1},
  {"id": "reveal", "type": "boolean", "label": "Clears again (off = stays covered)", "default": true},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": false},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#d9dce3"},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "shape-wipe" (0.5.0, the Motion Graphics library): a transition to put over a cut - bars,
     a circle, a slanted panel, two halves or thin stripes cover the frame (in two colour layers, 3 frames apart), hold,
     then clear the other way. Put the cut where the frame is fully covered: from start + 3 + cover_frames for
     hold_frames frames. Not learned from a clip: shape transitions are a main category on Mixkit, Envato Elements and
     Motion Array (researched 2026-10-16). MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .pc { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1.6" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="wipe" class="abs"></div>
  <div id="tx" class="t"></div>
</div>
<script>
  const FPS = 30, FRAMES = 48;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#wipe"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const mode = V.mode, dir = V.direction, horiz = dir === "left" || dir === "right", sgn = dir === "right" || dir === "down" ? 1 : -1;
  const S = Math.round(V.start), C = Math.max(K(2), Math.round(V.cover_frames * FPS / 30)), HOLD = Math.round(V.hold_frames * FPS / 30), LAG = K(3);
  const nl = Math.round(V.layers) >= 2 ? 2 : 1, cols = nl === 2 ? [V.c2, V.c1] : [V.c1];      // back layer first, front on top
  const n = Math.max(2, Math.round(V.pieces));
  const div = (parent, st) => { const e = document.createElement("div"); e.className = "pc"; Object.assign(e.style, st); parent.appendChild(e); return e; };
  const ox = W * V.x / 100, oy = H * V.y / 100, D = 2 * Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([a, b]) => Math.hypot(a - ox, b - oy))) + 8;

  // ---- the motion, per layer (the front one LAG frames after the back one): cover C frames (power3.inOut), hold, clear
  // C frames the other way (the front layer first, so the back colour flashes through); bars / stripes are staggered
  // across the cover time (each piece 70 % of it)
  cols.forEach((col, li) => {
    const lay = div(q("wipe"), { width: `${W}px`, height: `${H}px` });
    const c0 = S + li * LAG, r0 = S + (nl - 1) * LAG + C + HOLD + (nl - 1 - li) * LAG;        // its cover start, its clear start
    const clear = V.reveal && r0 + C <= FRAMES;
    const pieceT = Math.max(K(2), Math.round(C * 0.7)), stag = (C - pieceT) / Math.max(1, n - 1);
    if (mode === "bars" || mode === "stripes") {
      const along = mode === "stripes" ? !horiz : horiz;       // bars stand across the move; stripes lie along it
      for (let i = 0; i < n; i++) {
        const k = sgn > 0 ? i : n - 1 - i;
        const st = along ? { left: `${W * k / n}px`, top: "0", width: `${W / n + 1}px`, height: `${H}px` } : { left: "0", top: `${H * k / n}px`, width: `${W}px`, height: `${H / n + 1}px` };
        const e = div(lay, { ...st, background: col });
        const alt = mode === "stripes" ? (i % 2 ? 1 : -1) : sgn;
        const prop = mode === "stripes" ? (horiz ? "scaleY" : "scaleX") : (along ? "scaleY" : "scaleX");
        const o1 = prop === "scaleY" ? (alt > 0 ? "50% 0%" : "50% 100%") : (alt > 0 ? "0% 50%" : "100% 50%");
        const o2 = prop === "scaleY" ? (alt > 0 ? "50% 100%" : "50% 0%") : (alt > 0 ? "100% 50%" : "0% 50%");
        const f0 = c0 + Math.round(i * stag), g0 = r0 + Math.round(i * stag);
        gsap.set(e, { [prop]: 0, transformOrigin: o1 });
        ft(e, { [prop]: 0 }, { [prop]: 1 }, f0, f0 + pieceT, "power3.inOut");
        if (clear) { set(e, { transformOrigin: o2 }, g0); to(e, { [prop]: 0 }, g0, g0 + pieceT, "power3.inOut"); }
      }
    } else if (mode === "circle") {
      const e = div(lay, { width: `${D}px`, height: `${D}px`, borderRadius: "50%", background: col });
      gsap.set(e, { x: ox - D / 2, y: oy - D / 2, scale: 0, transformOrigin: "50% 50%" });
      ft(e, { scale: 0 }, { scale: 1 }, c0, c0 + C, "power3.inOut");
      if (clear) {                                              // the hole: a ring of colour whose middle grows
        const hole = div(lay, { width: "0px", height: "0px", borderRadius: "50%", boxShadow: `0 0 0 ${D}px ${col}` });
        gsap.set(hole, { x: ox, y: oy, xPercent: -50, yPercent: -50, opacity: 0 });
        set(hole, { opacity: 1 }, r0); set(e, { opacity: 0 }, r0);
        ft(hole, { width: 0, height: 0 }, { width: D, height: D }, r0, r0 + C, "power3.inOut");
      }
    } else if (mode === "diagonal") {
      const pw = (horiz ? W : H) * 1.9, slant = 0.35;
      const e = div(lay, horiz ? { width: `${pw}px`, height: `${H * 1.4}px`, background: col } : { width: `${W * 1.4}px`, height: `${pw}px`, background: col });
      const off = (horiz ? W : H) * (1 + slant) + pw * 0.3;   // 0.3: the skewed edge reaches ~0.24 pw past the box
      const base = horiz ? { y: -H * 0.2, skewX: -20 * sgn } : { x: -W * 0.2, skewY: -20 * sgn };
      const k = horiz ? "x" : "y", mid = horiz ? -(pw - W) / 2 : -(pw - H) / 2;
      gsap.set(e, { ...base, [k]: mid - sgn * off });
      ft(e, { [k]: mid - sgn * off }, { [k]: mid }, c0, c0 + C, "power3.inOut");
      if (clear) to(e, { [k]: mid + sgn * off }, r0, r0 + C, "power3.inOut");
    } else {                                                    // split: two halves meet in the middle
      const a = div(lay, horiz ? { width: `${W / 2 + 1}px`, height: `${H}px`, background: col } : { width: `${W}px`, height: `${H / 2 + 1}px`, background: col });
      const b = div(lay, horiz ? { left: `${W / 2}px`, width: `${W / 2}px`, height: `${H}px`, background: col } : { top: `${H / 2}px`, width: `${W}px`, height: `${H / 2}px`, background: col });
      const k = horiz ? "x" : "y", half = (horiz ? W : H) / 2 + 2;
      gsap.set(a, { [k]: -half }); gsap.set(b, { [k]: half });
      ft(a, { [k]: -half }, { [k]: 0 }, c0, c0 + C, "power3.inOut"); ft(b, { [k]: half }, { [k]: 0 }, c0, c0 + C, "power3.inOut");
      if (clear) { to(a, { [k]: -half }, r0, r0 + C, "power3.inOut"); to(b, { [k]: half }, r0, r0 + C, "power3.inOut"); }
    }
  });
  if (V.text) {
    const t = q("tx"); t.textContent = V.text;
    Object.assign(t.style, { font: `900 ${110 * U}px '${V.font}', 'Segoe UI', sans-serif`, color: V.ink, letterSpacing: "-0.01em" });
    gsap.set(t, { x: W / 2, y: H / 2, xPercent: -50, yPercent: -50, opacity: 0 });
    const full = S + (nl - 1) * LAG + C, r = full + HOLD;
    ft(t, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1 }, Math.max(S, full - K(6)), full + K(2), "back.out(2)");
    if (V.reveal) to(t, { opacity: 0, scale: 1.08 }, r, r + K(5), "power2.in");
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
