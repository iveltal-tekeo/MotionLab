<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "words", "type": "string", "label": "Words (| between; one pill each)", "default": "LOVE|SWISHY|LOVE|SWISHY|LOVE|SWISHY"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Space Mono", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "pill", "type": "color", "label": "Pill colour", "default": "#d7ff1f"},
  {"id": "ink", "type": "color", "label": "Letters and lines", "default": "#1a1a1a"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#dfe1e4"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 2, "step": 0.05},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 45, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Comes in at frame", "default": 0, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "stretch-pills" (0.5.0, the Motion Graphics library): words on bright pills whose letters
     sit far apart with thin lines between them; the pills grow in one after another, then stretch wide and narrow like
     elastic on different beats - the letters slide with the pill (they are spread across its width, so the layout
     does it, no measuring). Learned from text__create-a-stretchy-animation-like-this (lime pills "L-O-V-E" and
     "S-W-I-S-H-Y" stretching wider and narrower, a single pill at f135-f264 growing back into the stack). MotionLab's
     own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; overflow: hidden; }
  .ch { flex: none; line-height: 1; font-synthesis: none; }
  .ln { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"></div>
</div>
<script>
  const FPS = 30, FRAMES = 180;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Courier New", monospace`;

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const words = String(V.words || "WORD").split("|").map(x => x.trim().toUpperCase()).filter(Boolean);
  const s = V.size, ph = 64 * U * s, gap = 16 * U * s, fs = 30 * U * s, n = words.length;
  const wide = W * 0.9 * Math.min(1.05, s), narrow = W * 0.42 * s, cy = H * V.y / 100, top0 = cy - (n * ph + (n - 1) * gap) / 2;   // not "top": a global const named like window.top stops the whole script
  const cam = document.getElementById("cam"), pills = [];
  words.forEach((w, i) => {
    const p = document.createElement("div"); p.className = "pill";
    Object.assign(p.style, { height: `${ph}px`, borderRadius: `${ph / 2}px`, background: V.pill, padding: `0 ${ph * 0.45}px`, gap: `${fs * 0.3}px` });
    [...w].forEach((c, k) => {
      if (k) { const l = document.createElement("div"); l.className = "ln"; Object.assign(l.style, { height: `${Math.max(1.5, 2 * U)}px`, background: V.ink, opacity: 0.85 }); p.appendChild(l); }
      const e = document.createElement("div"); e.className = "ch"; e.textContent = c;
      Object.assign(e.style, { font: `700 ${fs}px ${fam}`, color: V.ink }); p.appendChild(e);
    });
    cam.appendChild(p);
    gsap.set(p, { width: wide * (0.75 + 0.25 * ((i * 37) % 10) / 10), x: W / 2, xPercent: -50, y: top0 + i * (ph + gap) });
    pills.push(p);
  });

  // ---- the motion: pills grow in from narrow (back.out, 3 frames apart); then every pill stretches between wide and
  // narrow on its own beat (S-curves 20-28 frames), so the stack ripples; a squeeze to one pill and back mid-way
  const S = Math.round(V.start);
  pills.forEach((p, i) => {
    const f0 = S + i * K(3), w0 = parseFloat(gsap.getProperty(p, "width"));
    enter(p, { opacity: 1, width: ph * 1.2 }, { width: w0 }, f0, f0 + K(16), "back.out(1.4)");
    let f = f0 + K(16) + K(4) + i * K(4), wideNow = false, k = 0;
    while (f + K(20) < FRAMES) {
      const len = K(20 + ((i + k) % 3) * 4);
      to(p, { width: wideNow ? wide * (0.8 + 0.2 * ((i + k) % 2)) : narrow * (0.7 + 0.3 * ((i * 3 + k) % 4) / 3) }, f, Math.min(FRAMES, f + len), "power3.inOut");
      f += len + K(2); wideNow = !wideNow; k++;
    }
  });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
