<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "line-chart-draw" (2026-10-23): a dashed grid with two axes and the names stacked under it stands on a dark page from the first frame; a
     thick line is drawn from point to point (the first move f3-f16, then one every ~20 f, each move ~10 f with a
     steep S-curve and a long soft tail; the line updates every 2nd frame, as the original does) and every point
     shows its number, counting up quickly (f7, f26, f45, f63 ... one every ~18 f); the whole chart floats about 10
     px to the end (measured, 1280 x 720 units). The names, the numbers and how many points are settings. Look-aware.
     MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #ch { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #sv { position: absolute; left: 0; top: 0; overflow: visible; }
  .vl { position: absolute; white-space: nowrap; line-height: 1; font-synthesis: none; text-align: center; }
  .st { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"><div id="ch"><svg id="sv" width="1920" height="1080" viewBox="0 0 1280 720"></svg></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 300;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  // a CSS-style cubic-bezier as a GSAP ease (the reference's measured curve)
  const bz = (x1, y1, x2, y2) => t => { let s = t; for (let i = 0; i < 8; i++) { const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s - t;
    const d = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2); if (Math.abs(d) < 1e-6) break; s = Math.min(1, Math.max(0, s - x / d)); }
    return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s; };
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const rgba = (h, a) => window.MLLook ? MLLook.rgba(h, a) : h;
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };
  const S0 = Math.round(V.start);
  const K = W / 1280;                                       // the reference is 1280 x 720: its numbers below are in those units
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  const pick = { paper: glare, signal: L.signal, mustard: L.mustard, deep: L.deep };
  const col = pick[V.line_col] || L.signal;
  const labs = String(V.labels == null ? "" : V.labels).split("|").map(x => x.trim());
  if (labs.length === 1 && labs[0] === "") labs.length = 0;
  const vals = String(V.values == null ? "" : V.values).split("|").map(x => parseFloat(x));
  const N = Math.max(2, Math.min(14, labs.length || vals.length || 12));
  const MAXV = Math.max(1e-6, V.max);
  const unit = String(V.unit == null ? "" : V.unit);
  const fmtv = x => Number.isInteger(x) ? String(x) : String(Math.round(x * 10) / 10);

  // ---- the ground: a dark page with a faint glow of the line colour in the middle
  const ground = q("bgfill");
  Object.assign(ground.style, { width: `${W}px`, height: `${H}px` });
  if (V.background) ground.style.background = `radial-gradient(ellipse 62% 62% at 50% 46%, ${rgba(col, 0.1)} 0%, ${rgba(col, 0)} 100%), ${night}`;

  // ---- the chart (clip units): axis x = 240.5, baseline y = 549, the points run from x = 300 to 1033 and from y = 536 (0) up by 331 (the top of the scale)
  const NS = "http://www.w3.org/2000/svg";
  const sv = q("sv"), ch = q("ch");
  const mkS = (tag, at, parent) => { const e = document.createElementNS(NS, tag); Object.keys(at).forEach(k => e.setAttribute(k, at[k])); (parent || sv).appendChild(e); return e; };
  const PX = i => 300 + i * 733 / (N - 1);
  const PY = v => 536 - clamp01(v / MAXV) * 331;
  const P = Array.from({ length: N }, (_, i) => { const v = vals[i] >= 0 ? vals[i] : 0; return { x: PX(i), y: PY(v), v }; });
  const dash = "8 6";
  for (let i = 0; i < N; i++) mkS("line", { x1: PX(i) - 5, y1: 118, x2: PX(i) - 5, y2: 594, stroke: rgba(col, 0.78), "stroke-width": 1.7, "stroke-dasharray": dash });
  for (let j = 0; j < 7; j++) { const y = 157 + 56.5 * j; mkS("line", { x1: 206, y1: y, x2: 1066, y2: y, stroke: rgba(col, 0.78), "stroke-width": 1.7, "stroke-dasharray": dash }); }
  mkS("line", { x1: 240.5, y1: 110, x2: 240.5, y2: 598, stroke: rgba(col, 0.9), "stroke-width": 2.2 });
  mkS("line", { x1: 188, y1: 549, x2: 1082, y2: 549, stroke: rgba(col, 0.9), "stroke-width": 2.8 });
  const lw = V.line_w * U / K;
  const line = mkS("path", { d: "M0 0", fill: "none", stroke: col, "stroke-width": lw, "stroke-linecap": "round", "stroke-linejoin": "round" });
  line.style.visibility = "hidden";

  // ---- the names under the grid (stacked letters like the original, or a plain line when a name is long) and the numbers on the points
  const mfs = V.month_size * U;
  const names = labs.length ? labs : Array.from({ length: N }, () => "");
  const stacks = [];
  for (let i = 0; i < N; i++) {
    const nm = String(names[i] == null ? "" : names[i]);
    const letters = Array.from(nm.replace(/[*_=^]/g, "")).filter(c => c.trim() !== "");
    if (V.stack && letters.length > 0 && letters.length <= 5) {
      const d = document.createElement("div"); d.className = "st ml-body";
      Object.assign(d.style, { left: `${(PX(i) - 6) * K}px`, top: `${604 * K}px`, fontSize: `${mfs}px`, fontWeight: String(fw(V.body_font, 500)), color: glare, textTransform: "uppercase" });
      letters.forEach(c => { const e = document.createElement("div"); e.textContent = c; e.style.lineHeight = "0.93"; e.style.letterSpacing = "0"; d.appendChild(e); });
      ch.appendChild(d); stacks.push({ el: d, plain: false });
    } else {
      const d = document.createElement("div"); d.className = "vl ml-body";
      Object.assign(d.style, { left: "0px", top: `${604 * K}px`, fontSize: `${mfs}px`, fontWeight: String(fw(V.body_font, 500)), color: glare, textTransform: "uppercase" });
      if (window.MLLook) MLLook.rich(d, nm, { look: L, family: V.body_font, weight: 500 }); else d.textContent = nm;
      ch.appendChild(d); stacks.push({ el: d, plain: true, cx: (PX(i) - 6) * K });
    }
  }
  const lfs = V.label_size * U;
  const nums = P.map(p => { const d = document.createElement("div"); d.className = "vl ml-body";
    Object.assign(d.style, { left: `${p.x * K}px`, top: `${(p.y - 3) * K}px`, fontSize: `${lfs}px`, fontWeight: String(fw(V.body_font, 500)), color: glare, opacity: 0, transform: "translate(-50%, -50%)", display: V.show_values ? "block" : "none" });
    ch.appendChild(d); return d; });

  // ---- the measured timing (frames; g = the frame minus "Starts at frame")
  // each move from a point to the next: [start, end] - a steep S-curve with soft ends (the line is drawn in bursts); after the last measured one, a move every 19.5 f
  const WIN = [[3, 16], [26, 38], [47, 58], [66, 76], [87, 99], [107, 115], [128, 136], [147, 158], [167, 178], [187, 197], [205, 218]];
  const win = k => k < WIN.length ? WIN[k] : [WIN[10][0] + 19.5 * (k - 10), WIN[10][0] + 19.5 * (k - 10) + 12];
  const LF = k => k < 12 ? [7, 26, 45, 63, 82, 97, 118, 138, 157, 174, 193, 210][k] : 210 + 18.5 * (k - 11);   // when each number shows up
  const ease = bz(0.5, 0.2, 0.38, 0.99);
  // the measured float of the whole chart (clip px; every part moves together)
  const DRIFT = [[0, -4.3, 8.5], [6, -2.8, 3.9], [12, 0.5, 2.2], [18, 4.5, -0.1], [24, 8.2, -4.2], [30, 10.7, -1.2], [36, 11.7, -2], [42, 11.7, 0.1], [48, 9.5, -0.1], [54, 7, 3.2], [60, 3.5, 10.5], [66, 1.6, 11],
    [72, -0.6, 10.6], [78, -2.4, 13.1], [84, -3.4, 12.1], [90, -2.8, 11.6], [96, -1.9, 10.6], [102, 0.2, 10.7], [108, 2.5, 12.4], [114, 5.6, 12.7], [120, 8.7, 13.7], [126, 9.7, 13.7], [132, 10.8, 14.2],
    [138, 11.8, 15.9], [144, 12.7, 12.5], [150, 12.3, 12.4], [156, 12.6, 8.3], [162, 10.7, 6.1], [168, 8.2, 5.4], [174, 5.3, 3], [180, 2.2, 5.3], [186, 0.2, 6.2], [192, -1.3, 7.4], [198, -2.4, 7.1],
    [204, -1.6, 10.9], [210, -0.5, 9.1], [216, 0.4, 11.2], [222, 2.2, 8.6], [228, 2.9, 8.7], [234, 3, 8.6], [240, 1.8, 10], [246, 0.7, 11.6], [252, -2.8, 10.9], [258, -6.2, 13.1], [264, -9.1, 15.3],
    [270, -9.4, 10], [276, -9.5, 8.6], [282, -9.6, 7.9], [288, -6.5, 6.3], [294, -2.6, 2], [299, 0, 0]];

  let ready = false;
  function layout() {                                       // plain (long) names are measured here, with the real fonts: nothing may overflow
    const room = (733 / (N - 1)) * K * 0.92;
    stacks.forEach(s => { if (!s.plain) return; const w = s.el.offsetWidth, h = s.el.offsetHeight, sc = w > room ? room / w : 1;
      s.el.style.left = `${s.cx - w / 2}px`; s.el.style.transformOrigin = "50% 0%"; s.el.style.transform = sc < 1 ? `scale(${sc.toFixed(4)})` : "none"; });
    ready = true;
  }
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S0;
    const on = g >= 0;
    ch.style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    const d = tab(DRIFT, g), fl = V.float;
    ch.style.transform = `translate(${(d[0] * K * fl).toFixed(2)}px, ${(d[1] * K * fl).toFixed(2)}px)`;
    const gq = V.smooth ? g : (g % 2 === 1 ? g : g - 1);                 // the original is drawn on twos
    // where the head of the line is, in points (0 .. N-1)
    let s = 0;
    for (let k = 0; k < N - 1; k++) { const w = win(k); s += ease(clamp01((gq - w[0]) / (w[1] - w[0]))); }
    if (gq < 3) { line.style.visibility = "hidden"; }
    else {
      const kf = Math.min(N - 1, Math.floor(s + 1e-9)), fr = kf >= N - 1 ? 0 : s - kf;
      let dd = `M${P[0].x.toFixed(2)} ${P[0].y.toFixed(2)}`;
      for (let i = 1; i <= kf; i++) dd += ` L${P[i].x.toFixed(2)} ${P[i].y.toFixed(2)}`;
      if (fr > 0) dd += ` L${(P[kf].x + (P[kf + 1].x - P[kf].x) * fr).toFixed(2)} ${(P[kf].y + (P[kf + 1].y - P[kf].y) * fr).toFixed(2)}`;
      else if (kf === 0) dd += ` L${(P[0].x + 0.01).toFixed(2)} ${P[0].y.toFixed(2)}`;
      line.setAttribute("d", dd); line.style.visibility = "visible";
    }
    if (V.show_values) nums.forEach((el, k) => {
      const lf = LF(k), a = clamp01((gq - lf + 1) / 5);
      el.style.opacity = a.toFixed(3);
      if (a <= 0) return;
      const c = clamp01((gq - lf) / 6), tv = P[k].v;
      const shown = c >= 1 || !(tv >= 1) ? tv : Math.max(1, Math.round(tv * c * c * c));
      el.textContent = fmtv(shown) + unit;
    });
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the long names are
  // measured here, with the real fonts
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 500, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
