<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "look", "type": "enum", "label": "Look", "default": "tile", "options": [{"value": "tile", "label": "Tile - an app-style tile with letters, glowing"}, {"value": "warning", "label": "Warning - a triangle that pulses"}, {"value": "symbol", "label": "Symbol - a big symbol or emoji on a disc"}]},
  {"id": "letters", "type": "string", "label": "Letters / symbol", "default": "Ed"},
  {"id": "label", "type": "string", "label": "A line under it (empty = none)", "default": ""},
  {"id": "color", "type": "color", "label": "Main colour", "default": "#31a8ff"},
  {"id": "tile", "type": "color", "label": "Tile colour (tile look)", "default": "#001e36"},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "pulses", "type": "boolean", "label": "Keeps pulsing during the hold", "default": true},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#0b0d12"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "x", "type": "number", "label": "Centre across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 45, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Pops at frame", "default": 4, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "icon-pop" (0.5.0, the Motion Graphics library): one icon, made to matter. Tile: a rounded
     tile with letters (an app, a tool, a skill) pops in, its glow swells and breathes. Warning: a red triangle with "!"
     punches in, shakes, and pulses with a glow ring. Symbol: a big symbol or emoji on a soft disc pops and bobs.
     Learned from social__photoshop-animation and social__premiere-pro-animation (an app tile glowing in and out on
     dark) and overlays__error-error (a red warning triangle pulsing with a glow on white). MotionLab's own code - make
     your own letters; no app's logo. Size-independent; an overlay (background off) or a scene. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #ic { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; line-height: 1; font-synthesis: none; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="glow" class="abs"></div><div id="rings" class="abs"></div><div id="ic"></div><div id="lb" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", "Segoe UI Emoji", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam", "#rings"], { width: W, height: H });
  const look = V.look, s = V.size, cx = W * V.x / 100, cy = H * V.y / 100;
  gsap.set("#bgfill", { background: V.background ? (look === "warning" && V.bg === "#0b0d12" ? "#ffffff" : V.bg) : "transparent" });
  const D = 300 * U * s, ic = q("ic");
  if (look === "tile") {
    Object.assign(ic.style, { width: `${D}px`, height: `${D}px`, borderRadius: `${D * 0.22}px`, background: V.tile, border: `${D * 0.03}px solid ${V.color}`,
      color: V.color, font: `700 ${D * 0.42}px ${fam}`, boxShadow: `0 0 ${60 * U}px ${V.color}66, inset 0 0 ${30 * U}px ${V.color}22` });
    ic.textContent = V.letters;
  } else if (look === "warning") {
    ic.innerHTML = `<svg width="${D}" height="${D}" viewBox="0 0 24 24"><path d="M12 2.8 22.2 20.5H1.8z" fill="none" stroke="${V.color === "#31a8ff" ? "#ff3b3b" : V.color}" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v5.6" stroke="${V.color === "#31a8ff" ? "#ff3b3b" : V.color}" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.15" fill="${V.color === "#31a8ff" ? "#ff3b3b" : V.color}"/></svg>`;
    Object.assign(ic.style, { width: `${D}px`, height: `${D}px`, filter: `drop-shadow(0 0 ${18 * U}px ${V.color === "#31a8ff" ? "#ff3b3b" : V.color}99)` });
  } else {
    Object.assign(ic.style, { width: `${D}px`, height: `${D}px`, borderRadius: "50%", background: `radial-gradient(circle at 35% 30%, #ffffff33, ${V.color}55 60%, ${V.color}22)`,
      font: `800 ${D * 0.5}px ${fam}`, color: V.color });
    ic.textContent = V.letters;
  }
  gsap.set(ic, { x: cx - D / 2, y: cy - D / 2, transformOrigin: "50% 50%" });
  const gc = look === "warning" ? (V.color === "#31a8ff" ? "#ff3b3b" : V.color) : V.color;
  Object.assign(q("glow").style, { width: `${D * 2.6}px`, height: `${D * 2.6}px`, borderRadius: "50%", background: `radial-gradient(circle, ${gc}55, transparent 62%)` });
  gsap.set("#glow", { x: cx - D * 1.3, y: cy - D * 1.3, opacity: 0, transformOrigin: "50% 50%" });
  const rings = [0, 1].map(() => { const r = document.createElement("div"); r.className = "abs";
    Object.assign(r.style, { width: `${D * 1.2}px`, height: `${D * 1.2}px`, borderRadius: look === "tile" ? `${D * 0.28}px` : "50%", border: `${4 * U * s}px solid ${gc}` });
    q("rings").appendChild(r); gsap.set(r, { x: cx - D * 0.6, y: cy - D * 0.6, opacity: 0, transformOrigin: "50% 50%" }); return r; });
  if (V.label) { const lb = q("lb"); lb.textContent = V.label;
    Object.assign(lb.style, { font: `600 ${40 * U * s}px ${fam}`, color: look === "warning" && V.bg === "#0b0d12" ? "#222" : "#fff", opacity: 0.85 });
    gsap.set(lb, { x: cx, y: cy + D * 0.75, xPercent: -50 }); }

  // ---- the motion: the pop (to 1.15 in 8 f, settle back.out 10 f) with a glow swell; warning adds a shake; then the
  // pulse every 36 frames (a ring goes out, the glow breathes) or a slow bob
  const S = Math.round(V.start);
  enter(ic, { opacity: 1, scale: 0, rotation: look === "tile" ? -12 : 0 }, { scale: 1.15, rotation: 0 }, S, S + K(8), "power3.out");
  to(ic, { scale: 1 }, S + K(8), S + K(18), "back.out(3)");
  ft("#glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1 }, S + K(2), S + K(16), "power2.out");
  if (look === "warning") [-14, 12, -8, 5, 0].forEach((x, i) => to(ic, { x: cx - D / 2 + x * U * s }, S + K(18) + i * K(2), S + K(20) + i * K(2), "sine.inOut"));
  if (V.label) enter("#lb", { opacity: 0, y: cy + D * 0.75 + 16 * U }, { opacity: 0.85, y: cy + D * 0.75 }, S + K(12), S + K(24), "power2.out");
  if (V.pulses) for (let f = S + K(28), k = 0; f + K(30) < FRAMES; f += K(36), k++) {
    const r = rings[k % 2];
    ft(r, { opacity: 0.8, scale: 0.85 }, { opacity: 0, scale: 1.6 }, f, f + K(30), "power2.out");
    to(ic, { scale: 1.06 }, f, f + K(6), "power2.out"); to(ic, { scale: 1 }, f + K(6), f + K(16), "power2.inOut");
    to("#glow", { opacity: 0.6 }, f + K(6), f + K(20), "sine.inOut"); to("#glow", { opacity: 1 }, f + K(20), f + K(34), "sine.inOut");
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
