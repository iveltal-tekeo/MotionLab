<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "count", "type": "string", "label": "A number beside it (empty = none)", "default": "12.4K"},
  {"id": "plus", "type": "boolean", "label": "A +1 floats up", "default": true},
  {"id": "color", "type": "color", "label": "Heart colour", "default": "#ff2d55"},
  {"id": "disc", "type": "boolean", "label": "A soft disc behind the heart", "default": true},
  {"id": "font", "type": "enum", "label": "Font", "default": "Inter", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "text_color", "type": "color", "label": "Number colour", "default": "#16161a"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#fafafa"},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
  {"id": "x", "type": "number", "label": "Centre across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Centre down (% of the height)", "default": 72, "min": 0, "max": 100, "step": 1},
  {"id": "start", "type": "number", "label": "Pops at frame", "default": 8, "min": 0, "max": 900, "step": 1},
  {"id": "beats", "type": "boolean", "label": "Beats like a heart during the hold", "default": true}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "like-burst" (0.5.0, the Motion Graphics library): a heart pops (it overshoots and
     settles), a ring goes out, small particles burst around it and fade, a +1 floats up, the number counts up one;
     then it beats gently. Learned from overlays__like (a red heart button popping with a burst of small particles,
     f11-f23 (00:00:00:11-00:00:00:23) at 25 fps) and overlays__heart-crush-button (the heart on a pink disc, a pop
     on every change). MotionLab's own code. Size-independent; an overlay (background off) or a scene. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .p { position: absolute; left: 0; top: 0; border-radius: 50%; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
  #num::after { content: attr(data-v); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="disc" class="abs"></div><div id="ring" class="abs"></div><div id="parts" class="abs"></div>
    <svg id="heart" class="abs" viewBox="0 0 24 24" style="overflow:visible"><path id="hp" d="M12 20.6s-7.6-4.6-9.4-9.3C1.4 8 3.4 4.6 6.9 4.6c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.5 0 5.5 3.4 4.3 6.7-1.8 4.7-9.4 9.3-9.4 9.3z"/></svg>
    <div id="plus1" class="t"></div><div id="num" class="t"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 120;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const fam = `"${V.font}", "Segoe UI", sans-serif`;
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? V.bg : "transparent" });
  const s = V.size, hs = 150 * U * s, cx = W * V.x / 100 - (V.count ? hs * 0.7 : 0), cy = H * V.y / 100;
  const heart = q("heart");
  heart.setAttribute("width", hs); heart.setAttribute("height", hs);
  q("hp").setAttribute("fill", V.color);
  gsap.set(heart, { x: cx - hs / 2, y: cy - hs / 2, transformOrigin: "50% 55%" });
  const ds = hs * 1.7;
  Object.assign(q("disc").style, { width: `${ds}px`, height: `${ds}px`, borderRadius: "50%", background: V.color, opacity: 0.16 });
  gsap.set("#disc", { x: cx - ds / 2, y: cy - ds / 2, opacity: V.disc ? 0.16 : 0 });
  Object.assign(q("ring").style, { width: `${ds}px`, height: `${ds}px`, borderRadius: "50%", border: `${6 * U * s}px solid ${V.color}` });
  gsap.set("#ring", { x: cx - ds / 2, y: cy - ds / 2, opacity: 0 });
  // particles: 12 dots in a ring, two sizes, two colours, each its own angle and distance (seeded)
  const R = rnd(23), parts = [];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement("div"), sz = (i % 2 ? 14 : 22) * U * s, a = (i / 12) * Math.PI * 2 + (R() - 0.5) * 0.3;
    p.className = "p";
    Object.assign(p.style, { width: `${sz}px`, height: `${sz}px`, background: i % 3 === 0 ? "#ffb703" : V.color });
    q("parts").appendChild(p);
    gsap.set(p, { x: cx - sz / 2, y: cy - sz / 2, opacity: 0 });
    parts.push({ p, a, d: hs * (0.95 + R() * 0.5) });
  }
  q("num").setAttribute("data-v", V.count || "");
  Object.assign(q("num").style, { font: `700 ${64 * U * s}px ${fam}`, color: V.text_color });
  gsap.set("#num", { x: cx + hs * 0.85, y: cy, yPercent: -50 });
  q("plus1").textContent = "+1";
  Object.assign(q("plus1").style, { font: `800 ${52 * U * s}px ${fam}`, color: V.color });
  gsap.set("#plus1", { x: cx, y: cy - hs * 0.9, xPercent: -50, opacity: 0 });

  // ---- the motion: the pop overshoots to 1.25 and settles (14 f), the ring goes out (16 f), the particles burst
  // (18 f, a slow end, fading), the +1 floats (24 f); the number ticks up one; then a gentle heartbeat
  const S = Math.round(V.start);
  if (V.disc) enter("#disc", { opacity: 0, scale: 0.6 }, { opacity: 0.16, scale: 1 }, Math.max(0, S - K(6)), S + K(6), "power2.out");
  enter(heart, { opacity: 1, scale: 0 }, { scale: 1.25 }, S, S + K(7), "power3.out");
  to(heart, { scale: 1 }, S + K(7), S + K(16), "back.out(3)");
  ft("#ring", { opacity: 0.7, scale: 0.55 }, { opacity: 0, scale: 1.25 }, S + K(3), S + K(19), "power2.out");
  parts.forEach(({ p, a, d }, i) => {
    const sz = parseFloat(p.style.width);
    ft(p, { opacity: 1, x: cx - sz / 2, y: cy - sz / 2, scale: 1 }, { x: cx - sz / 2 + Math.cos(a) * d, y: cy - sz / 2 + Math.sin(a) * d, scale: 0.4, opacity: 0 }, S + K(3), S + K(21), "power3.out");
  });
  if (V.plus) ft("#plus1", { opacity: 1, y: cy - hs * 0.9 }, { opacity: 0, y: cy - hs * 1.9 }, S + K(6), S + K(30), "power2.out");
  if (V.count) {                                         // the count ticks up by one when the number ends in a digit
    const m = String(V.count).match(/^(.*?)(\d+)([^\d]*)$/);
    if (m && !/[.,]\d*$/.test(m[1] + m[2]) ) { set("#num", { attr: { "data-v": `${m[1]}${+m[2] + 1}${m[3]}` } }, S + K(8)); }
    enter("#num", { opacity: 0, x: cx + hs * 0.85 - 30 * U }, { opacity: 1, x: cx + hs * 0.85 }, S, S + K(8), "power3.out");
    ft("#num", { scale: 1 }, { scale: 1.12 }, S + K(8), S + K(12), "power2.out");
    to("#num", { scale: 1 }, S + K(12), S + K(20), "power2.inOut");
  }
  if (V.beats) for (let f = S + K(36); f + K(14) < FRAMES; f += K(30)) {    // a heartbeat: lub-dub, then rest
    to(heart, { scale: 1.1 }, f, f + K(4), "power2.out"); to(heart, { scale: 1 }, f + K(4), f + K(8), "power2.in");
    to(heart, { scale: 1.06 }, f + K(8), f + K(11), "power2.out"); to(heart, { scale: 1 }, f + K(11), f + K(14), "power2.in");
  }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
