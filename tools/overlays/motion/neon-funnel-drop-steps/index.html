      if (slot && window.MLLogo) {
        has = MLLogo.fill(d, slot, { scale: MLLogo.is(slot) ? 0.58 : 1, dark: darkDisc });
        if (has && !MLLogo.is(slot)) d.querySelectorAll("img").forEach(m => Object.assign(m.style, { objectFit: "cover", objectPosition: "50% 50%" }));
      }
      if (!has) {                                              // an empty slot: a neutral ring
        const ring = document.createElement("div");
        Object.assign(ring.style, { width: `${BR * 0.9}px`, height: `${BR * 0.9}px`, borderRadius: "50%", border: `${BR * 0.13}px solid ${glare}`, opacity: 0.95 });
        d.appendChild(ring);
      }
      box.appendChild(d); ghosts.push({ d, dt });
    });
    balls.push({ box, ghosts, tr: TR[b] });
  }

  // ---- the captions: each scales in from small with a little overshoot and a horizontal blur; the old one is replaced at once
  const caps = String(V.captions == null ? "" : V.captions).split("|").map(x => x.trim()).filter(x => x.length).slice(0, 3);
  if (!caps.length) caps.push("Step");
  const NC = caps.length;
  const capw = q("capw");
  capw.style.top = "192px";
  const capEls = caps.map(t => {
    const e = document.createElement("div"); e.className = "cap ml-display"; capw.appendChild(e);
    if (window.MLLook) MLLook.rich(e, V.caps ? t.toUpperCase() : t, { look: L, family: V.display_font, weight: 700 }); else e.textContent = V.caps ? t.toUpperCase() : t;
    Object.assign(e.style, { fontSize: `${V.size * U / K}px`, color: glare, fontWeight: String(fw(V.display_font, 900)), visibility: "hidden" });
    if (window.MLLook) MLLook.glow(e, glare, 85, { kind: "text", U: 1.4 / K });
    return e;
  });
  const SC = [[0, 0.1], [1, 0.29], [2, 0.51], [3, 0.745], [4, 0.944], [5, 1.07], [6, 1.1], [7, 1.089], [8, 1.06], [9, 1.03], [10, 1.01], [11, 1]];
  const CT0 = 20, CPER = 41;                                   // caption k starts at f20 + 41 k
  const tblg = q("tblg");

  // ---- the measured motion (frames; g = the frame minus "Starts at frame")
  const LAND = i => 8 + 4.97 * i;                              // tier i (0 = the smallest, at the bottom) lands
  const BH = [77, 74, 80, 64, 64, 64], BT = 11;                // how high each jumps back up (units), and how long it is in the air
  const FALL = 139;                                            // units a frame
  const dyTier = (i, g) => {
    const Lf = LAND(i);
    if (g <= Lf + 0.5) return -(Lf - g) * FALL;
    const u = (g - Lf - 0.5) / BT;
    return u >= 1 ? 0 : -BH[i] * 4 * u * (1 - u);
  };
  const HP = [[-5, 0], [-4, 0.3], [-3, 0.52], [-2, 0.7], [-1, 0.86], [0, 1], [1, 0.88], [2, 0.72], [3, 0.52], [4, 0.3], [5, 0]];
  const flashAt = (j, g) => { let m = 0; for (let w = 0; w < NC; w++) { const u = g - (35 + 30 * w + 5 * j); if (u > -5 && u < 5) m = Math.max(m, tab(HP, u)[0]); } return m; };

  let ready = false;
  function layout() {
    capEls.forEach(e => { const w = e.offsetWidth; if (w > 0.86 * 720) e.style.fontSize = `${parseFloat(e.style.fontSize) * 0.86 * 720 / w}px`; });
    ready = true;
  }
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    const on = g >= 0;
    stage.style.visibility = on ? "visible" : "hidden";
    if (!on || !ready) return;
    // the haze behind the funnel
    const ha = clamp01((g - 14) / 17), he = 1 - (1 - ha) * (1 - ha);
    haze.style.background = he > 0.001 ? `radial-gradient(ellipse 520px 340px at 360px 500px, ${rgba(neon, 0.17 * he)} 0%, ${rgba(neon, 0.15 * he)} 40%, ${rgba(neon, 0.07 * he)} 75%, ${rgba(neon, 0)} 100%)` : "none";
    // the tiers: fall, land, jump back up; the wave of light
    tiers.forEach((tr, j) => {
      const i = NT - 1 - j;
      const dy = dyTier(i, g);
      tr.grp.setAttribute("transform", `translate(0 ${dy.toFixed(2)})`);
      tr.grp.style.visibility = (tr.g.cy + dy < -200 && tr.g.cyb + dy < -60) ? "hidden" : "visible";
      const f = flashAt(j, g);
      tr.wash.setAttribute("opacity", (f * (i === 0 ? 0.62 : 0.5)).toFixed(3));
      tr.glows.forEach(o => o.e.setAttribute("stroke-opacity", (o.a * (1 + 1.6 * f)).toFixed(3)));
    });
    // the logos
    balls.forEach(b => {
      b.ghosts.forEach(gh => { const p = trackPos(b.tr, g + gh.dt); gh.d.style.transform = `translate(${p[0].toFixed(2)}px, ${p[1].toFixed(2)}px)`; });
    });
    // the caption
    let blurX = 0;
    capEls.forEach((e, k) => {
      const t0 = CT0 + CPER * k, t1 = k + 1 < NC ? CT0 + CPER * (k + 1) : 1e9;
      const shown = g >= t0 + 0.5 && g < t1 - 0.5;
      e.style.visibility = shown ? "visible" : "hidden";
      if (!shown) return;
      const s = tab(SC, g - t0)[0], s1 = tab(SC, g - 1 - t0)[0];
      e.style.transform = `translate(-50%, -50%) scale(${s.toFixed(4)})`;
      e.style.left = "360px";
      blurX = 0.2 * Math.abs(s - s1) * e.offsetWidth * (g - t0 < 5.5 ? 1 : 0.4);
      e.style.filter = blurX > 0.5 ? "url(#tbl)" : "none";
    });
    tblg.setAttribute("stdDeviation", `${(blurX * K).toFixed(2)} 0`);
  }
  const px = window.MLLook ? MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render) : (render(0), { t: 0 });

  Object.assign(q("hand").style, { width: `${W}px`, height: `${H}px` });
  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 5, hits: [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 23 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the captions are measured here
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    layout();
    render(px.t);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
