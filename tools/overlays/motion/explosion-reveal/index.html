<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/looks/look.css">
<script src="assets/looks/looks.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<!-- MotionLab motion template "explosion-reveal" (2026-10-22): a line of glowing fire-coloured capitals types itself on in the middle of a dark scene with a faint
     wavy grid (f1-f30, a letter about every 1.5 f), holds (f31-f49), then blows apart: at f50 the letters smear and
     twist, by f51 they have flown most of the way to their places and tumble out across the whole frame, drifting
     the last bit slowly (a fast burst, then a long soft stop by f80) while they shrink to about 0.6 and fade
     (f60-f97). Their colour comes from where they are on the screen - gold above the middle, red below - so every
     letter changes colour as it flies. The distances, the speed curve, the shrink and the fade were measured by
     tracking the 16 letters of the clip. Look-aware: the ground from the ink and the deep, the gold from the mustard,
     the red from the signal, the body font and the film grain from the look tokens (tools\overlays\motion\_looks).
     MotionLab's own code. Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #grid { position: absolute; left: 0; top: 0; overflow: visible; }
  #tx { position: absolute; white-space: nowrap; line-height: 1.1; font-synthesis: none; letter-spacing: -0.01em; text-transform: uppercase; }
  #tx .w { white-space: nowrap; }
  #tx .l { display: inline-block; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3.366667" data-width="1920"
     data-height="1080">
  <div id="bgfill" class="abs"></div>
  <div id="hand" class="abs"><svg id="grid" width="1920" height="1080" viewBox="0 0 1920 1080"></svg><div id="tx" class="ml-body"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 101;
  const W = 1920, H = 1080;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const tl = gsap.timeline({ paused: true });
  const q = id => document.getElementById(id);
  const root = q("root");
  const L = window.MLLook ? MLLook.apply(root, V, U) : { dark: false, ink: V.ink, paper: V.paper, signal: V.signal, deep: V.deep, mustard: V.mustard, radius: V.radius * U, shadow: "none", rgba: (h, a) => h };
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const tab = (rows, g) => {
    const n = rows.length;
    if (g <= rows[0][0]) return rows[0].slice(1);
    if (g >= rows[n - 1][0]) return rows[n - 1].slice(1);
    let i = 0; while (rows[i + 1][0] < g) i++;
    const a = rows[i], b = rows[i + 1], k = (g - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
  };
  const hex = h => { const s = String(h).replace("#", ""); const t = s.length === 3 ? s.split("").map(c => c + c).join("") : s; return [0, 2, 4].map(i => parseInt(t.slice(i, i + 2), 16) || 0); };
  const mixv = (a, b, t) => { const x = hex(a), y = hex(b); return x.map((v, i) => Math.round(v + (y[i] - v) * t)); };
  const mix = (a, b, t) => `rgb(${mixv(a, b, t).join(",")})`;
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
  const fw = (fam, want) => { const i = window.MLLook && MLLook.FONTS[fam]; return i ? Math.max(i.min, Math.min(i.max, want)) : want; };
  const R = Math.min(W, H) / 720, OX = (W - 1280 * R) / 2, OY = (H - 720 * R) / 2;     // the reference's 1280x720 px, centred
  const S = Math.round(V.start);

  // ---- the look: a dark ground that leans toward the deep colour at the bottom, a faint grid, gold -> red fire
  const night = L.dark ? L.paper : L.ink, glare = L.dark ? L.ink : L.paper;
  gsap.set("#bgfill", { width: W, height: H, background: V.background ? `linear-gradient(180deg, ${mix(night, L.deep, 0.06)} 0%, ${mix(night, L.deep, 0.3)} 100%)` : "transparent" });
  const hand = q("hand");
  Object.assign(hand.style, { width: `${W}px`, height: `${H}px` });
  const GOLD = L.mustard, RED = L.signal;
  const ramp = yf => { const u = clamp01((yf - 0.465) / (0.62 - 0.465)); return mixv(GOLD, RED, u * u * (3 - 2 * u)); };     // by height in the frame (0 top .. 1 bottom)
  const rgbs = c => `rgb(${c.join(",")})`;

  // ---- the faint wavy grid (a few px of slow sway)
  const grid = q("grid"), NS = "http://www.w3.org/2000/svg", gl = [];
  if (V.grid && V.background) {
    const gc = rgba(glare, 0.07), step = 96 * R * 0.85;
    const mk = (vert, pos, ph) => { const p = document.createElementNS(NS, "path"); p.setAttribute("fill", "none"); p.setAttribute("stroke", gc); p.setAttribute("stroke-width", Math.max(1, 1.2 * U)); grid.appendChild(p); gl.push({ p, vert, pos, ph }); };
    for (let x = OX + step / 2; x < W; x += step) mk(true, x, x * 0.013);
    for (let y = OY + step / 2; y < H; y += step) mk(false, y, y * 0.017);
  }
  const drawGrid = t => gl.forEach(g => {
    const n = 14, amp = 3.5 * R, pts = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n * (g.vert ? H : W), w = amp * Math.sin(s * 0.0042 + t * 0.9 + g.ph) + 0.5 * amp * Math.sin(s * 0.011 - t * 1.4 + g.ph * 2);
      pts.push(g.vert ? `${(g.pos + w).toFixed(1)},${s.toFixed(1)}` : `${s.toFixed(1)},${(g.pos + w).toFixed(1)}`);
    }
    g.p.setAttribute("d", "M " + pts.join(" L "));
  });

  // ---- the letters: each its own span (spaces keep their room); laid out as one centred line
  const fam = V.body_font;
  const tx = q("tx");
  Object.assign(tx.style, { fontWeight: String(fw(fam, 900)), left: `${W / 2}px`, top: `${OY + 363 * R}px`, transform: "translate(-50%, -50%)" });
  const rr = window.MLLook ? MLLook.rich(tx, V.text, { look: L, family: fam, weight: 800 }) : (tx.textContent = String(V.text || ""), { words: [], marks: [] });
  const letters = [];
  let ci = 0;
  rr.words.forEach((w, wi) => {
    const s = w.textContent; w.textContent = "";
    [...s].forEach(ch => { const sp = document.createElement("span"); sp.className = "l"; sp.textContent = ch; w.appendChild(sp); letters.push({ el: sp, c: ci++ }); });
    ci++;                                                                     // the space after the word is one character of typing
  });
  const NCH = Math.max(1, ci - 1);
  // where the chips of the clip came to rest (1280x720 px, sorted by x): letter i takes the nearest of these in order
  const TARGETS = [[240, 166], [279, 582], [299, 433], [376, 256], [455, 282], [459, 382], [576, 489], [666, 527], [708, 237], [809, 442], [869, 477], [953, 294], [963, 487], [1145, 100], [1153, 282], [1163, 354]];
  const rnd = window.MLLook ? MLLook.rnd(41) : () => 0.5;
  const nL = letters.length;
  letters.forEach((l, i) => {
    const k = nL > 1 ? i * (TARGETS.length - 1) / (nL - 1) : 7.5, a = TARGETS[Math.floor(k)], b = TARGETS[Math.min(TARGETS.length - 1, Math.floor(k) + 1)], f = k - Math.floor(k);
    const jit = nL > TARGETS.length ? 24 : 0;                                   // a longer text reuses places: nudge them apart
    l.tx = OX + (lerp(a[0], b[0], f) + (rnd() - 0.5) * jit) * R; l.ty = OY + (lerp(a[1], b[1], f) + (rnd() - 0.5) * jit) * R;
    l.rot = (rnd() < 0.5 ? -1 : 1) * (22 + rnd() * 50); l.rot2 = (rnd() - 0.5) * 70;
  });
  const layout = () => {
    letters.forEach(l => { l.el.style.transform = "none"; });
    let fs = V.size * U;
    tx.style.fontSize = `${fs}px`;
    const maxW = W * 0.84, w = tx.offsetWidth;
    if (w > maxW) { fs *= maxW / w; tx.style.fontSize = `${fs}px`; }
    const rt = root.getBoundingClientRect();
    letters.forEach(l => { const b = l.el.getBoundingClientRect(); l.ox = b.left - rt.left + b.width / 2; l.oy = b.top - rt.top + b.height / 2; l.h = b.height; });
  };
  layout();

  // ---- the measured curves (reference frames)
  const TYPE0 = 1, TYPE = Math.min(2.6, Math.max(0.7, 29 / NCH));                 // frames a character
  const P = [[49, 0], [50, 0.12], [51, 0.44], [52, 0.56], [53, 0.63], [54, 0.67], [55, 0.7], [56, 0.73], [57, 0.755], [58, 0.78], [59, 0.8], [60, 0.822], [62, 0.858], [64, 0.886],
    [66, 0.91], [68, 0.93], [70, 0.945], [72, 0.958], [74, 0.97], [76, 0.98], [78, 0.99], [80, 1]];     // how far the letters have flown (1 = rest)
  const SC = [[49, 1], [50, 1.0], [51, 1.15], [52, 1.1], [54, 1.0], [58, 0.88], [62, 0.8], [66, 0.74], [72, 0.68], [80, 0.62], [98, 0.58]];
  const AL = [[52, 1], [60, 0.9], [70, 0.79], [80, 0.68], [90, 0.58], [94, 0.45], [96, 0.39], [97, 0.2], [98, 0]];
  const BL = [[49, 0], [50, 6], [51, 3], [52, 1.5], [53, 0.6], [54, 0]];                    // smear (reference px)
  const GL = [[0, 1], [48, 1], [50, 2.2], [52, 1.6], [58, 1.2], [70, 1.05], [98, 0.8]];     // glow strength
  const gs = Math.max(0, V.glow / 100);
  function render(tt) {
    const g = tt * FPS - S, t = tt;
    if (gl.length) drawGrid(t);
    letters.forEach(l => {
      const el = l.el;
      let on = g >= TYPE0 + l.c * TYPE - 0.001;
      if (g < 0 || !on || g >= 98) { el.style.visibility = "hidden"; return; }
      el.style.visibility = "visible";
      const p = g < 49 ? 0 : tab(P, g)[0], sc = g < 49 ? 1 : tab(SC, g)[0], op = g < 52 ? 1 : tab(AL, g)[0];
      const rotK = clamp01(p / 0.45), rot = l.rot * rotK + (g >= 50 && g < 53 ? l.rot2 * (g < 51 ? 0.4 : 0.15) : 0);
      const dx = (l.tx - l.ox) * p, dy = (l.ty - l.oy) * p;
      const stretch = g >= 50 && g < 51 ? 1.25 : 1;
      el.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)}, ${(sc * stretch).toFixed(3)})`;
      // colour by height in the frame: this letter's top and bottom
      const yc = l.oy + dy, hh = l.h * sc * 0.5, c1 = ramp((yc - hh) / H), c2 = ramp((yc + hh) / H);
      el.style.backgroundImage = `linear-gradient(180deg, ${rgbs(c1)}, ${rgbs(c2)})`;
      const bl = (g < 49 ? 0 : tab(BL, g)[0]) * R, gk = (g < 49 ? 1 + 0.06 * Math.sin(g * 0.5) : tab(GL, g)[0]) * gs;
      const cm = mixv(c1, c2, 0.5);
      el.style.opacity = op.toFixed(3);
      el.style.filter = (bl > 0.3 ? `blur(${bl.toFixed(2)}px) ` : "") + (gk > 0.02 ? `drop-shadow(0 0 ${(7 * U * (0.6 + gk * 0.6)).toFixed(1)}px ${rgbs(mixv(cm, RED, 0.5))}) drop-shadow(0 0 ${(20 * U * gk).toFixed(1)}px rgba(${mixv(cm, RED, 0.6).join(",")},${(0.75 * Math.min(1, gk)).toFixed(2)}))` : "");
    });
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 11, hits: V.shake > 0 ? [{ f: S + 50, amount: 4 }] : [] });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 29 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font); the line is measured again with the real font first
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 900].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { layout(); render(0); window.__timelines["main"] = tl; });
</script>
</body>
</html>
