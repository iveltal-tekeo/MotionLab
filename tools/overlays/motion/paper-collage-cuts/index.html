  const RED = tone(SIG, INK, 0.08), WINE = tone(SIG, INK, 0.62), CREAM = tone(PAPER, MUS, 0.18);
  const FIX = { signal: SIG, paper: PAPER, ink: INK, deep: DEEP, mustard: MUS };
  const stripCol = c => FIX[V.strip_colour] || (c === "r" ? RED : c === "w" ? WINE : CREAM);
  if (window.MLLook) MLLook.rich(stt, V.text, { look: L, family: V.body_font, weight: 700 }); else stt.textContent = V.text;
  stt.style.fontWeight = "700"; stt.style.fontSize = px(V.size * U);

  // ---- the motion: a hard cut every V.cut frames (7 in the clip) through the 28 recorded cuts; inside a cut the surface and
  // the strip push in linearly (+0.0011 scale, -0.03 deg, -0.75 / -0.52 px drift a frame, measured)
  const CUT = Math.max(1, Math.round(V.cut));
  let SHOWN = -1;
  function render(t) {
    const g = Math.round(t * FPS * 1000) / 1000 - S;
    hand.style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    const sc = Math.min(Math.floor(g / CUT), 9999), lf = g - sc * CUT, k = sc % SC.length, row = SC[k];
    if (V.background && SHOWN !== row[0]) { CAN.forEach((c, i) => { c.style.display = i === row[0] ? "block" : "none"; }); SHOWN = row[0]; }
    const s = 1 + 0.0011 * lf, rot = -0.03 * lf, tx = -0.75 * lf * R, ty = -0.52 * lf * R;
    bgw.style.transformOrigin = "0 0";
    bgw.style.transform = `translate(${(tx).toFixed(2)}px, ${(ty).toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${s.toFixed(5)})`;
    const sw = row[2] * R, sh = sw * 0.345, c = stripCol(row[1]), c2 = tone(c, [255, 255, 255], 0.5);
    Object.assign(strip.style, { width: px(sw), height: px(sh), left: px(row[4] * R - sw / 2), top: px(row[5] * R - sh / 2), transformOrigin: "50% 50%",
      transform: `rotate(${(row[3] + rot).toFixed(3)}deg) scale(${s.toFixed(5)})` });
    rim.style.background = rgbs(c2); pap.style.background = rgbs(c);
    stt.style.color = lumv(c) > 0.55 ? rgbs(tone(INK, c, 0.05)) : rgbs(tone(PAPER, [255, 255, 255], 0.5));
    stt.style.textShadow = lumv(c) > 0.55 ? "none" : `0 ${R}px ${2 * R}px rgba(0,0,0,0.25)`;
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, render); else render(0);

  if (window.MLLook) MLLook.handheld(hand, tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 6 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 29 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in (HyperFrames captures f0 only then); the line is fitted
  // to the narrowest strip here
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 600, 700].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => {
    const maxW = 0.8 * 583 * R;
    if (stt.offsetWidth > maxW) stt.style.fontSize = px(V.size * U * maxW / stt.offsetWidth);
    render(0);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
