<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "mark", "type": "enum", "label": "What it draws", "default": "circle", "options": [{"value": "circle", "label": "A circle around something"}, {"value": "underline", "label": "An underline"}, {"value": "arrow", "label": "An arrow pointing at it"}, {"value": "check", "label": "A check mark"}, {"value": "cross", "label": "A cross"}, {"value": "scribble", "label": "A scribble over it"}]},
  {"id": "x", "type": "number", "label": "Where across (% of the width)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "y", "type": "number", "label": "Where down (% of the height)", "default": 50, "min": 0, "max": 100, "step": 1},
  {"id": "w", "type": "number", "label": "How wide (% of the width)", "default": 50, "min": 5, "max": 100, "step": 1},
  {"id": "h", "type": "number", "label": "How tall (% of the width)", "default": 22, "min": 3, "max": 100, "step": 1},
  {"id": "note", "type": "string", "label": "A handwritten note beside it (empty = none)", "default": "this!"},
  {"id": "color", "type": "color", "label": "Ink colour", "default": "#ff3b30"},
  {"id": "pencil", "type": "boolean", "label": "Show the pencil drawing it", "default": true},
  {"id": "font", "type": "enum", "label": "Note font", "default": "Permanent Marker", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": false},
  {"id": "bg", "type": "color", "label": "Background colour", "default": "#d8a93c"},
  {"id": "thickness", "type": "number", "label": "Line thickness (px on a 1080 frame)", "default": 12, "min": 2, "max": 40, "step": 1},
  {"id": "draw_frames", "type": "number", "label": "Frames to draw", "default": 18, "min": 3, "max": 120, "step": 1},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 6, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "pencil-annotate" (0.5.0, the Motion Graphics library): a hand-drawn mark over your video - a
     circle round something, an underline, an arrow, a check, a cross or a scribble - drawn stroke by stroke by a pencil
     whose tip rides the line (slightly wobbly, like a hand), with an optional handwritten note; it stays, then the
     pencil lifts away. Learned from graphics__pencil-drawing (a pencil drawing a long curve on mustard yellow, its tip
     following the line). Made for talking-head videos: background off by default. MotionLab's own code.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .t { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-synthesis: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <svg id="g" class="abs" style="overflow:visible"></svg>
  <div id="nt" class="t"></div>
  <svg id="pen" class="abs" viewBox="-10 -150 60 160" style="overflow:visible"><g><path d="M0,0 l8,-24 h14 l8,24z" fill="#f6d7a7"/><path d="M8,-24 v-96 h22 v96z" fill="#f2b705"/><path d="M8,-120 h22 v-14 h-22z" fill="#e78fa3"/><path d="M11,-8 l4,8 l4,-8z" fill="#333"/></g></svg>
</div>
<script>
  const FPS = 30, FRAMES = 90;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const rnd = s => () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const enter = (t, a, b, f0, f1, ease = "none") => { if (f0 > 0) set(t, { opacity: 0 }, 0); return ft(t, a, b, f0, f1, ease); };
  const q = id => document.getElementById(id);

  gsap.set("#bgfill", { width: W, height: H, background: V.background ? V.bg : "transparent" });
  const svg = q("g"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const cx = W * V.x / 100, cy = H * V.y / 100, mw = W * V.w / 100, mh = W * V.h / 100, R = rnd(53), j = () => (R() - 0.5) * mw * 0.03;
  // the strokes (in drawing order), a little irregular like a hand
  let strokes = [];
  if (V.mark === "circle") { let d = ""; const n = 40; for (let i = 0; i <= n + 6; i++) { const a = -Math.PI * 0.6 + i / n * Math.PI * 2, r = 1 + (i > n ? 0.08 : 0) + Math.sin(i * 0.9) * 0.025;
      d += `${i ? "L" : "M"}${cx + Math.cos(a) * mw / 2 * r},${cy + Math.sin(a) * mh / 2 * r} `; } strokes = [d]; }
  else if (V.mark === "underline") strokes = [`M${cx - mw / 2},${cy + j()} C${cx - mw / 6},${cy + mh * 0.06 + j()} ${cx + mw / 6},${cy - mh * 0.04 + j()} ${cx + mw / 2},${cy + mh * 0.02}`];
  else if (V.mark === "arrow") { const tx = cx + mw / 2, ty = cy, sx = cx - mw / 2, sy = cy + mh;
    strokes = [`M${sx},${sy} Q${cx - mw * 0.1},${cy - mh * 0.2} ${tx},${ty}`, `M${tx - mw * 0.16},${ty - mh * 0.06} L${tx},${ty} L${tx - mw * 0.05},${ty + mh * 0.2}`]; }
  else if (V.mark === "check") strokes = [`M${cx - mw / 2},${cy} L${cx - mw * 0.12},${cy + mh / 2} L${cx + mw / 2},${cy - mh / 2}`];
  else if (V.mark === "cross") strokes = [`M${cx - mw / 2},${cy - mh / 2} L${cx + mw / 2 + j()},${cy + mh / 2}`, `M${cx + mw / 2},${cy - mh / 2} L${cx - mw / 2 + j()},${cy + mh / 2}`];
  else { let d = `M${cx - mw / 2},${cy}`; for (let i = 1; i <= 14; i++) d += ` L${cx - mw / 2 + mw * i / 14},${cy + (i % 2 ? -1 : 1) * mh / 2 * (0.6 + 0.4 * R())}`; strokes = [d]; }
  const NS = "http://www.w3.org/2000/svg";
  const paths = strokes.map(d => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", V.color);
    p.setAttribute("stroke-width", V.thickness * U); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); svg.appendChild(p);
    const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", `${L} ${L}`); p.setAttribute("stroke-dashoffset", L); return { p, L }; });
  const pen = q("pen"), ps = 220 * U; pen.setAttribute("width", ps * 60 / 160); pen.setAttribute("height", ps);
  gsap.set(pen, { opacity: 0, transformOrigin: "41.7% 93.75%", rotation: 28 });                // the tip: (15, 0) in its viewBox
  const tipX = pt => pt.x - ps * 60 / 160 * 0.4167, tipY = pt => pt.y - ps * 0.9375;
  if (V.note) { const nt = q("nt"); nt.textContent = V.note; Object.assign(nt.style, { font: `400 ${72 * U}px "${V.font}", cursive`, color: V.color });
    gsap.set(nt, { x: cx + mw / 2 + 30 * U, y: cy - mh / 2 - 90 * U, rotation: -8, opacity: 0 }); }

  // ---- the motion: each stroke draws over its share of draw_frames (S-curve per stroke), the pencil tip on the line
  // every frame; a short lift between strokes; the note writes in (a wipe) after; the pencil lifts away
  const S = Math.round(V.start), D = Math.max(K(3), Math.round(V.draw_frames * FPS / 30)), total = paths.reduce((a, b) => a + b.L, 0), ease = gsap.parseEase("power1.inOut");
  let f = S;
  if (V.pencil) { set(pen, { opacity: 1 }, S); const p0 = paths[0].p.getPointAtLength(0); set(pen, { x: tipX(p0), y: tipY(p0) }, S); }
  paths.forEach(({ p, L }, k) => {
    const n = Math.max(2, Math.round(D * L / total));
    for (let i = 0; i <= n; i++) {
      const at = L * ease(i / n), fr = f + i;
      set(p, { attr: { "stroke-dashoffset": L - at } }, fr);
      if (V.pencil) { const pt = p.getPointAtLength(at); set(pen, { x: tipX(pt), y: tipY(pt) }, fr); }
    }
    f += n + (k < paths.length - 1 ? K(3) : 0);
  });
  if (V.note) { const nt = q("nt"); set(nt, { opacity: 1, clipPath: "inset(0 100% 0 0)" }, f + K(2)); ft(nt, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)" }, f + K(2), f + K(14), "power1.inOut"); }
  if (V.pencil) { const fe = f + (V.note ? K(16) : K(2)); if (fe + K(10) < FRAMES) to(pen, { x: `+=${120 * U}`, y: `-=${160 * U}`, opacity: 0, rotation: 40 }, fe, fe + K(10), "power2.in"); }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
