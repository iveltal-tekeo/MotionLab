<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "photos", "type": "string", "label": "Pictures in the graphic’s assets folder (| between; empty = colour art)", "default": ""},
  {"id": "frames_n", "type": "number", "label": "Frames on the strip", "default": 3, "min": 2, "max": 4, "step": 1},
  {"id": "caption", "type": "string", "label": "Writing at the bottom of the strip (empty = none)", "default": "16.10.26"},
  {"id": "bw", "type": "boolean", "label": "Black and white pictures", "default": true},
  {"id": "font", "type": "enum", "label": "Caption font", "default": "Permanent Marker", "options": [{"value": "Anton", "label": "Anton"}, {"value": "Barlow Condensed", "label": "Barlow Condensed"}, {"value": "Bebas Neue", "label": "Bebas Neue"}, {"value": "Oswald", "label": "Oswald"}, {"value": "Archivo Black", "label": "Archivo Black"}, {"value": "Inter", "label": "Inter"}, {"value": "League Spartan", "label": "League Spartan"}, {"value": "Montserrat", "label": "Montserrat"}, {"value": "Poppins", "label": "Poppins"}, {"value": "Unbounded", "label": "Unbounded"}, {"value": "Nunito", "label": "Nunito"}, {"value": "Rubik", "label": "Rubik"}, {"value": "Bagel Fat One", "label": "Bagel Fat One"}, {"value": "Bangers", "label": "Bangers"}, {"value": "Lilita One", "label": "Lilita One"}, {"value": "Luckiest Guy", "label": "Luckiest Guy"}, {"value": "Pacifico", "label": "Pacifico"}, {"value": "Permanent Marker", "label": "Permanent Marker"}, {"value": "DM Serif Display", "label": "DM Serif Display"}, {"value": "Fraunces", "label": "Fraunces"}, {"value": "Instrument Serif", "label": "Instrument Serif"}, {"value": "Playfair Display", "label": "Playfair Display"}, {"value": "Hanken Grotesk", "label": "Hanken Grotesk"}, {"value": "Lato", "label": "Lato"}, {"value": "Raleway", "label": "Raleway"}, {"value": "Roboto", "label": "Roboto"}, {"value": "Space Grotesk", "label": "Space Grotesk"}, {"value": "Space Mono", "label": "Space Mono"}, {"value": "Arial Black", "label": "Arial Black (Windows only)"}, {"value": "Impact", "label": "Impact (Windows only)"}, {"value": "Bahnschrift", "label": "Bahnschrift (Windows only)"}, {"value": "Segoe UI", "label": "Segoe UI (Windows only)"}, {"value": "Verdana", "label": "Verdana (Windows only)"}, {"value": "Georgia", "label": "Georgia (Windows only)"}]},
  {"id": "wall", "type": "color", "label": "Wall colour", "default": "#f2b8c6"},
  {"id": "background", "type": "boolean", "label": "Paint a background (off = see-through, over a video)", "default": true},
  {"id": "size", "type": "number", "label": "Size (1 = normal)", "default": 1, "min": 0.4, "max": 1.4, "step": 0.05},
  {"id": "back_in", "type": "boolean", "label": "It slides back in at the end", "default": true},
  {"id": "start", "type": "number", "label": "Starts at frame", "default": 6, "min": 0, "max": 900, "step": 1}
]'>
<head>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<!-- MotionLab motion template "photo-strip" (0.5.0, the Motion Graphics library): a photo-booth strip feeds out of a slot
     in steps (the machine pushes it, it stops, pushes again - one frame of the strip each time), sways a little when it
     is out, the writing at its foot appears; at the end it slides back in. Learned from graphics__photobooth-animation
     (a strip of three black-and-white photos sliding out of a slot over a pink striped wall, then back, f18-f79
     (00:00:00:18-00:00:03:04) at 25 fps). Your pictures go in the graphic's assets folder. MotionLab's own drawing.
     Size-independent. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  #clip { position: absolute; left: 0; top: 0; overflow: hidden; }
  .ph { width: 100%; background-size: cover; background-position: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080"
     data-height="1920">
  <div id="bgfill" class="abs"></div>
  <div id="cam" class="abs"><div id="clip"><div id="strip" class="abs"></div></div><div id="slot" class="abs"></div></div>
</div>
<script>
  const FPS = 30, FRAMES = 150;
  const W = 1080, H = 1920;
  const F = n => n / FPS;
  const AT = n => Math.max(0, (n - 0.5) / FPS);
  const V = window.__hyperframes.getVariables();
  const U = Math.min(W, H) / 1080;
  const K = n => Math.max(1, Math.round(n * FPS / 30));
  const tl = gsap.timeline({ paused: true });
  const END = 0.5 / FPS + 0.002;
  const dur = (f0, f1) => Math.max(F(f1 - f0) - END, 0.004);
  const set = (t, v, f) => tl.set(t, v, f <= 0 ? 0 : AT(f));
  const to = (t, v, f0, f1, ease = "none") => tl.to(t, { ...v, duration: dur(f0, f1), ease }, F(f0));
  const ft = (t, a, b, f0, f1, ease = "none") => { set(t, a, f0); return tl.fromTo(t, a, { ...b, duration: dur(f0, f1), ease, immediateRender: false }, F(f0)); };
  const q = id => document.getElementById(id);

  gsap.set(["#bgfill", "#cam"], { width: W, height: H });
  gsap.set("#bgfill", { background: V.background ? `repeating-linear-gradient(90deg, ${V.wall} 0 ${22 * U}px, #ffffff33 ${22 * U}px ${26 * U}px), ${V.wall}` : "transparent" });
  const s = V.size, n = Math.round(V.frames_n), sw = 300 * U * s, pad = 22 * U * s, pf = sw - 2 * pad, capH = V.caption ? 110 * U * s : pad;
  const sh = pad + n * (pf * 1.05 + pad) + capH, slotW = sw * 1.7, slotY = H * 0.2;
  Object.assign(q("slot").style, { width: `${slotW}px`, height: `${70 * U * s}px`, background: "#f4f4f2", borderRadius: `${16 * U * s}px`, boxShadow: `0 ${10 * U}px ${24 * U}px rgba(0,0,0,.18)` });
  q("slot").innerHTML = `<div style="position:absolute;left:${slotW * 0.1}px;right:${slotW * 0.1}px;top:${24 * U * s}px;height:${20 * U * s}px;border-radius:999px;background:#151515"></div>`;
  gsap.set("#slot", { x: W / 2 - slotW / 2, y: slotY - 35 * U * s });
  const clip = q("clip"); gsap.set(clip, { x: W / 2 - sw / 2 - 40 * U, y: slotY, width: sw + 80 * U, height: H - slotY });
  const strip = q("strip");
  Object.assign(strip.style, { width: `${sw}px`, height: `${sh}px`, background: "#fbfbf8", padding: `${pad}px`, display: "flex", flexDirection: "column", gap: `${pad}px`, boxShadow: `0 ${16 * U}px ${30 * U}px rgba(0,0,0,.2)` });
  const own = String(V.photos || "").split("|").map(x => x.trim().replace(/"/g, "")).filter(Boolean);
  const ART = [["#cfcfcf", "#5a5a5a"], ["#e3e3e3", "#4a4a4a"], ["#d8d8d8", "#6a6a6a"], ["#bdbdbd", "#3a3a3a"]];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div"); p.className = "ph";
    p.style.height = `${pf * 1.05}px`;
    p.style.background = own[i] ? `center / cover url("${own[i]}")` : `radial-gradient(ellipse 30% 26% at ${50 + (i - 1) * 8}% 42%, ${ART[i % 4][0]} 60%, transparent 62%), radial-gradient(ellipse 46% 40% at 50% 100%, ${ART[i % 4][0]} 60%, transparent 62%), linear-gradient(160deg, ${ART[i % 4][1]}, #222)`;
    if (V.bw) p.style.filter = "grayscale(1) contrast(1.1)";
    strip.appendChild(p);
  }
  if (V.caption) { const c = document.createElement("div"); c.textContent = V.caption;
    Object.assign(c.style, { font: `400 ${48 * U * s}px "${V.font}", cursive`, color: "#333", textAlign: "center", lineHeight: `${capH - pad}px`, opacity: 0 }); strip.appendChild(c); }
  // in: hidden above the slot (in the machine), pushed down in n steps
  gsap.set(strip, { x: 40 * U, y: -sh, transformOrigin: "50% 0%" });

  // ---- the motion: n pushes (each 9 frames, S-curve, then a 6-frame stop with a tiny shake), the last one lets it all
  // out; it sways (sine, 30 f); the caption appears; at the end it slides back up (14 f, accelerating)
  const S = Math.round(V.start), step = (sh - capH) / n;
  let f = S, y = -sh;
  for (let i = 0; i <= n; i++) {
    const ny = i === n ? 0 : -sh + step * (i + 1), len = K(i === n ? 12 : 9);
    to(strip, { y: ny }, f, f + len, "power2.inOut"); y = ny; f += len;
    if (i < n) { to(strip, { x: 40 * U + 2 * U }, f, f + K(2), "none"); to(strip, { x: 40 * U }, f + K(2), f + K(4), "none"); f += K(6); }
  }
  for (let g = f, k = 0; g + K(30) < FRAMES - K(20); g += K(30), k++) to(strip, { rotation: k % 2 ? -1.6 : 1.6 }, g, g + K(30), "sine.inOut");
  const cap = strip.lastChild;
  if (V.caption) ft(cap, { opacity: 0 }, { opacity: 1 }, f, f + K(10), "power1.out");
  if (V.back_in) { const B = FRAMES - K(18); if (B > f + K(20)) { to(strip, { rotation: 0 }, B - K(4), B, "power1.inOut"); to(strip, { y: -sh }, B, B + K(14), "power3.in"); } }
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
