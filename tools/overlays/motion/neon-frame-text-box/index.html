    { A: [-10, 413], B: [350, 730], t0: 207.3, D: 3.2, r0: 288.4, rD: 5.5 }];
  const easeO = u => 1 - Math.pow(1 - clamp(u), 1.6);

  // ---- scene A: the ring and its label
  const ga = q("ga"), t1 = q("t1"), CIRC = 2 * Math.PI * 298.5;
  q("rg0").setAttribute("stop-color", ACC); q("rg1").setAttribute("stop-color", GOLD);
  q("fa0").setAttribute("stop-color", mix(GROUND, "#000000", 0.5)); q("fa1").setAttribute("stop-color", mix(GROUND, "#000000", 0.35));
  q("fa2").setAttribute("stop-color", mix(GROUND, ACC, 0.22));
  q("rg2").setAttribute("opacity", String(Math.min(1, 0.42 * gs))); q("rg1c").setAttribute("opacity", String(Math.min(1, 0.6 * gs)));
  const RAD = Math.max(0, L.radius) * 2.8;                                  // the look's corner, rounder for a neon box (px)
  Object.assign(t1.style, { fontSize: `${V.size * U}px`, color: FG, fontWeight: String(fw(V.body_font, 800)) });
  if (window.MLLook) MLLook.rich(t1, V.text1, { look: L, family: V.body_font, weight: 800 }); else t1.textContent = V.text1;
  t1.style.textShadow = `0 0 ${8 * U}px ${rgba(FG, 0.4 * gs)}`;

  // ---- scenes B and C: neon boxes (a main one and an echo for the stutter), the lines
  const BWD = 457, BHT = 279, BORDER = 11;
  function mkBox(texts) {
    const el = document.createElement("div"); el.className = "bx"; el.style.display = "none";
    const bf = document.createElement("div"); bf.className = "bf"; el.appendChild(bf);
    Object.assign(el.style, { width: `${BWD * KR}px`, height: `${BHT * KR}px` });
    Object.assign(bf.style, {
      border: `${BORDER * KR}px solid ${NEON}`, borderRadius: `${RAD}px`,
      background: `radial-gradient(ellipse 72% 82% at 50% 56%, ${mix(GROUND, NEON, 0.16)} 0%, ${mix(GROUND, "#000000", 0.35)} 100%)`,
      boxShadow: gs > 0 ? `0 0 ${14 * KR}px ${rgba(NEON, Math.min(1, 0.62 * gs))}, 0 0 ${44 * KR}px ${rgba(NEON, Math.min(1, 0.3 * gs))}, inset 0 0 ${24 * KR}px ${rgba(NEON, Math.min(1, 0.42 * gs))}` : "none" });
    const ts = texts.map(tx => {
      const d = document.createElement("div"); d.className = "bt ml-body"; d.style.opacity = "0";
      Object.assign(d.style, { fontSize: `${V.size * U * (tx.big || 1)}px`, color: tx.accent ? ACC : FG, fontWeight: String(fw(V.body_font, 800)),
        textShadow: tx.accent ? `0 0 ${12 * KR}px ${rgba(ACC, Math.min(1, 0.7 * gs))}, 0 0 ${26 * KR}px ${rgba(ACC, Math.min(1, 0.35 * gs))}` : `0 0 ${7 * KR}px ${rgba(FG, 0.35 * gs)}` });
      if (tx.flip) d.style.transform = "rotate(180deg)";
      if (window.MLLook) MLLook.rich(d, tx.text, { look: L, family: V.body_font, weight: 800 }); else d.textContent = tx.text;
      el.appendChild(d); return d;
    });
    q("boxes").appendChild(el);
    return { el, bf, ts };
  }
  const bxM = mkBox([{ text: V.text2 }, { text: V.text3, flip: true }, { text: V.text4, flip: true, accent: true }]);
  const bxE = mkBox([{ text: V.text2 }, { text: V.text3, flip: true }, { text: V.text4, flip: true, accent: true }]);
  const bx5 = mkBox([{ text: V.text5, big: 1.22 }]);
  function put(b, cx, cy, s, rot, which, alpha, blur, tblur) {
    const e = b.el;
    e.style.display = alpha > 0.002 ? "block" : "none";
    if (alpha <= 0.002) return;
    e.style.opacity = alpha.toFixed(3);
    e.style.transform = `translate(${(cx * KR).toFixed(2)}px, ${(cy * KR).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${s.toFixed(4)}) translate(${(-BWD * KR / 2).toFixed(2)}px, ${(-BHT * KR / 2).toFixed(2)}px)`;
    e.style.filter = blur > 0.3 ? `blur(${(blur * KR).toFixed(2)}px)` : "none";
    b.ts.forEach((t, i) => { t.style.opacity = i === which ? "1" : "0"; t.style.filter = (i === which && tblur > 0.3) ? `blur(${(tblur * KR).toFixed(2)}px)` : "none"; });
  }
  const svc = q("lines"), lineEls = LN.map(() => { const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("stroke", NEON); l.setAttribute("stroke-width", String(11 * KR)); l.setAttribute("stroke-linecap", "round"); svc.appendChild(l); return l; });
  q("sc").style.filter = gs > 0 ? `drop-shadow(0 0 ${5 * KR}px ${rgba(NEON, Math.min(1, 0.9 * gs))}) drop-shadow(0 0 ${20 * KR}px ${rgba(NEON, Math.min(1, 0.5 * gs))})` : "none";

  const rowsAt = (rows, g) => { const r = tab(rows, g); return r; };
  const spd = (rows, g) => { const a = tab(rows, g), b = tab(rows, g - 1); return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  function render(f) {
    const g = (f - S) * 30 / FPS;
    q("hand").style.opacity = g >= 0 ? "1" : "0";
    if (g < 0) return;
    // ---------- scene A
    const showA = g >= 0 && g < 70;
    q("sa").style.display = showA ? "block" : "none";
    t1.style.display = showA ? "block" : "none";
    if (showA) {
      const u = g < 1 ? 0 : tab(U_ARC, g)[0], sw = tab(SW_ARC, g)[0];
      const cs = g < 12 ? [645, 353, 1] : tab(RING, g);
      const a0 = 30 - 120 * u, len = u * CIRC, s0 = (((a0 % 360) + 360) % 360) / 360 * CIRC;
      ["rg0c", "rg1c", "rg2"].forEach(id => {
        const c = q(id); c.setAttribute("stroke-width", String(sw));
        c.setAttribute("stroke-dasharray", `${len.toFixed(2)} ${Math.max(0, CIRC - len).toFixed(2)}`); c.setAttribute("stroke-dashoffset", String((-s0).toFixed(2)));
      });
      q("fillA").setAttribute("opacity", String(clamp((g - 12) / 10)));
      ga.setAttribute("transform", `translate(${(cs[0] * KR).toFixed(2)} ${(cs[1] * KR).toFixed(2)}) scale(${(KR * cs[2]).toFixed(4)})`);
      const al = tab(A_T1, g)[0], sc = tab(SC_T1, g)[0], bl = tab(BL_T1, g)[0];
      t1.style.opacity = al.toFixed(3);
      t1.style.transform = `translate(${(cs[0] * KR).toFixed(2)}px, ${(cs[1] * KR).toFixed(2)}px) scale(${(cs[2] * sc).toFixed(4)}) translate(-50%, -50%)`;
      t1.style.filter = bl > 0.3 ? `blur(${(bl * KR).toFixed(2)}px)` : "none";
    }
    // ---------- scene B: the box with the second, third and fourth labels
    const showB = g >= 62.5 && g < 190.5;
    if (showB) {
      const p = tab(BOXP, g);
      let cx = p[0], cy = p[1];
      const rot = g < 91 ? 0 : tab(TH, g)[0];
      const sc = g < 140 ? 1 : g < 150 ? tab(SB, g)[0] : 0.8;
      const which = g < 95.5 ? 0 : g < 139.5 ? 1 : 2;
      const dth = g < 91 || g > 108 ? 0 : Math.abs(tab(TH, g)[0] - tab(TH, g - 1)[0]);
      const sp = spd(BOXP, g);
      const blur = Math.max(0, dth - 6) * 0.25 + Math.max(0, sp - 25) * 0.12 + (g >= 139.5 && g < 148 ? Math.max(0, Math.abs(sc - tab(SB, g - 1)[0]) * 30 - 3) * 0.2 : 0);
      const stutter = g >= 125.5 && g < 139.5;
      put(bxM, cx, cy, sc, rot, which, 1, blur, stutter ? 2.5 : 0);
      if (stutter) { const e = tab(BOXP, g - 1); put(bxE, e[0], e[1], sc, rot, which, 0.42, blur, 2.5); } else put(bxE, 0, 0, 1, 0, 0, 0, 0, 0);
    } else { put(bxM, 0, 0, 1, 0, 0, 0, 0, 0); put(bxE, 0, 0, 1, 0, 0, 0, 0, 0); }
    // ---------- scene C: the lines and the last box
    const showC = g >= 195.5 && g < 295;
    q("sc").style.display = showC ? "block" : "none";
    const c5 = tab(C5, Math.max(g, 218));
    const wx = c5[0] - 629, wy = c5[1] - 441.5;
    if (showC) {
      LN.forEach((ln, i) => {
        let ph = g < ln.t0 ? 0 : easeO((g - ln.t0) / ln.D);
        if (ln.r0 !== undefined && g > ln.r0) ph = Math.min(ph, 1 - clamp((g - ln.r0) / ln.rD));
        const pt = ln.tail ? clamp((g - ln.tail[0]) / ln.tail[1]) : 0;
        const el = lineEls[i];
        if (ph - pt < 0.001) { el.setAttribute("display", "none"); return; }
        el.removeAttribute("display");
        const P = t => [ln.A[0] + (ln.B[0] - ln.A[0]) * t + wx, ln.A[1] + (ln.B[1] - ln.A[1]) * t + wy];
        const a = P(pt), b = P(ph);
        el.setAttribute("x1", (a[0] * KR).toFixed(2)); el.setAttribute("y1", (a[1] * KR).toFixed(2)); el.setAttribute("x2", (b[0] * KR).toFixed(2)); el.setAttribute("y2", (b[1] * KR).toFixed(2));
      });
    }
    const a5 = (g < 214.5 || g > 292 ? 0 : tab(A_C5, g)[0] * (g > 268 ? tab(A_C5O, g)[0] : 1));
    put(bx5, c5[0], c5[1], 1, 0, 0, a5, 0, 0);
  }
  if (window.MLLook) MLLook.every(tl, { fps: FPS, from: 0, to: FRAMES }, t => render(t * FPS)); else render(0);

  if (window.MLLook) MLLook.handheld(q("hand"), tl, { amount: V.shake, fps: FPS, frames: FRAMES, U, W, H, seed: 37 });
  if (window.MLLook) MLLook.grain(root, tl, { V, fps: FPS, frames: FRAMES, at: AT, U, seed: 101 });
  tl.set({}, {}, F(FRAMES));
  window.__timelines = window.__timelines || {};
  // the timeline is registered once the look's fonts are in: HyperFrames captures f0 only then (else f0 shows a
  // fallback font)
  (document.fonts && document.fonts.load ? Promise.all(["display_font", "body_font", "accent_font"].flatMap(k =>
    [400, 700, 800].map(w => document.fonts.load(`${w} 100px "${V[k]}"`))).concat([document.fonts.ready])).catch(() => {})
    : Promise.resolve()).then(() => { render(0); window.__timelines["main"] = tl; });
</script>
