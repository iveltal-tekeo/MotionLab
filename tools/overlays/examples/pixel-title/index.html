<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "text", "type": "string", "label": "Text", "default": "TEST 4AM"},
  {"id": "color", "type": "color", "label": "Colour", "default": "#db0d0d"},
  {"id": "letter_height", "type": "number", "label": "Letter height (px)", "default": 54, "min": 6, "max": 600, "step": 1},
  {"id": "letter_width", "type": "number", "label": "Letter width (2 = the 4AM look)", "default": 2, "min": 0.5, "max": 4, "step": 0.1},
  {"id": "center_x", "type": "number", "label": "Centre x (px)", "default": 760, "min": 0, "max": 1520, "step": 1},
  {"id": "top", "type": "number", "label": "Top (px)", "default": 494, "min": -200, "max": 1080, "step": 1},
  {"id": "glow", "type": "number", "label": "Glow size (px, 0 = none)", "default": 9.72, "min": 0, "max": 80, "step": 0.1},
  {"id": "glow_strength", "type": "number", "label": "Glow strength", "default": 0.9, "min": 0, "max": 1, "step": 0.05},
  {"id": "show_from", "type": "number", "label": "Shows from frame", "default": 0, "min": 0, "max": 29, "step": 1}
]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1520, height=1080">
<!-- MotionLab overlay example "pixel-title" (4AM title_open, plan frames 0-29): 30 frames at 25 fps, 1520 x 1080 px (the plan's frame). Render:
     .venv\Scripts\python tools\overlay.py render <this folder>
     Rules: transparent background (never paint html / body / #root); everything absolutely positioned in output
     pixels; animate only on the paused GSAP timeline below (no CSS animations, timers, Date or Math.random -
     use rnd(seed) for noise); times in frames with F(n) / AT(n).
     Settings (declared on <html>, changed in the app's Videos > Graphics or with overlay.py set): the text is drawn
     in the lab's boxy pixel font (motionlab\graphics.py GLYPHS / text_layout, the same geometry), with a glow. -->
<script src="./gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1520px; height: 1080px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 1520px; height: 1080px; overflow: hidden; }
  .abs { position: absolute; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1.2" data-width="1520"
     data-height="1080">
  <svg id="title" class="abs" style="overflow:visible"></svg>
</div>
<script>
  const FPS = 25, FRAMES = 30;
  const F = n => n / FPS;                 // frames -> seconds: tween positions and durations
  const AT = n => (n - 0.5) / FPS;        // a jump (tl.set) that shows from frame n on, never on frame n - 1
  const V = window.__hyperframes.getVariables();
  // the boxy pixel font: strokes on a 4 x 6 grid (x right, y down) - motionlab\graphics.py GLYPHS
  const GLYPHS = {
    A: [[[0,6],[0,0],[4,0],[4,6]], [[0,3],[4,3]]], B: [[[0,0],[0,6],[4,6],[4,3],[0,3]], [[0,0],[3,0],[3,3]]],
    C: [[[4,0],[0,0],[0,6],[4,6]]], D: [[[0,0],[0,6],[3,6],[4,5],[4,1],[3,0],[0,0]]],
    E: [[[4,0],[0,0],[0,6],[4,6]], [[0,3],[3,3]]], F: [[[4,0],[0,0],[0,6]], [[0,3],[3,3]]],
    G: [[[4,0],[0,0],[0,6],[4,6],[4,3],[2,3]]], H: [[[0,0],[0,6]], [[4,0],[4,6]], [[0,3],[4,3]]],
    I: [[[0,0],[0,6]]], J: [[[4,0],[4,6],[0,6],[0,4]]],
    K: [[[0,0],[0,6]], [[0,3],[3,3]], [[3,3],[4,2],[4,0]], [[3,3],[4,4],[4,6]]], L: [[[0,0],[0,6],[4,6]]],
    M: [[[0,6],[0,0],[4,0],[4,6]], [[2,0],[2,4]]], N: [[[0,6],[0,0],[4,0],[4,6]]],
    O: [[[0,0],[4,0],[4,6],[0,6],[0,0]]], P: [[[0,6],[0,0],[4,0],[4,3],[0,3]]],
    Q: [[[0,0],[4,0],[4,6],[0,6],[0,0]], [[3,5],[4.6,6.6]]], R: [[[0,6],[0,0],[4,0],[4,3],[0,3]], [[2,3],[4,4],[4,6]]],
    S: [[[4,0],[0,0],[0,3],[4,3],[4,6],[0,6]]], T: [[[0,0],[4,0]], [[2,0],[2,6]]], U: [[[0,0],[0,6],[4,6],[4,0]]],
    V: [[[0,0],[0,4],[2,6],[4,4],[4,0]]], W: [[[0,0],[0,6],[4,6],[4,0]], [[2,2],[2,6]]],
    X: [[[0,0],[4,6]], [[4,0],[0,6]]], Y: [[[0,0],[0,3],[4,3]], [[4,0],[4,6],[0,6]]], Z: [[[0,0],[4,0],[0,6],[4,6]]],
    "0": [[[0,0],[4,0],[4,6],[0,6],[0,0]]], "1": [[[1,1],[2,0],[2,6]]], "2": [[[0,0],[4,0],[4,3],[0,3],[0,6],[4,6]]],
    "3": [[[0,0],[4,0],[4,6],[0,6]], [[1,3],[4,3]]], "4": [[[0,0],[0,3],[4,3]], [[4,0],[4,6]]],
    "5": [[[4,0],[0,0],[0,3],[4,3],[4,6],[0,6]]], "6": [[[4,0],[0,0],[0,6],[4,6],[4,3],[0,3]]],
    "7": [[[0,0],[4,0],[4,6]]], "8": [[[0,0],[4,0],[4,6],[0,6],[0,0]], [[0,3],[4,3]]],
    "9": [[[4,3],[0,3],[0,0],[4,0],[4,6],[0,6]]], "-": [[[0,3],[4,3]]], ".": [[[0,6],[0.01,6]]],
    ":": [[[0,1.6],[0.01,1.6]], [[0,4.4],[0.01,4.4]]], "'": [[[0,0],[0,1.5]]],
    "!": [[[0,0],[0,4]], [[0,6],[0.01,6]]], "?": [[[0,0],[4,0],[4,3],[2,3],[2,4]], [[2,6],[2.01,6]]],
  };
  const NARROW = "I1.:'!";
  // text_layout(): polylines + dots in the box's pixels, stroke width, box size (graphics.py, same numbers)
  function layout(text, height, wscale, tracking = 0.55) {
    text = text.toUpperCase();
    const u = height / 6, ux = u * wscale, st = Math.max(1, height * 0.085), pad = st * 2;
    const widths = [...text].map(ch => ch === " " ? 2.2 * ux : (NARROW.includes(ch) ? st : 4 * ux + st));
    const total = widths.reduce((a, b) => a + b, 0) + tracking * ux * 2 * Math.max(0, text.length - 1);
    const W = Math.ceil(total + 2 * pad), H = Math.ceil(height + st + 2 * pad);
    const lines = [], dots = [];
    let x = pad + st / 2;
    [...text].forEach((ch, i) => {
      for (const poly of GLYPHS[ch] || []) {
        const pts = poly.map(([px, py]) => [x + px * ux, pad + st / 2 + py * u]);
        if (pts.length === 2 && Math.abs(pts[0][0] - pts[1][0]) < 0.5 && Math.abs(pts[0][1] - pts[1][1]) < 0.5) dots.push(pts[0]);
        else lines.push(pts);
      }
      x += widths[i] + tracking * ux * 2;
    });
    return { lines, dots, st, W, H };
  }
  const L = layout(V.text, V.letter_height, V.letter_width);
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("title");
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  svg.setAttribute("width", L.W); svg.setAttribute("height", L.H); svg.setAttribute("viewBox", `0 0 ${L.W} ${L.H}`);
  svg.style.left = Math.round(V.center_x - L.W / 2) + "px"; svg.style.top = V.top + "px";
  const g = el("g", { fill: "none", stroke: V.color, "stroke-width": L.st, "stroke-linecap": "square", "stroke-linejoin": "round" }, svg);
  if (V.glow > 0) {
    const m = Math.max(60, Math.ceil(6 * V.glow));
    const f = el("filter", { id: "glow", filterUnits: "userSpaceOnUse", x: -m, y: -m, width: L.W + 2 * m, height: L.H + 2 * m,
                             "color-interpolation-filters": "sRGB" }, el("defs", {}, svg));
    el("feGaussianBlur", { in: "SourceAlpha", stdDeviation: V.glow, result: "blur" }, f);
    el("feFlood", { "flood-color": V.color, result: "c" }, f);
    el("feComposite", { in: "c", in2: "blur", operator: "in", result: "g0" }, f);
    el("feFuncA", { type: "linear", slope: V.glow_strength }, el("feComponentTransfer", { in: "g0", result: "glow" }, f));
    const mg = el("feMerge", {}, f);
    el("feMergeNode", { in: "glow" }, mg); el("feMergeNode", { in: "SourceGraphic" }, mg);
    g.setAttribute("filter", "url(#glow)");
  }
  for (const pts of L.lines) el("polyline", { points: pts.map(p => p.join(",")).join(" ") }, g);
  for (const [px, py] of L.dots) el("rect", { x: px - 0.6 * L.st, y: py - 0.6 * L.st, width: 1.2 * L.st, height: 1.2 * L.st,
                                              fill: V.color, stroke: "none" }, g);
  const tl = gsap.timeline({ paused: true });
  if (V.show_from > 0) { tl.set("#title", { opacity: 0 }, 0); tl.set("#title", { opacity: 1 }, AT(V.show_from)); }
  tl.set({}, {}, F(FRAMES));              // the timeline's length = the overlay's length
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
