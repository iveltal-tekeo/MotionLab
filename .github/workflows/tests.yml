# MotionLab - automatic tests on GitHub (0.3.1; since 0.4.2.1 only for the big versions). The full run (self-test +
# app smoke test on a clean Windows machine with Python 3.12, requirements.txt and the ffmpeg build friends get from
# setup.bat) takes ~15 minutes, so it runs only when:
#   - __version__ is a new x.y.0 (0.5.0, 0.6.0, ...) that has no v<version> tag yet - so it runs again on every push
#     until that version passes and is tagged,
#   - or it is started by hand: GitHub > Actions > tests > Run workflow (any branch; on main a pass moves "tested").
# Any other NEW version (0.4.2.1, 0.4.3, ...: no v<version> tag yet) is released after a quick check on Linux (~1 min:
# every Python file compiles, the roadmap and the shared knowledge read) - the user's choice (2026-10-15): the full
# tests for the big versions only, so small versions ship smoothly. The full self-test + smoke test still run on the
# developer's PC before every release (CLAUDE.md, Publishing).
# A push that only adds friends' shared knowledge (cards, incoming lessons, lessons.md) since the last tested commit
# needs no Windows machine: its files are checked on Linux and "tested" moves at once, so cards reach everyone.
# Any other push (code between versions) runs nothing: it reaches friends with the next version.
#
# When a run on main passes, the branch "tested" moves to it. The app's Update button installs only what is on
# "tested" (tools/motionlab/app/updater.py). A new __version__ also gets its git tag (v0.3.1, ...).
# Details: docs/organization.md, "Tests on GitHub".
name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:                                   # runs on main go one after the other, in order (none cancelled)
  group: tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write                              # move the "tested" branch, push version tags

env:
  FFMPEG_VERSION: "9.0.2"                      # Gyan's release = what winget Gyan.FFmpeg installs; raise it when it moves
  PYTHONUTF8: "1"

jobs:
  scope:                                       # a few seconds on Linux: decide what this push needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.s.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What does this push need? (full tests for a new x.y.0 or by hand, a quick release check for another new version, or only shared knowledge)
        id: s
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' tools/motionlab/__init__.py)
          new=false
          if [ -n "$v" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then new=true; fi
          run=none
          why="a code change between versions - it reaches friends with the next version (the full tests: by hand, Actions > tests > Run workflow)"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=tests; why="started by hand"
          elif [ "$new" = true ] && [[ "$v" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            run=tests; why="big version $v is new (no tag v$v yet): the full tests"
          elif [ "$new" = true ]; then
            run=release; why="version $v is new (no tag v$v yet) and not an x.y.0: the quick check, then released"
          elif git rev-parse -q --verify origin/tested >/dev/null && git merge-base --is-ancestor origin/tested HEAD; then
            changed=$(git diff --name-only origin/tested HEAD)
            other=$(printf '%s\n' "$changed" | grep -v -E '^(knowledge/references/|knowledge/incoming/|\.claude/skills/(analyze-reference|recreate-video)/lessons\.md$)' | grep -v '^$' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then
              run=knowledge; why="only shared knowledge since the last tested commit"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$run: $why"
          echo "**$run**: $why" >> "$GITHUB_STEP_SUMMARY"

  knowledge:                                   # friends' cards / lessons only: check they read, then release them
    needs: scope
    if: needs.scope.outputs.run == 'knowledge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Every shared card and lesson reads (JSON / UTF-8)
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("knowledge").rglob("*")):
              if not p.is_file() or not p.parts[1:2] or p.parts[1] not in ("references", "incoming"):
                  continue
              try:
                  t = p.read_text(encoding="utf-8")
                  if p.suffix == ".json":
                      json.loads(t)
              except Exception as e:                # noqa: BLE001
                  bad.append(f"{p}: {e}")
          for b in bad:
              print(f"::error title=shared knowledge::{b}")
          sys.exit(1 if bad else 0)
          EOF
          python3 -c "[open(f, encoding='utf-8').read() for f in ('.claude/skills/analyze-reference/lessons.md', '.claude/skills/recreate-video/lessons.md')]"

      - name: Mark as tested
        shell: bash
        run: bash .github/scripts/mark_tested.sh

  release:                                     # a new version that is not x.y.0: a quick check (~1 min), then released
    needs: scope
    if: needs.scope.outputs.run == 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Every Python file compiles; CHANGELOG, roadmap and shared knowledge are ready for this version
        shell: bash
        run: |
          python -m compileall -q tools || { echo "::error title=release check::a Python file does not compile (see the log above)"; exit 1; }
          python - <<'EOF'
          import json, pathlib, re, sys
          bad = []
          v = re.search(r'^__version__ = "(.+?)"', pathlib.Path("tools/motionlab/__init__.py").read_text(encoding="utf-8"), re.M).group(1)
          if not re.search(rf"^## {re.escape(v)} - ", pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8"), re.M):
              bad.append(f"CHANGELOG.md has no '## {v} - date - title' section (the Update dialog shows it)")
          try:
              here = json.loads(pathlib.Path("docs/roadmap/roadmap.json").read_text(encoding="utf-8")).get("here")
              if here != v:
                  bad.append(f"docs/roadmap/roadmap.json says here = {here}, the version is {v} (roadmap.py sync)")
          except Exception as e:                    # noqa: BLE001
              bad.append(f"docs/roadmap/roadmap.json: {e}")
          for p in sorted(pathlib.Path("knowledge").rglob("*")):
              if p.is_file() and p.parts[1:2] and p.parts[1] in ("references", "incoming"):
                  try:
                      t = p.read_text(encoding="utf-8")
                      if p.suffix == ".json":
                          json.loads(t)
                  except Exception as e:            # noqa: BLE001
                      bad.append(f"{p}: {e}")
          for b in bad:
              print(f"::error title=release check::{b}")
          print(f"release check for {v}: " + ("FAIL" if bad else "PASS"))
          sys.exit(1 if bad else 0)
          EOF

      - name: Mark as tested + tag the version
        shell: bash
        run: bash .github/scripts/mark_tested.sh --tag

  tests:
    needs: scope
    if: needs.scope.outputs.run == 'tests'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: ffmpeg (cache)
        id: ffcache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ffmpeg
          key: ffmpeg-gyan-${{ env.FFMPEG_VERSION }}-essentials

      - name: ffmpeg (download)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $v = $env:FFMPEG_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.7z'
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.7z" -OutFile $zip
          7z x $zip "-o$env:RUNNER_TEMP\fftmp" | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ffmpeg" | Out-Null
          Move-Item "$env:RUNNER_TEMP\fftmp\ffmpeg-$v-essentials_build\bin\*" "$env:RUNNER_TEMP\ffmpeg\"

      - name: ffmpeg (on PATH)
        shell: pwsh
        run: |
          "$env:RUNNER_TEMP\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\ffmpeg\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Self-test (synthetic videos with known effects, --extended)
        shell: bash
        run: |
          set -o pipefail
          python tools/selftest.py --extended 2>&1 | tee selftest.log

      - name: App smoke test (modules, server routes, every page in Edge, MCP server)
        shell: bash
        run: |
          set -o pipefail
          python tools/dev/smoke.py 2>&1 | tee smoke.log

      - name: Mark as tested + tag a new version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: bash .github/scripts/mark_tested.sh --tag

      # Job logs are only readable by the repo's admins (API) - the error notes ("annotations") are public, so a failed
      # test copies its important lines and its last lines there: Claude and anyone helping can read the cause.
      - name: Why it failed (public error notes)
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib
          KEYS = ("FAIL", "Error", "error:", "Traceback", "SCORE", "OVERALL", "WRONG", "MISS", "expected", "Exception")
          enc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for f in ("selftest.log", "smoke.log"):
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              lines = [l[:220] for l in p.read_text(encoding="utf-8", errors="replace").splitlines()]
              key = [l for l in lines if any(k in l for k in KEYS)][-40:]
              if key:
                  print(f"::error title={f}: the important lines::" + enc("\n".join(key)))
              print(f"::error title={f}: the last 60 lines::" + enc("\n".join(lines[-60:])))
          EOF

      - name: Keep the scores and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            selftest.log
            smoke.log
            analysis/synthetic_*/selftest_score.json
            analysis/synthetic_*/events.json
            .app/server.log
          if-no-files-found: ignore
